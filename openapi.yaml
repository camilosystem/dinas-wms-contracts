    CAMBIOS EN v0.33.3 — NO SE ACREDITA LO QUE NUNCA SE VENDIÓ
    ══════════════════════════════════════════════════════════════════════════

    ⚠️ REVERTIDO EN v0.47.0. Este bloque se conserva porque explica un bug
    real —`cantidad × null` → 0— pero la REGLA que introdujo ya NO rige: no
    hay ninguna restricción de ítem ni de factura para crear una solicitud.
    Ver el changelog de v0.47.0 antes de implementar nada de lo que sigue.

    Incluye todo lo de v0.33.2.

    ★ `POST /credit-requests` rechaza con 400
      (code=`item_never_invoiced_to_client`) si algún ítem de las líneas
      nunca se le facturó a ese cliente.

      Rechaza aunque la línea traiga `proposed_amount`: el problema no es
      que falte el cálculo, es que la solicitud no es legítima.

    ★ CÓMO APARECIÓ
      Probando el monto propuesto de la app de vendedores en vivo, se creó
      una solicitud con dos líneas de ítems que ese cliente nunca había
      comprado. Resultado:

        línea escrita por el vendedor  → proposed_amount 10.00  ✅
        línea sin tocar                → proposed_amount  0.00  ⚠️

      La segunda debía traer el cálculo del servidor. Trajo cero, porque
      `unit_price` era null —no había factura previa de ese cliente+ítem—
      y el cálculo hizo `cantidad × null` → 0.

      El `calculated_amount` de la cabecera sumó ese cero sin señal alguna.
      Una solicitud de crédito por un ítem jamás vendido a ese cliente
      valía 0, y el aprobador podía aprobarla tal cual.

      Contradecía la semántica ya declarada: `unit_price: null` significa
      "no se pudo resolver", no "vale cero". El cálculo la ignoraba.

