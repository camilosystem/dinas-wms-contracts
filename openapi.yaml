          description: >
            ★ NUEVO en v0.30.0. SOLO para ADMIN, y OBLIGATORIO para él
            (400 si lo omite): no tiene salesperson_code propio con el
            cual filtrar.

            VENDEDOR, VENDEDOR_INSTITUCIONAL y ANALISTA_COMERCIAL NO lo
            envían: si lo mandan se IGNORA y se usa el del token, mismo
            criterio que GET /my-orders. Un vendedor nunca ve el libro de
