  # ═══════════════════════════════════════════════════════════════
  # ★ NUEVO v0.29.0 — "MIS ÓRDENES" DEL VENDEDOR INSTITUCIONAL
  # ═══════════════════════════════════════════════════════════════
  # Endpoint aparte a propósito, NO una variante de /admin/orders: allí
  # salesperson_code es un filtro OPCIONAL que elige el cliente, y aquí el
  # alcance es una GARANTÍA del servidor. Misma query por debajo.

  /my-orders:
    get:
      tags: [orders]
      summary: Órdenes tomadas por el vendedor institucional autenticado
      description: >
        ★ v0.29.0. REQUIERE rol VENDEDOR_INSTITUCIONAL (cualquier otro rol,
        ADMIN incluido, recibe 403 — esta NO es una segunda puerta a la
        grilla del Dashboard).

        El salesperson_code sale SIEMPRE del token, nunca del request. No
        existe un parámetro salesperson_code en este endpoint: uno enviado
        en la query se ignora en silencio (no es 400 ni 403, el resultado
        simplemente no depende de él).

        NO expone held_count: ese contador es global (todas las
        RETENIDA_CARTERA de la empresa, sin aplicar filtro por vendedor) y
        existe solo para el badge del ADMIN en GET /admin/orders.

        Sin filtro por client_code (no aplica al caso de uso) ni por fecha
        (tampoco existe hoy en /admin/orders).

        403 con code=salesperson_code_missing si la cuenta autenticada no
        tiene salesperson_code: sin código no hay "mis órdenes" que acotar.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
          description: Filtra por estado DENTRO de las órdenes propias.
      responses:
        '200':
          description: Página de órdenes propias
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total:
                    type: integer
                    description: Total de órdenes PROPIAS que cumplen el filtro.
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/OrderSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >
            Rol distinto de VENDEDOR_INSTITUCIONAL, o cuenta sin
            salesperson_code (code=salesperson_code_missing).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/orders:

    get:
      tags: [admin]
      summary: Grilla de órdenes recibidas
      description: REQUIERE rol ADMIN.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: salesperson_code
          in: query
          schema: { type: string }
        - name: client_code
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/OrderStatus' }
          description: ★ v0.4.0 — filtrar por estado.
        - name: received_from
          in: query
          required: false
          schema: { type: string, format: date }
          description: >
            ★ NUEVO en v0.38.0. Solo órdenes recibidas EN o DESPUÉS de este
            día. Límite INCLUSIVO.

            Fecha sin hora, resuelta contra el día calendario de
            **Nueva York** (`America/New_York`), NUNCA contra el día UTC —
            ver la regla global al principio de este documento. `received_at`
            es un instante en UTC; el día se deriva convirtiendo a Nueva York
            primero.
        - name: received_to
          in: query
          required: false
          schema: { type: string, format: date }
          description: >
            ★ NUEVO en v0.38.0. Solo órdenes recibidas EN o ANTES de este
            día. Límite INCLUSIVO — `received_to=2026-08-13` incluye todo el
            13 hasta las 23:59:59 de Nueva York, no se corta a la medianoche
            UTC (que en Nueva York son las 20:00 y dejaría afuera las horas
            más activas del día).

            Si `received_to` es anterior a `received_from`, 400.
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [received_at, order_number, status]
            default: received_at
          description: >
            ★ NUEVO en v0.38.0. Por qué campo ordenar. El default reproduce
            el comportamiento actual, así que un cliente que no lo manda ve
            lo mismo que hoy.

            `status` NO ordena alfabéticamente: usa el ORDEN DEL CICLO DE
            VIDA tal como está declarado el enum OrderStatus (SINCRONIZADA →
            RETENIDA_CARTERA → APROBADA → RECHAZADA). Alfabéticamente
            APROBADA quedaría antes que RETENIDA_CARTERA, y lo que el admin
            necesita atender terminaría enterrado en el medio.
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: >
            ★ NUEVO en v0.38.0. Dirección del ordenamiento.

            ⚠️ DESEMPATE OBLIGATORIO: todo ordenamiento lleva un criterio
            secundario determinista — `received_at` descendente y después
            `order_number`, que es único. Sin él, ordenar por un campo con
            muchos empates (`status` tiene cuatro valores para todas las
            órdenes) deja el orden de las filas empatadas a criterio del
            motor, y sobre una lista PAGINADA eso significa que entre dos
            consultas la misma orden puede aparecer en la página 1 y en la 2,
            o en ninguna de las dos.
      responses:
        '200':
          description: Página de órdenes
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  held_count:
                    type: integer
                    description: >
                      ★ Cuántas órdenes están RETENIDA_CARTERA en total
                      (no solo en esta página). Para el aviso del Dashboard.
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/OrderSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/orders/held:
    get:
      tags: [admin]
      summary: Órdenes RETENIDAS por cartera (bandeja de aprobación)
      description: >
        ★ NUEVO en v0.4.0. REQUIERE rol ADMIN.

        Atajo de /admin/orders?status=RETENIDA_CARTERA, pero enriquecido:
        cada orden trae el CONTEXTO DE CARTERA del cliente (saldo, cupo, mora,
