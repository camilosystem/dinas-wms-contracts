      cartera). Sigue siendo opcional en CreditRequestCreate (decisión ya
      vigente: la foto no es obligatoria en solicitudes de crédito, en
      ninguna modalidad).

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.17.1 — ESTADO DE ERROR DE INTEGRACIÓN SAP
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Se añade el valor ERROR_INTEGRACION al enum compartido ApprovalStatus.
      Motivo: si la integración a SAP (IncomingPayments / CreditNotes) falla
      DESPUÉS de que el aprobador ya aprobó un account-payment o credit-request,
      el registro no puede quedar como APROBADO (SAP no lo recibió) ni como
      PENDIENTE_APROBACION (ya fue revisado, no debe volver a la bandeja de
      pendientes por aprobar). ERROR_INTEGRACION distingue ese caso para que
      el Dashboard pueda mostrarlo y ofrecer reintentar la integración sin
      pedirle al aprobador que apruebe de nuevo.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.17.0 — PAGOS Y CRÉDITOS (procesos secundarios app vendedores)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Dos flujos nuevos del vendedor, ambos con aprobación en el Dashboard
      antes de integrar a SAP:
        · POST /account-payments   — Reportar un pago (aplicado a cartera)
        · POST /credit-requests    — Solicitar una Nota de Crédito

    ★ NOMBRE "account-payments", NO "payments"
      El bloque 4C (v0.16.0) ya usa `payments`/`payments-admin` para el dinero
      que el DRIVER recoge en ruta (efectivo/cheque suelto, sin aplicar a
      factura). Este es un concepto DISTINTO: el vendedor reporta un pago que
      se APLICA a facturas específicas de cartera (vw_CxC). Para no colisionar
      recursos ni confundir el mismo payment_uuid con dos significados
      distintos, este bloque usa `account-payments` como namespace propio.

    ★ EL VENDEDOR PROPONE, EL APROBADOR CONFIRMA
      Mismo principio que cartera (v0.4.0): la app registra la intención, el
      middleware/Dashboard decide antes de tocar SAP.
        · Pago: el vendedor puede proponer a qué facturas se aplica
          (`proposed_applications`), pero el APROBADOR_PAGOS confirma o
          reemplaza esa imputación con montos editables por factura. Si el
          total no cuadra exacto contra las facturas, el sobrante/faltante
          queda como PAGO_A_CUENTA sin aplicar (no bloquea la aprobación).
        · Crédito: dos modalidades — CON ítems (monto calculado de las
          líneas) o SIN ítems (monto manual). En la modalidad sin ítems, la
          cuenta de G/L se resuelve automáticamente por `reason`
          (Damaged/Doesn't want it/Mistake/Short) vía configuración — nunca
          elegida a mano por el aprobador.

    ★ ROLES NUEVOS
      APROBADOR_PAGOS y APROBADOR_CREDITOS, separados desde el inicio (no
      comparten con ADMIN), para que la aprobación de dinero tenga su propio
      permiso.

    ★ INTEGRACIÓN A SAP
      Al aprobar: POST → SAP (IncomingPayments para pagos, CreditNotes para
      créditos). La integración ocurre en la aprobación, NUNCA en el reporte
      del vendedor.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.16.0 — RECOGER PAGO (Bloque 4C) · cierra la app de driver
    ══════════════════════════════════════════════════════════════════════════

    ★ ESTE BLOQUE TOCA DINERO — merece más cuidado que los demás
      Los otros bloques registran INFORMACIÓN; este registra DINERO RECIBIDO.
      Un retorno perdido se reconstruye preguntándole al cliente; un pago
      perdido significa que alguien entregó efectivo sin constancia, y eso puede
      terminar en una acusación a un driver honesto.
      De ahí las dos reglas duras:
        · IDEMPOTENCIA obligatoria (payment_uuid generado por la app). Un pago
          duplicado es tan malo como uno perdido.
        · REGISTRO INMUTABLE: un pago NO se edita ni se borra. Si hubo error se
          ANULA, dejando el rastro.

    ★ QUÉ REGISTRA
      Cliente (de SU ruta), monto, tipo (CASH o CHEQUE) y la hora real.
      · CHEQUE: número de cheque + FOTO OBLIGATORIA (es un documento físico;
        fotografiarlo protege al driver y a la empresa).
      · CASH: sin foto (no hay documento que fotografiar).

    ★ NO SE APLICA A FACTURAS
      Es un monto suelto. El admin lo aplica después en SAP. Nada se escribe a
      SAP desde aquí.

    ★ ANULACIÓN CON RASTRO
      El driver puede anular un pago mal registrado, con MOTIVO OBLIGATORIO.
      El registro NO desaparece: queda como anulado, con quién, cuándo y por qué.
      Se puede anular EN CUALQUIER MOMENTO, incluso con la ruta ya cerrada —
      el error suele notarse al cuadrar la caja en la bodega.

    ★ EL DRIVER VE SU CAJA
      Total recogido en la ruta, separado por CASH y CHEQUE. Al terminar trae
      ese dinero encima y necesita saber cuánto es.
      Los anulados NO suman.

    ★ OFFLINE igual que todo: se encola, `occurred_at` lleva la hora real.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.15.0 — RETORNO DE PRODUCTO (Bloque 4B)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ ES
      El cliente devuelve mercancía de FACTURAS ANTERIORES (no de la entrega de
      hoy — eso son los rejected_items del 4A). El driver la recibe durante su
      visita, la documenta con una FOTO, y queda registrada para el admin.

    ★ ES UN REGISTRO, NO UN MOVIMIENTO DE INVENTARIO
      Nada se escribe a SAP. El admin lo procesa manualmente. Cuando exista
      BIN LOAD, ahí se decidirá el reingreso al stock.

    ★ EL CLIENTE ES DE SU RUTA
      No se busca entre todos los clientes: el retorno es de una de las paradas
      que el driver ya tiene descargadas. Si no va a pasar por ese cliente, no
      hay quien le entregue la mercancía.
      Puede registrarlo en CUALQUIER MOMENTO de la ruta, no solo estando en esa
      parada.

    ★ EL ÍTEM SE BUSCA EN EL CATÁLOGO COMPLETO
      Un retorno es de compras anteriores, así que el ítem puede NO estar en el
      camión de hoy. La app descarga el catálogo de ítems vendibles junto con la
      ruta (~540 ítems) para poder buscar sin conexión, por código o nombre.

    ★ VARIOS ÍTEMS POR RETORNO, UNA FOTO
      Cada ítem con su cantidad y su motivo: DANADO · EXPIRADO · NO_LO_QUIERE.
      La FOTO es OBLIGATORIA — es la evidencia de lo que se recibió.

    ★ LA FOTO VIAJA EN EL MISMO POST (base64)
      La app la REDIMENSIONA antes de enviar (~1024px, calidad ~70% → 150-300KB).
      Una sola petición: o entra el retorno completo con su foto, o no entra.
      Eso es lo que exige que la foto sea obligatoria — un segundo paso podría
      fallar y dejar retornos sin evidencia.
      El middleware la guarda EN DISCO y conserva la ruta en la base.

    ★ OFFLINE — con idempotencia explícita
      Se encola como todo lo demás. La foto se guarda local hasta que haya
      señal. `occurred_at` lleva la hora real de la visita.
      ★ `return_uuid` lo GENERA LA APP y hace el POST idempotente. Es necesario
      porque un retorno no tiene identidad natural (a diferencia de `deliver`,
      cuya clave es el order_uuid): el mismo cliente puede devolver lo mismo dos
      veces el mismo día. Sin esa clave, si el servidor procesa y la señal se
      cae antes de que llegue la respuesta, el reintento crearía un DUPLICADO
      con su foto. Con ella, el reintento devuelve 200 con el registro existente.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.14.0 — DESPACHO / APP DE DRIVER (Bloque 4A)
    ══════════════════════════════════════════════════════════════════════════

    ★ ALCANCE: solo el DESPACHO (la ruta y las entregas en la calle).
      El RETORNO DE PRODUCTO (con foto) es el 4B y el RECOGER PAGO el 4C.

    ★ ROL NUEVO: DRIVER
      Usuario propio del WMS, como BODEGUERO. Solo despacha.

    ★ ASIGNACIÓN DIRIGIDA
      El ADMIN asigna un camión ALISTADO a UN driver. Un driver, UN camión a la
      vez. El driver no elige.

    ★ ESTADOS NUEVOS DEL CAMIÓN
        ALISTADO → (admin asigna driver) → ASIGNADO_DRIVER
                 → (driver inicia ruta)  → EN_RUTA
                 → (driver termina ruta) → RUTA_CERRADA

    ★ EL ESTADO DEL PEDIDO SE DERIVA (no lo elige el driver)
      El driver marca qué pasó con la MERCANCÍA; el middleware deduce el
      resultado:
        · nada rechazado           → ENTREGADO
        · algo rechazado           → ENTREGADO_PARCIAL
        · salida rápida de pedido  → NO_ENTREGADO (con motivo de pedido)
      Reusa los mismos estados y motivos del 3A: el driver ahora los registra en
      la calle en vez del admin en el escritorio.

    ★ ORDEN DE PARADAS: el driver reordena SOLO EN SU VISTA
      Puede arrastrar si le conviene por la calle. Recibe un AVISO de que
      cambiar el orden puede afectar el orden en que están cargados los pallets
      — pero NO se le bloquea. El orden guardado por el admin NO cambia.
      Es una preferencia local del dispositivo, no un dato del camión.

    ★ OFFLINE TOTAL — requisito duro
      El driver debe poder trabajar TODA la ruta sin conexión. Al asignarle el
      camión se descarga todo (paradas, pedidos, líneas, clientes, direcciones)
      y lo que registre se encola hasta que haya señal.
      La app AVISA claramente si el driver no ha descargado su ruta.

    ★ ADMIN Y DRIVER COEXISTEN
      El admin puede seguir registrando/corrigiendo entregas desde el Dashboard
      aunque haya driver asignado (el endpoint del 3A ya es idempotente).

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.13.0 — PICKING EN CURSO (Bloque 3C) · cierra el roadmap
    ══════════════════════════════════════════════════════════════════════════

    ★ EL PROBLEMA QUE RESUELVE
      Hoy el admin queda A CIEGAS entre "asigné el camión" y "apareció ALISTADO".
      No sabe si el bodeguero va por la mitad, si se atascó, ni si hay faltantes.
      Con DOS CARRILES es peor: dos personas trabajando y no ve a ninguna.

      Los endpoints /picking/* son del BODEGUERO (filtrados por su token), así
      que el Dashboard no puede usarlos. Este es su equivalente de solo lectura
      bajo /admin/*.

    ★ QUÉ ES
      GET /admin/picking-board — el piso de la bodega de un vistazo: todos los
      camiones activos, con el avance de CADA CARRIL y sus faltantes.

    ★ QUÉ ENTRA
      · Los camiones que se están trabajando: ASIGNADO, EN_PICKING, EN_REPARTICION.
      · Más los ALISTADOS de HOY (para ver lo ya terminado en la jornada).

    ★ POR CARRIL (los dos van a su ritmo, se muestran por separado)
      · quién lo tiene (bodeguero)
      · en qué fase va (LaneStatus)
      · cuánto lleva (fracción de recolección y de repartición)
      · sus FALTANTES CON DETALLE: qué ítem y cuánto faltó — es lo único sobre
        lo que el admin puede ACTUAR mientras el bodeguero trabaja (llamar al
        proveedor, avisar al vendedor).

    ★ PURAMENTE LECTURA. No hay operación ni estado nuevo.
      El Dashboard lo refresca solo (~30s) para ver el movimiento en vivo.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.12.0 — TABLERO DE CARGA (Bloque 3B)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ ES
      El tablero de PLANIFICACIÓN del admin de bodega: qué hay que despachar
      cada día de la semana, agrupado por shipping code, con las sumatorias y
      —lo accionable— cuántos pedidos YA van en camión y cuántos NO.

    ★ EL EJE: LUNES a VIERNES + columna SIN_DIA
      Sábado y domingo se IGNORAN. Un shipping code configurado solo para fin
      de semana deja sus pedidos sin día asignable → caen en SIN_DIA.

    ★ CADA PEDIDO CAE EN UN SOLO DÍA (no se duplica)
      El PRÓXIMO día de entrega de su shipping code contado DESDE HOY.
      Un shipping code con varios días (ej. martes y viernes) NO reparte sus
      pedidos: todos van al próximo disponible.

    ★ ATRASADOS
      Un pedido que ya existía cuando pasó su día de entrega y no se despachó
      aparece en el próximo día disponible, MARCADO como atrasado. Es la señal
      de que algo se quedó sin sacar.

    ★ SIN_DIA — lo que no cae en ningún día
      · pedidos sin shipping code
      · shipping codes sin días configurados
      · shipping codes configurados solo sábado/domingo

    ★ QUÉ ENTRA
      Todos los pedidos APROBADOS sin entregar. Es un tablero de lo que FALTA
      despachar, no un histórico.

    ★ PURAMENTE LECTURA — no hay operación ni estado nuevo.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.11.0 — ENTREGA (Bloque 3A) · cierre del ciclo del pedido
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ CIERRA
      El camión sale ALISTADO con su manifiesto impreso. El driver entrega y
      regresa. El ADMIN cierra en el Dashboard, PEDIDO POR PEDIDO, el resultado
      real de la entrega. El vendedor lo ve en su app.

    ★ TRES ESTADOS DE ENTREGA (no es binario)
        ENTREGADO           El cliente recibió todo.
        ENTREGADO_PARCIAL   Recibió, pero rechazó ítems (motivo + cantidad por ítem).
        NO_ENTREGADO        No recibió nada (motivo de pedido).

    ★ DOS NIVELES DE RECHAZO
      · Nivel PEDIDO (no se entregó nada):
          NEGOCIO_CERRADO · PEDIDO_CANCELADO
      · Nivel ÍTEM (entregó, pero el cliente rechazó líneas):
          NO_LO_QUIERE · DANADO · SHORT · NO_ORDENADO
        Se registra la CANTIDAD rechazada por ítem, no solo la marca.

    ★ SHORT — matiz a tener presente
      "Llegó menos de lo facturado". Puede venir de un faltante ya conocido del
      picking (is_incomplete_delivery) o ser una discrepancia nueva (se cargó
      completo pero llegó menos). Se registra igual; distinguir el origen es
      analítica futura.

    ★ EL PEDIDO QUEDA CERRADO en ese estado.
      Los ítems rechazados vuelven en el camión → eso es ROUTE RETURN, que
      pertenece a la fase de BIN LOAD (futuro, no aquí).

    ★ SOLO CAMIONES ALISTADOS
      No se cierra la entrega de un camión que no salió → 409.

    ★ LA APP DE DRIVER ES OTRO BLOQUE
      Por ahora el registro es del ADMIN en el Dashboard. Cuando exista la app
      de driver, reusará estos mismos endpoints.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.10.0 — DOS CARRILES DE PICKING (Bloque 2C)
    ══════════════════════════════════════════════════════════════════════════

    ★ EL CAMBIO
      Antes: UN bodeguero por camión picaba todo (regulares + congelados).
      Ahora: DOS bodegueros trabajan el mismo camión EN PARALELO, cada uno su
      tipo. Razón física: los congelados se pican en la NEVERA, los regulares
      en el almacén — dos lugares distintos, dos personas a la vez.

    ★ EL MODELO: dos carriles independientes
        REGULARES  → bodeguero A → recolecta → reparte → pallets "<camión>-Regular-N"
        CONGELADOS → bodeguero B → recolecta → reparte → pallets "<camión>-Frozen-N"
      Cada carril hace su ciclo COMPLETO. No se cruzan.

    ★ ASIGNACIÓN POR TIPO (antes era por camión)
      · POST /admin/trucks/{id}/assign ahora lleva `lane` (REGULAR|FROZEN).
      · SIEMPRE por separado: el mismo bodeguero NO puede tener ambos carriles.
      · Si el camión no tiene congelados, solo existe el carril REGULAR.
      · Reasignable por carril, incluso en curso, conservando el progreso.

    ★ has_frozen — el sistema lo calcula
      El camión expone `has_frozen` (¿tiene ítems con ItemCode que empieza con F?).
      Determina si se esperan 1 o 2 asignaciones. El admin no lo decide a mano.

    ★ ESTADO: global + por carril
      El camión conserva su `status` (informativo, el agregado), y ahora expone
      `lanes` con el avance de cada carril por separado. Con carriles desfasados
      (uno repartiendo, otro recolectando) el admin ve ambos.
      ALISTADO solo cuando TODOS los carriles existentes cerraron.

    ★ VER TODO, OPERAR SOLO LO SUYO
      Cada bodeguero ve el camión completo (contexto), pero solo puede operar su
      carril. Operar el carril ajeno → 403.

    ★ PALLETS: correlativo POR TIPO
      "<camión>-Regular-1, -2" y "<camión>-Frozen-1, -2" (antes era global).

    ★ CUADRE POR CARRIL
      La validación de cuadre se aplica dentro de cada carril, no global.

    ★ FALTANTES EN LA REPARTICIÓN (corrige un bloqueo)
      Antes, un ítem marcado como faltante seguía apareciendo repartible: la app
      lo ofrecía, el middleware lo rechazaba por cuadre, y el pedido no se podía
      completar → flujo BLOQUEADO.
      Ahora la repartición trabaja contra lo RECOGIDO, no contra lo pedido:
        · `available_quantity` por ítem = lo realmente disponible para ese pedido.
        · Faltante TOTAL (nada recogido) → el ítem NO se ofrece (available = 0).
        · Faltante PARCIAL → se ofrece hasta lo disponible; el BODEGUERO decide
          a qué pedidos dárselo (él sabe qué cliente es prioritario).
        · `has_shortage` marca el ítem; `is_incomplete_delivery` marca el pedido
          que no recibirá todo lo que pidió.
        · El cierre sigue exigiendo que todo lo RECOGIDO esté repartido; lo
          pedido-pero-no-recogido ya NO bloquea (es un faltante conocido).

    ★ DESASIGNAR CARRIL (nuevo)
      POST /admin/trucks/{id}/unassign — quita el bodeguero de un carril.
      Cierra un callejón sin salida: antes, un camión ASIGNADO no se podía
      cancelar ni eliminar ni deshacer; solo reasignar a otra persona.
      · Disponible siempre mientras el camión no esté ALISTADO.
      · SE PIERDE el progreso de ese carril (el Dashboard debe avisarlo).
        Para cambiar de persona CONSERVANDO el trabajo, usar `assign`.
      · Si ningún carril queda asignado → el camión vuelve a CONFIRMADO,
        desde donde se puede cancelar o eliminar.

    ★ ELIMINAR CAMIÓN (nuevo)
      ⚠️ CANCELAR ≠ ELIMINAR — son dos acciones distintas, ambas existen:
        · CANCELAR → POST /admin/trucks/{id}/cancel (antes era el DELETE).
          El camión queda CANCELADO y SUS ÓRDENES SE LIBERAN para otro camión.
          Para un camión CON órdenes que ya no se va a despachar.
        · ELIMINAR → DELETE /admin/trucks/{id}. El camión DESAPARECE.
          Solo si NO tiene órdenes y está en BORRADOR, CONFIRMADO o CANCELADO.
          Para un camión vacío armado por error.
      DELETE /admin/trucks/{id} — borrado REAL. Solo si el camión NO tiene
      órdenes y está en BORRADOR, CONFIRMADO o CANCELADO. Para que el admin
      pueda descartar un camión que armó por error. No se borra un camión que
      un bodeguero ya está trabajando, ni uno ALISTADO.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.9.0 — MANIFIESTO DE RUTA (Bloque 2B-2) · cierre del picking
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ ES
      El informe final del camión: los pedidos por parada, con el/los pallet(s)
      de cada uno. Es con lo que el driver entrega. Lo ve el ADMIN en el
      Dashboard (ver e imprimir).

    ★ PURAMENTE LECTURA
      No hay operación ni estado nuevo. Todos los datos ya existen (pedidos,
      pallets, orden de paradas). El manifiesto solo los junta y ordena.

    ★ ORDEN DE ENTREGA (directo, NO inverso)
      El manifiesto va en orden de paradas DIRECTO (parada 1, 2, 3...). El
      inverso era para CARGAR el camión (fondo primero); el manifiesto es para
      ENTREGAR (primero primero). El driver sigue las paradas en orden natural.

    ★ REGLAS
      · Solo para camiones ALISTADOS (repartición cerrada). Si no → 409.
      · Un pedido con congelados está en 2 pallets (frozen + regular): se
        listan todos los pallets del pedido (ej. "Pallets: 1, 3").

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.8.0 — PICKING FASE 2: repartición + pallets (Bloque 2B-1)
    ══════════════════════════════════════════════════════════════════════════

    ★ ALCANCE: la REPARTICIÓN de lo recogido entre los pedidos, y el ARMADO de
      PALLETS. Van juntos porque la repartición se hace SOBRE los pallets.
      El Manifiesto de Ruta es el Bloque 2B-2 (informe final, aparte).

    ★ PRECONDICIÓN
      La recolección (2A) debe estar COMPLETA. No se reparte lo que no se recogió.
      Nueva transición: EN_PICKING → EN_REPARTICION (cuando arranca la fase 2).

    ★ EL PALLET
      · Identificado por: nombre del camión + correlativo (ej. "Queens-1").
      · Tipo: FROZEN o REGULAR. NUNCA mezclan. Un pedido con congelados usa
        mínimo 2 pallets (uno frozen, uno regular).
      · Contiene asignaciones (ítem, cantidad, pedido). Muchos-a-muchos: un
        pallet tiene varios pedidos; un pedido puede estar en varios pallets
        (el frozen aparte, o porque no cupo por peso/altura).
      · El bodeguero puede CREAR pallets nuevos sobre la marcha (cuando el
        sugerido se llena — juzga a ojo; el cálculo de peso/volumen es futuro,
        cuando SAP tenga esos datos).

    ★ LA REPARTICIÓN GUIADA
      · La app lleva PEDIDO POR PEDIDO, en orden de paradas INVERSO (lo último
        en entregarse se carga primero, al fondo del camión).
      · Por cada ítem del pedido: la app dice cuánto va (de lo recogido). El
        bodeguero lo asigna a un pallet y CONFIRMA cada asignación
        (ítem→pedido→pallet), no espera al cierre del pallet.
      · Frozen → pallet frozen; regular → pallet regular (automático por tipo).

    ★ REGLA DE CUADRE (la vigila el middleware)
      Lo repartido de un ítem debe coincidir con lo recogido (menos faltantes).
      Ni sobra ni falta. La app sabe cuánto queda por repartir de cada ítem y no
      deja cerrar hasta que cuadre. Evita el error clásico del wave picking.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.7.0 — PICKING FASE 1: recolección (Bloque 2A)
    ══════════════════════════════════════════════════════════════════════════

    ★ ALCANCE: solo la RECOLECCIÓN consolidada (wave picking fase 1).
      La repartición entre pedidos, pallets y manifiesto son el Bloque 2B.

    ★ ROL NUEVO: BODEGUERO
      Usuario propio del WMS (no de SAP). Solo pica. No arma camiones ni configura.
      Para 2A se crean bodegueros de prueba por seed (la gestión de usuarios es
      un bloque aparte).

    ★ ASIGNACIÓN DIRIGIDA (no autoservicio)
      El ADMIN asigna un camión CONFIRMADO+con-ruta a UN bodeguero (Dashboard).
      El bodeguero solo ve los camiones que le asignaron. Puede reasignarse a
      otro bodeguero, incluso durante el picking, CONSERVANDO el progreso.
      ★ El progreso de recolección es del CAMIÓN, no del bodeguero — para que
      la reasignación no pierda trabajo.

    ★ ESTADOS DEL CAMIÓN (ampliados)
        CONFIRMADO → (admin asigna) → ASIGNADO → (bodeguero inicia) → EN_PICKING
      Se congela (admin ya no toca órdenes/ruta) al entrar EN_PICKING.

    ★ RECOLECCIÓN CONSOLIDADA (wave, fase 1)
      · DOS listas: REGULARES (ItemCode no empieza con F) y CONGELADOS (empieza
        con F, se recogen en nevera).
      · Por ítem: total a recoger (sumado del camión) + bins con stock.
      · El bodeguero elige bin (la app muestra dónde hay). Configurable a futuro
        para picking dirigido.
      · Confirma cantidad. Registra faltantes. Stock = foto del inicio.
      · Pausar y retomar: el progreso persiste.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.6.0 — ORDEN DE PARADAS (OptimoRoute vía CSV) · Bloque 1.5
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ RESUELVE

      Un camión, antes de picarse, necesita saber EN QUÉ ORDEN se entregan sus
      paradas. Ese cálculo lo hace OptimoRoute (sistema externo). Por ahora la
      comunicación es por CSV manual (export/import); a futuro, por API.

    ★ EL FLUJO

      1. EXPORTAR (Dashboard): genera el CSV de un camión CONFIRMADO,
         AGRUPADO POR CLIENTE (una parada por cliente, no por pedido).
         · Order # = client_code (OptimoRoute acepta alfanumérico)
         · Dirección del CLIENTE (de OCRD, vía vw_WMS_Clients)
         · Subtotal = suma de los pedidos de ese cliente en el camión
         · Columnas: Order Date, Order #, Sales Rep, Customer Name, Address,
           City, Zip Code, Delivery Window From/To, Weight, Subtotal, Shipping Code
         · Marca los clientes con dirección/zip INCOMPLETO (aviso, no bloqueo).

      2. El admin sube el CSV a OptimoRoute (fuera del sistema).

      3. IMPORTAR (Dashboard → middleware): el admin sube el CSV que devuelve
         OptimoRoute (trae una columna Stop # con el orden). El middleware
         empareja cada fila por client_code y guarda el Stop # de cada cliente.
         Ese Stop # se aplica a TODOS los pedidos de ese cliente en el camión.

    ★ REGLAS

      · Una PARADA = un CLIENTE (aunque tenga varios pedidos en el camión).
      · El orden de paradas es RE-IMPORTABLE (subir un CSV corregido), mientras
        el camión no haya empezado el picking.
      · Para el Bloque 2: un camión NO se puede picar sin orden de paradas.
        (Un pedido suelto FUERA DE RUTA sí se podrá picar sin camión — eso es
        del Bloque 2, no de aquí.)

    ★ NO INCLUYE

      La integración por API con OptimoRoute (futuro). Solo CSV manual.
      El picking en sí (Bloque 2).

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.5.0 — CAMIONES (armado de despachos) · BLOQUE 1 del picking
    ══════════════════════════════════════════════════════════════════════════

    ★ NUEVO CONCEPTO: EL CAMIÓN

      Un CAMIÓN es un grupo de órdenes APROBADAS que se despachan (y luego se
      pican) juntas. Lo arma el ADMINISTRADOR DE BODEGA desde el Dashboard,
      cada mañana.

      ⚠️ SE AGRUPA POR SHIPPING CODE, NO POR RUTA.
        · RUTA (U_RSAP_ROUTE) es un eje COMERCIAL (para vendedores). NO es
          logística. No se usa para camiones.
        · SHIPPING CODE (U_RSAP_SHIPPING_CODE) es el eje LOGÍSTICO: zonas
          geográficas de reparto (BNX3, BRK1, QNS2...). Su nombre vive en la
          tabla [@RSAP_SHIPPING_CODE]. ES el criterio de agrupación de camiones.

      Flujo:
        · Las órdenes aprobadas heredan el SHIPPING CODE de su cliente.
        · El admin las ve agrupadas por shipping code y ARMA CAMIONES.
        · Normalmente un camión = un shipping code, pero puede mezclar varios.
        · Una orden aprobada puede quedar SIN camión ese día (queda marcada).

      DÍA DE ENTREGA: cada shipping code se entrega uno o varios días de la
      semana. Ese dato NO está en SAP: lo configura el admin en el Dashboard
      (dato del middleware). Sirve para agrupar/ver la carga por día.

    ★ ESTADOS DEL CAMIÓN

        BORRADOR    El admin lo está armando. Agrega/quita órdenes libremente.
        CONFIRMADO  Listo para picar. Aún modificable.
        EN_PICKING  El bodeguero empezó. ★ SE CONGELA: ya no se modifica.
        ALISTADO    Picking terminado. (Bloque 2)
        CANCELADO   El admin lo deshizo; sus órdenes vuelven a "sin camión".

      Transiciones válidas:
        BORRADOR    → CONFIRMADO | CANCELADO
        CONFIRMADO  → EN_PICKING | BORRADOR | CANCELADO
        EN_PICKING  → ALISTADO            (Bloque 2, la app de bodega)
        (una transición inválida → 409)

    ★ ALCANCE DE ESTA VERSIÓN (Bloque 1)

      SOLO el armado de camiones (Dashboard + middleware). El PICKING en sí
      (la app de bodega, el wave, la repartición) es el Bloque 2 — NO se
      implementa aquí. Por eso EN_PICKING/ALISTADO se definen pero el camión
      llega como mucho a CONFIRMADO en esta versión.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.4.1 — LA APP SE ENTERA DE LA DECISIÓN DEL ADMIN
    ══════════════════════════════════════════════════════════════════════════

    Hasta v0.4.0, POST /orders devolvía el estado de la orden UNA SOLA VEZ, al
    momento de recibirla. Si quedaba RETENIDA_CARTERA, la app nunca volvía a
    preguntar -- el vendedor no se enteraba cuando el admin la aprobaba o
    rechazaba despues.

    GET /sync/orders (nuevo, sync-down) cierra ese ciclo: el vendedor descarga
    el estado ACTUAL de sus propias órdenes (status, hold_reason,
    decision_note, decided_at), incremental por `since` igual que
    /sync/catalog y /sync/clients. Deliberadamente liviano: no repite lo que
    la app ya tiene (client_name, lines, total_amount...), solo lo que puede
    cambiar DESPUÉS de que la orden ya fue aceptada.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.4.1 — SEGUIMIENTO DEL ESTADO DE LA ORDEN
    ══════════════════════════════════════════════════════════════════════════

    ★ EL PROBLEMA QUE RESUELVE

      Hasta v0.4.0, POST /orders era una FOTO ÚNICA: la app guardaba el estado
      que devolvía y nunca lo volvía a consultar. Cuando el admin aprobaba o
      rechazaba una orden retenida, EL VENDEDOR NUNCA SE ENTERABA — su orden
      se quedaba en "Retenida" para siempre.

      Eso rompía el propósito del módulo de cartera: el vendedor debe poder
      decirle a su cliente "tu pedido no procedió porque tienes facturas
      vencidas".

    ★ LA SOLUCIÓN

      1) GET /sync/orders?since=...  (NUEVO)
         La app descarga el estado ACTUAL de sus órdenes ya enviadas.
         Incremental. Filtrado por el vendedor del token.
         Devuelve OrderStatusUpdate (liviano: NO repite líneas, cliente ni
         totales — la app ya los tiene localmente).

      2) decided_by / decided_at / decision_note EN OrderSummary
         (antes solo estaban en OrderDetail)
         Así la GRILLA del Dashboard puede mostrar el motivo del rechazo sin
         tener que abrir el detalle de cada orden.
         Se heredan en OrderDetail y HeldOrder vía allOf.

    ★ BASE PARA EL FUTURO

      GET /sync/orders es el cimiento del seguimiento del ciclo de vida de la
      orden. Cuando lleguen picking, facturación y entrega, el vendedor va a
      querer saber en qué va su pedido — y este es el canal.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.4.0 — CARTERA Y RETENCIÓN DE ÓRDENES
    ══════════════════════════════════════════════════════════════════════════

    1) DATOS DE CARTERA EN EL CLIENTE

       Cada cliente ahora trae su información de crédito, para que la app pueda
       ADVERTIR al vendedor OFFLINE:
         · balance          — saldo actual (de SAP)
         · credit_limit     — cupo
         · credit_available — cupo disponible
         · overdue_count / overdue_amount / max_days_overdue — mora

    2) ESTADO DE CUENTA DEL CLIENTE (nuevo endpoint)

       GET /clients/{client_code}/statement — facturas, notas de crédito y
       pagos a cuenta pendientes. Lo baja la app para verlo offline.

    3) MÁQUINA DE ESTADOS DE LA ORDEN (¡inaugurada aquí!)

       Hasta v0.3.0 toda orden llegaba a SINCRONIZADA y ahí moría.
       Ahora:

         SINCRONIZADA ──(cartera OK)──────────────────► APROBADA
              │
              └──(excede cupo o tiene mora)──► RETENIDA_CARTERA
                                                    │
                                     ┌──────────────┴──────────────┐
                                     ▼                             ▼
                                 APROBADA                     RECHAZADA
                             (admin aprueba)              (admin rechaza)

       La evaluación la hace el MIDDLEWARE al recibir la orden.

    4) LA REGLA DE RETENCIÓN

       Una orden se RETIENE si:
         (a) balance + total_de_la_orden > credit_limit   → excede cupo
         (b) max_days_overdue > 5                          → mora

       Los 5 días de gracia viven en appsettings del middleware (ajustables
       sin recompilar). Son iguales para todos los clientes.

    5) LA APP ADVIERTE, EL MIDDLEWARE DECIDE

       La app evalúa la regla LOCALMENTE (offline, con datos de la última
       sincronización) y ADVIERTE al vendedor: "esta orden quedará retenida".

       Pero NUNCA lo bloquea. El vendedor decide y sigue.

       El middleware vuelve a evaluar con datos FRESCOS al recibirla.
       Los veredictos pueden diferir (el saldo cambió desde la última sync) y
       eso está bien: la advertencia es informativa, la decisión es del servidor.

    6) ENDPOINTS DE APROBACIÓN (Dashboard)

       GET  /admin/orders/held          — órdenes retenidas por cartera
       POST /admin/orders/{uuid}/approve — aprobar
       POST /admin/orders/{uuid}/reject  — rechazar

    ══════════════════════════════════════════════════════════════════════════
    Fuera de alcance (NO implementar): visitas, gastos, promociones,
    facturación a SAP, BIN LOAD.

servers:
  - url: https://api.dinas-wms.example.com/v1
    description: Middleware. El path base es /v1.

tags:
  - name: auth
  - name: sync-down
  - name: sync-up
  - name: credit
  - name: account-payments
    description: >
      ★ v0.17.0 — Pagos de cartera reportados por el vendedor (aplicados a
      facturas vw_CxC) y su aprobación. Distinto de `payments` (dinero
      recogido por el driver en ruta).
  - name: admin
  - name: trucks
    description: Armado de camiones (despachos) por el administrador de bodega.
  - name: shipping-codes
    description: Zonas logísticas de entrega y sus días de la semana.
  - name: route-stops
    description: Orden de paradas de un camión (OptimoRoute vía CSV).
  - name: picking-admin
    description: Asignación de camiones a bodegueros (admin).
  - name: picking
    description: Recolección del bodeguero (rol BODEGUERO).
  - name: distribution
    description: Repartición en pallets (fase 2 del picking).
  - name: manifest
    description: Manifiesto de Ruta (informe final de entrega).
  - name: delivery
    description: Registro del resultado de la entrega (Bloque 3A).
  - name: workload
    description: Tablero de carga por día y shipping code (Bloque 3B).
  - name: dispatch-admin
    description: Asignación de camiones a drivers (Bloque 4A).
  - name: dispatch
    description: Despacho en la calle — la app del driver (Bloque 4A).
  - name: returns
    description: Retorno de producto desde la ruta (Bloque 4B).
  - name: payments
    description: Pagos recogidos en ruta por el DRIVER (Bloque 4C). No confundir con account-payments.
  - name: payments-admin
    description: Pagos de ruta vistos por el admin (Bloque 4C).
  - name: returns-admin
    description: Retornos vistos por el admin (Bloque 4B).
  - name: pickups
    description: >
      ★ v0.45.0 — Recogidas: solicitudes de crédito convertidas en parada de
      camión para ir a BUSCAR mercancía. Marcar (bandeja), montar (camión) y
      registrar (driver). Vía separada de la aprobación del crédito.

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Login por usuario y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Autenticación correcta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ═══════════════════════════════════════════════════════════════
  # ★ NUEVO v0.23.0 — DISPARO A DEMANDA DEL REFRESCO DEL ESPEJO
  # ═══════════════════════════════════════════════════════════════
  # Alcance MÍNIMO a propósito: solo dispara el mismo refresco que ya
  # corre cada 15 min (SapRefreshBackgroundService/SapMirrorRefreshService),
  # sin agregar configuración de intervalo ni panel — eso es un bloque
  # aparte, más adelante. Este endpoint existe puntualmente para que el
  # jefe de bodega pueda pedir datos frescos de stock justo antes del
  # chequeo de reconciliación en Órdenes de Venta → Facturas.

  /admin/sap-refresh/trigger:
    post:
      tags: [sap-refresh]
      summary: Dispara el refresco del espejo SAP ahora, sin esperar el ciclo de 15 min
      description: >
        ★ v0.23.0. REQUIERE rol ADMIN. Llama directamente al mismo
        SapMirrorRefreshService que usa el timer de 15 min
        (SapRefreshBackgroundService) — no es lógica nueva, es el mismo
        código expuesto también bajo demanda. Si ya hay un refresco en
        curso (disparado por el timer o por otra llamada a este mismo
        endpoint), esta llamada espera a que termine ese y devuelve su
        resultado, en vez de correr dos refrescos en paralelo. Síncrono:
        la respuesta llega cuando el refresco ya terminó, no antes.
      responses:
        '200':
          description: Refresco completado (o el de otra llamada en curso, si coincidieron)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SapRefreshResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: El refresco falló contra SAP (ej. conexión caída) — ver source_results para el detalle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SapRefreshResult' }

  /admin/sap-status:
    get:
      tags: [sap-refresh]
      summary: Estado del espejo SAP — qué se refrescó, cuándo, y qué falló
      description: >
        ★ DECLARADO en v0.46.0. REQUIERE rol ADMIN.

        No es nuevo: existe en el proceso desde julio de 2026, servido y sin
        declarar. Lo encontró el test que compara el OpenAPI servido contra
        este archivo. Se declara porque un endpoint servido y no declarado
        es superficie que nadie gobierna.

        Puramente lectura, sin efectos. Es el diagnóstico del espejo: por
        cada fuente, cuándo se intentó refrescar, cuándo fue la última vez
        que salió bien, con qué error falló, cuántas filas tiene y si lleva
        demasiado tiempo sin actualizarse.

        PARA QUÉ SIRVE: hoy la única forma de saber si el espejo está al día
        es entrar a la base. Con esto, cuando algo se ve raro —stock que no
        cuadra, un cliente que no aparece— se puede saber en un click si el
        espejo se refrescó o si lleva horas fallando.

        ⚠️ SOLO ADMIN, Y SIEMPRE LO FUE. `last_error` es texto crudo de
        error de SAP y no hay razón para que un vendedor en la calle lo
        lea. Igual que `POST /admin/sap-refresh/trigger`.

        ★ v0.46.1 — v0.46.0 afirmó acá que la restricción era nueva y que
        antes lo leía cualquier usuario autenticado. Era falso: el
        controlador exige ADMIN desde el día uno, con test. Ver el
        changelog de v0.46.1.
      responses:
        '200':
          description: Estado de cada fuente del espejo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SapStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sync/catalog:
    get:
      tags: [sync-down]
      summary: Catálogo con los 3 precios (vendedor)
      description: >
        ★ v0.30.0 — REQUIERE VENDEDOR, VENDEDOR_INSTITUCIONAL o ADMIN.
        Este endpoint no filtra por vendedor: el catálogo es idéntico para
        los tres roles, así que un ADMIN no necesita indicar
        salesperson_code acá (a diferencia de /sync/clients y /promotions).

        ★ v0.29.0 — VENDEDOR_INSTITUCIONAL opera desde el Dashboard, no
        desde la app iOS, pero necesita la misma superficie de
        sincronización para armar el carrito.

        Solo llegan ítems con SellItem='Y' en SAP.
        Un precio de 0 es VÁLIDO y el ítem ES ORDENABLE (muestra / publicidad).
        `available` viene YA CALCULADO por el middleware.

        ★ GARANTÍA DE v0.41.1 — UN CAMBIO EN UN CAMPO PROPIO DEL WMS APARECE
        EN EL DELTA. Este endpoint entrega solo lo modificado desde `since`,
        y los campos del WMS (`visible_in_catalog`, la imagen) no los mueve el
        refresco de SAP. Si cambiarlos no marcara al ítem como modificado, la
        ocultación no viajaría nunca: el ítem no se omite, simplemente no
        vuelve a aparecer — mismo resultado que la regla quería evitar,
        alcanzado por otra vía. Es una garantía del servidor, no un mecanismo
        que el cliente deba conocer.
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: Lista de ítems (delta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sync/clients:
    get:
      tags: [sync-down]
      summary: Clientes del vendedor, CON SUS DATOS DE CARTERA
      description: >
        ★ v0.30.0 — REQUIERE VENDEDOR, VENDEDOR_INSTITUCIONAL o ADMIN.
        Los dos primeros ven ÚNICAMENTE los clientes asignados a su propio
        salesperson_code (del token, sin excepción). Un ADMIN no tiene
        salesperson_code, así que debe indicarlo por query param — ver
        abajo.

        Solo los clientes ASIGNADOS al vendedor (el del token, o el
        indicado por un ADMIN).

        ★ v0.4.0: cada cliente incluye ahora su información de CRÉDITO
        (balance, cupo, mora). La app la usa para ADVERTIR offline.

        ★ v0.17.5: cada cliente incluye ahora `open_invoices` (facturas
        abiertas de vw_CxC), para que el vendedor pueda armar
        `proposed_applications` en POST /account-payments sin conexión.
      parameters:
        - $ref: '#/components/parameters/Since'
        - name: salesperson_code
          in: query
          required: false
          schema: { type: string }
          description: >
            ★ NUEVO en v0.30.0. SOLO para ADMIN. Un ADMIN no tiene
            salesperson_code propio, así que debe indicar de qué vendedor
            quiere los datos (400 si un ADMIN lo omite).

            VENDEDOR y VENDEDOR_INSTITUCIONAL NO lo envían: si lo mandan se
            IGNORA y se usa el del token, igual que en GET /my-orders. Un
            vendedor nunca puede ver los datos de otro.
      responses:
        '200':
          description: Lista de clientes (delta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  clients:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sync/orders:
    get:
      tags: [sync-down]
      summary: Estado ACTUAL de las órdenes del vendedor (delta)
      description: >
        ★ v0.30.0 — sigue en VENDEDOR o VENDEDOR_INSTITUCIONAL: este
        endpoint NO se abre a ADMIN, a diferencia de /sync/catalog y
        /sync/clients. Un ADMIN ve las órdenes por GET /admin/orders, que
        ya filtra por salesperson_code.

        Nota para quien implemente: eso obliga a autorización por ACCIÓN en
        SyncController, no a nivel de clase — un [Authorize] de clase con
        ADMIN abriría este endpoint de arrastre, porque los atributos de
        clase y método se acumulan con AND y no se aflojan hacia abajo.

        ★ v0.29.0 — cada rol ve el estado ÚNICAMENTE de sus propias órdenes
        (salesperson_code del token). Un institucional que toma pedidos
        necesita ver cómo evolucionan, igual que cualquier VENDEDOR.

        ★ NUEVO en v0.4.1.

        POST /orders devuelve el estado de la orden UNA SOLA VEZ, al momento
        de recibirla. Si el admin la aprueba o rechaza DESPUÉS, la app nunca
        se enteraba -- este endpoint cierra ese ciclo.

        Solo las órdenes del vendedor del token (mismo filtro que
        /sync/clients). Incremental por `since`, igual que /sync/catalog y
        /sync/clients: trae tanto órdenes nuevas como las que cambiaron de
        estado desde la última sincronización.

        Deliberadamente liviano -- no repite lo que la app ya tiene de cuando
        envió la orden (client_name, lines, total_amount...), solo lo que
        puede cambiar DESPUÉS: status, hold_reason, decision_note, decided_at.
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: Órdenes del vendedor (delta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time: { type: string, format: date-time }
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/OrderStatusUpdate' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /clients/{client_code}/statement:
    get:
      tags: [credit]
      summary: Estado de cuenta del cliente (facturas, NC, pagos)
      description: >
        ★ v0.29.0 — REQUIERE VENDEDOR o VENDEDOR_INSTITUCIONAL. 403
        client_not_assigned si el cliente no está asignado al
        salesperson_code del token, sin distinción de rol.

        ★ NUEVO en v0.4.0.

        Documentos pendientes del cliente. La app lo baja para que el vendedor
        pueda consultarlo OFFLINE al visitar al cliente.

        · INVOICE            → open_amount POSITIVO (el cliente debe)
        · CREDIT_NOTE        → open_amount NEGATIVO (resta deuda)
        · PAYMENT_ON_ACCOUNT → open_amount NEGATIVO (resta deuda)

        NOTA: la suma del detalle se APROXIMA al `balance`, pero puede diferir
        por ajustes contables. **El `balance` es la cifra oficial**; el detalle
        la desglosa. Es una herramienta comercial, no una auditoría contable.

        El vendedor solo puede consultar SUS clientes (403 si no es suyo).
      parameters:
        - name: client_code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Estado de cuenta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientStatement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El cliente no está asignado a este vendedor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders:
    post:
      tags: [sync-up]
      summary: Enviar una orden tomada por el vendedor
      description: >
        Idempotente por 'client_uuid'. UUID ya registrado → 200 con la orden
        existente (sin duplicar). UUID nuevo → 201.

        ★ v0.4.0: el middleware EVALÚA LA CARTERA al recibir la orden.
        La respuesta indica en qué estado quedó:
          · APROBADA          → cartera OK, la orden sigue su curso
          · RETENIDA_CARTERA  → excede cupo o tiene mora; espera al admin

        El campo `hold_reason` explica POR QUÉ se retuvo (para mostrárselo al
        vendedor).

        `unit_price = 0` y `line_discount_pct = 100` son VÁLIDOS.
        `price_list` debe estar entre las autorizadas del cliente (si no → 400,
        ver los códigos de error documentados abajo).

        ★ v0.30.0 — REQUIERE VENDEDOR, VENDEDOR_INSTITUCIONAL o ADMIN.

        ADMIN es nuevo acá: puede tomar pedidos desde el carrito del Dashboard
        a nombre de un vendedor, y por eso `salesperson_code` es OBLIGATORIO
        en su caso (ver OrderCreate). Para los otros dos roles nada cambia:
        el servidor sigue resolviendo el vendedor desde el token e ignora el
        campo si viene.

        En todos los casos el pedido entra al MISMO pipeline y termina en el
        mismo Order.Status — no hay concepto de canal ni tratamiento distinto
        según quién lo creó. La única diferencia observable es `created_by`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Orden creada (ver `status` para saber si quedó retenida)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderAccepted' }
        '200':
          description: Orden ya existente (reintento idempotente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderAccepted' }
        '400':
          description: >
            ★ v0.29.0 — códigos de error documentados (antes solo se decía
            "400"). Distínguelos por `Error.code`, no por el texto del
            mensaje.

            · `unauthorized_price_list` — alguna línea usa un price_list que
              el cliente no tiene autorizado. El mensaje nombra la línea
              concreta y lista las autorizadas, así que es mostrable al
              usuario tal cual. Ejemplo real: "price_list 1 no esta
              autorizada para el cliente 'C100003' (linea 'F1MD-GARRAFA
              LG-01'). Autorizadas: [3]."

            · `invalid_promotion` — el bloque de una promoción llegó
              incompleto. El bloque es INDIVISIBLE: o van todas sus líneas
              (condición + beneficio, compartiendo el mismo
              promotion_group_id) o no va ninguna. El mensaje nombra la
              línea que falta. Ejemplo real: "Falta la linea de beneficio
              'GDD0027' del bloque de la promocion '78866ea1-…'."

            Otros 400 genéricos (payload malformado, campos faltantes)
            siguen el formato estándar de Error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ═══════════════════════════════════════════════════════════════
  # ★ NUEVO v0.17.2 — SUBIDA DE EVIDENCIA (compartido por ambos flujos)
  # ═══════════════════════════════════════════════════════════════
  /evidence-photos:
    post:
      tags: [account-payments, credit-requests]
      summary: Sube una foto de evidencia y devuelve su URL
      description: >
        ★ v0.17.2. Endpoint compartido por account-payments y credit-requests.
        ★ v0.17.7: evidencia OPCIONAL en ambos flujos (antes obligatoria en
        account-payments). La app sube la imagen en base64 aquí PRIMERO,
        recibe `evidence_image_url`, y luego la incluye al reportar el pago
        o la solicitud de crédito, si decide adjuntarla. No requiere
        idempotencia por uuid — subir la misma imagen dos veces solo produce
        dos archivos independientes, sin efecto sobre ningún registro de
        negocio (el efecto real ocurre al crear el AccountPayment/CreditRequest
        que referencia la URL).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidencePhotoUpload' }
      responses:
        '201':
          description: Imagen subida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePhotoUploaded' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /evidence-photos/{id}:
    get:
      tags: [account-payments, credit-requests]
      summary: Sirve de vuelta una foto de evidencia ya subida
      description: >
        ★ v0.17.3. Necesario para que la bandeja de aprobación del Dashboard
        muestre la imagen sin salir de la pantalla. `id` es el identificador
        devuelto dentro de `evidence_image_url` por POST /evidence-photos —
        `evidence_image_url` YA es la ruta relativa a este mismo GET (p. ej.
        `/evidence-photos/3fa85f64-...`), no una URL externa aparte. Requiere
        rol ADMIN, APROBADOR_PAGOS o APROBADOR_CREDITOS (no el vendedor que la
        subió, salvo que sea dueño del registro — a criterio de implementación
        si se necesita esa excepción).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Bytes de la imagen (JPEG/PNG)
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ═══════════════════════════════════════════════════════════════
  # ★ NUEVO v0.17.0 — PAGOS DE CARTERA (account-payments)
  # ═══════════════════════════════════════════════════════════════
  /account-payments:
    post:
      tags: [account-payments]
      summary: Reportar un pago de cartera tomado por el vendedor
      description: >
        ★ v0.17.0. Idempotente por `payment_uuid` (generado por la app, mismo
        patrón que /orders). El vendedor PROPONE la imputación a facturas
        (vw_CxC); el aprobador la confirma o modifica. Queda en
        PENDIENTE_APROBACION hasta entonces.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountPaymentCreate' }
      responses:
        '201':
          description: Pago creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPaymentAccepted' }
        '200':
          description: Reintento idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPaymentAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /credit-requests:
    post:
      tags: [account-payments]
      summary: Solicitar una Nota de Crédito
      description: >
        ★ v0.33.1 — REQUIERE rol VENDEDOR, VENDEDOR_INSTITUCIONAL, ADMIN o
        APROBADOR_CREDITOS.

        Este endpoint NUNCA había declarado rol, y la implementación
        aceptaba SOLO a VENDEDOR — los otros tres recibían 403. Eso hacía
        imposible que la oficina creara una solicitud desde el Dashboard,
        que es justamente el punto del vínculo con las devoluciones de ruta
        introducido en v0.33.0: el driver captura en ruta y alguien en
        oficina crea el crédito a partir de eso.

        Mismo caso que el 403 de `reject` corregido en v0.32.2: residuo de
        v0.17.0, no diseño.

        ★ v0.33.2 — `salesperson_code` se resuelve DESDE EL CLIENTE, no
        desde el token. Eso es lo que hace posible abrir el endpoint: un
        ADMIN o un APROBADOR_CREDITOS no tienen código propio, y el método
        que lo leía del token LANZA si el claim falta — abrirlo sin este
        cambio habría dado 500, peor que el 403 que reemplaza.

        Y quien la carga queda en `created_by`, igual que en los pedidos
        desde v0.30.0. Ver ambos campos en CreditRequestDetail.

        ★ v0.47.0 — ELIMINADO el rechazo `item_never_invoiced_to_client`
        que introdujo v0.33.3. NO HAY NINGUNA RESTRICCIÓN DE ÍTEM NI DE
        FACTURA: cualquier `item_code` del catálogo, con o sin
        `invoice_doc_num`.

        Una solicitud es un PEDIDO, no una afirmación contable que haya que
        respaldar de antemano. Siempre hay una persona que la revisa y la
        autoriza o la rechaza, y acreditarle un monto a la cuenta de un
        cliente sin relacionar factura es práctica corriente. Poner la
        puerta antes del pedido rechaza al que pide, no al que decide.

        ★ v0.47.1 — TAMPOCO SE RECHAZA POR FALTA DE PRECIO. La creación
        NUNCA falla por no poder resolver un precio: si no hay ninguno, la
        línea vale **1.00** y `price_source` viaja en `PLACEHOLDER`. Quien
        aprueba pone el monto final, y si lo aprueba en 1.00 es una
        decisión suya.

        (v0.47.0 declaraba un 400 `price_unresolved` para ese caso. Se
        eliminó antes de implementarse.)

        La garantía que v0.33.3 quería se conserva igual: un precio que no
        se pudo resolver NUNCA se convierte en 0. Ese era el bug —
        `cantidad × null` → 0 guardaba la solicitud en cero y el aprobador
        veía un cero aprobable, porque un cero se lee como "no corresponde
        acreditar" y pasa desapercibido. 1.00 no se lee como nada.

        Ver `price_source` en CreditRequestDetailLine para la cadena
        completa de resolución.

        ★ v0.17.0. Dos modalidades: CON ítems (monto calculado de las líneas)
        o SIN ítems (monto manual + razón, que determina la cuenta G/L).
        Idempotente por `request_uuid`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditRequestCreate' }
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditRequestAccepted' }
        '200':
          description: Reintento idempotente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditRequestAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/account-payments/pending:
    get:
      tags: [admin]
      summary: Pagos de cartera pendientes de aprobación
      description: ★ v0.17.0. REQUIERE rol ADMIN o APROBADOR_PAGOS.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de pagos pendientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  payments:
                    type: array
                    items: { $ref: '#/components/schemas/PendingAccountPayment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/account-payments/{payment_uuid}/approve:
    post:
      tags: [admin]
      summary: Aprobar (o modificar la imputación) de un pago de cartera
      description: >
        ★ v0.17.0. REQUIERE rol APROBADOR_PAGOS.
        El aprobador puede CONFIRMAR la imputación propuesta o REEMPLAZARLA
        con `applications` editado. Si la suma de `applications` no cubre el
        `amount` total, el sobrante queda como PAGO_A_CUENTA (sin aplicar, no
        bloquea). Al confirmar, dispara POST → SAP (IncomingPayments).
      parameters:
        - name: payment_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountPaymentApproval' }
      responses:
        '200':
          description: Pago aprobado e integrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPaymentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El pago ya fue decidido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/account-payments/{payment_uuid}/reject:
    post:
      tags: [admin]
      summary: Rechazar un pago de cartera reportado
      description: ★ v0.17.0. REQUIERE rol APROBADOR_PAGOS. Motivo obligatorio.
      parameters:
        - name: payment_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Pago rechazado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPaymentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El pago ya fue decidido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /account-payments/{payment_uuid}/cancel:
    post:
      tags: [account-payments]
      summary: El VENDEDOR cancela su propio pago reportado por error, antes de revisión
      description: >
        ★ v0.21.0. REQUIERE rol VENDEDOR — endpoint distinto de
        /admin/account-payments/{payment_uuid}/reject (ese es del aprobador).
        Solo el vendedor que reportó el pago puede cancelarlo (validar
        ownership contra salesperson_code del token, 403 si no coincide).
        Motivo OPCIONAL (a diferencia del reject del aprobador, que lo exige).
        Deja el registro en CANCELADO — NO en RECHAZADO, son conceptos
        distintos (ver ApprovalStatus). NO es el mecanismo para cancelar un
        pago ya APROBADO o integrado a SAP — eso es una función aparte,
        futura, del lado del Dashboard (reversar una transacción real en
        SAP tiene su propio flujo, no este).
      parameters:
        - name: payment_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true }
      responses:
        '200':
          description: Pago cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPaymentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: No es el vendedor dueño del pago, o rol incorrecto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El pago ya no está PENDIENTE_APROBACION (ya fue decidido)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/credit-requests/pending:
    get:
      tags: [admin]
      summary: Solicitudes de crédito pendientes de aprobación
      description: ★ v0.17.0. REQUIERE rol ADMIN o APROBADOR_CREDITOS.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de solicitudes pendientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  credit_requests:
                    type: array
                    items: { $ref: '#/components/schemas/PendingCreditRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/invoices/{invoice_doc_num}/lines:
    get:
      tags: [admin]
      summary: Líneas de una factura, para asignarlas a un crédito
      description: >
        ★ NUEVO en v0.31.0. REQUIERE rol APROBADOR_CREDITOS o ADMIN.

        Devuelve las líneas de una factura de SAP con su número de línea, para
        que el aprobador de un crédito elija contra cuál va cada línea de la
        solicitud.

        POR QUÉ EXISTE: la nota de crédito se liga a la factura POR LÍNEA
        (BaseLine), no de cabecera. Y no se puede deducir automáticamente por
        `item_code`, porque el mismo ítem aparece repetido con frecuencia — el
        esquema de promociones escribe los ítems descontados en línea aparte
        para que el cliente vea los descuentos. Cualquier heurística fallaría
        de forma rutinaria, así que la elección la hace una persona con el
        contexto delante.

        Lectura de solo lectura sobre el espejo de SAP. No modifica nada.

        ★ FILTRA FACTURAS ANULADAS. Una factura cancelada no es un destino
        válido para un crédito — devolver sus líneas solo daría algo que
        elegir mal. Si la factura está anulada, responde 404 igual que si no
        existiera.

        Si el espejo de SAP no está disponible, responde 404, nunca 500: la
        ausencia de la factura y la ausencia de la fuente se ven igual desde
        acá, y ninguna de las dos es un error del servidor.
      parameters:
        - name: invoice_doc_num
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Líneas de la factura
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice_doc_num: { type: string }
                  client_code: { type: string }
                  lines:
                    type: array
                    items: { $ref: '#/components/schemas/InvoiceLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: La factura no existe en SAP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/credit-requests/{request_uuid}:
    get:
      tags: [admin]
      summary: Detalle de una solicitud de crédito, decidida o no
      description: >
        ★ NUEVO en v0.32.0. REQUIERE rol APROBADOR_CREDITOS o ADMIN.

        POR QUÉ EXISTE: hasta v0.31.2, `CreditRequestDetail` solo se
        devolvía como RESPUESTA de approve, reject o cancel — o sea en el
        instante de decidir. Una vez aprobada, la solicitud desaparecía de
        la bandeja (que por definición solo lista pendientes) y no había
        forma de volver a leerla.

        Eso dejaba inalcanzable justo el campo que CAMBIA después de
        aprobar: `sap_documents`, donde aparecen los DocNum de las notas
        creadas y los errores de integración. Sin este endpoint, el
        Dashboard no puede mostrar en qué quedó una solicitud ni ofrecer el
        reintento del documento que falló — que es medio punto del modelo
        de dos documentos.

        Es el mismo hueco que tuvo `line_id` en v0.31.0, en su otra mitad:
        entonces faltaba poder leer ANTES de decidir, y se resolvió cargando
        la bandeja. Acá falta leer DESPUÉS, y la bandeja no sirve.
      parameters:
        - name: request_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La solicitud, en cualquier estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/credit-requests/{request_uuid}/retry:
    post:
      tags: [admin]
      summary: Reintentar la integración de un documento que falló
      description: >
        ★ NUEVO en v0.32.1. REQUIERE rol APROBADOR_CREDITOS o ADMIN.

        Vuelve a encolar el documento indicado de una solicitud ya
        aprobada, para que el sincronizador lo intente de nuevo.

        POR QUÉ EXISTE: el modelo de dos documentos contempla que uno se
        integre y el otro falle, y que el que pasó QUEDE HECHO. Pero hasta
        v0.32.0 no había forma de reintentar el que falló desde el
        Dashboard: reaprobar devuelve 409 `credit_request_already_decided`,
        y los endpoints `/admin/sap-sync/*` son la superficie del
        sincronizador, no la del Dashboard.

        O sea que el aprobador podía VER que un documento quedó en error y
        no tenía cómo hacer nada al respecto. Este endpoint cierra esa
        mitad.

        Solo aplica a documentos en `ERROR_INTEGRACION`. Un documento ya
        integrado no se reintenta: devuelve 409 y no toca nada — igual que
        reportar dos veces sobre una tarea ya integrada.
      parameters:
        - name: request_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_kind]
              properties:
                doc_kind:
                  type: string
                  enum: [ITEMS, SERVICE]
                  description: >
                    Cuál de los documentos de la solicitud se reintenta. Es
                    obligatorio porque una solicitud puede tener dos, y solo
                    uno de ellos puede haber fallado.
      responses:
        '200':
          description: Documento re-encolado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditRequestDetail' }
        '400':
          description: doc_kind inválido, o la solicitud no tiene ese documento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            El documento no está en ERROR_INTEGRACION — ya está integrado, o
            todavía no se intentó.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/credit-requests/{request_uuid}/approve:
    post:
      tags: [admin]
      summary: Aprobar una solicitud de crédito
      description: >
        ★ v0.31.0 — la aprobación pasa a ser una decisión con contenido, no
        solo un visto bueno. El aprobador puede AJUSTAR el monto de cada
        línea y DEBE asignarle una línea de la factura cuando la solicitud
        trae `invoice_doc_num`.

        La integración con SAP deja de ser un stub: al aprobar se encolan de
        verdad una o dos notas de crédito reales (ver
        `CreditRequestSapDocument`).

        ★ v0.17.0. REQUIERE rol APROBADOR_CREDITOS **o ADMIN**.

        ⚠️ v0.32.1 — esto siempre estuvo en el contrato y la implementación
        NO lo cumplía: rechazaba a ADMIN con 403. Se detectó midiendo la
        matriz de roles, y el 409 con el rol correcto sobre la misma
        solicitud probó que el 403 era de ROL y no de estado.

        El efecto era feo: el Dashboard deja entrar a ADMIN a la bandeja,
        así que podía abrirla, cargar montos, elegir líneas, apretar
        Aprobar — y recibir un 403 con cuerpo vacío. Es un bug de
        implementación, no un cambio de diseño.
        Si la solicitud es SIN ítems, la cuenta G/L se resuelve
        automáticamente por `reason` (tabla de configuración, no elegible
        manualmente).
      parameters:
        - name: request_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
                line_allocations:
                  type: array
                  nullable: true
                  description: >
                    ★ NUEVO en v0.31.0. La decisión del aprobador sobre cada
                    línea de la solicitud.

                    OBLIGATORIO cuando la solicitud tiene `lines` (modalidad
                    CON ítems) — 400 si falta, o si no cubre todas las
                    líneas, o si trae un `line_id` que no existe. No aplica a
                    la modalidad SIN ítems.

                    Cada entrada corresponde a una línea de la solicitud,
                    identificada por su `line_id` (nunca por `item_code`, que
                    puede repetirse).
                  items:
                    type: object
                    required: [line_id, approved_amount]
                    properties:
                      line_id:
                        type: integer
                        description: >
                          El `line_id` de la línea de la solicitud, tal como
                          viene en `PendingCreditRequest.lines` (la bandeja)
                          o en `CreditRequestDetail.lines`.

                          ★ v0.31.2 — la bandeja lo trae desde esta versión.
                          Antes no, y eso hacía el endpoint inaplicable.
                      approved_amount:
                        type: number
                        format: double
                        description: >
                          Monto que finalmente se acredita por esta línea. El
                          aprobador puede confirmar el `proposed_amount` del
                          vendedor o cambiarlo. Es lo que viaja a SAP.
                      base_line:
                        type: integer
                        nullable: true
                        description: >
                          El `line_num` de la línea de la FACTURA contra la
                          que va este crédito, obtenido de
                          GET /admin/invoices/{invoice_doc_num}/lines.

                          OBLIGATORIO cuando la solicitud trae
                          `invoice_doc_num` **y la línea va a un documento
                          de ÍTEMS** (motivos DOESNT_WANT_IT, MISTAKE o
                          DAMAGED). Ahí el aprobador lo elige SIEMPRE,
                          incluso cuando el ítem aparece una sola vez en la
                          factura y no hay ambigüedad — se confirma
                          explícitamente, no se deduce.

                          ★ v0.32.0 — NO se exige para líneas SHORT, aunque
                          la solicitud traiga factura. Esas van a un
                          documento de SERVICIO, y una línea de servicio no
                          se puede ligar a una factura: SAP la deja en
                          `BaseType -1`. Pedirle al aprobador que elija una
                          línea que después se descarta era pedirle una
                          decisión sin consecuencia, y difícil de explicar
                          en la interfaz.

                          NULL también cuando la solicitud no trae factura:
                          ahí la nota va independiente, sin ligar.

                          ⚠️ VALIDACIÓN QUE EL CLIENTE DEBE HACER: que la
                          cantidad acreditada no exceda la cantidad de la
                          línea elegida. SAP NO lo valida — se verificó
                          contra Service Layer que acepta acreditar 10
                          unidades contra una línea de 1, sin error ni
                          advertencia. Sin esa validación del lado del
                          cliente, un error de tipeo se convierte en un
                          crédito real por varias veces el valor vendido,
                          con stock devuelto por cantidades que nunca
                          salieron.
      responses:
        '200':
          description: Solicitud aprobada e integrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya fue decidida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/credit-requests/{request_uuid}/reject:
    post:
      tags: [admin]
      summary: Rechazar una solicitud de crédito
      description: >
        ★ v0.32.2 — REQUIERE rol APROBADOR_CREDITOS **o ADMIN**. Motivo
        obligatorio.

        ADMIN se agrega para alinear con `approve`, que lo tiene desde
        v0.17.0. La asimetría estaba al revés desde el riesgo: un ADMIN
        podía APROBAR —que crea notas de crédito reales en SAP y mueve
        inventario— pero no RECHAZAR, que no tiene ningún efecto externo.
        Se le permitía la acción peligrosa y se le negaba la inocua.

        ★ v0.17.0.
      parameters:
        - name: request_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Solicitud rechazada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya fue decidida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/credit-requests/{request_uuid}/pickup:
    post:
      tags: [pickups]
      summary: Marcar una solicitud de crédito como RECOGIDA de producto
      description: >
        ★ NUEVO en v0.45.0. REQUIERE rol ADMIN o APROBADOR_CREDITOS.

        Marca que esta solicitud implica ir a BUSCAR mercancía donde el
        cliente. NO la monta en ningún camión: eso es un acto aparte
        (`POST /admin/trucks/{truck_id}/pickups`), porque el camión de esa
        zona normalmente todavía no existe cuando llega la solicitud.

        SOLO mientras la solicitud está PENDIENTE_APROBACION → 409
        `credit_request_already_decided` si ya se decidió. Marcar es parte de
        mirarla por primera vez; una vez decidida, esa ventana se cerró.

        ⚠️ MARCAR NO ES APROBAR NI CONDICIONA LA APROBACIÓN. Aprobar y
        recoger son vías separadas: el aprobador decide sin esperar la
        mercancía y el camión la recoge sin esperar la decisión.

        Idempotente: volver a marcar una ya marcada devuelve 200 con el
        estado actual, sin crear nada ni pisar `pickup_note` con null.
      parameters:
        - name: request_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pickup_note:
                  type: string
                  nullable: true
                  description: >
                    Instrucción para quien va a recoger (dónde está la
                    mercancía, con quién preguntar). La ve el driver en su
                    parada. Omitirlo en una re-marca NO borra el anterior.
      responses:
        '200':
          description: Solicitud marcada como recogida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            `credit_request_already_decided` — la solicitud ya fue aprobada,
            rechazada o cancelada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [pickups]
      summary: Quitarle la marca de recogida a una solicitud
      description: >
        ★ NUEVO en v0.45.0. REQUIERE rol ADMIN o APROBADOR_CREDITOS.

        Deshace la marca. La solicitud sigue su curso normal de aprobación —
        esto no la toca.

        Se puede desmarcar aunque la solicitud ya esté decidida: la marca
        pudo ponerse por error y no hay razón para dejar viva una recogida
        que nadie va a hacer. Lo que NO se puede es desmarcar una recogida
        que ya está montada en un camión (409 `pickup_on_truck`, con
        `truck_id`) ni una ya RECOGIDA (409 `pickup_already_collected`):
        primero se desmonta del camión, y lo que ya volvió en un camión no
        se puede declarar inexistente.

        Idempotente: desmarcar una que no está marcada devuelve 200.
      parameters:
        - name: request_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Marca retirada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            `pickup_on_truck` (está montada en un camión; el cuerpo trae
            `truck_id`) o `pickup_already_collected` (el driver ya registró
            la devolución).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /credit-requests/{request_uuid}/cancel:
    post:
      tags: [credit-requests]
      summary: El VENDEDOR cancela su propia solicitud de crédito reportada por error
      description: >
        ★ v0.21.0. Mismo patrón que /account-payments/{payment_uuid}/cancel
        — REQUIERE rol VENDEDOR (distinto del reject del aprobador),
        ownership validado contra el token, motivo OPCIONAL, deja el
        registro en CANCELADO (no RECHAZADO). Solo válido mientras el
        registro sigue PENDIENTE_APROBACION.
      parameters:
        - name: request_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true }
      responses:
        '200':
          description: Solicitud cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: No es el vendedor dueño de la solicitud, o rol incorrecto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya no está PENDIENTE_APROBACION (ya fue decidida)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ═══════════════════════════════════════════════════════════════
  # ★ NUEVO v0.18.0 — COLA DE INTEGRACIÓN SAP (SapIntegrationTask)
  # ═══════════════════════════════════════════════════════════════
  # Consumidos por el sincronizador local (Windows Service en el Windows
  # Server), NUNCA por la app de vendedores ni el Dashboard directamente.
  # Auth: requiere rol ADMIN (el sincronizador se loguea como una cuenta
  # de servicio ADMIN — no hay rol nuevo para esto).
  #
  # Solo cubre los 2 tipos de documento que ya existen (ACCOUNT_PAYMENT,
  # CREDIT_REQUEST). Tipos futuros (órdenes→facturas, retornos→voids,
  # etc.) tendrán su propio par de endpoints cuando existan — no se
  # generaliza este par para adivinar el futuro.
  #
  # IMPORTANTE: estos endpoints NO tocan AccountPayment/CreditRequest
  # todavía — el corte del stub actual hacia esta cola real es un paso
  # posterior, deliberadamente separado.

  /admin/sap-sync/account-payments/pending:
    get:
      tags: [sap-sync]
      summary: Tareas de integración SAP pendientes — pagos de cartera
      description: >
        ★ v0.18.0. REQUIERE rol ADMIN. Trae tareas con status PENDIENTE o
        ERROR (para reintento automático en el próximo ciclo del
        sincronizador). `forced` es informativo — el sincronizador decide
        si lo usa para saltarse su ventana horaria; el filtro de este
        endpoint es únicamente por status, no por `forced`.
      responses:
        '200':
          description: Lista de tareas pendientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/SapAccountPaymentSyncTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/sap-sync/account-payments/{task_id}/result:
    post:
      tags: [sap-sync]
      summary: Reportar el resultado de integrar un pago de cartera a SAP
      description: >
        ★ v0.18.0, CORREGIDO en v0.20.0. REQUIERE rol ADMIN. Actualiza
        SapIntegrationTask Y el AccountPayment real: INTEGRADO →
        AccountPayment.sap_incoming_payment_doc_num = sap_reference (queda
        APROBADO con la integración confirmada); ERROR → AccountPayment
        pasa a ERROR_INTEGRACION (reintentable — un nuevo approve sobre un
        registro en ERROR_INTEGRACION reactiva la MISMA SapIntegrationTask
        a PENDIENTE, nunca crea una fila nueva). 409 si la tarea ya está en
        estado INTEGRADO.
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SapSyncResultReport' }
      responses:
        '200':
          description: Resultado registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SapAccountPaymentSyncTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La tarea ya está INTEGRADO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/sap-sync/credit-requests/pending:
    get:
      tags: [sap-sync]
      summary: Tareas de integración SAP pendientes — solicitudes de crédito
      description: >
        ★ v0.18.0. REQUIERE rol ADMIN. Mismo criterio de elegibilidad que
        la de pagos (status PENDIENTE o ERROR; `forced` informativo).
      responses:
        '200':
          description: Lista de tareas pendientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/SapCreditRequestSyncTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/sap-sync/credit-requests/{task_id}/result:
    post:
      tags: [sap-sync]
      summary: Reportar el resultado de integrar una solicitud de crédito a SAP
      description: >
        ★ v0.18.0. REQUIERE rol ADMIN. Actualiza ÚNICAMENTE
        SapIntegrationTask (no toca CreditRequest — corte posterior, sigue
        pendiente. A diferencia de account-payments, que YA tuvo su corte
        en v0.20.0 — ver ese endpoint. CreditRequest sigue con el stub de
        integración, no el sincronizador real). 409 si la tarea ya está en
        estado INTEGRADO.
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SapSyncResultReport' }
      responses:
        '200':
          description: Resultado registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SapCreditRequestSyncTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La tarea ya está INTEGRADO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ═══════════════════════════════════════════════════════════════
  # ★ NUEVO v0.22.0 — ÓRDENES DE VENTA → FACTURAS (ORDER_INVOICE)
  # ═══════════════════════════════════════════════════════════════
  # Igual patrón que account-payments/credit-requests, pero con un origen
  # de disparo distinto: no hay aprobación de negocio que encole la tarea
  # — se encola automáticamente cuando un camión llega a ALISTADO
  # (Truck.AlistadoAtUtc), una orden por cada Order APROBADA del camión
  # que SÍ tenga filas en PalletAssignment (las de faltante total no
  # generan factura). La factura es standalone — no referencia ninguna
  # Orden de Venta base en SAP (no existe tal documento).

  /admin/sap-sync/order-invoices/pending:
    get:
      tags: [sap-sync]
      summary: Tareas de integración SAP pendientes — facturas de órdenes ya pickeadas
      description: >
        ★ v0.22.0. REQUIERE rol ADMIN. Mismo criterio de elegibilidad que
        pagos/créditos (status PENDIENTE o ERROR; `forced` informativo).
      responses:
        '200':
          description: Lista de tareas pendientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/SapOrderInvoiceSyncTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/sap-sync/order-invoices/{task_id}/result:
    post:
      tags: [sap-sync]
      summary: Reportar el resultado de integrar una factura de orden a SAP
      description: >
        ★ v0.22.0. REQUIERE rol ADMIN. Actualiza ÚNICAMENTE
        SapIntegrationTask — este bloque no tiene todavía un "AccountPayment"
        equivalente que actualizar (la orden en sí no cambia de estado por
        esto; si en el futuro se decide reflejar el resultado en la orden,
        es un cambio aparte). 409 si la tarea ya está en estado INTEGRADO.
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SapSyncResultReport' }
      responses:
        '200':
          description: Resultado registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SapOrderInvoiceSyncTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La tarea ya está INTEGRADO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ═══════════════════════════════════════════════════════════════
  # ★ NUEVO v0.27.0 — CONTROL MANUAL DE RECONCILIACIÓN ANTES DE FACTURAR
  # ═══════════════════════════════════════════════════════════════
  # Reemplaza el disparo automático de ORDER_INVOICE en ALISTADO (que
  # existía desde v0.22.0) — ahora el jefe de bodega debe: (1) correr el
  # chequeo de stock, (2) resolver discrepancias con reducciones
  # dirigidas si las hay, (3) volver a chequear, (4) enviar a facturar
  # solo cuando el último chequeo salió limpio y reciente. El disparo
  # automático en RefreshAggregateStatusAsync debe eliminarse — un
  # camión en ALISTADO ya NO encola nada por sí solo.

  /admin/trucks/{truck_id}/invoice-readiness:
    get:
      tags: [dispatch-admin]
      summary: Chequeo de stock antes de enviar a facturación — compara demanda agregada del camión contra SAP
      description: >
        ★ v0.34.1 — aplica a camiones en ALISTADO, ASIGNADO_DRIVER,
        EN_RUTA o RUTA_CERRADA. Antes exigía ALISTADO, y eso dejaba a
        v0.34.0 sin efecto: `send-to-invoicing` se amplió a esos cuatro
        estados pero exige un chequeo LIMPIO y de menos de 5 minutos, y
        este endpoint es el ÚNICO que lo escribe. Un camión despachado no
        podía obtenerlo nunca, así que el rechazo llegaba igual — solo que
        con otro código. El callejón no se había cerrado, se había mudado
        de compuerta.

        Es una lectura: compara lo que el camión demanda contra el stock
        disponible. Nada en ella depende de que el camión no haya salido.

        ★ v0.27.0. REQUIERE ADMIN.
        Por cada ítem con demanda en el camión (suma de PalletAssignment
        de TODAS sus órdenes APROBADA), compara contra el stock real del
        almacén 01 (vw_WMS_Stock — usa POST /admin/sap-refresh/trigger
        primero si quieres datos frescos, esto NO refresca por su cuenta).
        Cada llamada PERSISTE su resultado en el camión
        (Truck.LastInvoiceReadinessCheckAt/Clean) — es lo que
        POST .../send-to-invoicing exige antes de dejar enviar.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Resultado del chequeo (limpio o con discrepancias)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckInvoiceReadiness' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            El picking del camión no está completo (código
            `picking_not_complete`) — se acepta desde ALISTADO en adelante.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/orders/{order_uuid}/items/{item_code}/reduce-allocation:
    post:
      tags: [dispatch-admin]
      summary: Reducción dirigida — descompletar un ítem de UNA orden específica para resolver una discrepancia
      description: >
        ★ v0.34.1 — aplica a camiones en ALISTADO, ASIGNADO_DRIVER,
        EN_RUTA o RUTA_CERRADA, por la misma razón que los otros dos: es
        la única vía para resolver una discrepancia, y un camión despachado
        puede tenerlas. Si otra factura consumió el stock mientras el
        camión estaba en la calle, sin esto quedaría en
        `discrepancies_found` para siempre.

        ★ v0.27.0. REQUIERE ADMIN. Reduce ÚNICAMENTE
        PalletAssignment.Quantity de esta orden+ítem — nada más del
        camión, del lane, ni de otras órdenes se toca (alcance
        deliberadamente angosto, confirmado con el negocio). reason es
        OBLIGATORIO — queda auditado junto con la reducción, para
        distinguir esto de un picking normal. new_quantity no puede ser
        mayor a la cantidad actual (esto es para reducir, no para
        aumentar — 400 si se intenta subir).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: order_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: item_code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_quantity, reason]
              properties:
                new_quantity:
                  type: number
                  format: double
                  description: Nueva cantidad para esta orden+ítem. Debe ser menor a la actual.
                reason:
                  type: string
                  description: Obligatorio. Ej. "Faltante detectado en reconciliación antes de facturar".
      responses:
        '200':
          description: Reducción aplicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PalletAssignmentAdjustment' }
        '400':
          description: new_quantity no es menor a la cantidad actual, o reason vacío
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            El picking del camión no está completo (código
            `picking_not_complete`) — se acepta desde ALISTADO en adelante.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/send-to-invoicing:
    post:
      tags: [dispatch-admin]
      summary: Envío manual a facturación — encola ORDER_INVOICE para todas las órdenes elegibles del camión
      description: >
        ★ v0.34.0 — ACEPTA el camión en ALISTADO, ASIGNADO_DRIVER,
        EN_RUTA o RUTA_CERRADA. Antes exigía ALISTADO, y eso creaba un
        callejón sin salida:

        Asignar un driver saca al camión de ALISTADO (recuperable con
        unassign-driver), pero cuando el driver ARRANCA LA RUTA el camión
        pasa a EN_RUTA y ya no hay vuelta — `unassign-driver` lo rechaza.
        Un camión que salía a repartir sin haberse facturado no se podía
        facturar NUNCA, y nada avisaba en ningún momento.

        La condición real nunca fue el estado sino que el PICKING ESTÉ
        COMPLETO, y eso lo cumplen los cuatro estados de arriba por igual:
        las cantidades alistadas ya no cambian porque el camión salga.

        Sigue rechazando los estados anteriores a ALISTADO (código
        `picking_not_complete`), donde las cantidades todavía pueden
        moverse.

        NOTA sobre el chequeo de disponibilidad en camiones ya
        despachados: el stock de SAP no se decrementa hasta que la factura
        existe, así que la mercancía de un camión sin facturar sigue
        contada aunque físicamente haya salido — el chequeo da limpio. Si
        otra factura consumió ese stock mientras tanto, el chequeo falla, y
        eso es correcto: no se puede facturar lo que en SAP ya no está.

        ★ v0.27.0. REQUIERE ADMIN. Reemplaza el disparo automático que
        existía en ALISTADO desde v0.22.0 — ahora SOLO esto encola las
        tareas. EXIGE que el último invoice-readiness de este camión
        haya salido limpio (is_clean=true) Y reciente (dentro de los
        últimos 5 minutos) — 409 si no, con el detalle de por qué
        (nunca se corrió, salió con discrepancias, o ya pasó el tiempo
        límite). Misma lógica de siempre para elegir órdenes: APROBADA
        con al menos una línea de PalletAssignment > 0; las de faltante
        total no generan tarea. Calcula y persiste bin_allocations en
        este momento (movido desde el punto de encolado automático que
        existía antes).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tareas encoladas
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks_created:
                    type: integer
                    description: Cuántas SapIntegrationTask se encolaron (una por orden elegible).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            El picking del camión no está completo, o el último
            invoice-readiness no es limpio y reciente — ver Error.code
            (picking_not_complete | no_readiness_check |
            stale_readiness_check | discrepancies_found).

            ★ v0.34.0 — `picking_not_complete` reemplaza al viejo
            `not_alistado`, que ya no describe la condición: ahora se acepta
            cualquier estado desde ALISTADO en adelante.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

