  /promotions/{promotion_id}:
    get:
      tags: [promotions]
      summary: Detalle de una promoción (desde la perspectiva del vendedor)
      description: >
        ★ v0.30.1 — REQUIERE VENDEDOR, ANALISTA_COMERCIAL,
        VENDEDOR_INSTITUCIONAL o ADMIN, con el mismo query param
