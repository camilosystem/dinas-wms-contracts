                note:
                  type: string
                  description: Nota del aprobador (opcional, queda en el registro).
      responses:
        '200':
          description: Orden aprobada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La orden no está en un estado que permita aprobarla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/orders/{client_uuid}/reject:
    post:
      tags: [admin]
      summary: RECHAZAR una orden retenida
      description: >
        ★ NUEVO en v0.4.0. REQUIERE rol ADMIN.

        RETENIDA_CARTERA → RECHAZADA.

        El MOTIVO es OBLIGATORIO: el vendedor debe poder explicarle al cliente
        por qué su pedido no procedió.

        Si ya está APROBADA o RECHAZADA → 409.
      parameters:
        - name: client_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: >
                    Motivo del rechazo. OBLIGATORIO.
                    El vendedor lo verá y podrá explicárselo al cliente.
      responses:
        '200':
          description: Orden rechazada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La orden no está en un estado que permita rechazarla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /catalog-images/{image_id}:
    get:
      tags: [sync-down]
      summary: La imagen de un ítem del catálogo
      description: >
        ★ NUEVO en v0.41.1. La lee CUALQUIER rol autenticado — las tres apps
        y el Dashboard la necesitan, y una foto de producto no es un dato
        sensible.

        ★ POR QUÉ NO REUSA `GET /evidence-photos/{id}`: ese endpoint está
        restringido a ADMIN, APROBADOR_PAGOS y APROBADOR_CREDITOS, así que un
        token VENDEDOR recibe 403 y las apps se quedarían sin ver ninguna
        imagen del catálogo. Es el mismo mecanismo de almacenamiento, con
        otra puerta.

        ⚠️ NO CONSTRUYAS ESTA URL. Usá `image_url` tal como viene en el ítem:
        lleva una versión derivada del contenido normalizado y cambia cuando
        cambia la imagen, que es lo que hace que un cliente con el catálogo
        cacheado traiga la foto nueva.
      parameters:
        - name: image_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Los bytes de la imagen
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/catalog:
    get:
      tags: [admin]
      summary: Catálogo completo con los 3 precios
      description: REQUIERE rol ADMIN. Incluye los ítems a $0.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema: { type: string }
        - name: only_without_price
          in: query
          schema: { type: boolean, default: false }
        - name: only_without_image
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            ★ NUEVO en v0.41.0. Solo ítems sin imagen cargada. Hermano de
            `only_without_price`: con 539 ítems y las imágenes cargándose de
            a una, sin una forma de ver qué falta no hay cómo saber por dónde
            va la carga ni cuándo terminó.
        - name: category
          in: query
          required: false
          schema: { type: string }
          description: >
            ★ NUEVO en v0.40.0. Filtra por categoría exacta (no búsqueda
            parcial — para eso está `search`). El valor debe ser uno de los
            que devuelve `categories` en la respuesta.

            Una categoría que no existe devuelve una página vacía, no un 400:
            el catálogo cambia con los datos maestros de SAP y un valor que
            era válido ayer puede no estarlo hoy.
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [item_code, name, stock, committed, available, category]
            default: item_code
          description: >
            ★ NUEVO en v0.40.0. Por qué campo ordenar. El default reproduce el
            comportamiento actual, así que un cliente que no lo manda ve lo
            mismo que hoy.
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: >
            ★ NUEVO en v0.40.0. Dirección del ordenamiento.

            ⚠️ DESEMPATE OBLIGATORIO: todo ordenamiento lleva `item_code` como
            criterio secundario, que es único. Sin él, ordenar por `category`
            o por `stock` —donde los empates son masivos— deja el orden de las
            filas empatadas a criterio del motor, y sobre una lista PAGINADA
            eso significa que la misma fila puede aparecer en dos páginas o en
            ninguna.
      responses:
        '200':
          description: Página de ítems
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  without_price_count: { type: integer }
                  categories:
                    type: array
                    items: { type: string }
                    description: >
                      ★ NUEVO en v0.40.0. TODAS las categorías del catálogo,
                      ordenadas, para poblar el selector del filtro.

                      NO se recorta a los filtros aplicados, a propósito: si
                      devolviera solo las de la página o las del filtro
                      activo, elegir una categoría dejaría al selector sin las
                      demás y no habría cómo volver. Y derivarla de la página
                      cargada mostraría solo las que casualmente aparecen en
                      esas 25 filas.
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminCatalogItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/catalog/{item_code}:
    get:
      tags: [admin]
      summary: Un ítem del catálogo
      description: >
        ★ NUEVO en v0.41.1. REQUIERE rol ADMIN. Devuelve el ítem con todo lo
        que trae la página, para que la ficha editable no dependa de la fila
        que la grilla tenga cargada — un refresco la dejaría sin nada.
      parameters:
        - name: item_code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: El ítem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCatalogItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      summary: Ajustes del WMS sobre un ítem
      description: >
        ★ NUEVO en v0.41.0. REQUIERE rol ADMIN.

        Cambia SOLO datos propios del WMS. No toca ningún dato maestro de
        SAP: nombre, categoría, precios, stock y `active` siguen viniendo del
        espejo y son de solo lectura acá.

        Campos omitidos = sin cambio. Mandar `null` en un campo nulable SÍ lo
        borra, así que omitir y anular son cosas distintas a propósito.
      parameters:
        - name: item_code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visible_in_catalog:
                  type: boolean
                  description: >
                    Si es `false`, el ítem deja de ofrecerse en el catálogo
                    del vendedor. NO desaparece de `GET /sync/catalog`: viaja
                    con este campo en `false` para que el cliente pueda
                    quitarlo de su base local.
                controlled_sale:
                  type: boolean
                  description: >
                    Marca el ítem como de venta controlada. Si se pone en
                    `true`, `controlled_sale_limit` pasa a ser obligatorio —
                    un ítem controlado sin tope no controla nada (400
                    `controlled_sale_limit_required`).
                controlled_sale_limit:
                  type: number
                  format: double
                  nullable: true
                  description: >
                    Tope de UNIDADES por vendedor sobre sus órdenes abiertas
                    de este ítem. Debe ser mayor que 0 (400
                    `invalid_controlled_sale_limit`).

                    Cambiar el tope NO recalcula los avisos ya guardados en
                    pedidos anteriores: esos dicen qué pasaba cuando se
                    tomaron, y reescribirlos borraría el hecho.
      responses:
        '200':
          description: Ítem actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCatalogItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/catalog/{item_code}/image:
    put:
      tags: [admin]
      summary: Subir o reemplazar la imagen del ítem
      description: >
        ★ NUEVO en v0.41.0. REQUIERE rol ADMIN.

        La imagen viaja en base64 en el cuerpo, igual que
        `POST /evidence-photos` desde v0.17.2 — mismo mecanismo, que los
        clientes ya saben usar.

        Es un `PUT` y no un `POST` porque un ítem tiene UNA imagen: subirla
        de nuevo REEMPLAZA la anterior, no acumula. Repetir la misma llamada
        deja el mismo estado.

        ⚠️ La `image_url` que devuelve es DISTINTA de la anterior, porque
        lleva una versión derivada del contenido. Eso es lo que hace que las
        apps, que guardan el catálogo sin conexión, muestren la nueva foto:
        con una URL estable, el cliente que ya cacheó la vieja se quedaría
        con ella. Los clientes tratan `image_url` como OPACA — la usan tal
        cual, no la construyen ni la parsean.
      parameters:
        - name: item_code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_base64]
              properties:
                image_base64:
                  type: string
                  description: >
                    La imagen codificada en base64, sin prefijo de tipo MIME.

                    ★ v0.41.1 — MÁXIMO 5 MB de imagen DECODIFICADA. El cuerpo
                    de la petición pesa ~33% más por el base64.

                    El formato se valida por la firma de los bytes, nunca por
                    `filename` ni por un tipo declarado.

                    ★ EL SERVIDOR NORMALIZA LO QUE GUARDA: re-codifica a un
                    lado mayor de 1024 px. Lo que se acepta al subir y lo que
                    se sirve NO son lo mismo, a propósito — 539 fotos de
                    cámara sin normalizar serían más de un giga que cada app
                    se baja por red móvil para llenar su catálogo offline.
                filename:
                  type: string
                  nullable: true
                  description: >
                    Nombre original, opcional y solo informativo. NO se usa
                    para emparejar con el ítem: las imágenes de Dinas están
                    en una carpeta con nombres que no corresponden al código,
                    y el emparejamiento lo hace la persona al elegir el ítem.
      responses:
        '200':
          description: Imagen guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCatalogItem' }
        '400':
          description: >
            Base64 inválido, formato de imagen no soportado, o excede el
            tamaño máximo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Borrar la imagen del ítem
      description: >
        ★ NUEVO en v0.41.0. REQUIERE rol ADMIN. Deja `image_url` en `null` y
        los clientes vuelven al placeholder.

        Idempotente: borrar la imagen de un ítem que no tiene devuelve 200
        igual. El 404 queda para el ítem que no existe, que es otra cosa.

        ★ v0.41.1 — devuelve el ítem, no 204 sin cuerpo. Con 204 la pantalla
        tenía que CONSTRUIR el estado resultante en vez de usar el que llegó,
        y era el único punto del bloque donde el cliente arma estado. Chico,
        correcto, y exactamente la excepción que después se generaliza.
      parameters:
        - name: item_code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Imagen borrada (o no había)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCatalogItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/clients:
    get:
      tags: [admin]
      summary: Todos los clientes, con listas autorizadas y CARTERA
      description: REQUIERE rol ADMIN.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema: { type: string }
          description: >
            Coincidencia parcial sobre `client_code`, `name`, `address`,
            `city` y —★ NUEVO en v0.42.0— `zipcode`.

            Los cuatro primeros ya se buscaban y no estaba escrito en ningún
            lado; el código postal existía como campo y viajaba en la
            respuesta, pero no se buscaba.
        - name: only_overdue
          in: query
          schema: { type: boolean, default: false }
          description: ★ v0.4.0 — solo clientes con mora (>5 días).
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [client_code, balance, credit_limit, credit_available, overdue_amount]
            default: client_code
          description: >
            ★ NUEVO en v0.42.0. Por qué campo ordenar. Los cuatro últimos son
            campos de `credit`. El default reproduce el comportamiento
            actual, así que un cliente que no lo manda ve lo mismo que hoy.
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: >
            ★ NUEVO en v0.42.0. Dirección del ordenamiento.

            ⚠️ DESEMPATE OBLIGATORIO por `client_code`, que es único. Sin él,
            ordenar por mora —donde la enorme mayoría de los clientes comparte
            el valor 0— deja el orden de las filas empatadas a criterio del
            motor, y sobre una lista PAGINADA la misma fila puede aparecer en
            dos páginas o en ninguna.
      responses:
        '200':
          description: Página de clientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
                  overdue_count:
                    type: integer
                    description: ★ Cuántos clientes tienen mora (en total).
                  clients:
                    type: array
                    items: { $ref: '#/components/schemas/AdminClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/clients/{client_code}/price-list:
    put:
      tags: [admin]
      summary: Autorizar (o quitar) la lista de precios adicional
      description: >
        ★ v0.29.0 — REQUIERE rol ADMIN o ANALISTA_COMERCIAL.
        ANALISTA_COMERCIAL es quien opera esto en el día a día (habilita
        Lista2 a un cliente concreto); ADMIN mantiene acceso universal de
        respaldo, mismo patrón que las bandejas de Pagos/Créditos.

        Modelo de negocio que este endpoint implementa: Lista3 es el
        precio por DEFECTO de todo cliente (default_price_list) — no es
        una elección del vendedor. Lista2 es una EXCEPCIÓN que se otorga
        cliente por cliente a través de aquí. SAP no valida listas: obedece
        el precio que el WMS le reporta y solo registra qué PriceList se
        usó.

        Nota técnica: este endpoint vive en su propio controller (no en
        AdminController) porque en ASP.NET Core los [Authorize] de clase y
        de método son ACUMULATIVOS (AND, no sustitutivos) — no se puede
        aflojar por método el rol que exige la clase entera. La ruta
        pública no cambió.

        Cada cambio efectivo (no los 400/404) se registra en los logs del
        servidor con client_code, el valor nuevo y el username de quien lo
        hizo — para distinguir cuál de los dos roles autorizados operó,
        dado el impacto directo sobre qué precios puede aplicar un vendedor
        a ese cliente.
      parameters:
        - name: client_code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [additional_price_list]
              properties:
                additional_price_list:
                  type: integer
                  enum: [1, 2, 3]
                  nullable: true
      responses:
        '200':
          description: Autorización actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminClient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/clients/{client_code}/statement:
    get:
      tags: [admin]
      summary: Estado de cuenta del cliente (vista admin)
      description: >
        ★ NUEVO en v0.4.0. REQUIERE rol ADMIN.
        Igual que /clients/{code}/statement pero SIN el filtro de vendedor:
        el admin puede consultar cualquier cliente.
      parameters:
        - name: client_code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Estado de cuenta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientStatement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/delivery-truck-names:
    get:
      tags: [trucks]
      summary: Catálogo de nombres de reparto
      description: >
        ★ NUEVO en v0.43.0. REQUIERE rol ADMIN.

        La lista fija de nombres con los que se puede crear un camión del
        día. NO son vehículos: son destinos de reparto (ALLENTOWN, BRONX,
        QUEENS…) más casos que no son camiones en absoluto, como
        `CLIENTE RETIRA` y `UPS`.

        Devuelve TODOS, activos e inactivos, ordenados por nombre. Los
        inactivos viajan con `is_active: false` en vez de omitirse: quien
        administra la lista tiene que poder volver a activarlos, y para eso
        tiene que verlos. El selector de creación es el que filtra.

        Sin paginar — son unas decenas y se consumen enteros.
      responses:
        '200':
          description: El catálogo completo
          content:
            application/json:
              schema:
                type: object
                properties:
                  names:
                    type: array
                    items: { $ref: '#/components/schemas/DeliveryTruckName' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [trucks]
      summary: Agregar un nombre al catálogo
      description: >
        ★ NUEVO en v0.43.0. REQUIERE rol ADMIN. Nace activo.

        El nombre se compara sin distinguir mayúsculas ni espacios de los
        extremos: agregar "bronx" cuando ya existe "BRONX" devuelve 409
        `truck_name_exists`, no crea un segundo. Un catálogo con dos entradas
        que se ven iguales no ordena nada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
      responses:
        '201':
          description: Nombre agregado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTruckName' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ya existe un nombre igual (`truck_name_exists`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/delivery-truck-names/{name_id}:
    patch:
      tags: [trucks]
      summary: Activar, desactivar o corregir un nombre del catálogo
      description: >
        ★ NUEVO en v0.43.0. REQUIERE rol ADMIN. Campos omitidos = sin cambio.

        **No hay borrado a propósito.** Un nombre que deja de usarse esta
        temporada puede volver; desactivarlo lo saca del selector sin
        perderlo ni romper nada.

        ⚠️ CORREGIR UN NOMBRE ACÁ NO RENOMBRA NINGÚN CAMIÓN YA CREADO. El
        camión copia el nombre al crearse, igual que la orden congela
        `shipping_code_name`: es un documento del día y su etiqueta es la que
        tuvo ese día. Sirve para arreglar un error de tipeo del catálogo, no
        para reescribir historia.
      parameters:
        - name: name_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                is_active: { type: boolean }
      responses:
        '200':
          description: Nombre actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTruckName' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya existe otro nombre igual (`truck_name_exists`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks:
    get:
      tags: [trucks]
      summary: Lista de camiones
      description: REQUIERE rol ADMIN. Filtrable por estado.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TruckStatus' }
        - name: date
          in: query
          schema: { type: string, format: date }
          description: >
            Camiones CREADOS en esta fecha (created_at), por defecto hoy.
            Es la fecha de creación = el día de trabajo del admin, NO una fecha
            de entrega.
      responses:
        '200':
          description: Lista de camiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  trucks:
                    type: array
                    items: { $ref: '#/components/schemas/TruckSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [trucks]
      summary: Crear un camión (vacío, en BORRADOR)
      description: >
        REQUIERE rol ADMIN. Crea un camión vacío que el admin irá llenando
        con órdenes. Empieza en estado BORRADOR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: >
                    ★ v0.35.0 — OBLIGATORIO. Antes era opcional y el servidor
                    asignaba un código automático, lo que llenó la base de
                    camiones llamados "Sin nombre" — invisibles de distinguir
                    en la grilla, que es donde el admin trabaja todos los días.

                    Un nombre en blanco o solo espacios se rechaza con 400.

                    ★ v0.43.0 — DEJA DE SER TEXTO LIBRE. Tiene que ser un
                    nombre del catálogo `/admin/delivery-truck-names` y estar
                    ACTIVO; cualquier otro se rechaza con 400
                    `unknown_truck_name`. Si hace falta uno nuevo, se agrega
                    primero al catálogo — que es el punto de tener la lista.

                    Y **UN NOMBRE, UN CAMIÓN POR DÍA**: si ya existe uno con
                    ese nombre creado hoy (día calendario de Nueva York,
                    según la regla global del principio de este documento),
                    409 `truck_name_used_today`. Dos camiones BRONX el mismo
                    día es siempre un error de carga, y sin la regla se arman
                    dos para el mismo destino sin que nadie lo note hasta que
                    salen.

                    La comparación con el catálogo ignora mayúsculas y
                    espacios de los extremos, pero el camión guarda el nombre
                    CANÓNICO del catálogo, no lo que se mandó.
                note: { type: string }
      responses:
        '201':
          description: Camión creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400':
          description: >
            ★ v0.43.0 — `unknown_truck_name`: el nombre no está en el
            catálogo, o está inactivo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            ★ v0.43.0 — `truck_name_used_today`: ya hay un camión con ese
            nombre creado hoy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      conflicting_truck_id:
                        type: string
                        format: uuid
                        description: >
                          ★ NUEVO en v0.43.1. El camión que ya tiene ese
                          nombre ese día.

                          Viaja para que el cliente pueda OFRECER ABRIRLO,
                          que es lo que quiere quien recibe este error. Sin
                          él tendría que redescubrirlo con
                          `GET /admin/trucks?date=…` y matchear por nombre —
                          trabajo que el servidor ya hizo, y con la trampa de
                          resolver ese "hoy" contra el día de Nueva York y no
                          el UTC.

  /order-drafts:
    get:
      tags: [orders]
      summary: Listar borradores de pedido
      description: >
        ★ NUEVO en v0.37.0. REQUIERE rol ADMIN o VENDEDOR_INSTITUCIONAL.

        Un ADMIN ve TODOS los borradores. Un VENDEDOR_INSTITUCIONAL ve solo
        los suyos — los que él creó.

        Ordenados por `updated_at` descendente: lo último que se tocó,
        primero.
      responses:
        '200':
          description: Borradores visibles para el llamador
          content:
            application/json:
              schema:
                type: object
                properties:
                  drafts:
                    type: array
                    items: { $ref: '#/components/schemas/OrderDraftSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [orders]
      summary: Guardar un pedido como borrador
      description: >
        ★ NUEVO en v0.37.0. REQUIERE rol ADMIN o VENDEDOR_INSTITUCIONAL.

        ★ QUÉ ES UN BORRADOR

        El carrito guardado, tal cual, para retomarlo después. Sirve para
        una cotización que el cliente todavía no confirmó, y para no perder
        lo armado cuando hay que cambiar de cliente o de vendedor.

        ★ UN BORRADOR NO ES UN PEDIDO. Deliberadamente no es un
        `Order.Status` nuevo: un pedido que existe consume cupo del cliente,
        aparece en la grilla de Órdenes y se puede montar en un camión. Un
        borrador no hace nada de eso.

        Si fuera un estado, cada consulta del sistema tendría que acordarse
        de excluirlo — y el día que alguien se olvidara, una cotización
        aparecería en el tablero de picking. Como entidad aparte, eso es
        imposible por construcción.

        ★ GUARDA EL PAYLOAD, NO UNA COPIA PARECIDA

        El cuerpo es un `OrderCreate` completo, y se guarda tal cual.
        Convertirlo es reenviar ese mismo payload por el camino normal de
        creación, así que no hay dos validaciones que puedan divergir ni
        forma de que exista un borrador imposible de convertir por una
        diferencia de forma.

        ★ NO SE VALIDA AL GUARDAR

        Un borrador se guarda como esté: cliente en mora, ítem sin stock,
        promoción vencida, cantidades en cero. Las validaciones corren al
        CONVERTIR, no antes.

        Eso es a propósito —una cotización a medio armar tiene que poder
        guardarse— pero tiene una consecuencia que el cliente debe mostrar
        bien: **un borrador guardado hoy puede fallar mañana**, porque la
        promoción venció, el cliente entró en mora o el ítem se agotó. El
        error al convertir tiene que ser legible, no un 400 crudo.

        Lo único que se valida al guardar es que el cuerpo sea un
        `OrderCreate` sintácticamente válido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                title:
                  type: string
                  nullable: true
                  description: >
                    Etiqueta libre para reconocerlo en la lista ("Cotización
                    Arepa Lady", "pendiente confirmación"). Opcional.
                payload:
                  allOf:
                    - $ref: '#/components/schemas/OrderCreate'
                  description: >
                    El pedido tal como se enviaría a POST /orders.

                    ★ CORREGIDO EN v0.37.2. El `client_uuid` que traiga se
                    guarda tal cual, pero AL CONVERTIR NO SE USA: el
                    servidor emite uno nuevo (ver el endpoint de
                    conversión). El texto anterior aconsejaba generarlo
                    "recién al convertir", cosa que ningún cliente puede
                    hacer porque /convert no recibe body.

                    Conviene igual que el cliente genere un uuid nuevo en
                    cada guardado, para que el payload guardado sea honesto
                    y dos borradores no compartan llave. Pero la garantía
                    ya no depende de eso.
      responses:
        '201':
          description: Borrador guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraftDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /order-drafts/{draft_id}:
    get:
      tags: [orders]
      summary: Leer un borrador
      description: >
        ★ NUEVO en v0.37.0. REQUIERE ADMIN o VENDEDOR_INSTITUCIONAL.
        Un institucional solo puede leer los suyos — si pide uno ajeno,
        404 (no 403: que no exista para él es más honesto que confirmarle
        que existe y no puede verlo).
      parameters:
        - name: draft_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El borrador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraftDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [orders]
      summary: Reemplazar el contenido de un borrador
      description: >
        ★ NUEVO en v0.37.0. Mismo alcance por rol que el GET.

        Reemplaza el payload completo — un borrador se edita guardándolo de
        nuevo, no parcheándolo. Actualiza `updated_at`.

        Tampoco valida el contenido: mismo criterio que al crear.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                title: { type: string, nullable: true }
                payload: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '200':
          description: Borrador actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraftDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [orders]
      summary: Eliminar un borrador
      description: >
        ★ NUEVO en v0.37.0. Mismo alcance por rol que el GET. Se borra
        definitivamente — un borrador no deja rastro, porque nunca fue un
        documento.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /order-drafts/{draft_id}/convert:
    post:
      tags: [orders]
      summary: Convertir un borrador en pedido
      description: >
        ★ NUEVO en v0.37.0. Mismo alcance por rol que el GET.

        Crea el pedido con el payload guardado y BORRA el borrador, en una
        sola operación.

        ★ POR QUÉ UN ENDPOINT Y NO DOS LLAMADAS DEL CLIENTE: si el cliente
        hiciera POST /orders y después DELETE del borrador, un fallo entre
        medio deja el pedido creado y el borrador vivo — y alguien lo
        convierte de nuevo, duplicando el pedido. Acá o pasan las dos cosas
        o no pasa ninguna.

        ★ LAS VALIDACIONES SON LAS DE POST /orders, sin excepción: cupo,
        mora, promociones vigentes, precios autorizados. Si alguna falla, se
        devuelve el MISMO código de error que devolvería la creación normal,
        y **el borrador NO se borra** — queda para corregirlo.

        No hay revisión de nadie más: convertir es el mismo usuario
        confirmando. No es un flujo de aprobación.

        ★ v0.37.2 — EL `client_uuid` LO EMITE EL SERVIDOR AL CONVERTIR, y
        se ignora el que venga guardado en el payload. Si se reusara el
        guardado, dos borradores nacidos del mismo carrito compartirían
        llave de idempotencia y la segunda conversión devolvería el pedido
        de la primera en vez de crear uno nuevo — borrando el borrador sin
        que exista el pedido que el usuario cree haber creado.

        Esto NO debilita la idempotencia de la conversión: la sostiene la
        existencia del borrador, que se borra en la misma transacción. Un
        reintento posterior da 404, nunca un pedido duplicado.
      parameters:
        - name: draft_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Pedido creado y borrador eliminado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderAccepted' }
        '400':
          description: >
            El payload guardado ya no es válido — mismos códigos que
            POST /orders. El borrador se conserva.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/trucks/pending-invoicing:
    get:
      tags: [trucks]
      summary: Camiones pendientes de facturar
      description: >
        ★ NUEVO en v0.35.0. REQUIERE rol ADMIN.

        Devuelve los camiones cuyo picking está completo y que TODAVÍA NO se
        enviaron a facturación. Sin filtro de fecha.

        ★ POR QUÉ NO ALCANZABA GET /admin/trucks?status=ALISTADO

        La pantalla de Facturación pendiente componía la pregunta desde el
        cliente —estado más fecha— y eso la dejaba ciega en dos frentes:

        1. **La fecha.** `date` tiene default "hoy" y filtra por
           `created_at` en UTC. Un camión alistado ayer era invisible y no
           se podía facturar desde el Dashboard. Y como el día UTC corta a
           las 20:00 de Nueva York, después de esa hora desaparecían
           también los del propio día. No había forma de pedir "todas las
           fechas".

        2. **El estado, que es lo grave.** Desde v0.34.0 se puede facturar
           un camión en ALISTADO, ASIGNADO_DRIVER, EN_RUTA o RUTA_CERRADA
           — el arreglo que existe justamente para que un camión despachado
           sin facturar no quede sin salida. Pero la pantalla pedía solo
           ALISTADO, así que **ese caso nunca aparecía en la lista**: el
           arreglo estaba en el backend y era inalcanzable desde la
           interfaz.

        "Pendiente de facturar" no es un estado ni un día: es una pregunta
        del negocio, y el servidor es quien conoce su definición. Este
        endpoint la responde en vez de hacer que el cliente la arme.

        ★ QUÉ INCLUYE
        Camiones con el picking completo —los cuatro estados de arriba— y
        `sent_to_invoicing = false`. Nada más.

        Un camión ya enviado desaparece de la lista aunque siga en
        ALISTADO, que es lo que corresponde: el estado no cambia al
        facturar.

        Ordenados por `alistado_at` ascendente — lo que espera hace más
        tiempo, primero.
      responses:
        '200':
          description: Camiones pendientes de facturar
          content:
            application/json:
              schema:
                type: object
                properties:
                  trucks:
                    type: array
                    items: { $ref: '#/components/schemas/TruckSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trucks/available-orders:
    get:
      tags: [trucks]
      summary: Órdenes APROBADAS disponibles para armar camiones
      description: >
        REQUIERE rol ADMIN.
        Órdenes en estado APROBADA que NO están en ningún camión activo
        (sin asignar). Agrupadas por SHIPPING CODE (el eje logístico), para que
        el admin las monte en camiones.
      parameters:
        - name: shipping_code
          in: query
          schema: { type: integer }
          description: Filtrar por shipping code (el eje logístico).
        - name: delivery_day
          in: query
          schema: { $ref: '#/components/schemas/WeekDay' }
          description: >
            Filtrar por día de entrega. Usa la config de días por shipping code.
      responses:
        '200':
          description: Órdenes disponibles, agrupadas por shipping code
          content:
            application/json:
              schema:
                type: object
                properties:
                  shipping_codes:
                    type: array
                    description: Resumen por shipping code (sin asignar).
                    items:
                      type: object
                      properties:
                        shipping_code: { type: integer }
                        shipping_code_name:
                          type: string
                          nullable: true
                          description: >
                            ★ v0.49.1 — NULLABLE. Hay códigos en uso que no
                            tienen nombre en la UDT.
                        delivery_days:
                          type: array
                          items: { $ref: '#/components/schemas/WeekDay' }
                          description: Días configurados para este shipping code.
                        order_count: { type: integer }
                        item_total:
                          type: integer
                          description: Suma de unidades de todas las órdenes.
                        total_amount: { type: number, format: double }
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/OrderSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trucks/available-pickups:
    get:
      tags: [pickups]
      summary: Recogidas marcadas y sin camión
      description: >
        ★ NUEVO en v0.45.0. REQUIERE rol ADMIN.

        El equivalente de `/admin/trucks/available-orders` para el otro
        sentido: las solicitudes marcadas como recogida que todavía no están
        montadas en ningún camión activo.

        Trae el shipping code del cliente porque es el eje por el que se
        arman los camiones — sin él, decidir en qué camión va cada recogida
        obligaría a abrir el cliente uno por uno.

        Incluye las ya decididas (aprobadas o rechazadas): aprobar y recoger
        son vías separadas, y una recogida marcada sigue pendiente de hacer
        aunque la solicitud ya se haya decidido. Cada fila dice en qué estado
        está su solicitud.
      parameters:
        - name: shipping_code
          in: query
          required: false
          schema: { type: integer }
          description: Filtrar por shipping code del cliente (el eje logístico).
      responses:
        '200':
          description: Recogidas disponibles para montar
          content:
            application/json:
              schema:
                type: object
                properties:
                  pickups:
                    type: array
                    items: { $ref: '#/components/schemas/AvailablePickup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trucks/{truck_id}:
    get:
      tags: [trucks]
      summary: Detalle de un camión con sus órdenes
      description: REQUIERE rol ADMIN.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Camión con sus órdenes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [trucks]
      summary: Renombrar un camión o cambiar su nota
      description: >
        ★ NUEVO en v0.35.0. REQUIERE rol ADMIN.

        POR QUÉ EXISTE: no había NINGUNA forma de corregir el nombre de un
        camión — ni PUT ni PATCH. Un error de tipeo al crearlo quedaba a la
        vista en la grilla para siempre, y la única salida era editar la
        base a mano.

        Junto con el `name` ahora obligatorio en la creación, cierra el
        mismo problema por sus dos puntas: que se ponga un nombre, y que se
        pueda arreglar si sale mal.

        Solo toca la etiqueta y la nota. NO cambia estado, órdenes, driver
        ni nada del flujo — para eso están los endpoints específicos.

        Se puede renombrar un camión en CUALQUIER estado, incluso ya
        despachado o cerrado: el nombre es una etiqueta para humanos, y un
        error de tipeo no se vuelve incorregible porque el camión haya
        salido.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  description: >
                    Nombre nuevo. Si se omite, no se toca. En blanco o solo
                    espacios → 400.

                    ★ v0.43.0 — RIGEN LAS MISMAS DOS REGLAS QUE AL CREAR:
                    tiene que estar en el catálogo y activo (400
                    `unknown_truck_name`), y no puede repetir el nombre de
                    otro camión del mismo día (409 `truck_name_used_today`).

                    Están acá porque ésta es la otra puerta al mismo campo:
                    si la creación validara y el renombre no, la regla se
                    esquivaría creando con un nombre válido y renombrando
                    después. Es la forma exacta del hueco que este contrato ya
                    produjo cuatro veces — cerrar una compuerta y dejar la
                    otra abierta.

                    ⚠️ La unicidad se evalúa contra EL DÍA DEL PROPIO CAMIÓN,
                    no contra hoy. Renombrar uno de hace tres semanas no puede
                    chocar con el BRONX de esta mañana.

                    Los camiones creados antes de v0.43.0 pueden tener
                    nombres fuera del catálogo. Se quedan como están: las
                    reglas aplican a lo que se crea y se renombra de acá en
                    adelante.

                    ★ v0.43.1 — el 409 de este endpoint trae
                    `conflicting_truck_id`, igual que el de creación. Es más
                    útil acá todavía: como la unicidad se evalúa contra el
                    día del propio camión, sin el id el cliente tendría que
                    saber esa regla y buscar con el `created_at` del camión
                    que está editando. Con el id no hay nada que razonar.
                note:
                  type: string
                  nullable: true
                  description: >
                    Nota nueva. Enviar null la borra; omitirla la deja como
                    está.
      responses:
        '200':
          description: Camión actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400':
          description: >
            Nombre en blanco, o —★ v0.43.0— `unknown_truck_name`: el nombre
            no está en el catálogo de reparto o está inactivo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            ★ v0.43.0 — `truck_name_used_today`: otro camión DEL MISMO DÍA
            QUE ÉSTE ya tiene ese nombre. Ojo: el día que cuenta es el del
            camión que se está renombrando, no hoy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      conflicting_truck_id:
                        type: string
                        format: uuid
                        description: >
                          ★ NUEVO en v0.43.1. El camión que ya tiene ese
                          nombre ese día, para poder ofrecer abrirlo sin que
                          el cliente tenga que buscarlo.
    delete:
      tags: [trucks]
      summary: Eliminar un camión
      description: >
        ★ v0.10.0 — REQUIERE rol ADMIN. Borra el camión definitivamente.
        REGLAS:
          · Solo si NO tiene órdenes asignadas (hay que quitarlas antes) → 409 si tiene.
          · Solo en estado BORRADOR, CONFIRMADO o CANCELADO → 409 en cualquier otro.
            Quedan FUERA: ASIGNADO, EN_PICKING, EN_REPARTICION (un bodeguero ya está
            trabajando el camión) y ALISTADO (ya se picó; su manifiesto puede estar
            impreso y en ruta).
        Es un borrado REAL: el camión desaparece, junto con su orden de paradas y
        asignaciones de carril.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Camión eliminado
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            El camión tiene órdenes, o su estado no permite borrarlo (solo
            BORRADOR, CONFIRMADO o CANCELADO son borrables).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/cancel:
    post:
      tags: [trucks]
      summary: Cancelar un camión
      description: >
        REQUIERE rol ADMIN. Cancela el camión (estado CANCELADO).
        Sus órdenes vuelven a "sin asignar" (no se pierden) y pueden montarse
        en otro camión.
        NO se puede cancelar un camión EN_PICKING o ALISTADO → 409.
        ★ v0.10.0 — Antes era DELETE /admin/trucks/{id}; se movió a POST .../cancel
        para liberar el DELETE, que ahora es el BORRADO REAL (otra acción).
        CANCELAR ≠ ELIMINAR: cancelar conserva el camión y libera sus órdenes;
        eliminar lo hace desaparecer (y exige que no tenga órdenes).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Camión cancelado; órdenes liberadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión ya está en picking o alistado; no se puede cancelar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/orders:
    post:
      tags: [trucks]
      summary: Agregar órdenes a un camión
      description: >
        REQUIERE rol ADMIN.
        Solo si el camión está en BORRADOR o CONFIRMADO (no EN_PICKING → 409).
        Las órdenes deben estar APROBADAS y sin asignar a otro camión (si no → 400).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_uuids]
              properties:
                order_uuids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
      responses:
        '200':
          description: Órdenes agregadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión está congelado (EN_PICKING/ALISTADO)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/orders/{order_uuid}:
    delete:
      tags: [trucks]
      summary: Quitar una orden de un camión
      description: >
        REQUIERE rol ADMIN. La orden vuelve a "sin asignar".
        Solo si el camión NO está EN_PICKING/ALISTADO → 409.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: order_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Orden removida del camión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión está congelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/pickups:
    post:
      tags: [pickups]
      summary: Montar recogidas en un camión
      description: >
        ★ NUEVO en v0.45.0. REQUIERE rol ADMIN.

        Monta una o varias solicitudes YA MARCADAS como recogida. Cada una
        se convierte en parada del camión — o se SUMA a la parada que el
        cliente ya tiene si además lleva pedidos, porque el camión pasa una
        sola vez.

        Ventana: BORRADOR, CONFIRMADO o ASIGNADO. Desde EN_PICKING en
        adelante → 409, no porque haya algo que picar (no lo hay) sino
        porque la secuencia de paradas ya se cerró y una parada sin
        `stop_number` es una parada que el driver no ve.

        Rechaza con 400 si la solicitud no está marcada como recogida
        (`pickup_not_marked`) o si ya está montada en otro camión
        (`pickup_on_another_truck`, con `truck_id`).

        ⚠️ ★ v0.45.1 — SI CREA UNA PARADA NUEVA E INVALIDA LA SECUENCIA. Si
        el cliente NO tenía nada en este camión, la recogida agrega una
        parada; y si el camión ya tenía su orden de paradas importado, esa
        secuencia queda INVALIDADA: `has_route` vuelve a `false` y hay que
        reimportar de OptimoRoute. La respuesta ya lo refleja.

        ★ v0.45.2 — INVALIDAR BORRA LAS PARADAS, no solo apaga el booleano.
        `POST /dispatch/returns` y el manifiesto leen las paradas guardadas
        sin mirar `has_route`: dejar las filas haría la invalidación
        invisible justo donde importa.

        Es a propósito y es ruidoso: `assign` exige `has_route`, así que el
        camión no avanza hasta que alguien reimporte. Y la respuesta de esta
        llamada trae `has_route: false` — ése es el momento de avisarle al
        admin, porque después `GET .../route` responde 404 sin poder decir
        por qué. La alternativa era
        dejar la parada con `stop_number: null`, y el manifiesto, la ruta
        del driver y el cierre ordenan por `stop_number` — una parada sin
        número existe en la base y no existe en la calle. Que el servidor la
        pusiera al final sería peor: inventaría un recorrido que ningún
        software de mapas calculó.

        Si el cliente YA era parada (tenía pedidos acá), no pasa nada: la
        parada ya tiene su número y la recogida se le suma.

        NO exige que la solicitud esté pendiente: aprobar y recoger son vías
        separadas y una solicitud decidida se puede recoger igual.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_uuids]
              properties:
                request_uuids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
      responses:
        '200':
          description: Recogidas montadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión está congelado (EN_PICKING en adelante)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/pickups/{request_uuid}:
    delete:
      tags: [pickups]
      summary: Quitar una recogida de un camión
      description: >
        ★ NUEVO en v0.45.0. REQUIERE rol ADMIN.

        La solicitud vuelve a MARCADA (disponible para otro camión); NO
        pierde la marca. Misma ventana que montar: congelado → 409.

        ★ v0.45.1 — Si el cliente queda sin pedidos ni recogidas en el
        camión, su parada DESAPARECE, y si la secuencia ya estaba importada
        queda INVALIDADA: `has_route` vuelve a `false` y ★ v0.45.2 las
        paradas guardadas se BORRAN. El servidor no
        renumera solo — reordenar paradas que un software externo calculó
        sería inventar una ruta.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: request_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Recogida removida del camión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            El camión está congelado, o el driver ya registró esta recogida
            (`pickup_already_collected`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/confirm:
    post:
      tags: [trucks]
      summary: Confirmar un camión (BORRADOR → CONFIRMADO)
      description: >
        REQUIERE rol ADMIN. Marca el camión como listo para picar.
        Debe tener al menos una orden (si está vacío → 400).
        Sigue siendo modificable tras confirmar (hasta que empiece el picking).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Camión confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400':
          description: El camión está vacío
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está en un estado que permita confirmarlo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/shipping-codes:
    get:
      tags: [shipping-codes]
      summary: Shipping codes con su día(s) de entrega configurado(s)
      description: >
        REQUIERE rol ADMIN.
        Lista los shipping codes (de SAP: código + nombre) con los días de
        entrega que el admin les configuró (dato del middleware).
      responses:
        '200':
          description: Lista de shipping codes con sus días
          content:
            application/json:
              schema:
                type: object
                properties:
                  shipping_codes:
                    type: array
                    items: { $ref: '#/components/schemas/ShippingCodeConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/shipping-codes/{code}/delivery-days:
    put:
      tags: [shipping-codes]
      summary: Configurar los días de entrega de un shipping code
      description: >
        REQUIERE rol ADMIN.
        Define en qué día(s) de la semana se entrega este shipping code.
        Puede ser uno o varios. Lista vacía = sin días configurados.
        Este dato vive en el MIDDLEWARE (no en SAP).
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery_days]
              properties:
                delivery_days:
                  type: array
                  items: { $ref: '#/components/schemas/WeekDay' }
                  description: Días de entrega (puede ser varios, o vacío).
      responses:
        '200':
          description: Días actualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShippingCodeConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/route-export:
    post:
      tags: [route-stops]
      summary: Paradas de un conjunto de órdenes seleccionadas (sin camión)
      description: >
        ★ NUEVO en v0.44.0. REQUIERE rol ADMIN.

        Las MISMAS paradas que `/admin/trucks/{truck_id}/route-export`, para
        órdenes que todavía NO están montadas en ningún camión.

        Sirve para UNA cosa: llevar las direcciones a un software de mapas
        externo y **ver distancias** antes de decidir qué órdenes van juntas
        en un camión.

        ⚠️ NO ES PARA ORDENAR PARADAS. El orden de paradas sigue siendo lo
        que es hoy —parte de lo que pasa DESPUÉS de montar las órdenes, con
        el `route-export`/`route-import` del camión— y no cambia en nada.
        Este endpoint no devuelve secuencia y no recibe ninguna de vuelta.
        Se dice explícito porque el archivo es idéntico, y un archivo
        idéntico invita a suponer que el proceso también lo es.

        Misma regla de agrupación: UNA PARADA POR CLIENTE, sumando sus
        pedidos. Mismo schema `RouteExportStop`.

        No crea ni modifica nada. Es `POST` y no `GET` sólo porque la lista
        de órdenes puede ser larga y en la query string se vuelve frágil.

        ⚠️ NO valida que las órdenes sean "montables": mirar distancias es
        exploratorio y bloquearlo obligaría a adivinar qué se puede mirar. Lo
        que sí hace es DECIR qué órdenes no pudo incluir y por qué.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_uuids]
              properties:
                order_uuids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
                  description: >
                    Las órdenes seleccionadas en la pantalla. Repetidas se
                    ignoran sin error — seleccionar dos veces la misma no es
                    un problema del que haya que avisar.
                pickup_request_uuids:
                  type: array
                  maxItems: 500
                  items: { type: string, format: uuid }
                  description: >
                    ★ NUEVO en v0.45.0. Recogidas marcadas que se están
                    considerando para el mismo camión. Suman su parada al
                    estudio de distancias — una recogida es una parada más y
                    dejarla fuera daría un estudio sobre una ruta que no es
                    la que va a hacerse.

                    Un cliente que aparece por pedido y por recogida sale
                    UNA sola vez, igual que en el camión.

                    Sigue habiendo al menos una orden porque un camión de
                    puras recogidas no existe (ver `confirm`).
      responses:
        '200':
          description: Paradas listas para el CSV
          content:
            application/json:
              schema:
                type: object
                properties:
                  stops:
                    type: array
                    items: { $ref: '#/components/schemas/RouteExportStop' }
                  incomplete_count:
                    type: integer
                    description: >
                      Cuántas paradas tienen dirección, ciudad o zip
                      incompletos. Aviso, no bloqueo — igual que en el export
                      del camión.
                  ignored:
                    type: array
                    description: >
                      ★ Las órdenes que NO entraron en el archivo, con el
                      motivo. Vacío si entraron todas.

                      Existe para que nada se descarte en silencio: alguien
                      selecciona 20 órdenes, una la montó otro admin mientras
                      tanto, y el archivo saldría con 19 clientes sin que se
                      note. Una lista más corta de lo pedido no se distingue
                      de una lista correcta si nadie dice qué faltó.
                    items:
                      type: object
                      properties:
                        order_uuid: { type: string, format: uuid }
                        reason:
                          type: string
                          enum: [not_found, already_on_truck]
                          description: >
                            `not_found`: la orden no existe o el admin no
                            puede verla.
                            `already_on_truck`: alguien la montó mientras la
                            pantalla estaba abierta. NO es un error — es
                            información para que el admin decida si rehace la
                            selección o sigue.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trucks/{truck_id}/route-export:
    get:
      tags: [route-stops]
      summary: Datos del camión para exportar a OptimoRoute (agrupado por cliente)
      description: >
        REQUIERE rol ADMIN.
        Devuelve las paradas del camión AGRUPADAS POR CLIENTE (una por cliente,
        aunque tenga varios pedidos). El Dashboard arma el CSV con esto.
        Marca los clientes con dirección/zip incompleto (aviso, no bloquea).
        El camión debe estar CONFIRMADO.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paradas del camión, listas para el CSV
          content:
            application/json:
              schema:
                type: object
                properties:
                  truck_id: { type: string, format: uuid }
                  truck_name: { type: string, nullable: true }
                  stops:
                    type: array
                    items: { $ref: '#/components/schemas/RouteExportStop' }
                  incomplete_count:
                    type: integer
                    description: Cuántas paradas tienen dirección/zip incompleto.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/route-import:
    post:
      tags: [route-stops]
      summary: Importar el orden de paradas devuelto por OptimoRoute
      description: >
        REQUIERE rol ADMIN.
        El admin sube el CSV que devolvió OptimoRoute (parseado a JSON por el
        Dashboard, o el CSV crudo). Cada entrada trae el client_code (Order #)
        y su Stop #. El middleware empareja por client_code y guarda el orden.
        Aplica el Stop # a todos los pedidos de ese cliente en el camión.

        ⚠️ ★ v0.45.1 — QUÉ SIGNIFICA "ESTÁ EN EL CAMIÓN". Los clientes
        válidos son los que tienen **órdenes O RECOGIDAS** en el camión, no
        solo los que tienen órdenes. Un cliente de pura recogida es una
        parada legítima: viene en `route-export`, vuelve en el CSV con su
        Stop #, y el import DEBE aceptarlo.

        Si se valida solo contra las órdenes, el bloque se cierra sobre sí
        mismo sin un solo error visible: el import rechaza al cliente de
        recogida, el admin lo saca del CSV para que pase, la parada nunca se
        crea, el driver no la ve, y `POST /dispatch/returns` la rechaza
        porque "no es una parada de esta ruta". Cada paso parece razonable
        por separado.
        RE-IMPORTABLE: reemplaza el orden anterior. Solo si el camión NO ha
        empezado el picking (si no → 409).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stops]
              properties:
                stops:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [client_code, stop_number]
                    properties:
                      client_code:
                        type: string
                        description: El Order # del CSV (= client_code).
                      stop_number:
                        type: integer
                        description: El Stop # que asignó OptimoRoute.
      responses:
        '200':
          description: Orden de paradas guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckRoute' }
        '400':
          description: >
            CSV inválido, o client_codes que no están en el camión —★ v0.45.1:
            ni con órdenes NI con recogidas—, o Stop # duplicados/faltantes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión ya está en picking; no se puede re-importar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/route:
    get:
      tags: [route-stops]
      summary: Ver el orden de paradas actual del camión
      description: >
        REQUIERE rol ADMIN. El orden guardado (si existe).

        ★ v0.45.3 — "No tiene ruta" NO es un 404. Un camión que existe y no
        tiene secuencia responde 200 con `has_route: false` y `stops: []`.
        El contrato declaraba 404 y estaba mal: mezclaba "ese camión no
        existe" con "ese camión existe y todavía no tiene ruta", que exigen
        respuestas distintas de quien llama, y dejaba sin uso a `has_route`
        —una respuesta que nunca puede traer `false` en ese campo no
        necesita el campo—.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >
            El orden de paradas. ★ v0.45.3 — También es la respuesta cuando
            NO hay secuencia: `has_route: false`, `stops: []`.

            ⚠️ Ese estado es idéntico se haya llegado a él por no haber
            importado nunca o por una INVALIDACIÓN (montar o desmontar una
            recogida que cambió el conjunto de paradas — ver v0.45.1 y
            v0.45.2). Es deliberado: la acción es la misma, importar. Por
            eso el aviso al admin va en la respuesta de montar/desmontar,
            que trae `has_route: false` y es el único momento en que se
            puede explicar POR QUÉ desapareció la secuencia.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckRoute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >
            ★ v0.45.3 — SOLO si el camión no existe. Antes decía "o no tiene
            orden de paradas aún", y eso era falso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/warehouse-workers:
    get:
      tags: [picking-admin]
      summary: Lista de bodegueros (para asignar camiones)
      description: >
        REQUIERE rol ADMIN. Los usuarios con rol BODEGUERO, para que el admin
        elija a quién asignar un camión. (En 2A son bodegueros de prueba por seed.)
      responses:
        '200':
          description: Lista de bodegueros
          content:
            application/json:
              schema:
                type: object
                properties:
                  workers:
                    type: array
                    items:
                      type: object
                      properties:
                        username: { type: string }
                        display_name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/trucks/{truck_id}/assign:
    post:
      tags: [picking-admin]
      summary: Asignar (o reasignar) un camión a un bodeguero
      description: >
        REQUIERE rol ADMIN.
        ★ v0.10.0 — Asigna un CARRIL del camión a un bodeguero. El camión debe
        estar CONFIRMADO con orden de paradas (has_route).
        Reglas:
          · `lane` indica qué carril se asigna (REGULAR o FROZEN).
          · El mismo bodeguero NO puede tener ambos carriles del mismo camión
            → 400. Siempre se asignan por separado.
          · El carril FROZEN solo se puede asignar si has_frozen es true → 400.
          · REASIGNABLE por carril, incluso en curso; el progreso SE CONSERVA
            (es del camión + carril, no del bodeguero).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_username, lane]
              properties:
                worker_username: { type: string }
                lane:
                  $ref: '#/components/schemas/PickingLane'
      responses:
        '200':
          description: Camión asignado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400':
          description: >
            El bodeguero no existe; el camión no tiene ruta; el bodeguero ya
            tiene el OTRO carril de este camión; o se pidió FROZEN en un camión
            sin congelados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está en un estado asignable (ej. BORRADOR/ALISTADO)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /picking/my-trucks:
    get:
      tags: [picking]
      summary: Los camiones asignados al bodeguero (del token)
      description: >
        REQUIERE rol BODEGUERO. Solo los camiones donde ESTE bodeguero tiene un
        carril asignado. Sin asignación, lista vacía.
        ★ v0.10.0 — Cada entrada indica `my_lane`: el carril que le toca a este
        bodeguero en ese camión. Ve el camión completo (contexto) pero solo
        opera su carril.
      responses:
        '200':
          description: Camiones del bodeguero
          content:
            application/json:
              schema:
                type: object
                properties:
                  trucks:
                    type: array
                    items: { $ref: '#/components/schemas/PickingTruckSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /picking/trucks/{truck_id}/start:
    post:
      tags: [picking]
      summary: Iniciar el picking de un camión (ASIGNADO → EN_PICKING)
      description: >
        REQUIERE rol BODEGUERO con un carril asignado en este camión.
        ★ v0.10.0 — Inicia SU CARRIL (el carril pasa a EN_PICKING). Congela el
        camión para el admin. Idempotente.
        Devuelve la lista de recolección DE SU CARRIL solamente.
        Si el bodeguero no tiene carril en este camión → 403.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Picking iniciado, con las listas de recolección
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickingCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El camión no está asignado a este bodeguero
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/collection:
    get:
      tags: [picking]
      summary: Las listas de recolección consolidada del camión
      description: >
        REQUIERE rol BODEGUERO con carril en este camión.
        ★ v0.10.0 — Devuelve la lista de recolección DE SU CARRIL (regulares o
        congelados, según el carril que le tocó), con el total a recoger por
        ítem, los bins con stock, y su progreso. Para PAUSAR/RETOMAR.
        Puede incluir el resumen del otro carril como CONTEXTO (solo lectura),
        pero el bodeguero no lo opera.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Las listas de recolección con progreso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickingCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/collect:
    post:
      tags: [picking]
      summary: Registrar la recolección de un ítem (de un bin)
      description: >
        REQUIERE rol BODEGUERO con carril en este camión.
        Confirma cuánto recogió de un ítem, de qué bin. Idempotente por
        (item_code, bin_code).
        ★ v0.10.0 — El ítem debe pertenecer AL CARRIL del bodeguero. Intentar
        recoger un ítem del otro carril → 403.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_code, bin_code, quantity]
              properties:
                item_code: { type: string }
                bin_code:
                  type: string
                  description: El bin de donde tomó (o is_system_bin si sin ubicar).
                quantity:
                  type: number
                  format: double
                  description: Cuánto recogió de ESTE bin.
      responses:
        '200':
          description: Recolección registrada; devuelve el progreso del ítem
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickingItemProgress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/shortage:
    post:
      tags: [picking]
      summary: Registrar un faltante de un ítem
      description: >
        REQUIERE rol BODEGUERO con carril en este camión. Marca que no había
        stock suficiente de un ítem.
        ★ v0.10.0 — El ítem debe pertenecer AL CARRIL del bodeguero → 403 si no.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_code, missing_quantity]
              properties:
                item_code: { type: string }
                missing_quantity: { type: number, format: double }
                note: { type: string }
      responses:
        '200':
          description: Faltante registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickingItemProgress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/start-distribution:
    post:
      tags: [distribution]
      summary: Iniciar la repartición (EN_PICKING → EN_REPARTICION)
      description: >
        REQUIERE rol BODEGUERO con carril en este camión.
        ★ v0.10.0 — Inicia la repartición DE SU CARRIL. Precondición: la
        recolección DE SU CARRIL debe estar completa (no la del otro). Si no → 409.
        El carril pasa a EN_REPARTICION. Los carriles son independientes: uno
        puede estar repartiendo mientras el otro sigue recolectando.
        Devuelve el plan de repartición de su carril (pedidos en orden de
        paradas INVERSO, con solo los ítems de su carril).
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Repartición iniciada, con el plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistributionPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La recolección no está completa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /picking/trucks/{truck_id}/distribution:
    get:
      tags: [distribution]
      summary: El plan de repartición y su progreso
      description: >
        REQUIERE rol BODEGUERO con carril en este camión.
        ★ v0.10.0 — El plan DE SU CARRIL: los pedidos en orden de paradas
        inverso, con solo los ítems de su carril, lo ya asignado y a qué pallets.
        Para pausar/retomar.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El plan con progreso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistributionPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/pallets:
    get:
      tags: [distribution]
      summary: Los pallets del camión
      description: REQUIERE rol BODEGUERO asignado. Los pallets creados y su contenido.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Los pallets
          content:
            application/json:
              schema:
                type: object
                properties:
                  pallets:
                    type: array
                    items: { $ref: '#/components/schemas/Pallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [distribution]
      summary: Crear un pallet nuevo
      description: >
        REQUIERE rol BODEGUERO con carril en este camión.
        ★ v0.10.0 — Crea un pallet DE SU CARRIL. El tipo se deriva del carril
        del bodeguero (no lo elige: el de FROZEN crea pallets FROZEN).
        El correlativo es POR TIPO: "<camión>-Regular-1, -2" y
        "<camión>-Frozen-1, -2", numerados independientemente.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                ★ v0.10.0 — Sin cuerpo requerido: el tipo se deriva del carril
                del bodeguero. Si se envía pallet_type y no coincide con su
                carril → 400.
              properties:
                pallet_type:
                  allOf:
                    - $ref: '#/components/schemas/PalletType'
                  description: Opcional; debe coincidir con el carril del bodeguero.
      responses:
        '201':
          description: Pallet creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/pallets/{pallet_id}/clear:
    post:
      tags: [distribution]
      summary: Desarmar un pallet (bajar todo su contenido)
      description: >
        ★ NUEVO en v0.51.0. REQUIERE rol BODEGUERO con carril en este camión.

        Baja TODO lo que tiene el pallet y lo devuelve a "sin repartir". El
        pallet sigue existiendo, vacío, y se le puede volver a asignar.

        Es el paso previo a borrarlo, y también sirve solo: el bodeguero
        armó un pallet que no le sirve y quiere empezarlo de nuevo sin
        perder la etiqueta.

        REGLAS:
          · El pallet debe ser DE SU CARRIL → 403.
          · Solo con el carril abierto; si ya cerró → 409.

        Idempotente: desarmar un pallet vacío devuelve 200 con la lista
        vacía.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: pallet_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >
            Pallet desarmado. Devuelve QUÉ QUEDÓ SIN REPARTIR — no un OK a
            secas: sin esa lista el bodeguero tiene que salir a buscar qué
            se soltó.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pallet: { $ref: '#/components/schemas/Pallet' }
                  released:
                    type: array
                    description: Lo que volvió a estar sin repartir.
                    items:
                      type: object
                      properties:
                        order_uuid: { type: string, format: uuid }
                        order_number: { type: string }
                        client_name: { type: string }
                        item_code: { type: string }
                        item_name: { type: string }
                        quantity:
                          type: number
                          format: double
                          description: Cuánto de ese ítem quedó sin repartir.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El carril ya está cerrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /picking/trucks/{truck_id}/pallets/{pallet_id}:
    delete:
      tags: [distribution]
      summary: Retirar un pallet (creado de más o que ya no se usa)
      description: >
        ★ NUEVO en v0.51.0. REQUIERE rol BODEGUERO con carril en este camión.

        Solo si el pallet está VACÍO → 409 `pallet_not_empty` si tiene algo,
        con el detalle de qué tiene. Para vaciarlo primero está
        `POST .../clear`.

        ⚠️ NO se borra con contenido y ya. Hacerlo sería una operación que
        hace dos cosas y muestra una: el pallet desaparece de la pantalla y
        el bodeguero NO ve que le volvieron diez ítems a la lista de
        pendientes. Desarmar primero lo obliga a ver qué quedó suelto, que
        es justamente lo que tiene que volver a ubicar. Es además el orden
        del mundo real: primero se baja la mercancía, después se retira el
        pallet.

        ★ EL NÚMERO NO SE REUSA. Si se borra el Regular-2, el próximo pallet
        regular es el Regular-3. La etiqueta es FÍSICA —alguien pudo
        haberla escrito en el plástico— y dos pallets con el mismo rótulo el
        mismo día es un error que aparece en la calle, cuando el driver
        busca uno y hay dos.

        REGLAS:
          · El pallet debe ser DE SU CARRIL → 403.
          · Solo con el carril abierto; si ya cerró → 409.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: pallet_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Pallet retirado
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            `pallet_not_empty` — todavía tiene contenido (el cuerpo lo
            detalla), o el carril ya está cerrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /picking/trucks/{truck_id}/assign-to-pallet:
    post:
      tags: [distribution]
      summary: Asignar un ítem de un pedido a un pallet (repartición)
      description: >
        REQUIERE rol BODEGUERO con carril en este camión. El acto central de la
        repartición: pone una cantidad de un ítem de un pedido en un pallet.
        REGLAS que el middleware valida:
          · ★ v0.10.0 — El ítem y el pallet deben ser DEL CARRIL del bodeguero.
            Tocar el carril ajeno → 403.
          · El pallet debe ser del tipo correcto (frozen→FROZEN, regular→REGULAR)
            → 400 si no.
          · Cuadre POR CARRIL: lo repartido ≤ lo recogido en ese carril → 400.
        Idempotente por (order_uuid, item_code, pallet_id): reenviar actualiza.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_uuid, item_code, pallet_id, quantity]
              properties:
                order_uuid: { type: string, format: uuid }
                item_code: { type: string }
                pallet_id: { type: string, format: uuid }
                quantity: { type: number, format: double }
      responses:
        '200':
          description: Asignación registrada; devuelve el progreso del pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDistributionProgress' }
        '400':
          description: Tipo de pallet incorrecto, o excede lo recogido (cuadre)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /picking/trucks/{truck_id}/complete-distribution:
    post:
      tags: [distribution]
      summary: Cerrar la repartición (EN_REPARTICION → ALISTADO)
      description: >
        REQUIERE rol BODEGUERO con carril en este camión.
        ★ v0.10.0 — Cierra SU CARRIL. Valida el cuadre DE SU CARRIL: todo lo
        recogido en él debe estar repartido (o justificado). Si falta → 409 con
        el detalle. Su carril pasa a CERRADO.
        El CAMIÓN pasa a ALISTADO solo cuando TODOS sus carriles están CERRADO.
        Si el otro carril sigue abierto, el camión NO queda ALISTADO todavía.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >
            Carril cerrado. El camión queda ALISTADO solo si todos los carriles
            cerraron; si no, sigue en curso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Queda producto sin repartir (no cuadra)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistributionMismatch' }

  /admin/trucks/{truck_id}/unassign:
    post:
      tags: [picking-admin]
      summary: Desasignar un carril (quitarle el bodeguero)
      description: >
        ★ v0.10.0 — REQUIERE rol ADMIN.
        Quita el bodeguero de un carril: el carril vuelve a SIN_ASIGNAR.
        ⚠️ SE PIERDE EL PROGRESO de ese carril (recolección, repartición y
        pallets del carril se descartan). El Dashboard debe AVISARLO antes de
        confirmar. Si solo se quiere cambiar de persona conservando el trabajo,
        usar `assign` (reasignar), no este endpoint.
        Disponible SIEMPRE mientras el camión no esté ALISTADO (aunque el carril
        esté EN_PICKING o EN_REPARTICION) → 409 si el camión ya está ALISTADO.
        ★ Si tras desasignar NINGÚN carril queda asignado, el camión vuelve a
        CONFIRMADO (y desde ahí se puede cancelar o eliminar). Esto cierra el
        ciclo: toda asignación es reversible.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lane]
              properties:
                lane:
                  $ref: '#/components/schemas/PickingLane'
      responses:
        '200':
          description: Carril desasignado; devuelve el camión actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400':
          description: El carril no existe en este camión, o ya está SIN_ASIGNAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión está ALISTADO (ya se picó)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/manifest:
    get:
      tags: [manifest]
      summary: Manifiesto de Ruta del camión (informe final)
      description: >
        REQUIERE rol ADMIN.
        El informe con el que el driver entrega: los pedidos por parada, en
        orden de entrega DIRECTO (parada 1, 2, 3...), con el/los pallet(s) de
        cada pedido. Solo para camiones ALISTADOS (si no → 409).
        Puramente lectura: junta datos que ya existen.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El manifiesto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteManifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está ALISTADO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/delivery:
    get:
      tags: [delivery]
      summary: Estado de entrega de los pedidos de un camión
      description: >
        ★ v0.11.0 — REQUIERE rol ADMIN.
        La pantalla de cierre: todos los pedidos del camión, por parada (orden
        DIRECTO, como el manifiesto), con su estado de entrega.
        Solo para camiones ALISTADOS → 409 si no.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El estado de entrega del camión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está ALISTADO (no ha salido)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/orders/{order_uuid}/delivery:
    post:
      tags: [delivery]
      summary: Registrar el resultado de la entrega de un pedido
      description: >
        ★ v0.11.0 — REQUIERE rol ADMIN.
        Cierra la entrega de UN pedido. Reglas que valida el middleware:
          · El pedido debe pertenecer a un camión ALISTADO → 409 si no.
          · ENTREGADO: sin order_reason ni rejected_items.
          · NO_ENTREGADO: order_reason OBLIGATORIO, sin rejected_items.
          · ENTREGADO_PARCIAL: rejected_items OBLIGATORIO (al menos uno), sin
            order_reason. Cada ítem rechazado debe pertenecer al pedido y su
            cantidad no puede exceder lo que el pedido llevaba → 400.
        Idempotente: volver a registrar el mismo pedido ACTUALIZA el registro
        (el admin puede corregirse).
      parameters:
        - name: order_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/DeliveryStatus' }
                order_reason:
                  allOf:
                    - $ref: '#/components/schemas/OrderRejectionReason'
                  nullable: true
                rejected_items:
                  type: array
                  items:
                    type: object
                    required: [item_code, quantity, reason]
                    properties:
                      item_code: { type: string }
                      quantity: { type: number, format: double }
                      reason: { $ref: '#/components/schemas/ItemRejectionReason' }
                note: { type: string, nullable: true }
      responses:
        '200':
          description: Entrega registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRecord' }
        '400':
          description: >
            Combinación inválida (falta motivo, sobran ítems para el estado,
            ítem que no es del pedido, cantidad que excede lo llevado).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El pedido no está en un camión ALISTADO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/workload:
    get:
      tags: [workload]
      summary: Tablero de carga — qué despachar cada día
      description: >
        ★ v0.12.0 — REQUIERE rol ADMIN.
        El tablero de planificación del admin de bodega. Puramente lectura.

        Toma todos los pedidos APROBADOS sin entregar y los reparte en columnas
        de LUNES a VIERNES (+ SIN_DIA), agrupados por shipping code.

        Reglas de asignación de día:
          · Cada pedido cae en UN SOLO día: el PRÓXIMO día de entrega de su
            shipping code contado DESDE HOY. Un shipping code con varios días
            NO reparte sus pedidos entre ellos.
          · Sábado y domingo se IGNORAN.
          · Sin shipping code, sin días configurados, o solo fin de semana
            → columna SIN_DIA.
          · Un pedido que ya existía cuando pasó su día y no se despachó se
            marca ATRASADO (aparece en el próximo día disponible).
      responses:
        '200':
          description: El tablero
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkloadBoard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/picking-board:
    get:
      tags: [picking-admin]
      summary: Picking en curso — el piso de la bodega de un vistazo
      description: >
        ★ v0.13.0 — REQUIERE rol ADMIN. Puramente lectura.

        Todos los camiones que se están trabajando (ASIGNADO, EN_PICKING,
        EN_REPARTICION) más los ALISTADOS de HOY, con el avance de cada carril
        y sus faltantes.

        Resuelve la ceguera del admin entre "asigné" y "apareció ALISTADO":
        ahora ve quién está trabajando qué, cuánto lleva, y dónde hay faltantes.

        Los endpoints /picking/* son del bodeguero (filtrados por su token);
        este es su equivalente de solo lectura para el admin.

        El Dashboard lo refresca solo cada ~30s.
      responses:
        '200':
          description: El tablero de picking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickingBoard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/drivers:
    get:
      tags: [dispatch-admin]
      summary: Lista de drivers (para asignar camiones)
      description: >
        ★ v0.14.0 — REQUIERE ADMIN. Los usuarios con rol DRIVER, para que el
        admin elija a quién asignar un camión. Indica si cada uno ya tiene un
        camión activo (un driver, un camión a la vez).
      responses:
        '200':
          description: Lista de drivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  drivers:
                    type: array
                    items:
                      type: object
                      properties:
                        username: { type: string }
                        display_name: { type: string }
                        current_truck_id:
                          type: string
                          format: uuid
                          nullable: true
                          description: >
                            El camión que ya tiene asignado (ASIGNADO_DRIVER o
                            EN_RUTA). NULL si está libre.
                        current_truck_name: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/salespersons:
    get:
      tags: [dispatch-admin]
      summary: Lista de vendedores (para atribuir un pago reportado desde el Dashboard)
      description: >
        ★ v0.19.2 — REQUIERE ADMIN. Es la fuente de TODO selector de
        PERTENENCIA: a qué vendedor pertenece un pago, de qué vendedor es un
        pedido. Mismo patrón que /admin/drivers.

        ★ CORREGIDO EN v0.50.0 — CAMBIA DE FUENTE. Devuelve los vendedores
        ACTIVOS del ESPEJO DE SAP (`SapSalespersons`), no las cuentas de
        login del WMS.

        Devolvía 3 de 19: solo los aprovisionados. Un selector de "a quién
        pertenece esto" que ofrece el 16% de los vendedores reales no está
        incompleto, está roto — y el pedido que se intenta atribuir a los
        otros 16 se rechaza. Ver la regla global 👤: la pertenencia es un
        hecho de SAP y la cuenta de login es un hecho del WMS.

        ⚠️ NO CONFUNDIR CON `GET /admin/sap-salespersons`, que devuelve los
        mismos vendedores pero para otra pregunta: a quién FALTA
        aprovisionar (trae `is_active` y `has_login_account`). Uno es de
        negocio, el otro de administración de usuarios.

        ★ v0.29.0 — el criterio nunca fue el rol de login. Antes filtraba por
        Role=VENDEDOR, lo que dejaba fuera al VENDEDOR_INSTITUCIONAL sin
        razón de negocio: Role es la capa de autorización del WMS y SAP no
        tiene ningún concepto de rol. Aquella corrección iba en la dirección
        correcta y se quedó corta: cambió el filtro, no la tabla.
      responses:
        '200':
          description: Lista de vendedores
          content:
            application/json:
              schema:
                type: object
                properties:
                  salespersons:
                    type: array
                    items:
                      type: object
                      properties:
                        salesperson_code: { type: string }
                        display_name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/sap-salespersons:
    get:
      tags: [dispatch-admin]
      summary: Vendedores reales de SAP (espejo de solo lectura), con estado de aprovisionamiento
      description: >
        ★ v0.21.1 — REQUIERE ADMIN. Lee de SapSalespersons (el espejo que
        llena la sincronización real de SAP — NO la tabla de login). Cada
        fila indica si ya tiene cuenta de login creada (Salespersons) o no,
        para que la pantalla "Gestionar Usuarios" del Dashboard muestre
        quién falta por aprovisionar. Vacío de contrato encontrado durante
        la validación de producción: GET /admin/salespersons solo lee la
        tabla de login (vacía salvo el admin de bootstrap), y no había
        ninguna forma de ver los vendedores reales de SAP pendientes de
        aprovisionar. Campo de nombre: display_name (NO "name") — mismo
        nombre de campo que ya usa GET /admin/salespersons, por consistencia.
      responses:
        '200':
          description: Vendedores reales de SAP con estado de aprovisionamiento
          content:
            application/json:
              schema:
                type: object
                properties:
                  sap_salespersons:
                    type: array
                    items:
                      type: object
                      properties:
                        salesperson_code: { type: string, description: "SlpCode real de SAP." }
                        display_name: { type: string }
                        is_active: { type: boolean, description: "Estado en SAP, no en el login." }
                        has_login_account:
                          type: boolean
                          description: Ya existe una cuenta en Salespersons (login) para este código.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/salespersons/provision:
    post:
      tags: [dispatch-admin]
      summary: ADMIN crea la cuenta de login real de un vendedor
      description: >
        ★ v0.21.1 — REQUIERE ADMIN. Crea una cuenta VENDEDOR real en la
        tabla de login (Salespersons), vinculada a un salesperson_code que
        DEBE existir en SapSalespersons (validar contra el espejo real —
        400, code=salesperson_code_not_found, si el código no existe ahí).
        409 (code=salesperson_already_provisioned) si ese salesperson_code
        ya tiene cuenta de login. 409 (code=username_taken) si el username
        ya pertenece a OTRA cuenta cualquiera (vendedor o admin) — son dos
        causas de 409 DISTINTAS en el mismo endpoint, distínguelas por
        Error.code, no asumas que un 409 siempre significa lo mismo. El
        ADMIN define la contraseña inicial manualmente (no autogenerada) —
        mínimo 8 caracteres, validar server-side (400,
        code=password_too_short, si no cumple). display_name se toma del
        espejo SAP, no se recibe en el body. La respuesta 201 SÍ devuelve
        cuerpo (salesperson_code, username, display_name del vendedor
        creado) — no queda vacía.

        ★ v0.29.0 — sin cambio de firma salvo el nuevo campo OPCIONAL
        `role` en el body (VENDEDOR | VENDEDOR_INSTITUCIONAL, default
        VENDEDOR). El 409 salesperson_already_provisioned aplica
        independientemente del rol solicitado en este request: un
        salesperson_code admite UNA SOLA cuenta de login, sea VENDEDOR o
        VENDEDOR_INSTITUCIONAL. GET
        /admin/sap-salespersons.has_login_account sigue siendo un booleano
        simple, no distingue por rol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [salesperson_code, username, password]
              properties:
                salesperson_code:
                  type: string
                  description: >
                    Debe existir en SapSalespersons (espejo real de SAP) y no
                    tener ya una cuenta de login provisionada — la regla del 409
                    aplica sin importar el rol solicitado.
                username: { type: string }
                password: { type: string, minLength: 8 }
                role:
                  type: string
                  enum: [VENDEDOR, VENDEDOR_INSTITUCIONAL]
                  default: VENDEDOR
                  description: >
                    ★ v0.29.0. Rol de la cuenta a provisionar. Omitir este
                    campo equivale a VENDEDOR (compatibilidad total con
                    clientes existentes de este endpoint). No acepta ningún
                    otro valor de Role: BODEGUERO/DRIVER se provisionan vía
                    POST /admin/staff/provision (v0.24.0);
                    ADMIN/APROBADOR_PAGOS/APROBADOR_CREDITOS/
                    ANALISTA_COMERCIAL no se provisionan por esta vía en
                    absoluto.
      responses:
        '201':
          description: Cuenta de vendedor creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  salesperson_code: { type: string }
                  username: { type: string }
                  display_name: { type: string }
                  role:
                    type: string
                    enum: [VENDEDOR, VENDEDOR_INSTITUCIONAL]
                    description: >
                      ★ v0.29.0. Eco del rol efectivamente asignado (VENDEDOR
                      si el request omitió el campo).
        '400':
          description: >
            salesperson_code no existe en SapSalespersons
            (code=salesperson_code_not_found), password muy corta
            (code=password_too_short), o ★ v0.29.0 role fuera de
            [VENDEDOR, VENDEDOR_INSTITUCIONAL] (code=invalid_salesperson_role).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            Dos causas distintas, distinguir por Error.code: ese
            salesperson_code ya tiene cuenta (code=salesperson_already_provisioned),
            o el username ya pertenece a otra cuenta (code=username_taken).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ═══════════════════════════════════════════════════════════════
  # ★ NUEVO v0.24.0 — CREAR CUENTAS DE BODEGUERO/DRIVER DESDE CERO
  # ═══════════════════════════════════════════════════════════════
  # A diferencia de /admin/salespersons/provision (que ACTIVA una cuenta
  # para alguien que ya existe como SlpCode real en SAP), BODEGUERO y
  # DRIVER no son un concepto de SAP en absoluto — son personal interno
  # del WMS. Por eso este es un flujo distinto: crear una cuenta de cero,
  # sin ningún espejo de SAP contra el cual validar. Vive en la MISMA
  # pantalla "Gestionar Usuarios" del Dashboard, como sección aparte.

  /admin/staff:
    get:
      tags: [dispatch-admin]
      summary: Lista el personal interno ya creado (BODEGUERO, DRIVER, ANALISTA_COMERCIAL)
      description: >
        ★ v0.29.0 — el filtro pasa a Role IN (BODEGUERO, DRIVER,
        ANALISTA_COMERCIAL); antes solo los dos primeros.
        ANALISTA_COMERCIAL entra a este grupo (y no al de
        /admin/salespersons/provision) porque, igual que BODEGUERO y
        DRIVER, NO es un concepto de SAP y nunca lo será: es personal
        interno del WMS, sin salesperson_code, identificado únicamente por
        su rol de login.

        ★ v0.24.0. REQUIERE ADMIN. A diferencia de /admin/sap-salespersons,
        esto NO lee ningún espejo de SAP — lista directo la tabla de login
        (Salespersons). No hay "pendientes de aprovisionar" que mostrar,
        porque estas cuentas no existen fuera del WMS hasta que se crean
        aquí.
      responses:
        '200':
          description: Lista de personal
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items:
                      type: object
                      properties:
                        username: { type: string }
                        display_name: { type: string }
                        role: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/staff/provision:
    post:
      tags: [dispatch-admin]
      summary: ADMIN crea una cuenta nueva de personal interno del WMS desde cero
      description: >
        ★ v0.29.0 — role admite BODEGUERO, DRIVER o ANALISTA_COMERCIAL
        (antes solo los dos primeros). 400 code=invalid_staff_role para
        cualquier otro valor.

        Las dos vías de alta del proyecto son disjuntas y complementarias:
        POST /admin/salespersons/provision crea los roles que llevan
        salesperson_code real de SAP (VENDEDOR, VENDEDOR_INSTITUCIONAL);
        este endpoint crea los que NO existen en SAP (BODEGUERO, DRIVER,
        ANALISTA_COMERCIAL). ADMIN, APROBADOR_PAGOS y APROBADOR_CREDITOS
        no tienen todavía vía de alta por API — el primer ADMIN sale del
        bootstrap y los dos aprobadores, hoy, solo del seed.

        ★ v0.24.0. REQUIERE ADMIN. Crea una cuenta de login real
        (Salespersons) SIN ningún vínculo a SAP (Code queda null) — a
        diferencia de /admin/salespersons/provision, aquí no hay
        salesperson_code que validar. El ADMIN define
        display_name y la contraseña inicial manualmente — mínimo 8
        caracteres (400, code=password_too_short). 409
        (code=username_taken) si el username ya pertenece a OTRA cuenta
        cualquiera (vendedor, admin, u otro bodeguero/driver).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, display_name, role]
              properties:
                username: { type: string }
                password: { type: string, minLength: 8 }
                display_name: { type: string }
                role:
                  type: string
                  enum: [BODEGUERO, DRIVER, ANALISTA_COMERCIAL]
                  description: >
                    ★ v0.29.0 — se agrega ANALISTA_COMERCIAL. Ningún otro
                    valor de Role es válido aquí.
      responses:
        '201':
          description: Cuenta de personal creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  display_name: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
        '400':
          description: >
            role inválido — debe ser BODEGUERO, DRIVER o ANALISTA_COMERCIAL
            (code=invalid_staff_role) — o password muy corta
            (code=password_too_short)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: username ya pertenece a otra cuenta (code=username_taken)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/assign-driver:
    post:
      tags: [dispatch-admin]
      summary: Asignar (o reasignar) un camión a un driver
      description: >
        ★ v0.14.0 — REQUIERE ADMIN.
        El camión debe estar ALISTADO (ya picado) → 409 si no.
        UN DRIVER, UN CAMIÓN A LA VEZ: si el driver ya tiene otro camión
        ASIGNADO_DRIVER o EN_RUTA → 400.
        ALISTADO → ASIGNADO_DRIVER. Reasignable mientras no esté EN_RUTA.
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driver_username]
              properties:
                driver_username: { type: string }
      responses:
        '200':
          description: Camión asignado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '400':
          description: El driver no existe, o ya tiene otro camión activo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está ALISTADO, o ya salió (EN_RUTA)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/trucks/{truck_id}/unassign-driver:
    post:
      tags: [dispatch-admin]
      summary: Quitarle el camión a un driver
      description: >
        ★ v0.14.0 — REQUIERE ADMIN. El camión vuelve a ALISTADO.
        No se puede si ya está EN_RUTA o RUTA_CERRADA → 409.
        (Cierra el ciclo: la asignación de driver es reversible antes de salir.)
      parameters:
        - name: truck_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Driver desasignado; el camión vuelve a ALISTADO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión ya salió (EN_RUTA/RUTA_CERRADA)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/my-route:
    get:
      tags: [dispatch]
      summary: La ruta completa del driver (descarga para trabajar offline)
      description: >
        ★ v0.14.0 — REQUIERE rol DRIVER.
        Devuelve TODO lo que el driver necesita para trabajar la ruta SIN
        CONEXIÓN: paradas en orden, pedidos de cada parada, líneas de cada
        pedido, cliente y dirección. Es la descarga que debe hacer antes de salir.
        Sin camión asignado → 404 (la app avisa "no tienes ruta asignada").
        ★ La app debe AVISAR CLARAMENTE si el driver no ha descargado su ruta.
      responses:
        '200':
          description: La ruta completa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverRoute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El driver no tiene camión asignado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/start-route:
    post:
      tags: [dispatch]
      summary: Iniciar la ruta (ASIGNADO_DRIVER → EN_RUTA)
      description: >
        ★ v0.14.0 — REQUIERE rol DRIVER con camión asignado.
        Marca que salió a despachar. Idempotente: si ya está EN_RUTA, devuelve
        el estado actual.
      responses:
        '200':
          description: Ruta iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverRoute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está ASIGNADO_DRIVER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/orders/{order_uuid}/deliver:
    post:
      tags: [dispatch]
      summary: Registrar la entrega de un pedido (desde la calle)
      description: >
        ★ v0.14.0 — REQUIERE rol DRIVER; el pedido debe ser de SU camión → 403.

        ★ EL ESTADO SE DERIVA de lo que marca el driver — él NO lo elige:
          · sin rejected_items y sin order_reason → ENTREGADO
          · con rejected_items                    → ENTREGADO_PARCIAL
          · con order_reason (salida rápida)      → NO_ENTREGADO

        Los motivos son los mismos del Bloque 3A (ItemRejectionReason y
        OrderRejectionReason). Lo NO entregado alimenta la lista de RETORNADOS.

        Idempotente por pedido: reenviar ACTUALIZA (clave para el offline —
        la cola puede reintentar sin duplicar).
      parameters:
        - name: order_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                O bien `order_reason` (no se entregó nada), o bien
                `rejected_items` (entregó con novedades), o ninguno de los dos
                (entregó todo). Mandar ambos → 400.
              properties:
                order_reason:
                  allOf:
                    - $ref: '#/components/schemas/OrderRejectionReason'
                  nullable: true
                  description: Salida rápida — no se entregó nada.
                rejected_items:
                  type: array
                  description: Ítems que el cliente NO recibió, con su motivo.
                  items:
                    type: object
                    required: [item_code, quantity, reason]
                    properties:
                      item_code: { type: string }
                      quantity:
                        type: number
                        format: double
                        description: Cuántas unidades NO se entregaron.
                      reason: { $ref: '#/components/schemas/ItemRejectionReason' }
                note: { type: string, nullable: true }
                occurred_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: >
                    ★ Cuándo ocurrió la entrega EN LA CALLE. Importante para el
                    offline: si se registró sin señal y se sincroniza horas
                    después, esta es la hora real, no la de llegada al servidor.
      responses:
        '200':
          description: Entrega registrada; devuelve el estado derivado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryRecord' }
        '400':
          description: >
            order_reason y rejected_items juntos; ítem que no es del pedido;
            cantidad mayor a la que llevaba.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El pedido no es del camión de este driver
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está EN_RUTA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/pickups/{request_uuid}/not-collected:
    post:
      tags: [pickups]
      summary: Declarar que una recogida NO se pudo hacer
      description: >
        ★ NUEVO en v0.45.0. REQUIERE rol DRIVER con camión EN_RUTA; la
        recogida debe ser de SU camión → 403.

        La contraparte de registrar la devolución. EXISTE PORQUE SIN ELLA
        una recogida que el driver no pudo hacer y una que nadie miró se ven
        idénticas desde la oficina: las dos se quedan en EN_CAMION para
        siempre. Un estado que solo avanza cuando sale bien no dice nada
        cuando sale mal.

        No afecta la solicitud de crédito: el aprobador decide igual.

        Idempotente: reenviar ACTUALIZA (motivo y nota), clave para el
        offline. Si la recogida YA se registró como hecha → 409
        `pickup_already_collected`; corregirse ahí es asunto de la oficina,
        no de la calle.
      parameters:
        - name: request_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/PickupNotCollectedReason' }
                note: { type: string, nullable: true }
                occurred_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: >
                    Cuándo ocurrió la visita. Si se registró sin señal y
                    sincroniza horas después, esta es la hora real.
      responses:
        '200':
          description: Registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditRequestPickup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: La recogida no es del camión de este driver
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            El camión no está EN_RUTA, o la recogida ya se registró como
            hecha (`pickup_already_collected`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/finish-route:
    post:
      tags: [dispatch]
      summary: Terminar la ruta (EN_RUTA → RUTA_CERRADA)
      description: >
        ★ v0.14.0 — REQUIERE rol DRIVER con camión EN_RUTA.
        Cierra la jornada del driver. Los pedidos sin registrar quedan como
        estaban (PENDIENTE) — NO se fuerza un estado: el admin los cierra desde
        el Dashboard si hace falta.
        Devuelve el resumen de la ruta, incluida la lista de RETORNADOS.
      responses:
        '200':
          description: Ruta cerrada, con el resumen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: El camión no está EN_RUTA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/returns:
    post:
      tags: [returns]
      summary: Registrar un retorno de producto (con foto)
      description: >
        ★ v0.15.0 — REQUIERE rol DRIVER con camión EN_RUTA.

        El cliente devuelve mercancía de FACTURAS ANTERIORES. El driver la
        recibe, la documenta con una foto, y queda registrada para el admin.
        NO afecta inventario — es un registro (nada se escribe a SAP).

        Reglas:
          · El `client_code` debe ser de una parada de SU ruta → 400 si no.
          · Al menos un ítem, cada uno con cantidad > 0 y motivo.
          · La FOTO es OBLIGATORIA (base64, ya redimensionada por la app).
          · `occurred_at` = la hora real de la visita (clave para el offline).

        La app manda todo en UNA petición: o entra el retorno completo con su
        evidencia, o no entra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return_uuid, client_code, items, photo_base64]
              properties:
                return_uuid:
                  type: string
                  format: uuid
                  description: >
                    ★ v0.15.0 — Identidad del retorno, GENERADA POR LA APP.
                    Hace el POST idempotente: si el servidor ya procesó este
                    return_uuid, devuelve 200 con el registro existente en vez
                    de crear un duplicado.
                    Es necesario porque un retorno NO tiene identidad natural
                    (a diferencia de `deliver`, cuya clave es el order_uuid):
                    el mismo cliente puede devolver lo mismo dos veces el mismo
                    día legítimamente. Sin esta clave, un reintento tras
                    perderse la respuesta crearía un retorno duplicado con su
                    foto.
                client_code:
                  type: string
                  description: El cliente que devuelve. Debe ser una parada de su ruta.
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [item_code, quantity, reason]
                    properties:
                      item_code: { type: string }
                      quantity: { type: number, format: double }
                      reason: { $ref: '#/components/schemas/ProductReturnReason' }
                photo_base64:
                  type: string
                  description: >
                    La foto en base64, SIN el prefijo data-uri. La app la
                    redimensiona antes (~1024px, calidad ~70%) para que pese
                    150-300KB. OBLIGATORIA.
                note: { type: string, nullable: true }
                occurred_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: >
                    Cuándo ocurrió la visita. Si se registró sin señal y
                    sincroniza después, esta es la hora real.
                client_reference:
                  type: string
                  nullable: true
                  description: >
                    Referencia opcional que dé el cliente (número de factura,
                    remisión). Texto libre — no se valida contra nada.
                pickup_for_request_uuid:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    ★ NUEVO en v0.45.0. La solicitud de crédito que MANDÓ a
                    buscar esta mercancía, cuando esta devolución es la
                    RECOGIDA de una parada de recogida.

                    Debe ser una recogida montada en SU camión → 400
                    `pickup_not_on_route` si no. Al aceptarla, la recogida
                    pasa a RECOGIDA.

                    ⚠️ Las cantidades PUEDEN diferir de las que pidió la
                    solicitud y el servidor NO las compara ni rechaza: se
                    pidió crédito por 10 y el cliente entregó 7. Quien
                    aprueba ve las dos cifras y decide.

                    NULL en una devolución espontánea, que es como funcionó
                    todo hasta v0.44.0 y sigue funcionando igual.
      responses:
        '201':
          description: Retorno registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductReturn' }
        '200':
          description: >
            ★ Este return_uuid YA fue procesado — devuelve el registro existente
            sin crear un duplicado. Es la respuesta al reintento de una app que
            no recibió la confirmación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductReturn' }
        '400':
          description: >
            Cliente que no es de su ruta; sin ítems; cantidad inválida; ítem
            que no existe; foto ausente o ilegible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: El camión no está EN_RUTA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/returns/mine:
    get:
      tags: [returns]
      summary: Los retornos que registró el driver en esta ruta
      description: >
        ★ v0.15.0 — REQUIERE rol DRIVER. Para que el driver revise lo que lleva
        registrado. No incluye la foto (solo si la tiene).
      responses:
        '200':
          description: Los retornos de su ruta actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  returns:
                    type: array
                    items: { $ref: '#/components/schemas/ProductReturn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/returns:
    get:
      tags: [returns-admin]
      summary: Retornos de producto registrados
      description: >
        ★ v0.15.0 — REQUIERE ADMIN. Lo que los drivers han recibido de vuelta.
        El admin lo procesa manualmente (no hay movimiento de inventario
        automático).
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: Desde esta fecha (inclusive). Por defecto, hoy.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: Hasta esta fecha (inclusive). Por defecto, hoy.
      responses:
        '200':
          description: Los retornos del período
          content:
            application/json:
              schema:
                type: object
                properties:
                  returns:
                    type: array
                    items: { $ref: '#/components/schemas/ProductReturn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/returns/{return_id}/photo:
    get:
      tags: [returns-admin]
      summary: La foto de un retorno
      description: >
        ★ v0.15.0 — REQUIERE ADMIN. Devuelve la imagen para verla en el
        Dashboard. El middleware la sirve desde disco.
      parameters:
        - name: return_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La imagen
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dispatch/payments:
    post:
      tags: [payments]
      summary: Registrar un pago recibido en ruta (dinero del DRIVER)
      description: >
        ★ v0.16.0 — REQUIERE rol DRIVER con camión EN_RUTA.

        El driver recibe dinero del cliente durante la visita. Es un REGISTRO —
        el admin lo aplica después en SAP; nada se escribe a SAP desde aquí.
        NO es lo mismo que /account-payments (v0.17.0): esto es efectivo/cheque
        suelto recogido en ruta; account-payments es un pago del vendedor
        aplicado directamente a facturas de cartera.

        Reglas:
          · `payment_uuid` lo GENERA LA APP → idempotente. Si ya fue procesado,
            devuelve 200 con el registro existente. Un pago duplicado es tan
            grave como uno perdido.
          · El `client_code` debe ser de una parada de SU ruta → 400 si no.
          · `amount` > 0.
          · CHEQUE: `check_number` y `photo_base64` OBLIGATORIOS.
          · CASH: sin foto ni número de cheque (mandarlos → 400).
          · `occurred_at` = la hora real de la visita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_uuid, client_code, amount, payment_type]
              properties:
                payment_uuid:
                  type: string
                  format: uuid
                  description: >
                    ★ Identidad del pago, GENERADA POR LA APP. Hace el POST
                    idempotente: un reintento tras perderse la respuesta
                    devuelve el registro existente en vez de duplicar el dinero.
                client_code:
                  type: string
                  description: El cliente que paga. Debe ser una parada de su ruta.
                amount:
                  type: number
                  format: double
                  description: El monto recibido. Debe ser > 0.
                payment_type: { $ref: '#/components/schemas/PaymentType' }
                check_number:
                  type: string
                  nullable: true
                  description: OBLIGATORIO si payment_type es CHEQUE; ausente si CASH.
                photo_base64:
                  type: string
                  nullable: true
                  description: >
                    La foto del cheque, en base64 sin prefijo data-uri, ya
                    redimensionada por la app (~1024px, ~70%).
                    OBLIGATORIA si CHEQUE; ausente si CASH.
                note: { type: string, nullable: true }
                occurred_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Cuándo se recibió el dinero (hora real, no la de sync).
      responses:
        '201':
          description: Pago registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '200':
          description: >
            Este payment_uuid YA fue procesado — devuelve el registro existente
            sin duplicar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400':
          description: >
            Cliente que no es de su ruta; monto <= 0; CHEQUE sin número o sin
            foto; CASH con número de cheque o foto; foto ilegible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: El camión no está EN_RUTA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /dispatch/payments/mine:
    get:
      tags: [payments]
      summary: Los pagos que recogió el driver, con el total de su caja
      description: >
        ★ v0.16.0 — REQUIERE rol DRIVER.
        Lo que lleva recogido en su ruta actual, con el total separado por CASH
        y CHEQUE — al terminar trae ese dinero encima y necesita saber cuánto es.
        Los ANULADOS aparecen marcados pero NO suman al total.
        Sigue accesible con la ruta cerrada (para poder anular después).
      responses:
        '200':
          description: Sus pagos y el total
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverPaymentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /dispatch/payments/{payment_uuid}/void:
    post:
      tags: [payments]
      summary: Anular un pago mal registrado
      description: >
        ★ v0.16.0 — REQUIERE rol DRIVER; el pago debe ser SUYO → 403.

        ★ EL REGISTRO NO SE BORRA. Queda como anulado, con quién lo anuló,
        cuándo y POR QUÉ. Un pago es dinero: nada desaparece, todo queda
        auditable.

        El MOTIVO es obligatorio — un pago anulado sin explicación es una
        bandera roja que nadie puede resolver después.

        Se puede anular EN CUALQUIER MOMENTO, incluso con la ruta ya cerrada:
        el error suele notarse al cuadrar la caja en la bodega.

        Anular dos veces el mismo pago → 200 (idempotente), sin cambiar el
        motivo ni la hora del primer anulado.
      parameters:
        - name: payment_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: Por qué se anula. OBLIGATORIO.
                occurred_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Pago anulado (o ya lo estaba)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400':
          description: Sin motivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: El pago no es de este driver
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/payments:
    get:
      tags: [payments-admin]
      summary: Pagos recibidos en ruta (dinero del DRIVER)
      description: >
        ★ v0.16.0 — REQUIERE ADMIN. El dinero que los drivers recogieron.
        El admin lo aplica en SAP manualmente.
        Incluye los ANULADOS (marcados, con su motivo) — el rastro importa.
        No confundir con /admin/account-payments (v0.17.0), que son pagos del
        vendedor ya aplicados a facturas específicas.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: Desde esta fecha (inclusive). Por defecto, hoy.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: Hasta esta fecha (inclusive). Por defecto, hoy.
      responses:
        '200':
          description: Los pagos del período, con totales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPaymentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/payments/{payment_uuid}/photo:
    get:
      tags: [payments-admin]
      summary: La foto del cheque
      description: >
        ★ v0.16.0 — REQUIERE ADMIN. Solo para pagos con CHEQUE.
        404 si es CASH (no tiene foto).
      parameters:
        - name: payment_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La imagen
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Since:
      name: since
      in: query
      required: false
      schema: { type: string, format: date-time }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Token válido pero el rol no tiene permiso
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Petición inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ★ v0.23.0 — DISPARO A DEMANDA DEL REFRESCO DEL ESPEJO
    SapRefreshResult:
      type: object
      description: >
        ★ v0.23.0. Resultado real de una corrida de SapMirrorRefreshService
        — mismo objeto que ya se logueaba internamente en cada ciclo de
        15 min, ahora también devuelto como respuesta HTTP.
      properties:
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        source_results:
          type: array
          description: >
            Una fila por cada una de las 7 vistas leídas (vw_WMS_Items,
            vw_WMS_Stock, vw_WMS_BinStock, vw_WMS_Clients,
            vw_WMS_Salespersons, vw_WMS_ClientCredit, vw_WMS_ClientDocuments).
          items:
            type: object
            properties:
              source: { type: string, description: "ej. vw_WMS_Stock" }
              rows_upserted:
                type: integer
                nullable: true
                description: >
                  ★ v0.48.0 — NULLABLE, y null NO es 0: la fuente no llegó a
                  procesarse. Cero es "se procesó y no hubo filas".
              succeeded: { type: boolean }
              error_detail: { type: string, nullable: true }

    # ★ v0.17.0 — AGREGADOS APROBADOR_PAGOS, APROBADOR_CREDITOS
    Role:
      type: string
      enum:
        - ADMIN
        - VENDEDOR
        - VENDEDOR_INSTITUCIONAL
        - BODEGUERO
        - DRIVER
        - APROBADOR_PAGOS
        - APROBADOR_CREDITOS
        - ANALISTA_COMERCIAL
      description: >
        ★ v0.28.0 — se agrega ANALISTA_COMERCIAL para gestión de promociones.

        ★ v0.29.0 — se agrega VENDEDOR_INSTITUCIONAL: rol distinto de
        VENDEDOR y de ANALISTA_COMERCIAL. Opera desde el Dashboard (no la
        app iOS), tiene salesperson_code propio (mismo esquema que
        VENDEDOR), puede tomar pedidos (POST /orders, mismo pipeline que la
        app de vendedores, sin campo de canal) y puede aplicar descuento por
        línea SIN el tope que en el futuro aplicará a VENDEDOR normal — ver
        OrderLine.line_discount_pct.

    # ═══════════════ ★ NUEVO v0.17.0 — PAGOS DE CARTERA Y CRÉDITOS ═══════════════
    ApprovalStatus:
      type: string
      enum: [PENDIENTE_APROBACION, APROBADO, RECHAZADO, ERROR_INTEGRACION, CANCELADO]
      description: >
        ★ v0.17.0 — Estado compartido por el flujo de aprobación de
        account-payments y credit-requests.
        ★ v0.17.1 — Se agrega ERROR_INTEGRACION: el aprobador ya aprobó, pero
        la escritura a SAP (IncomingPayments / CreditNotes) falló. Es un
        estado terminal-reintentable: no vuelve a PENDIENTE_APROBACION ni
        requiere nueva aprobación del usuario, solo reintentar la integración.
        ★ v0.21.0 — Se agrega CANCELADO: el VENDEDOR (no el aprobador) canceló
        su propio reporte por error de captura, ANTES de que nadie lo revisara
        (solo posible mientras el registro sigue PENDIENTE_APROBACION).
        Distinto de RECHAZADO a propósito — RECHAZADO significa que el
        aprobador SÍ revisó el registro y decidió no aprobarlo; CANCELADO
        significa que nunca llegó a revisión, el propio vendedor lo retiró.
        Mantener esta distinción es lo que preserva el rastro real de qué
        pasó con cada registro. CANCELADO es un estado terminal — no se
        puede transicionar desde ahí a ningún otro estado.

    SapIntegrationTaskStatus:
      type: string
      enum: [PENDIENTE, EN_PROCESO, INTEGRADO, ERROR]
      description: >
        ★ v0.18.0 — Estado de una tarea en la cola genérica de integración
        SAP (SapIntegrationTask). Independiente de ApprovalStatus: esta cola
        es sobre el PASO DE INTEGRACIÓN A SAP en sí (lo procesa el
        sincronizador local), no sobre la decisión de negocio de aprobar/
        rechazar (eso ya pasó antes de que exista la tarea).

    SapSyncResultReport:
      type: object
      description: >
        ★ v0.18.0. Body que el sincronizador envía al reportar el resultado
        de un intento de integración. Actualiza únicamente SapIntegrationTask.
      required: [status]
      properties:
        status:
          type: string
          enum: [INTEGRADO, ERROR]
          description: Resultado del intento — no se reporta PENDIENTE/EN_PROCESO aquí.
        sap_reference:
          type: string
          nullable: true
          description: Requerido si status=INTEGRADO (doc_num u otro id de SAP).
        error_detail:
          type: string
          nullable: true
          description: Requerido si status=ERROR.

    SapAccountPaymentSyncTask:
      type: object
      description: >
        ★ v0.18.0. Una tarea pendiente de integrar, con el AccountPayment
        completo embebido (payload "gordo" — el sincronizador no necesita
        una segunda consulta para armar IncomingPayments).
      properties:
        task_id: { type: integer }
        document_uuid: { type: string, format: uuid, description: "= payment_uuid" }
        status: { $ref: '#/components/schemas/SapIntegrationTaskStatus' }
        forced:
          type: boolean
          description: Informativo — no es un filtro del GET. Ver descripción del endpoint.
        attempts: { type: integer }
        error_detail: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        account_payment:
          type: object
          description: >
            Snapshot del AccountPayment ya APROBADO, con la imputación
            CONFIRMADA (no la propuesta) — lo que el sincronizador necesita
            para construir IncomingPayments.
          properties:
            payment_uuid: { type: string, format: uuid }
            client_code: { type: string }
            amount: { type: number, format: double }
            method: { $ref: '#/components/schemas/AccountPaymentMethod' }
            payment_channel:
              allOf:
                - $ref: '#/components/schemas/PaymentChannel'
              nullable: true
              description: "★ v0.19.1. Crudo, solo para auditoría/Remarks — el sincronizador usa resolved_account_code, no esto. ★ v0.49.1 nullable."
            transfer_bank_account:
              allOf:
                - $ref: '#/components/schemas/TransferBankAccount'
              nullable: true
              description: "★ v0.19.1. Crudo, solo para auditoría/Remarks — el sincronizador usa resolved_account_code, no esto. ★ v0.48.0 nullable."
            resolved_account_code:
              type: string
              nullable: true
              description: >
                ★ v0.19.1. Cuenta contable REAL de SAP, ya resuelta server-side
                por el middleware vía PaymentAccountMapping (method +
                payment_channel para EFECTIVO/CHEQUE, o method +
                transfer_bank_account para TRANSFERENCIA). El sincronizador la
                usa tal cual como CashAccount/CheckAccount/TransferAccount
                según method — nunca la resuelve ni la elige por su cuenta.
                Null si method=OTRO (fuera de esta integración, se maneja
                manual).
            check_number:
              type: string
              nullable: true
              description: "★ v0.19.0. Solo si method=CHEQUE."
            bank_code:
              type: string
              nullable: true
              description: "★ v0.19.0. Solo si method=CHEQUE."
            payment_date: { type: string, format: date }
            confirmed_applications:
              type: array
              description: La imputación final que confirmó el aprobador (no la propuesta del vendedor).
              items: { $ref: '#/components/schemas/InvoiceApplication' }
            unapplied_amount:
              type: number
              format: double
              description: Sobrante/faltante que quedó como pago a cuenta sin aplicar.
            decided_by: { type: string }
            decided_at: { type: string, format: date-time }

    SapCreditNoteLine:
      type: object
      description: >
        ★ NUEVO en v0.31.1. Una línea de la nota de crédito, ya RESUELTA por
        el middleware — el sincronizador la traduce a Service Layer sin
        decidir nada.

        Todo lo que aquí viene ya pasó por el aprobador o por la
        configuración del middleware. El sincronizador no consulta tablas de
        motivos ni deduce cuentas: si un campo no está acá, no debe
        inventarlo.
      properties:
        item_code: { type: string }
        quantity: { type: number, format: double }
        approved_amount:
          type: number
          format: double
          description: >
            El monto que el aprobador aprobó para esta línea — NO el que
            propuso el vendedor. Es lo que se acredita.
        account_code:
          type: string
          description: >
            Cuenta contable ya resuelta por motivo: **4200** (Sales Returns
            and Allowances) para DOESNT_WANT_IT, MISTAKE y SHORT; **4700**
            (Returns Damaged) para DAMAGED.

            ★ v0.32.0 — DAMAGED pasa de 6020 a 4700. La 6020 (Damaged
            Merchandise) es de tipo `at_Other`, y SAP EXIGE una cuenta de
            tipo INGRESO en las líneas de una nota de ítems: rechaza el
            documento con error -5002 ("choose sales-type revenue account
            [INV1.AcctCode]"). Un borrador SÍ acepta 6020 porque no corre la
            validación de determinación de cuentas — por eso el
            descubrimiento inicial dio un falso positivo.

            La 4700 la creó contabilidad para esto: `at_Revenues`, activa,
            nivel 3 bajo Net Sales (40), junto a las demás cuentas de ajuste
            de venta, y sin cuentas hijas (o sea imputable). Conserva la
            separación contable de las devoluciones dañadas y permite que el
            stock vuelva al almacén 07.

            El sincronizador la manda tal cual; se verificó que SAP no la
            pisa con la del artículo, ni siquiera cuando la línea va ligada
            a una factura.
        warehouse_code:
          type: string
          nullable: true
          description: >
            Almacén destino, ya resuelto por motivo: 01 para
            DOESNT_WANT_IT/MISTAKE (vuelve como stock vendible), 07 (DAMAGE)
            para DAMAGED (vuelve pero fuera del stock vendible).

            NULL en las líneas de una nota de SERVICIO, que no tocan
            inventario.

            El 07 no tiene ubicaciones activadas, así que sus líneas NO
            llevan asignaciones de bin — a diferencia del 01.
        reason:
          $ref: '#/components/schemas/CreditRequestReason'
          description: >
            ★ NUEVO en v0.32.0. El motivo de ESTA línea (no el de cabecera
            de la solicitud, que puede diferir cuando la solicitud mezcla
            motivos).

            ⚠️ ES SOLO PARA VERIFICAR, NUNCA PARA DECIDIR. El sincronizador
            NO deriva de acá la cuenta ni el almacén — esos vienen ya
            resueltos en `account_code` y `warehouse_code`. Lo único que
            hace con este campo es comprobar coherencia y NEGARSE A POSTEAR
            si no cuadra.

            Existe porque sin él la regla "un documento SERVICE solo lleva
            líneas SHORT" no es verificable desde el sincronizador: cuando
            le llega la tarea el split ya está hecho. Y el error sería
            CONSISTENTE — si el middleware metiera una línea DAMAGED en un
            documento SERVICE, también le resolvería 4200 sin almacén,
            porque resuelve todo del mismo motivo mal leído. Sin `reason`
            no hay contradicción que detectar.

            Coherencia esperada: en un documento ITEMS las líneas son
            DOESNT_WANT_IT, MISTAKE o DAMAGED; en uno SERVICE, solo SHORT.
        base_line:
          type: integer
          nullable: true
          description: >
            El `line_num` de la línea de la FACTURA original contra la que
            va este crédito. Viaja a Service Layer como `BaseLine`, junto
            con `BaseType 13` y el `BaseEntry` que el sincronizador resuelve
            localmente desde `invoice_doc_num`.

            Lo ELIGIÓ EL APROBADOR, línea por línea. No se deduce ni se
            recalcula: el mismo `item_code` puede aparecer repetido en la
            factura (el esquema de promociones escribe los ítems descontados
            en línea aparte), así que cualquier intento de inferirlo
            fallaría de forma rutinaria.

            Empieza en 0, tal como lo tiene SAP. No reindexar.

            NULL cuando la solicitud no trae factura: la nota va
            independiente.

            ⚠️ v0.32.1 — AUNQUE VENGA CON VALOR, EL SINCRONIZADOR NO LIGA
            SI LA FACTURA ESTÁ PAGADA. SAP rechaza el documento con -5002
            ("One of the base documents has already been closed") cuando la
            factura base está en `bost_Close`.

            Y "cerrada" significa PAGADA, no "sin cantidad disponible": una
            factura saldada tiene sus líneas en `bost_Open` con
            `RemainingOpenQuantity` intacta, y SAP igual la rechaza porque
            mira la CABECERA.

            REGLA: el sincronizador consulta el estado de la factura antes
            de armar el payload. Si está abierta, liga
            (`BaseType 13` + `BaseEntry` + `BaseLine`). Si está pagada, arma
            la línea COMPLETA —`ItemCode`, precio y almacén explícitos— sin
            vínculo, y registra el `invoice_doc_num` en `Comments` junto al
            `request_uuid` para no perder el rastro.

            El resultado contable y el movimiento de inventario son
            idénticos; lo único que se pierde es el enlace formal en SAP, y
            es el mismo mecanismo de trazabilidad que el negocio ya usa hoy
            en sus notas de servicio, que referencian la factura en prosa.

            POR QUÉ AUTOMÁTICO y no rechazando para revisión humana: las
            devoluciones de cartera vieja son justamente las que llegan
            DESPUÉS del pago. Trabar cada crédito sobre una factura saldada
            bloquearía el caso más común de todos.

    SapCreditRequestSyncTask:
      type: object
      description: >
        ★ v0.31.1 — el snapshot pasa a traer la DECISIÓN del aprobador, no
        la propuesta del vendedor, y a identificar cuál de los dos posibles
        documentos es esta tarea.

        ★ v0.18.0. Igual que SapAccountPaymentSyncTask, para créditos.
      properties:
        task_id: { type: integer }
        document_uuid: { type: string, format: uuid, description: "= request_uuid" }
        doc_kind:
          type: string
          enum: [ITEMS, SERVICE]
          description: >
            ★ NUEVO en v0.31.1. Qué documento debe crear ESTA tarea.

            Una solicitud puede generar dos: una nota de ÍTEMS con las
            líneas DOESNT_WANT_IT/MISTAKE/DAMAGED, y una de SERVICIO con las
            SHORT. Un documento de SAP es de un tipo o del otro, nunca
            mixto.

            Sin este campo las dos tareas de una misma solicitud serían
            indistinguibles: comparten `document_uuid` y todo lo demás.

            Cada una se integra y se reintenta por separado. Si una tiene
            éxito y la otra falla, la que pasó queda hecha.
        status: { $ref: '#/components/schemas/SapIntegrationTaskStatus' }
        forced: { type: boolean }
        attempts: { type: integer }
        sap_reference:
          type: string
          nullable: true
          description: >
            ★ NUEVO en v0.32.0. El identificador que el sincronizador
            reportó al integrar — el DocNum de la nota de crédito en SAP.
            NULL mientras no se haya integrado.

            El campo ya existía del lado del middleware; simplemente no se
            devolvía. Sin él, el sincronizador reporta un número y no puede
            comprobar que aterrizó: solo sabe que su llamada no dio error.
            Mismo principio que se aplica en todo el proyecto — que quien
            escribe pueda verificar lo que quedó.
        error_detail:
          type: string
          nullable: true
          description: >
            Motivo del último intento FALLIDO.

            ★ v0.32.0 — NO se limpia al reintentar. Persiste como "el error
            del último intento que falló", así que una tarea en PENDIENTE
            con `attempts > 0` y este campo poblado cuenta la historia
            completa: falló antes, se va a reintentar, y esto fue lo que
            pasó.

            Limpiarlo al reintentar borraba justamente lo que hace falta
            para entender por qué la tarea está donde está — quedaba una
            tarea con `attempts: 1` y ningún rastro del porqué.
        created_at: { type: string, format: date-time }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        credit_request:
          type: object
          description: >
            Snapshot del CreditRequest ya APROBADO, filtrado a las líneas que
            corresponden al `doc_kind` de esta tarea.

            ★ v0.31.1 — `lines` pasa a ser SapCreditNoteLine (la decisión
            resuelta) en vez de CreditRequestLine (la propuesta del
            vendedor). El sincronizador no necesita consultar el motivo para
            nada: cuenta, almacén, monto y línea base vienen resueltos.

            La modalidad NO es un campo propio — se infiere igual que en el
            resto del contrato: `lines` presente + `manual_amount` null =
            CON_ITEMS; `manual_amount` presente + `lines` null = SIN_ITEMS.
          properties:
            request_uuid: { type: string, format: uuid }
            client_code: { type: string }
            reason: { $ref: '#/components/schemas/CreditRequestReason' }
            invoice_doc_num: { type: string, nullable: true }
            manual_amount: { type: number, format: double, nullable: true }
            calculated_amount: { type: number, format: double }
            gl_account_code:
              type: string
              nullable: true
              description: >
                Resuelto al aprobar (SIN_ITEMS). En CON_ITEMS es NULL: la
                cuenta va por línea en `account_code`, porque desde v0.31.0
                puede diferir entre líneas de una misma nota (DAMAGED usa
                4700 mientras el resto usa 4200).

                ★ v0.32.0 — CÓMO CONSTRUIR LA NOTA EN LA MODALIDAD
                SIN_ITEMS, que hasta ahora no estaba definida:

                Nota de SERVICIO (`dDocument_Service`) con UNA SOLA línea:

                  · `AccountCode` = este `gl_account_code`
                  · `UnitPrice` = `manual_amount`, con `Quantity` = 1.
                    OJO: en una línea de servicio la cantidad NO
                    MULTIPLICA — el LineTotal es el precio. Poner la
                    cantidad real acreditaría de menos.
                  · `ItemDescription` = nombre del cliente + motivo
                  · SIN ligar a factura, aunque la solicitud traiga
                    `invoice_doc_num`: una línea de servicio no se puede
                    ligar.
            lines:
              type: array
              nullable: true
              description: >
                Solo las líneas que corresponden al `doc_kind` de esta
                tarea, ya resueltas.
              items: { $ref: '#/components/schemas/SapCreditNoteLine' }
            decided_by: { type: string }
            decided_at: { type: string, format: date-time }

    SapOrderInvoiceSyncTask:
      type: object
      description: >
        ★ v0.22.0. Igual patrón que SapAccountPaymentSyncTask/
        SapCreditRequestSyncTask, pero sin decided_by/decided_at — no hay
        aprobador de negocio aquí, la tarea se encola automáticamente
        cuando el camión llega a ALISTADO. El snapshot trae ya resueltas
        las cantidades reales (de PalletAssignment, NO de OrderLine.Quantity)
        y el precio congelado de cada línea (de OrderLine — el WMS nunca
        revalida el precio, SAP debe obedecerlo tal cual).
      properties:
        task_id: { type: integer }
        document_uuid: { type: string, format: uuid, description: "= Order.ClientUuid (OrderUuid)" }
        status: { $ref: '#/components/schemas/SapIntegrationTaskStatus' }
        forced: { type: boolean }
        attempts: { type: integer }
        error_detail: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        order_invoice:
          type: object
          description: >
            Snapshot de la orden ya lista para facturar (camión en
            ALISTADO). Documento STANDALONE — no referencia ninguna Orden
            de Venta base en SAP (no existe tal documento para estas
            transacciones).
          properties:
            order_uuid: { type: string, format: uuid }
            client_code: { type: string }
            truck_id: { type: string, format: uuid }
            invoice_date:
              type: string
              format: date
              description: >
                Fecha del momento en que el camión llegó a ALISTADO
                (Truck.AlistadoAtUtc), expresada como **día calendario de
                Nueva York**.

                ⚠️ v0.35.0 — NO es el día UTC de ese instante. Viaja a SAP
                como DocDate, y SAP RECHAZA con -5002 ("enter posting date
                that is equal to or earlier than system date") cualquier
                fecha posterior a su fecha de sistema.

                Como el día UTC empieza a las 20:00 de Nueva York, calcularlo
                en UTC hace que toda facturación entre las 20:00 y la
                medianoche mande el día siguiente y SAP la rechace. Medido:
                dos tareas en ERROR con 3 intentos, enviadas de noche,
                mientras que las siete facturas de una corrida matutina
                pasaron sin problema.

                Es el mismo cálculo que la vigencia de promociones, y por la
                misma razón: el calendario que importa es el del negocio, no
                el del reloj del servidor.

                LA MISMA REGLA VALE PARA TODA FECHA QUE TERMINE EN UN
                DOCUMENTO DE SAP — pagos y notas de crédito incluidos.
            lines:
              type: array
              description: >
                ★ v0.37.1 — UNA ENTRADA POR LÍNEA DEL PEDIDO, NO POR ÍTEM.

                `item_code` PUEDE REPETIRSE entre entradas: el mismo producto
                con condiciones distintas son líneas distintas (el bloque de
                promoción manda condición y beneficio del mismo ítem, y
                v0.37.0 lo permite también para líneas normales). El
                sincronizador NO debe agrupar por `item_code` en ningún punto
                del camino — agruparlo fusiona dos líneas y cobra las dos al
                precio y el descuento de una sola.

                EL ORDEN DEL ARRAY ES EL ORDEN DE LAS LÍNEAS DEL PEDIDO, y el
                índice de cada entrada es el `BaseLineNumber` de la línea de
                la factura y de sus asignaciones de bin.

                Solo incluye líneas con cantidad repartida > 0 (de
                PalletAssignment). Una línea que quedó en faltante total no
                aparece — por eso el índice es el número de línea de la
                FACTURA, no el del pedido.
              items:
                type: object
                properties:
                  item_code: { type: string }
                  quantity:
                    type: number
                    format: double
                    description: >
                      ★ v0.37.1 — cantidad repartida asignada a ESTA LÍNEA, ya
                      no la suma del ítem.

                      PalletAssignment es por (orden, ítem), así que lo
                      repartido de un ítem se asigna a sus líneas POR ORDEN DE
                      LÍNEA: se llena cada una hasta su OrderLine.Quantity
                      antes de pasar a la siguiente. Sin faltante cada línea
                      recibe exactamente lo pedido; con faltante el recorte
                      cae en las últimas líneas de ese ítem.

                      Sigue sin ser OrderLine.Quantity: es lo REPARTIDO, que
                      con faltante es menor.
                  unit_price:
                    type: number
                    format: double
                    description: >
                      OrderLine.UnitPrice congelado al tomar el pedido.
                      Puede ser 0 (promoción legítima) — no es un error.
                  discount_pct:
                    type: number
                    format: double
                    nullable: true
                    description: >
                      OrderLine.LineDiscountPct. Puede ser 100 (promoción
                      legítima). NULL se interpreta como 0.00 en el builder
                      del snapshot (tarea 19).

                      Nota de contexto (v0.29.0, no verificable desde este
                      dato — no existe campo de origen/canal en el modelo,
                      por diseño): el carrito del Dashboard (rol
                      VENDEDOR_INSTITUCIONAL) nunca envía null en
                      OrderLine.line_discount_pct (ver nota en ese campo) —
                      hereda el valor sin transformación. Esto reduce, pero
                      no elimina desde el propio dato, la ambigüedad de un
                      0.00 en filas creadas por ese rol.
                  expected_line_total:
                    type: number
                    format: double
                    description: >
                      ★ v0.25.0. quantity × unit_price × (1 - discount_pct/100),
                      SIN redondear antes de multiplicar por quantity — misma
                      fórmula exacta que usa SAP para su propio LineTotal
                      (verificado con datos reales: SAP no redondea el precio
                      con descuento antes de multiplicar). El sincronizador
                      compara esto contra el DocTotal/LineTotal real que
                      devuelva SAP tras crear la factura — si no coincide,
                      repórtalo como advertencia, nunca lo fuerces a cuadrar
                      ni lo trates como error bloqueante.
                  bin_allocations:
                    type: array
                    description: >
                      ★ v0.26.0. Cómo repartir "quantity" entre los bins reales
                      de SAP para esta línea — necesario para
                      DocumentLinesBinAllocations cuando el almacén exige
                      asignación explícita (AutoAllocOnIssue=whsBinSingleChoiceOnly
                      y el ítem tiene más de un bin). Calculado y persistido
                      UNA SOLA VEZ al encolar la tarea (dentro de la misma
                      transacción atómica que crea todas las tareas del
                      camión), nunca recalculado en este GET — evita
                      divergencias entre consultas y que dos tareas "gasten"
                      el mismo bin. Si el ítem salió de un solo bin para este
                      camión, hay una sola fila con approximate=false (hecho
                      directo de TruckPickingCollection, no un cálculo). Si
                      salió de más de uno, hay varias filas repartidas
                      determinísticamente (fill-first) y approximate=true en
                      todas — el Wave Picking recoge por camión, no por
                      orden, así que a nivel de línea individual esto es una
                      atribución razonada, no un hecho; a nivel de TODO el
                      camión, la suma sí cuadra exacto contra lo recogido por
                      bin. El sincronizador arma DocumentLinesBinAllocations
                      con esto tal cual, sin recalcular nada de su lado.

                      ★ v0.37.1 — si un ítem va en varias líneas, sus filas de
                      bin se reparten entre esas líneas siguiendo el mismo
                      orden de línea que la cantidad. `approximate` no cambia
                      de significado: habla del BIN de origen, no de la línea.
                      Un ítem que salió de un solo bin sigue en
                      `approximate=false` aunque su cantidad se divida entre
                      dos líneas.
                    items:
                      type: object
                      properties:
                        bin_code: { type: string }
                        quantity: { type: number, format: double }
                        approximate:
                          type: boolean
                          description: >
                            false = hecho directo (un solo bin para este
                            ítem+camión). true = repartido determinísticamente
                            entre varios bins — exacto en el agregado del
                            camión, aproximado por línea individual.
            invoice_discount_pct:
              type: number
              format: double
              nullable: true
              description: >
                ★ NUEVO en v0.37.0. Descuento de documento del pedido, para
                que la factura salga con él. Null si no hubo.

                Sin esto la factura saldría por el monto sin descontar: la
                orden diría un total y SAP otro.
            freight_amount:
              type: number
              format: double
              nullable: true
              description: >
                ★ NUEVO en v0.37.0. Flete del pedido, para que la factura lo
                cobre. Null si no hubo.

                SAP lo modela como gasto adicional del documento, con su
                propio código y cuenta. El sincronizador resuelve esa
                correspondencia; el contrato solo transporta el monto.
            expected_doc_total:
              type: number
              format: double
              description: >
                ★ v0.25.0. Es lo único que le da al sincronizador algo contra
                qué comparar el DocTotal real que devuelva SAP — sin esto no
                hay forma de detectar una divergencia real (ej. un descuento
                fraccionario, donde el redondeo de SAP puede diferir en
                centavos).

                ★ v0.37.0 — YA NO es la simple suma de los
                expected_line_total: incluye el descuento de documento y el
                flete, en el mismo orden que define OrderCreate (líneas con
                su descuento → descuento de documento sobre el subtotal →
                flete sumado sin descontar).

                Es el total que el sincronizador espera que SAP le devuelva.

    # ★ v0.28.0 — PROMOCIONES
    PromotionType:
      type: string
      enum: [FREE_ITEMS, DISCOUNTED_ITEMS]
      description: >
        FREE_ITEMS: los ítems de beneficio son gratis (discount_pct=100).
        DISCOUNTED_ITEMS: los ítems de beneficio tienen un descuento
        definido por el analista, diferente por ítem.

    PromotionStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    PromotionConditionItem:
      type: object
      description: >
        Ítem que el cliente debe comprar a precio completo para activar
        la promoción. La cantidad mínima (min_quantity) es la suma total
        de TODOS los ConditionItems que debe estar en el carrito para
        que la promoción sea aplicable.
      properties:
        item_code: { type: string }
        min_quantity:
          type: number
          format: double
          description: Cantidad mínima requerida de este ítem a precio completo.

    PromotionBenefitItem:
      type: object
      description: >
        Ítem que se entrega gratis (discount_pct=100 si FREE_ITEMS) o
        con descuento (discount_pct definido por el analista si
        DISCOUNTED_ITEMS).
      properties:
        item_code: { type: string }
        quantity:
          type: number
          format: double
        discount_pct:
          type: number
          format: double
          description: >
            100.0 si el tipo de promoción es FREE_ITEMS.
            Valor entre 0 y 100 definido por el analista si DISCOUNTED_ITEMS.

    PromotionSummary:
      type: object
      description: Vista resumida para listas y grillas.
      properties:
        promotion_id: { type: string, format: uuid }
        title: { type: string }
        type: { $ref: '#/components/schemas/PromotionType' }
        status: { $ref: '#/components/schemas/PromotionStatus' }
        valid_from: { type: string, format: date, nullable: true }
        valid_to: { type: string, format: date, nullable: true }

    PromotionDetail:
      type: object
      description: Vista completa de una promoción, incluyendo sus ítems.
      properties:
        promotion_id: { type: string, format: uuid }
        title: { type: string }
        type: { $ref: '#/components/schemas/PromotionType' }
        status: { $ref: '#/components/schemas/PromotionStatus' }
        valid_from: { type: string, format: date, nullable: true }
        valid_to: { type: string, format: date, nullable: true }
        condition_items:
          type: array
          description: >
            Ítems a precio completo que activan la promoción. La suma
            de sus cantidades define las condiciones mínimas para que
            el vendedor pueda agregar el bloque de beneficios al carrito.
          items: { $ref: '#/components/schemas/PromotionConditionItem' }
        benefit_items:
          type: array
          description: Ítems que se agregan con descuento o gratis.
          items: { $ref: '#/components/schemas/PromotionBenefitItem' }
        salesperson_codes:
          type: array
          description: Vendedores que pueden usar esta promoción.
          items: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    PromotionCreate:
      type: object
      required: [title, type, condition_items, benefit_items, salesperson_codes]
      properties:
        title: { type: string }
        type: { $ref: '#/components/schemas/PromotionType' }
        valid_from: { type: string, format: date, nullable: true }
        valid_to: { type: string, format: date, nullable: true }
        condition_items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PromotionConditionItem' }
        benefit_items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PromotionBenefitItem' }
        salesperson_codes:
          type: array
          minItems: 1
          description: Al menos un vendedor debe estar asignado.
          items: { type: string }

    TruckInvoiceReadiness:

      type: object
      description: >
        ★ v0.27.0. Resultado del chequeo de reconciliación de un camión
        en ALISTADO. Cada consulta persiste checked_at/is_clean en el
        propio camión — es lo que POST .../send-to-invoicing exige.
      properties:
        truck_id: { type: string, format: uuid }
        checked_at: { type: string, format: date-time }
        is_clean:
          type: boolean
          description: true si NINGÚN ítem tiene discrepancy > 0.
        items:
          type: array
          items:
            type: object
            properties:
              item_code: { type: string }
              demanded:
                type: number
                format: double
                description: SUM(PalletAssignment.Quantity) de todas las órdenes APROBADA del camión para este ítem.
              available:
                type: number
                format: double
                description: Stock real en almacén 01 (vw_WMS_Stock) al momento del chequeo.
              discrepancy:
                type: number
                format: double
                description: max(0, demanded - available). 0 = sin problema para este ítem.
              orders_with_this_item:
                type: array
                description: Qué órdenes tienen este ítem — para que el jefe de bodega elija cuál reducir si hay discrepancia.
                items:
                  type: object
                  properties:
                    order_uuid: { type: string, format: uuid }
                    quantity: { type: number, format: double }

    PalletAssignmentAdjustment:
      type: object
      description: ★ v0.27.0. Registro de una reducción dirigida — el rastro de auditoría que exigió Camilo.
      properties:
        order_uuid: { type: string, format: uuid }
        item_code: { type: string }
        previous_quantity: { type: number, format: double }
        new_quantity: { type: number, format: double }
        reason: { type: string }
        adjusted_by: { type: string }
        adjusted_at: { type: string, format: date-time }

    AccountPaymentMethod:
      type: string
      enum: [EFECTIVO, CHEQUE, TRANSFERENCIA, OTRO]
      description: ★ v0.17.0 — Cómo pagó el cliente al vendedor (distinto de PaymentType del driver).

    PaymentChannel:
      type: string
      enum: [OFICINA, VENDEDOR]
      description: >
        ★ v0.19.1 (corregido — v0.19.0 decía "transversal a EFECTIVO/CHEQUE/
        TRANSFERENCIA", eso estaba mal). Aplica ÚNICAMENTE a EFECTIVO y
        CHEQUE. NO aplica a TRANSFERENCIA (ver TransferBankAccount) ni a OTRO.
        Junto con AccountPaymentMethod, resuelve la cuenta contable real en
        SAP vía PaymentAccountMapping (mismo principio que CreditReasonGLAccount
        — nadie elige el número de cuenta a mano).

        Quién lo provee depende del ROL de quien hace el POST:
        - Si el caller está autenticado como VENDEDOR (la app de vendedores):
          este campo NO se envía — el servidor fija VENDEDOR automáticamente
          para EFECTIVO/CHEQUE. La app no muestra ni conoce este concepto.
        - Si el caller está autenticado como ADMIN (Dashboard): el campo es
          OBLIGATORIO para EFECTIVO/CHEQUE — el usuario de oficina elige
          Oficina o Vendedor explícitamente (por defecto Oficina en la UI,
          pero puede cambiarlo).
        Debe ser null si method ∈ {TRANSFERENCIA, OTRO}, para cualquier caller.

    TransferBankAccount:
      type: string
      enum: [CHASE_9280, CHASE_7815]
      description: >
        ★ v0.19.1. Aplica ÚNICAMENTE a TRANSFERENCIA — NO usa el concepto de
        PaymentChannel (Oficina/Vendedor no aplica aquí). Lo elige
        directamente quien reporta el pago (vendedor O admin, cualquiera de
        los dos), indicando a cuál de las dos cuentas bancarias llegó la
        transferencia. Resuelve la cuenta real vía PaymentAccountMapping,
        igual mecanismo que PaymentChannel pero sin la indirección
        Oficina/Vendedor. OBLIGATORIO si method = TRANSFERENCIA. Debe ser
        null para cualquier otro method.

    EvidencePhotoUpload:
      type: object
      required: [image_base64]
      properties:
        image_base64:
          type: string
          description: Imagen en base64 (JPEG/PNG). Se guarda a disco igual que retornos (4B).
        client_code:
          type: string
          nullable: true
          description: Opcional, solo para organizar la ruta de almacenamiento.

    EvidencePhotoUploaded:
      type: object
      properties:
        evidence_image_url:
          type: string
          description: >
            Ruta relativa a usar tal cual en evidence_image_url de
            account-payments/credit-requests. Es la misma ruta que sirve
            GET /evidence-photos/{id} (p. ej. "/evidence-photos/3fa85f64-...") —
            no es una URL externa ni absoluta.

    InvoiceApplication:
      type: object
      description: >
        Cuánto de un pago de cartera se aplica a UNA factura.

        Un solo schema para las PROPUESTAS y las CONFIRMADAS. En las
        propuestas `amount` nunca es null; en las confirmadas puede serlo
        (ver el campo).
      required: [invoice_doc_num, amount]
      properties:
        invoice_doc_num: { type: string, description: "DocNum de la factura (de vw_CxC)." }
        amount:
          type: number
          format: double
          nullable: true
          description: >
            ★ v0.49.1 — NULLABLE en las imputaciones CONFIRMADAS, y la
            diferencia con 0 es la que importa al conciliar:

              · `0`    — el aprobador MIRÓ esta factura y decidió no
                         aplicarle nada. Es una decisión documentada.
              · `null` — todavía no se confirmó. Nadie decidió nada.

            Antes las confirmadas salían con `?? 0`, así que una imputación
            jamás revisada se leía igual que una revisada y descartada —
            exactamente lo que alguien intenta reconstruir cuando un pago no
            cuadra. Es el mismo patrón que el bug del precio: una ausencia
            convertida en un número que se lee como afirmación.

            En las PROPUESTAS nunca es null. Declararlo nullable ahí no
            rompe a nadie; es la dirección segura.

    AccountPaymentCreate:
      type: object
      required: [payment_uuid, client_code, amount, method, payment_date]
      properties:
        payment_uuid:
          type: string
          format: uuid
          description: Identidad del pago, generada por la app. Hace el POST idempotente.
        client_code: { type: string }
        salesperson_code:
          type: string
          nullable: true
          description: >
            ★ v0.19.1. Si el caller es VENDEDOR: se IGNORA cualquier valor
            enviado — el servidor usa el código del propio vendedor
            autenticado. Si el caller es ADMIN (Dashboard): OBLIGATORIO,
            el usuario de oficina elige a qué vendedor atribuir el pago.
        amount: { type: number, format: double, minimum: 0.01 }
        method: { $ref: '#/components/schemas/AccountPaymentMethod' }
        payment_channel:
          allOf:
            - $ref: '#/components/schemas/PaymentChannel'
          nullable: true
          description: >
            ★ v0.19.1. Ver PaymentChannel — solo EFECTIVO/CHEQUE, condicionado
            por rol del caller (ver ahí el detalle completo). Null si
            method ∈ {TRANSFERENCIA, OTRO}. ★ v0.49.1 — declarado nullable de
            verdad: antes el `$ref` con hermanos dejaba la nulabilidad sin
            expresar.
        transfer_bank_account:
          allOf:
            - $ref: '#/components/schemas/TransferBankAccount'
          nullable: true
          description: >
            ★ v0.19.1. OBLIGATORIO si method = TRANSFERENCIA (cualquier
            caller, vendedor o admin). Null para cualquier otro method.

            ★ v0.48.0 — declarado nullable de verdad: antes el `$ref` con
            hermanos dejaba la nulabilidad sin expresar.
        check_number:
          type: string
          nullable: true
          description: >
            ★ v0.19.0. OBLIGATORIO si method = CHEQUE (número de cheque, SAP
            CheckNumber). Debe ser null para cualquier otro method.
        bank_code:
          type: string
          nullable: true
          description: >
            ★ v0.19.0. OBLIGATORIO si method = CHEQUE (código de banco, SAP
            BankCode). Debe ser null para cualquier otro method.
        payment_date: { type: string, format: date }
        comments: { type: string, nullable: true }
        evidence_image_url:
          type: string
          nullable: true
          description: >
            ★ v0.17.7 — OPCIONAL (antes obligatoria en v0.17.2-v0.17.6). Si se
            adjunta, debe venir de POST /evidence-photos primero.
        proposed_applications:
          type: array
          description: >
            Imputación PROPUESTA por el vendedor o por el usuario de oficina
            (opcional). El aprobador puede confirmarla tal cual o reemplazarla.
          items: { $ref: '#/components/schemas/InvoiceApplication' }

    AccountPaymentAccepted:
      type: object
      properties:
        payment_uuid: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        received_at: { type: string, format: date-time }

    PendingAccountPayment:
      type: object
      description: Un pago de cartera en la bandeja, con contexto del cliente.
      properties:
        payment_uuid: { type: string, format: uuid }
        client_code: { type: string }
        client_name: { type: string }
        salesperson_code: { type: string }
        amount: { type: number, format: double }
        method: { $ref: '#/components/schemas/AccountPaymentMethod' }
        payment_channel:
          allOf:
            - $ref: '#/components/schemas/PaymentChannel'
          nullable: true
          description: ★ v0.49.1 — NULL cuando el método no es EFECTIVO ni CHEQUE.
        transfer_bank_account:
          allOf:
            - $ref: '#/components/schemas/TransferBankAccount'
          nullable: true
          description: ★ v0.48.0 — NULL cuando el pago no fue por transferencia.
        check_number: { type: string, nullable: true }
        bank_code: { type: string, nullable: true }
        payment_date: { type: string, format: date }
        comments: { type: string, nullable: true }
        evidence_image_url: { type: string, nullable: true }
        proposed_applications:
          type: array
          items: { $ref: '#/components/schemas/InvoiceApplication' }
        client_statement:
          $ref: '#/components/schemas/ClientStatement'
          description: Contexto completo para decidir sin salir de la bandeja.
        received_at: { type: string, format: date-time }

    AccountPaymentApproval:
      type: object
      required: [applications]
      properties:
        applications:
          type: array
          description: >
            Imputación FINAL (confirmada o modificada). Si la suma es MENOR
            al amount del pago, el sobrante queda como pago a cuenta sin
            aplicar (no bloquea).
          items: { $ref: '#/components/schemas/InvoiceApplication' }
        note: { type: string, nullable: true }

    AccountPaymentDetail:
      type: object
      properties:
        payment_uuid: { type: string, format: uuid }
        client_code: { type: string }
        client_name: { type: string }
        amount: { type: number, format: double }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        final_applications:
          type: array
          items: { $ref: '#/components/schemas/InvoiceApplication' }
        unapplied_amount:
          type: number
          format: double
          description: Sobrante sin aplicar a ninguna factura (pago a cuenta).
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        decision_note: { type: string, nullable: true }
        sap_incoming_payment_doc_num:
          type: string
          nullable: true
          description: DocNum en SAP tras integrar (NULL hasta aprobar).

    CreditRequestReason:
      type: string
      enum: [DAMAGED, DOESNT_WANT_IT, MISTAKE, SHORT]

    CreditRequestLine:
      type: object
      description: >
        Solo para la modalidad CON ítems.

        El mismo `item_code` PUEDE aparecer en más de una línea: la factura
        original puede tenerlo repetido (el esquema de promociones escribe
        los ítems descontados en línea aparte), y el cliente puede devolver
        de ambas. Por eso las líneas se identifican por `line_id` en el
        detalle, nunca por `item_code`.
      required: [item_code, quantity, reason]
      properties:
        item_code: { type: string }
        quantity: { type: number, format: double }
        reason: { $ref: '#/components/schemas/CreditRequestReason' }
        proposed_amount:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.31.0. Monto que el vendedor PROPONE acreditar por
            esta línea, para créditos parciales (acreditar el 20% de una
            línea, no la línea entera — es común).

            Si se omite, el servidor calcula `quantity` × el último precio
            facturado al cliente para ese ítem, que es el comportamiento
            anterior. Los clientes que no lo envíen siguen funcionando
            igual.

            El aprobador puede AJUSTARLO al aprobar (ver
            `line_allocations` en el endpoint de aprobación). Lo que se
            manda a SAP es el monto aprobado, no el propuesto.

    CreditRequestCreate:
      type: object
      required: [request_uuid, client_code, reason]
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Identidad de la solicitud, generada por la app. Hace el POST idempotente.
        client_code: { type: string }
        source_return_id:
          type: string
          format: uuid
          nullable: true
          description: >
            ★ NUEVO en v0.33.0. La devolución de ruta (ProductReturn) de la
            que nació esta solicitud, cuando se creó precargándola desde
            una.

            NULL cuando la solicitud nace de otro lado — el vendedor desde
            la app, o la oficina sin una devolución detrás (por ejemplo un
            SHORT, que nunca viene de ruta).

            POR QUÉ EXISTE: sin él, crear dos créditos desde la misma
            devolución sería invisible — cada uno se vería perfectamente
            válido, y serían dos créditos por la misma mercancía. Con él,
            la devolución expone su `credit_request_uuid` y el Dashboard
            puede mostrar cuáles ya se procesaron.
        invoice_doc_num:
          type: string
          nullable: true
          description: >
            OPCIONAL. Factura sobre la que aplica el ajuste, si aplica a una
            específica. Un crédito general del cliente puede omitirla.

            ★ v0.33.0 — al precargar desde una devolución, `client_reference`
            del ProductReturn es una PISTA (la referencia que dio el
            cliente: factura, remisión) pero es TEXTO LIBRE. Sirve para que
            la persona busque la factura, no como valor de este campo.
        reason: { $ref: '#/components/schemas/CreditRequestReason' }
        lines:
          type: array
          nullable: true
          description: >
            CON ítems: monto se calcula de estas líneas. Si se omite, es la
            modalidad SIN ítems y `manual_amount` es requerido.

            ★ v0.45.2 — `lines: null` ES LO MISMO QUE OMITIRLO. Un cliente
            que manda el campo explícitamente en null está diciendo lo
            mismo, y el servidor lo trata igual. Se dice porque "omitir" y
            "mandar null" son dos lecturas razonables de la misma frase, y
            la diferencia entre ellas sería un 400 imposible de explicar.

            ⚠️ `lines: []` NO es la modalidad sin ítems: es una solicitud
            con ítems y ninguno → 400.
          items: { $ref: '#/components/schemas/CreditRequestLine' }
        manual_amount:
          type: number
          format: double
          nullable: true
          description: Requerido si `lines` se omite (modalidad sin ítems).
        comments: { type: string, nullable: true }
        evidence_image_url: { type: string, nullable: true }

    CreditRequestAccepted:
      type: object
      properties:
        request_uuid: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        received_at: { type: string, format: date-time }

    PendingCreditRequest:
      type: object
      description: >
        Una solicitud de crédito en la bandeja, con contexto del cliente.

        ★ v0.31.2 — `lines` pasa a ser CreditRequestDetailLine, que trae
        `line_id`. Antes eran CreditRequestLine (la propuesta cruda del
        vendedor, sin identificador), y eso hacía IMPOSIBLE aprobar: el
        aprobador necesita `line_id` para armar `line_allocations`, y el
        único schema que lo traía —CreditRequestDetail— solo se devolvía
        COMO RESULTADO de aprobar, rechazar o cancelar. Para aprobar hacía
        falta un dato que solo llegaba después de aprobar.

        Se resolvió acá y no agregando `line_id` a CreditRequestLine, porque
        ese schema es lo que la app de vendedores ENVÍA al crear: llevarlo
        ahí sugeriría que el vendedor asigna el identificador, cuando lo
        asigna el servidor.
      properties:
        request_uuid: { type: string, format: uuid }
        client_code: { type: string }
        client_name: { type: string }
        salesperson_code: { type: string }
        invoice_doc_num: { type: string, nullable: true }
        reason: { $ref: '#/components/schemas/CreditRequestReason' }
        lines:
          type: array
          nullable: true
          description: >
            ★ v0.31.2 — con `line_id`, `unit_price` y `proposed_amount`. El
            aprobador tiene todo lo que necesita para decidir sin una
            segunda llamada.
          items: { $ref: '#/components/schemas/CreditRequestDetailLine' }
        manual_amount: { type: number, format: double, nullable: true }
        calculated_amount:
          type: number
          format: double
          description: >
            Monto final: la suma de `proposed_amount` de las líneas, o
            `manual_amount` en la modalidad SIN ítems.

            ★ v0.31.2 — antes sumaba el total de línea completo. Ahora suma
            lo PROPUESTO, que puede ser menor cuando el vendedor pide un
            crédito parcial. Es el monto que el aprobador ve al abrir la
            bandeja, antes de sus propios ajustes.
        comments: { type: string, nullable: true }
        evidence_image_url: { type: string, nullable: true }
        client_statement:
          $ref: '#/components/schemas/ClientStatement'
          description: >
            ★ v0.17.6. Mismo enriquecimiento que PendingAccountPayment —
            contexto completo del cliente para decidir sin salir de la bandeja.
        received_at: { type: string, format: date-time }
        created_by:
          type: string
          nullable: true
          description: >
            ★ NUEVO en v0.39.0. Quién CARGÓ la solicitud, que puede no ser el
            vendedor al que pertenece: desde v0.33.2 la puede cargar un ADMIN
            o un APROBADOR_CREDITOS por cuenta de él.

            Está acá porque el aprobador decide DESDE LA BANDEJA, y un
            aprobador aprobando algo que él mismo cargó es un dato de
            control, no un detalle de auditoría posterior. NULL en solicitudes
            anteriores a v0.33.2.
        source_return_id:
          type: string
          format: uuid
          nullable: true
          description: >
            ★ NUEVO en v0.39.0. La devolución de ruta de la que nació la
            solicitud, si nació de una.

            Es PROCEDENCIA y cambia cuánto hay que verificar antes de
            aprobar: si viene de una devolución, está precargada del registro
            del driver y su foto; si no, la tipeó alguien a mano. Igual que
            `created_by`, el aprobador lo necesita antes de decidir y no
            después.
        pickup:
          allOf:
            - $ref: '#/components/schemas/CreditRequestPickup'
          nullable: true
          description: >
            ★ NUEVO en v0.45.0. La recogida de esta solicitud, si alguien la
            marcó como tal. NULL cuando no hay nada que ir a buscar — que es
            el caso normal.

            Está en la bandeja porque marcar se hace DESDE la bandeja y solo
            mientras la solicitud está pendiente: si no se viera acá, el
            botón no tendría cómo saber si ya está marcada.

            ⚠️ NO condiciona la decisión. El aprobador puede aprobar o
            rechazar con la recogida en cualquier estado, y debe poder
            hacerlo sin esperar a que la mercancía vuelva.

    PickupStatus:
      type: string
      enum: [MARCADA, EN_CAMION, RECOGIDA, NO_RECOGIDA]
      description: >
        ★ NUEVO en v0.45.0. Dónde va la recogida de una solicitud de crédito.
          MARCADA       Alguien decidió que hay que ir a buscar. Sin camión.
          EN_CAMION     Montada en un camión, como parada.
          RECOGIDA      El driver registró la devolución (con foto).
          NO_RECOGIDA   El driver fue y no pudo — ver `not_collected_reason`.

        Es INDEPENDIENTE de `ApprovalStatus`. Una solicitud aprobada puede
        estar sin recoger y una rechazada puede estar recogida: son dos
        vías, no dos etapas de la misma.

    PickupNotCollectedReason:
      type: string
      enum: [NADA_QUE_RECOGER, NEGOCIO_CERRADO, CLIENTE_NO_LA_ENTREGA, SIN_ESPACIO_EN_CAMION]
      description: >
        ★ NUEVO en v0.45.0. Por qué el driver no pudo hacer la recogida.
          NADA_QUE_RECOGER      Llegó y no había mercancía para llevarse.
          NEGOCIO_CERRADO       Mismo caso que en las entregas.
          CLIENTE_NO_LA_ENTREGA El cliente se negó a entregarla.
          SIN_ESPACIO_EN_CAMION No cabía. Es real y hay que poder decirlo.

    PickupExpectedItem:
      type: object
      description: >
        ★ NUEVO en v0.45.0. Lo que la solicitud dice que hay que buscar.
        REFERENCIA, no validación: el driver registra lo que efectivamente
        recibe y puede no coincidir.
      properties:
        item_code: { type: string }
        item_name: { type: string, nullable: true }
        quantity:
          type: number
          format: double
          description: Cantidad que pide la solicitud.

    CreditRequestPickup:
      type: object
      description: >
        ★ NUEVO en v0.45.0. El estado de la recogida de una solicitud de
        crédito. Va dentro de la solicitud, no al revés: la solicitud existe
        primero y la recogida es algo que se le agrega.
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/PickupStatus' }
        marked_by: { type: string, description: Quién la marcó como recogida. }
        marked_at: { type: string, format: date-time }
        pickup_note:
          type: string
          nullable: true
          description: Instrucción para quien va a recoger. La ve el driver.
        truck_id:
          type: string
          format: uuid
          nullable: true
          description: El camión donde está montada. NULL si todavía es MARCADA.
        truck_name: { type: string, nullable: true }
        truck_status:
          allOf:
            - $ref: '#/components/schemas/TruckStatus'
          nullable: true
          description: >
            Estado del camión. Dice si todavía se puede desmontar sin pelear
            con el congelamiento.
        stop_number:
          type: integer
          nullable: true
          description: >
            Su parada, si el camión ya importó la secuencia. NULL mientras no
            la tenga — y eso NO significa "primera parada".
        return_id:
          type: string
          format: uuid
          nullable: true
          description: >
            La devolución (`ProductReturn`) con la que el driver registró la
            recogida, con sus cantidades reales y su foto. NULL hasta que
            ocurra.
        not_collected_reason:
          allOf:
            - $ref: '#/components/schemas/PickupNotCollectedReason'
          nullable: true
          description: Solo cuando el estado es NO_RECOGIDA.
        not_collected_note: { type: string, nullable: true }
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se cerró (RECOGIDA o NO_RECOGIDA), hora real de la calle.

    TruckPickup:
      type: object
      description: >
        ★ NUEVO en v0.45.0. Una recogida montada en un camión, como la ve el
        admin en el detalle del camión.
      properties:
        request_uuid: { type: string, format: uuid }
        client_code: { type: string }
        client_name: { type: string }
        reason: { $ref: '#/components/schemas/CreditRequestReason' }
        request_status:
          allOf:
            - $ref: '#/components/schemas/ApprovalStatus'
          description: >
            ⚠️ El estado de la SOLICITUD, que puede ser RECHAZADA con la
            recogida igual montada. El sistema NO la desmonta solo —
            sacarle una parada a un camión ya armado por un cambio de estado
            en otra pantalla es invisible hasta que el driver llega. Está acá
            para que una persona lo vea y decida.
        pickup_status: { $ref: '#/components/schemas/PickupStatus' }
        pickup_note: { type: string, nullable: true }
        stop_number: { type: integer, nullable: true }
        expected_items:
          type: array
          items: { $ref: '#/components/schemas/PickupExpectedItem' }
          description: >
            Lo que pide la solicitud. VACÍO en la modalidad SIN ítems (la del
            `manual_amount`), y vacío ahí significa "no se sabe qué ni
            cuánto", NO "nada que recoger".
        return_id: { type: string, format: uuid, nullable: true }

    AvailablePickup:
      type: object
      description: >
        ★ NUEVO en v0.45.0. Una recogida marcada y sin camión, como la ve el
        admin al armar camiones.
      properties:
        request_uuid: { type: string, format: uuid }
        client_code: { type: string }
        client_name: { type: string }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        zip_code: { type: string, nullable: true }
        shipping_code: { type: integer, nullable: true }
        shipping_code_name: { type: string, nullable: true }
        reason: { $ref: '#/components/schemas/CreditRequestReason' }
        request_status: { $ref: '#/components/schemas/ApprovalStatus' }
        marked_at: { type: string, format: date-time }
        pickup_note: { type: string, nullable: true }
        expected_items:
          type: array
          items: { $ref: '#/components/schemas/PickupExpectedItem' }

    DriverPickup:
      type: object
      description: >
        ★ NUEVO en v0.45.0. Una recogida en la parada, como la ve el driver.
        Va en la descarga de la ruta, así que tiene que bastarse sola sin
        conexión.
      properties:
        request_uuid: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/CreditRequestReason' }
        pickup_note: { type: string, nullable: true }
        pickup_status: { $ref: '#/components/schemas/PickupStatus' }
        expected_items:
          type: array
          items: { $ref: '#/components/schemas/PickupExpectedItem' }
          description: >
            Lo que la oficina espera que traiga. Es una AYUDA para buscar,
            no una lista a confirmar: el driver registra lo que el cliente
            efectivamente entrega, aunque sea menos, más o distinto. Vacía
            cuando la solicitud no tiene ítems — ahí hay que preguntar en el
            local.
        return_id:
          type: string
          format: uuid
          nullable: true
          description: >
            La devolución con la que ya la registró, si ya lo hizo. Sirve
            para que la app no la registre dos veces.

    InvoiceLine:
      type: object
      description: >
        ★ NUEVO en v0.31.0. Una línea de una factura de SAP, como la ve el
        aprobador de créditos al elegir contra cuál línea va cada crédito.
      properties:
        line_num:
          type: integer
          description: >
            Número de línea DENTRO de la factura, tal como lo tiene SAP. Es
            el valor que viaja a SAP como `BaseLine` al crear la nota de
            crédito, así que debe usarse tal cual — no reindexar ni asumir
            que empieza en 1.
          example: 2
        item_code: { type: string }
        item_name: { type: string, nullable: true }
        quantity:
          type: number
          format: double
          description: Cantidad facturada en esta línea.
        unit_price: { type: number, format: double }
        line_total: { type: number, format: double }

    CreditRequestDetailLine:
      type: object
      description: >
        ★ NUEVO en v0.31.0. Una línea de la solicitud tal como la ve el
        aprobador, con el identificador estable que necesita para asignarle
        una línea de la factura.
      properties:
        line_id:
          type: integer
          description: >
            Identificador de la línea DENTRO de esta solicitud, asignado por
            el servidor al guardarla. Estable e inmutable.

            Existe porque `item_code` no sirve para identificar una línea:
            puede repetirse dentro de la misma solicitud. Toda referencia a
            una línea —en particular `line_allocations` al aprobar— usa este
            campo.
          example: 1
        item_code: { type: string }
        item_name: { type: string, nullable: true }
        quantity: { type: number, format: double }
        reason: { $ref: '#/components/schemas/CreditRequestReason' }
        unit_price:
          type: number
          format: double
          nullable: true
          description: >
            Precio unitario de REFERENCIA, resuelto server-side. No es lo
            que se acredita: es de dónde parte el aprobador.

            ★ v0.47.1 — Se resuelve en cadena y `price_source` dice qué
            eslabón se usó: precio facturado a ese cliente → lista 3 →
            lista 1 → lista 2 → **1.00** de relleno.

            En solicitudes NUEVAS nunca es null: la cadena siempre termina
            en un número. Sigue declarado nullable por las anteriores a
            v0.47.1, donde null significa "no se pudo resolver" y NUNCA
            "vale cero".
        price_source:
          allOf:
            - $ref: '#/components/schemas/PriceSource'
          nullable: true
          description: >
            ★ NUEVO en v0.47.0. DE DÓNDE salió `unit_price`. Es lo que le
            dice al aprobador cuánto confiar en el número que está viendo:
            un precio facturado es un hecho de ese cliente; la lista 3 es
            una sugerencia de catálogo, que lo más probable es que el
            aprobador baje.

            Sin este campo los dos casos se ven idénticos —un número— y se
            aprobarían con la misma confianza, que es justo lo que no
            corresponde.

            ★ v0.47.2 — NULLABLE, y NULL no es un origen más: significa "no
            se puede afirmar de dónde salió". Aparece en solicitudes
            anteriores a v0.47.1 cuyo precio quedó en 0 por el bug que
            v0.47.0 describe. Ningún valor del enum es cierto para ellas —
            en particular NO son PLACEHOLDER, que significa exactamente
            1.00. Se dejan sin origen a propósito: inventarles uno haría
            pasar por resuelto un precio que nunca lo estuvo.

            En solicitudes nuevas siempre viene con valor.
        proposed_amount:
          type: number
          format: double
          description: >
            Lo que el vendedor propuso acreditar. Si no lo envió, el
            servidor lo calculó como `quantity` × `unit_price`.

            ★ v0.47.1 — Nunca es obligatorio. Si no se envía, se calcula
            con el `unit_price` que haya resuelto la cadena, incluido el
            1.00 de relleno.

    CreditRequestSapDocument:
      type: object
      description: >
        ★ NUEVO en v0.31.0. Un documento de SAP generado por esta solicitud.

        Una solicitud puede producir DOS documentos, porque los motivos
        mapean a tipos distintos y un documento de SAP es de ítems O de
        servicio, nunca mixto:

          · Nota de ÍTEMS   — líneas DOESNT_WANT_IT, MISTAKE, DAMAGED
          · Nota de SERVICIO — líneas SHORT

        En la práctica es raro que una solicitud mezcle ambos: casi siempre
        viene un solo tipo de motivo y se genera un solo documento. Pero el
        caso existe y el modelo lo contempla.

        Cada documento se integra por separado. Si uno tiene éxito y el otro
        falla, EL QUE PASÓ QUEDA HECHO — no se revierte. La solicitud
        muestra cuál falta y solo se reintenta el que falló.
      properties:
        doc_kind:
          type: string
          enum: [ITEMS, SERVICE]
          description: >
            ITEMS  — devuelve mercancía al inventario (motivos
                     DOESNT_WANT_IT, MISTAKE, DAMAGED).
            SERVICE — solo ajusta valor, no toca inventario (motivo SHORT).
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        sap_doc_num:
          type: string
          nullable: true
          description: DocNum en SAP. NULL mientras no se haya integrado.
        error_message:
          type: string
          nullable: true
          description: >
            Motivo del fallo si `status` es ERROR_INTEGRACION. NULL en
            cualquier otro caso.

    CreditRequestDetail:
      type: object
      properties:
        request_uuid: { type: string, format: uuid }
        client_code: { type: string }
        client_name: { type: string }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        calculated_amount: { type: number, format: double }
        gl_account_code:
          type: string
          nullable: true
          description: >
            Resuelto automáticamente por `reason` (config del middleware).
            Solo aplica a la modalidad SIN ítems.
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        decision_note: { type: string, nullable: true }
        salesperson_code:
          type: string
          nullable: true
          description: >
            ★ v0.33.2 — A QUÉ VENDEDOR PERTENECE la solicitud. Se resuelve
            DESDE EL CLIENTE, no desde el token de quien la carga.

            CAMBIO DE SIGNIFICADO respecto de v0.33.1 y anteriores: antes
            salía del token, así que significaba "quién la presentó". Eso
            producía atribución cruzada real — se midieron solicitudes de
            clientes de los vendedores 8 y 14 guardadas a nombre del 11,
            simplemente porque las cargó él. Nunca hubo validación de
            propiedad: se comprobaba que el cliente tuviera UN vendedor
            real, no que fuera el del que llama.

            Ahora significa una sola cosa, la misma que en los pedidos: el
            dueño. Quién la cargó vive en `created_by`.
        created_by:
          type: string
          nullable: true
          description: >
            ★ NUEVO en v0.33.2. Usuario que CREÓ la solicitud, distinto de
            `salesperson_code` (a quién pertenece).

            Para un vendedor que carga la de su propio cliente, coinciden.
            Para uno que carga la de un cliente ajeno, o para la oficina
            creándola desde una devolución de ruta, difieren.

            Mismo par de conceptos que en OrderSummary desde v0.30.0, y por
            la misma razón: un documento pertenece a un vendedor y lo puede
            haber cargado otro.

            NULL en solicitudes anteriores a v0.33.2 — la columna nace
            vacía y no se puede reconstruir quién las creó.
        source_return_id:
          type: string
          format: uuid
          nullable: true
          description: >
            ★ NUEVO en v0.33.0. La devolución de ruta de la que nació esta
            solicitud, si se creó precargándola desde una. NULL si nació de
            la app del vendedor o de la oficina sin devolución detrás.
        pickup:
          allOf:
            - $ref: '#/components/schemas/CreditRequestPickup'
          nullable: true
          description: >
            ★ NUEVO en v0.45.0. La recogida de esta solicitud, si se marcó
            una. NULL si no.

            ⚠️ NO confundir con `source_return_id`, que está dos campos más
            arriba y apunta al revés: `source_return_id` es la devolución de
            la que NACIÓ esta solicitud; `pickup.return_id` es la devolución
            que esta solicitud MANDÓ a buscar. Una solicitud puede tener las
            dos y no son la misma mercancía.

            ★ v0.45.1 — INVARIANTE VERIFICABLE: en una misma solicitud,
            `source_return_id` y `pickup.return_id` NUNCA pueden ser
            iguales. Que coincidan significa que registrar la recogida
            escribió el enlace de nacimiento, y con eso la garantía de "un
            solo crédito por mercancía devuelta" queda inservible sin que
            nada falle. Está escrito como igualdad de dos campos para que
            sea un test y no una advertencia que hay que recordar.
        reason:
          allOf:
            - $ref: '#/components/schemas/CreditRequestReason'
          description: >
            ★ NUEVO en v0.39.0. El motivo a nivel solicitud, el mismo que ya
            devuelve la bandeja.

            Antes solo estaba en la bandeja, que lista únicamente
            PENDIENTE_APROBACION — así que al decidir se volvía inalcanzable.
            En la modalidad SIN ítems no hay líneas, o sea que este es el
            ÚNICO motivo que existe: el detalle de una solicitud decidida
            decía cuánto y quién aprobó, pero no por qué. Y `gl_account_code`
            se resuelve DESDE este campo, así que quien concilia contra SAP
            necesita ver el par.
        comments:
          type: string
          nullable: true
          description: >
            ★ NUEVO en v0.39.0. El texto libre de quien pidió el crédito.

            Se veía `decision_note` —lo que dijo el aprobador— y no lo que
            dijo el solicitante. Faltaba la mitad del expediente.
        evidence_image_url:
          type: string
          nullable: true
          description: >
            ★ NUEVO en v0.39.0. La foto que justifica el crédito, la misma
            que ve el aprobador en la bandeja.

            Es el hueco más fuerte de los cuatro: quien audite después por
            qué se acreditó un monto no tenía de dónde sacar la evidencia —
            estaba guardada y sin ninguna vía de lectura. Se sirve con
            GET /evidence-photos/{id}, igual que desde la bandeja.
        received_at:
          type: string
          format: date-time
          description: >
            ★ NUEVO en v0.39.0. Cuándo se reportó la solicitud.

            El detalle traía `decided_at` pero no esto, así que no había
            forma de medir cuánto esperó una solicitud — que es justamente
            de lo que se queja la operación.
        invoice_doc_num:
          type: string
          nullable: true
          description: >
            ★ v0.31.0 — factura sobre la que aplica, si la solicitud la trae.
            Cuando está presente, el aprobador DEBE asignar una línea de esa
            factura a cada línea del crédito (ver `line_allocations`).
            Cuando es NULL, las notas van independientes, sin ligar.
        lines:
          type: array
          nullable: true
          description: >
            ★ NUEVO en v0.31.0. Las líneas de la solicitud, con su `line_id`.
            NULL en la modalidad SIN ítems.
          items: { $ref: '#/components/schemas/CreditRequestDetailLine' }
        sap_documents:
          type: array
          description: >
            ★ NUEVO en v0.31.0. Los documentos de SAP que genera esta
            solicitud — uno normalmente, dos si mezcla motivos de ítems con
            SHORT. Vacío mientras no se haya aprobado.
          items: { $ref: '#/components/schemas/CreditRequestSapDocument' }
        sap_credit_note_doc_num:
          type: string
          nullable: true
          description: >
            OBSOLETO desde v0.31.0 — se mantiene por compatibilidad. Trae el
            `sap_doc_num` del documento de ÍTEMS si existe, si no el del de
            servicio. Cuando hay dos documentos este campo no alcanza:
            usar `sap_documents`.

    OrderStatus:
      type: string
      enum: [SINCRONIZADA, RETENIDA_CARTERA, APROBADA, RECHAZADA]
      description: >
        ★ v0.4.0 — Máquina de estados inaugurada.

          SINCRONIZADA      Estado transitorio al recibirla. El middleware
                            evalúa la cartera y la mueve de inmediato.
          RETENIDA_CARTERA  Excede cupo o tiene mora. Espera decisión del admin.
          APROBADA          Cartera OK, o el admin la liberó. Sigue su curso.
          RECHAZADA         El admin la rechazó. No procede.

        Transiciones válidas:
          SINCRONIZADA     → APROBADA | RETENIDA_CARTERA   (automático)
          RETENIDA_CARTERA → APROBADA | RECHAZADA          (acción del admin)
          APROBADA         → (final por ahora)
          RECHAZADA        → (final)

    WeekDay:
      type: string
      enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SABADO, DOMINGO]

    ShippingCodeConfig:
      type: object
      description: >
        Un shipping code (zona logística de SAP) con los días de entrega que el
        admin le configuró. El código y el nombre vienen de SAP
        ([@RSAP_SHIPPING_CODE]); los días son del middleware.
      properties:
        code:
          type: integer
          description: Código (U_RSAP_SHIPPING_CODE).
        name:
          type: string
          nullable: true
          description: >
            Nombre legible (BNX3, BRK1, QNS2...).

            ★ v0.49.1 — NULLABLE: hay códigos en uso sin nombre en la UDT.
            La pantalla debe mostrar el código a secas, no una celda vacía.
        delivery_days:
          type: array
          items: { $ref: '#/components/schemas/WeekDay' }
          description: Días de entrega configurados (puede ser vacío).
        client_count:
          type: integer
          description: Cuántos clientes tienen este shipping code.

    RouteExportStop:
      type: object
      description: >
        Una parada para exportar a OptimoRoute. Agrupa TODOS los pedidos de un
        cliente en el camión (una parada por cliente).
      properties:
        client_code:
          type: string
          description: Va en la columna "Order #" del CSV (OptimoRoute alfanumérico).
        customer_name: { type: string }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        zip_code: { type: string, nullable: true }
        sales_rep: { type: string, nullable: true }
        subtotal:
          type: number
          format: double
          description: Suma de los pedidos de este cliente en el camión.
        shipping_code_name: { type: string, nullable: true }
        order_count:
          type: integer
          description: >
            Cuántos pedidos de este cliente hay en el camión.

            ⚠️ ★ v0.45.0 — PUEDE SER 0. Un cliente al que solo se va a
            RECOGER es una parada igual, con `order_count: 0` y `subtotal:
            0`. Quien arma el CSV no puede filtrar por esto: la parada existe
            y tiene que ir al software de mapas, o el estudio de ruta sale
            sobre una ruta que no es la que se va a hacer.
        pickup_count:
          type: integer
          description: >
            ★ NUEVO en v0.45.0. Cuántas recogidas de solicitudes de crédito
            tiene esta parada. Normalmente 0.
        address_incomplete:
          type: boolean
          description: >
            TRUE si falta dirección, ciudad o zip. Aviso para el admin:
            OptimoRoute podría no ubicar esta parada. NO bloquea la exportación.

    RouteStop:
      type: object
      description: Una parada ya ordenada (tras importar de OptimoRoute).
      properties:
        client_code: { type: string }
        customer_name: { type: string }
        stop_number:
          type: integer
          description: Orden de entrega (1 = primera parada).
        order_count:
          type: integer
          description: Pedidos de este cliente en el camión (todos comparten el stop).
        pickup_count:
          type: integer
          description: >
            ★ NUEVO en v0.45.0. Recogidas de este cliente en el camión. Una
            parada con `order_count: 0` y `pickup_count: 1` es una parada de
            pura recogida — existe y hay que ir.

    TruckRoute:
      type: object
      description: El orden de paradas de un camión.
      properties:
        truck_id: { type: string, format: uuid }
        has_route:
          type: boolean
          description: >
            Si el camión ya tiene orden de paradas importado.

            ★ v0.45.1 — VUELVE A `false` cuando cambia el CONJUNTO de
            paradas: montar una recogida de un cliente que no estaba, o
            quitar la última recogida de un cliente sin pedidos. ★ v0.45.2 —
            y las paradas guardadas se BORRAN, porque el manifiesto y
            `/dispatch/returns` las leen sin mirar este campo. La
            secuencia importada dejó de describir al camión, y `assign`
            exige `has_route` — el camión se detiene hasta que se reimporte,
            que es exactamente lo que tiene que pasar.
        imported_at:
          type: string
          format: date-time
          nullable: true
        stops:
          type: array
          items: { $ref: '#/components/schemas/RouteStop' }
          description: Las paradas ordenadas por stop_number.

    PickingTruckSummary:
      type: object
      description: Resumen de un camión asignado, para la app de bodega.
      properties:
        truck_id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TruckStatus' }
        my_lane:
          $ref: '#/components/schemas/PickingLane'
        my_lane_status:
          $ref: '#/components/schemas/LaneStatus'
        order_count: { type: integer }
        stop_count:
          type: integer
          description: Cuántas paradas (clientes) tiene el camión.
        regular_item_count:
          type: integer
          description: Cuántos ítems distintos regulares hay que recoger.
        frozen_item_count:
          type: integer
          description: Cuántos ítems distintos congelados hay que recoger.
        collection_progress:
          type: number
          format: double
          description: >
            ★ v0.10.0 — Fracción recogida DE SU CARRIL (0..1). No del camión
            completo.

    PickingCollection:
      type: object
      description: >
        Las dos listas de recolección consolidada de un camión, con progreso.
        Refleja el estado para pausar/retomar.
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TruckStatus' }
        my_lane:
          $ref: '#/components/schemas/PickingLane'
        items:
          type: array
          description: >
            ★ v0.10.0 — Los ítems DE SU CARRIL. Si my_lane es REGULAR, los que
            no empiezan con F; si es FROZEN, los que sí.
          items: { $ref: '#/components/schemas/PickingItem' }
        other_lane_summary:
          type: object
          nullable: true
          description: >
            ★ v0.10.0 — Contexto del OTRO carril (solo lectura). NULL si el
            camión no tiene el otro carril.
          properties:
            lane: { $ref: '#/components/schemas/PickingLane' }
            assigned_to_name: { type: string, nullable: true }
            status: { $ref: '#/components/schemas/LaneStatus' }
            collection_progress: { type: number, format: double }

    PickingItem:
      type: object
      description: Un ítem a recoger, consolidado de todo el camión.
      properties:
        item_code: { type: string }
        item_name: { type: string }
        is_frozen:
          type: boolean
          description: TRUE si ItemCode empieza con F.
        required_quantity:
          type: number
          format: double
          description: Total a recoger (suma de todos los pedidos del camión).
        collected_quantity:
          type: number
          format: double
          description: Cuánto lleva recogido (suma de sus registros de bin).
        shortage_quantity:
          type: number
          format: double
          description: Cuánto se marcó como faltante.
        is_complete:
          type: boolean
          description: Si collected + shortage cubre lo requerido.
        bins:
          type: array
          description: >
            Bins con stock de este ítem (FOTO del inicio). El bodeguero elige
            de cuál toma. is_system_bin marca el stock sin ubicar.
          items:
            type: object
            properties:
              bin_code: { type: string }
              on_hand: { type: number, format: double }
              is_system_bin: { type: boolean }
        collected_from:
          type: array
          description: De qué bins ya recogió y cuánto (para pausar/retomar).
          items:
            type: object
            properties:
              bin_code: { type: string }
              quantity: { type: number, format: double }

    PickingItemProgress:
      type: object
      description: El progreso de un ítem tras registrar recolección o faltante.
      properties:
        item_code: { type: string }
        required_quantity: { type: number, format: double }
        collected_quantity: { type: number, format: double }
        shortage_quantity: { type: number, format: double }
        is_complete: { type: boolean }

    PickingLane:
      type: string
      enum: [REGULAR, FROZEN]
      description: >
        ★ v0.10.0 — El carril de picking. REGULAR = ítems que NO empiezan con F
        (almacén). FROZEN = ítems que empiezan con F (nevera). Cada carril lo
        trabaja un bodeguero distinto, en paralelo.

    LaneProgress:
      type: object
      description: >
        ★ v0.10.0 — El avance de UN carril del camión. Los carriles son
        independientes y pueden ir desfasados.
      properties:
        lane: { $ref: '#/components/schemas/PickingLane' }
        assigned_to:
          type: string
          nullable: true
          description: Username del bodeguero de este carril. NULL = sin asignar.
        assigned_to_name: { type: string, nullable: true }
        status:
          $ref: '#/components/schemas/LaneStatus'
        collection_progress:
          type: number
          format: double
          description: Fracción recogida de este carril (0..1).
        distribution_complete:
          type: boolean
          description: Si la repartición de este carril ya cerró.
        item_count:
          type: integer
          description: Cuántos ítems distintos tiene este carril.

    LaneStatus:
      type: string
      enum: [SIN_ASIGNAR, ASIGNADO, EN_PICKING, EN_REPARTICION, CERRADO]
      description: >
        ★ v0.10.0 — El estado de UN carril (no del camión).
          SIN_ASIGNAR     No tiene bodeguero todavía.
          ASIGNADO        Tiene bodeguero, no ha empezado.
          EN_PICKING      Recolectando.
          EN_REPARTICION  Recolección completa, repartiendo en pallets.
          CERRADO         Repartición cerrada. El camión queda ALISTADO cuando
                          TODOS sus carriles están CERRADO.

    PalletType:
      type: string
      enum: [FROZEN, REGULAR]
      description: FROZEN y REGULAR nunca se mezclan en un pallet.

    PalletPlacement:
      type: object
      description: >
        ★ NUEVO en v0.49.0. Cuánto de un ítem quedó en un pallet.

        Un mismo ítem de un mismo pedido puede aparecer en varios: diez cajas
        pesadas se reparten entre dos pallets a propósito, y eso es el uso
        normal, no una excepción. La suma de las cantidades de un ítem sobre
        todos sus `PalletPlacement` es lo que viaja de ese ítem.
      properties:
        pallet_id: { type: string, format: uuid }
        pallet_label:
          type: string
          description: >
            La etiqueta física del pallet (ej. "Queens-Regular-1").

            ★ v0.51.0 — Los correlativos NO se reusan: si se borró el
            Regular-2, no vuelve a existir un Regular-2 en ese camión.
        quantity:
          type: number
          format: double
          description: Cuántas unidades de este ítem quedaron en ESTE pallet.

    Pallet:
      type: object
      properties:
        pallet_id: { type: string, format: uuid }
        label:
          type: string
          description: >
            ★ v0.10.0 — Nombre del camión + tipo + correlativo POR TIPO
            (ej. "Queens-Regular-1", "Queens-Frozen-1").
        pallet_type: { $ref: '#/components/schemas/PalletType' }
        sequence:
          type: integer
          description: >
            ★ v0.10.0 — Correlativo dentro del camión POR TIPO. Regular y Frozen
            numeran independientemente (Regular-1, Regular-2 / Frozen-1).
        assignments:
          type: array
          description: >
            Qué hay en el pallet (ítem, cantidad, de qué pedido).

            ⚠️ ★ v0.51.0 — NUNCA trae entradas con `quantity: 0`. Bajar una
            asignación a cero puede dejar el registro interno, pero un cero
            no es una asignación: es la ausencia de una. Si viajara, el
            pallet diría que tiene un ítem que ya no tiene.
          items:
            type: object
            properties:
              order_uuid: { type: string, format: uuid }
              client_name: { type: string }
              item_code: { type: string }
              item_name: { type: string }
              quantity: { type: number, format: double }

    DistributionPlan:
      type: object
      description: >
        El plan de repartición: los pedidos en orden de paradas INVERSO (el
        último en entregarse primero, para cargar al fondo). Con progreso.
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TruckStatus' }
        orders:
          type: array
          description: Pedidos en orden de reparto (paradas inverso).
          items: { $ref: '#/components/schemas/OrderDistributionProgress' }

    OrderDistributionProgress:
      type: object
      description: El estado de repartición de un pedido.
      properties:
        order_uuid: { type: string, format: uuid }
        order_number: { type: string }
        client_code: { type: string }
        client_name: { type: string }
        stop_number:
          type: integer
          nullable: true
          description: Su parada (del orden de OptimoRoute).
        is_complete:
          type: boolean
          description: >
            Si el pedido ya está repartido: todo lo DISPONIBLE de sus ítems está
            en pallets. ★ v0.10.0 — Un pedido con faltantes puede estar
            "completo" para la repartición (se repartió todo lo que había) y aun
            así ser una entrega incompleta — ver is_incomplete_delivery.
        is_incomplete_delivery:
          type: boolean
          description: >
            ★ v0.10.0 — TRUE si el cliente NO va a recibir todo lo que pidió
            (hubo faltante en algún ítem). El pedido se entrega igual, con menos.
            Informativo para el manifiesto y para avisar al vendedor (Bloque 3).
        items:
          type: array
          items:
            type: object
            properties:
              item_code: { type: string }
              item_name: { type: string }
              is_frozen: { type: boolean }
              ordered_quantity:
                type: number
                format: double
                description: Cuánto pidió este pedido de este ítem.
              available_quantity:
                type: number
                format: double
                description: >
                  ★ v0.10.0 — Cuánto hay REALMENTE disponible para repartir a
                  este pedido (limitado por lo recogido en el camión, no por lo
                  pedido). Si hubo faltante, es MENOR que ordered_quantity.
                  Si es 0, el ítem NO se ofrece para repartir.
              has_shortage:
                type: boolean
                description: >
                  ★ v0.10.0 — TRUE si no se recogió todo lo que este pedido
                  pidió de este ítem. El pedido quedará incompleto.
              distributed_quantity:
                type: number
                format: double
                description: Cuánto ya se puso en pallets.
              remaining:
                type: number
                format: double
                description: Cuánto falta por repartir a este pedido.
              in_pallets:
                type: array
                description: >
                  En qué pallets ya está y cuánto.

                  ⚠️ ★ v0.51.0 — NUNCA trae entradas con `quantity: 0`. Un
                  ítem que se movió del pallet A al B aparece solo en el B;
                  el A no queda como un cero. El filtrado es del SERVIDOR,
                  no de cada cliente: tres clientes aplicando la misma regla
                  por separado son tres chances de que uno se la olvide.
                items:
                  type: object
                  properties:
                    pallet_id: { type: string, format: uuid }
                    pallet_label: { type: string }
                    quantity: { type: number, format: double }

    DistributionMismatch:
      type: object
      description: Producto sin repartir al intentar cerrar (no cuadra).
      properties:
        message: { type: string }
        unresolved:
          type: array
          items:
            type: object
            properties:
              item_code: { type: string }
              item_name: { type: string }
              collected: { type: number, format: double }
              distributed: { type: number, format: double }
              difference: { type: number, format: double }

    RouteManifest:
      type: object
      description: >
        El informe de entrega. Pedidos por parada en orden DIRECTO, con sus pallets.
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        assigned_to_name: { type: string, nullable: true }
        generated_at: { type: string, format: date-time }
        total_stops: { type: integer }
        total_orders: { type: integer }
        total_pallets: { type: integer }
        total_units:
          type: number
          format: double
          description: Suma de unidades de todo el camión (todas las "cajas").
        stops:
          type: array
          description: Las paradas en orden de entrega DIRECTO (1, 2, 3...).
          items:
            type: object
            properties:
              stop_number: { type: integer }
              client_code: { type: string }
              client_name: { type: string }
              address: { type: string, nullable: true }
              city: { type: string, nullable: true }
              orders:
                type: array
                items:
                  type: object
                  properties:
                    order_uuid: { type: string, format: uuid }
                    order_number: { type: string }
                    total_amount: { type: number, format: double }
                    total_units:
                      type: number
                      format: double
                      description: >
                        ★ v0.9.0 — Suma de las unidades del pedido (las "cajas"
                        del manifiesto). De las líneas del pedido.
                    pallet_labels:
                      type: array
                      items: { type: string }
                      description: >
                        Los pallets de este pedido (ej. ["Queens-Regular-1",
                        "Queens-Frozen-1"]). Un pedido con congelados tiene 2.

                        ★ v0.49.0 — SIGUE SIENDO EL RESUMEN, y no se
                        deprecia: es lo que se mira para saber qué bajar en
                        esta parada. Para saber en cuál está una caja
                        concreta, ver `items`.
                    items:
                      type: array
                      description: >
                        ★ NUEVO en v0.49.0. Los ítems del pedido con el pallet
                        donde quedó cada uno.

                        Existe porque un pedido puede estar repartido entre
                        varios pallets —el bodeguero los separa por peso y
                        tamaño— y "está en estos cuatro pallets" obliga a
                        abrir los cuatro para encontrar dos cajas.
                      items:
                        type: object
                        properties:
                          item_code: { type: string }
                          item_name: { type: string }
                          quantity:
                            type: number
                            format: double
                            description: Cuánto de este ítem lleva el camión para este pedido.
                          pallets:
                            type: array
                            nullable: true
                            items: { $ref: '#/components/schemas/PalletPlacement' }
                            description: >
                              ⚠️ NULL y VACÍO no son lo mismo. `null` = el
                              pedido todavía no se repartió. `[]` = se
                              repartió y de este ítem no viajó nada (hubo
                              faltante y no se recogió ninguna unidad).
                    is_incomplete_delivery:
                      type: boolean
                      description: >
                        ★ v0.10.0 — TRUE si al pedido le faltó producto (no se
                        recogió todo lo pedido). El cliente recibe menos de lo
                        que pidió. El manifiesto debe MARCARLO para que el
                        driver y el cliente lo sepan al entregar.
              pickups:
                type: array
                items: { $ref: '#/components/schemas/TruckPickup' }
                description: >
                  ★ NUEVO en v0.45.0. Lo que hay que RECOGER en esta parada.

                  ⚠️ Una parada puede traer `orders: []` y una recogida. El
                  manifiesto tiene que imprimirla igual y distinguirla de una
                  entrega: el driver va a buscar, no a dejar.

    DeliveryStatus:
      type: string
      enum: [PENDIENTE, ENTREGADO, ENTREGADO_PARCIAL, NO_ENTREGADO]
      description: >
        ★ v0.11.0 — El resultado de la entrega de un pedido.
          PENDIENTE          Aún no se registró (el camión salió, no ha vuelto).
          ENTREGADO          El cliente recibió todo.
          ENTREGADO_PARCIAL  Recibió, pero rechazó ítems (ver rejected_items).
          NO_ENTREGADO       No recibió nada (ver order_reason).

    OrderRejectionReason:
      type: string
      enum: [NEGOCIO_CERRADO, PEDIDO_CANCELADO]
      description: >
        ★ v0.11.0 — Por qué NO se entregó el pedido completo.
        Solo aplica a NO_ENTREGADO.

    ItemRejectionReason:
      type: string
      enum: [NO_LO_QUIERE, DANADO, SHORT, NO_ORDENADO]
      description: >
        ★ v0.11.0 — Por qué el cliente rechazó un ítem al recibir.
          NO_LO_QUIERE  El cliente no lo quiso.
          DANADO        Llegó en mal estado.
          SHORT         Llegó menos de lo facturado (falta mercancía).
          NO_ORDENADO   El cliente dice que no lo pidió.

    DeliveryRecord:
      type: object
      description: >
        ★ v0.11.0 — El resultado de la entrega de un pedido, como lo cierra el
        admin (o, en el futuro, el driver desde su app).
      properties:
        order_uuid: { type: string, format: uuid }
        order_number: { type: string }
        client_code: { type: string }
        client_name: { type: string }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        order_reason:
          allOf:
            - $ref: '#/components/schemas/OrderRejectionReason'
          nullable: true
          description: Solo si status es NO_ENTREGADO.
        rejected_items:
          type: array
          description: >
            Ítems que el cliente rechazó al recibir. Solo si status es
            ENTREGADO_PARCIAL. Esta mercancía vuelve en el camión (ROUTE RETURN,
            fase futura de BIN LOAD).
          items: { $ref: '#/components/schemas/RejectedItem' }
        recorded_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se registró la entrega. NULL si aún PENDIENTE.
        recorded_by:
          type: string
          nullable: true
          description: Quién la registró (username del admin).
        note:
          type: string
          nullable: true
          description: Nota libre opcional del admin.

    RejectedItem:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        quantity:
          type: number
          format: double
          description: Cuántas unidades rechazó el cliente.
        reason: { $ref: '#/components/schemas/ItemRejectionReason' }

    TruckDelivery:
      type: object
      description: >
        ★ v0.11.0 — El estado de entrega de TODOS los pedidos de un camión.
        Es la pantalla de cierre del admin cuando el driver regresa.
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TruckStatus' }
        total_orders: { type: integer }
        pending_count:
          type: integer
          description: Cuántos pedidos siguen sin registrar.
        all_recorded:
          type: boolean
          description: TRUE si ya se registraron todos.
        driver_name:
          type: string
          nullable: true
          description: ★ v0.14.0 — El driver que está despachando, si lo hay.
        route_started_at:
          type: string
          format: date-time
          nullable: true
          description: ★ v0.14.0 — Cuándo salió a ruta.
        returned_items:
          type: array
          description: >
            ★ v0.14.0 — Los RETORNADOS acumulados HASTA AHORA (lo que ya se sabe
            que vuelve en el camión), para que el admin los vea llegar en vivo
            sin esperar al cierre de la ruta. Mismo consolidado que RouteSummary.
          items: { $ref: '#/components/schemas/ReturnedItem' }
        not_delivered_orders:
          type: array
          description: >
            ★ v0.14.0 — Los pedidos NO_ENTREGADOS. Su mercancía también vuelve
            COMPLETA en el camión, pero NO aparece en returned_items (un pedido
            no entregado no tiene motivos por ítem). El admin necesita ver ambas
            cosas para saber todo lo que regresa.
          items:
            type: object
            properties:
              order_number: { type: string }
              client_name: { type: string }
              order_reason:
                allOf:
                  - $ref: '#/components/schemas/OrderRejectionReason'
                description: >
                  ★ v0.46.0 — SE LLAMABA `reason` en este contrato y
                  `order_reason` en el proceso. Gana el proceso: así se llama
                  el mismo campo en `DeliveryRecord` y en
                  `POST /dispatch/orders/{uuid}/deliver`, y es lo que hoy
                  reciben los clientes. Renombrar del otro lado rompería a
                  quien funciona para cumplir una promesa que nunca se
                  cumplió.
        stops:
          type: array
          description: Las paradas en orden de entrega DIRECTO (como el manifiesto).
          items:
            type: object
            properties:
              stop_number: { type: integer }
              client_code: { type: string }
              client_name: { type: string }
              orders:
                type: array
                items: { $ref: '#/components/schemas/DeliveryRecord' }
              pickups:
                type: array
                items: { $ref: '#/components/schemas/TruckPickup' }
                description: >
                  ★ NUEVO en v0.45.0. Las recogidas de esta parada con su
                  estado: RECOGIDA (con `return_id`), NO_RECOGIDA (con
                  motivo) o todavía EN_CAMION.

                  ⚠️ EN_CAMION con el camión ya de vuelta significa que nadie
                  la tocó — no que salió bien. El admin la cierra desde el
                  Dashboard; el contrato NO la resuelve sola.

    WorkloadBoard:
      type: object
      description: >
        ★ v0.12.0 — El tablero de carga: qué falta despachar, por día y
        shipping code.
      properties:
        generated_at: { type: string, format: date-time }
        today:
          type: string
          description: >
            El día de la semana de HOY (LUNES..DOMINGO). El cálculo del "próximo
            día disponible" se hace desde aquí.
        totals:
          $ref: '#/components/schemas/WorkloadTotals'
        columns:
          type: array
          description: >
            Las columnas del tablero: LUNES a VIERNES, más SIN_DIA al final.
            Siempre vienen las 6, aunque estén vacías.
          items: { $ref: '#/components/schemas/WorkloadColumn'  }

    WorkloadColumn:
      type: object
      description: Una columna del tablero (un día, o SIN_DIA).
      properties:
        day:
          type: string
          enum: [LUNES, MARTES, MIERCOLES, JUEVES, VIERNES, SIN_DIA]
          description: >
            SIN_DIA agrupa lo que no cae en ningún día: pedidos sin shipping
            code, shipping codes sin días configurados, o configurados solo
            para sábado/domingo (que se ignoran).
        totals:
          $ref: '#/components/schemas/WorkloadTotals'
        groups:
          type: array
          description: Los shipping codes que caen en este día.
          items: { $ref: '#/components/schemas/WorkloadGroup' }

    WorkloadGroup:
      type: object
      description: Un shipping code dentro de una columna, con sus sumatorias.
      properties:
        shipping_code:
          type: integer
          nullable: true
          description: >
            El U_RSAP_SHIPPING_CODE (es INTEGER en SAP, no string).
            NULL para los pedidos sin shipping code (solo en SIN_DIA).
        shipping_code_name:
          type: string
          nullable: true
          description: El nombre de la zona (de la UDT RSAP_SHIPPING_CODE).
        totals:
          $ref: '#/components/schemas/WorkloadTotals'
        orders:
          type: array
          description: Los pedidos de este grupo.
          items: { $ref: '#/components/schemas/WorkloadOrder' }

    WorkloadOrder:
      type: object
      properties:
        order_uuid: { type: string, format: uuid }
        order_number: { type: string }
        client_code: { type: string }
        client_name: { type: string }
        total_units:
          type: number
          format: double
          description: Suma de unidades del pedido.
        total_amount: { type: number, format: double }
        in_truck:
          type: boolean
          description: >
            ★ Si el pedido YA está montado en un camión. FALSE = todavía hay que
            armarlo — es lo accionable del tablero.
        truck_id:
          type: string
          format: uuid
          nullable: true
          description: >
            ★ v0.12.0 — El id del camión donde va, si in_truck es true. NULL si
            no está en ninguno. Necesario para navegar al camión desde el
            tablero (el nombre NO es único — no sirve para identificarlo).
        truck_name:
          type: string
          nullable: true
          description: El camión donde va, si in_truck es true.
        is_overdue:
          type: boolean
          description: >
            ★ ATRASADO: el pedido ya existía cuando pasó su día de entrega y no
            se despachó. Aparece en el próximo día disponible con esta marca.

    WorkloadTotals:
      type: object
      description: Las sumatorias de un grupo, columna, o del tablero completo.
      properties:
        order_count: { type: integer }
        total_units: { type: number, format: double }
        total_amount: { type: number, format: double }
        in_truck_count:
          type: integer
          description: Cuántos de esos pedidos YA van en un camión.
        not_in_truck_count:
          type: integer
          description: ★ Cuántos NO están en ningún camión — lo que falta armar.
        overdue_count:
          type: integer
          description: Cuántos vienen atrasados.

    PickingBoard:
      type: object
      description: >
        ★ v0.13.0 — El piso de la bodega: los camiones activos con el avance de
        cada carril.
      properties:
        generated_at: { type: string, format: date-time }
        active_count:
          type: integer
          description: Camiones en curso (ASIGNADO/EN_PICKING/EN_REPARTICION).
        completed_today_count:
          type: integer
          description: Camiones que llegaron a ALISTADO hoy.
        trucks:
          type: array
          items: { $ref: '#/components/schemas/PickingBoardTruck' }

    PickingBoardTruck:
      type: object
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TruckStatus' }
        order_count: { type: integer }
        stop_count: { type: integer }
        has_frozen:
          type: boolean
          description: Si el camión tiene carril FROZEN (ítems congelados).
        alistado_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo quedó ALISTADO. NULL si sigue en curso.
        lanes:
          type: array
          description: >
            El avance de cada carril. Van a su propio ritmo — uno puede estar
            repartiendo mientras el otro recolecta.
          items: { $ref: '#/components/schemas/PickingBoardLane' }

    PickingBoardLane:
      type: object
      description: El avance de UN carril, como lo ve el admin.
      properties:
        lane: { $ref: '#/components/schemas/PickingLane' }
        status: { $ref: '#/components/schemas/LaneStatus' }
        assigned_to: { type: string, nullable: true }
        assigned_to_name:
          type: string
          nullable: true
          description: El bodeguero que lo tiene. NULL si SIN_ASIGNAR.
        collection_progress:
          type: number
          format: double
          description: Fracción recogida de este carril (0..1).
        distribution_progress:
          type: number
          format: double
          description: >
            Fracción repartida de este carril (0..1). 0 mientras no haya
            empezado la repartición.
        item_count:
          type: integer
          description: Cuántos ítems distintos tiene este carril.
        shortages:
          type: array
          description: >
            ★ Los faltantes registrados en este carril, CON DETALLE. Es lo único
            sobre lo que el admin puede actuar mientras el bodeguero trabaja.
          items: { $ref: '#/components/schemas/PickingBoardShortage' }

    PickingBoardShortage:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        required_quantity:
          type: number
          format: double
          description: Cuánto se necesitaba.
        collected_quantity:
          type: number
          format: double
          description: Cuánto se logró recoger.
        missing_quantity:
          type: number
          format: double
          description: Cuánto faltó.
        note:
          type: string
          nullable: true
          description: La nota que dejó el bodeguero, si dejó alguna.

    DriverRoute:
      type: object
      description: >
        ★ v0.14.0 — TODO lo que el driver necesita para trabajar la ruta SIN
        CONEXIÓN. Esta es la descarga que hace antes de salir.
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TruckStatus' }
        downloaded_at:
          type: string
          format: date-time
          description: Cuándo se generó esta descarga.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo el driver inició la ruta. NULL si no ha salido.
        total_stops: { type: integer }
        total_orders: { type: integer }
        pending_orders:
          type: integer
          description: Cuántos pedidos siguen sin registrar.
        stops:
          type: array
          description: >
            Las paradas en orden de entrega DIRECTO (el que definió el admin).
            ★ El driver puede reordenarlas EN SU VISTA, pero eso NO cambia este
            orden — es una preferencia local del dispositivo.
          items: { $ref: '#/components/schemas/DriverStop' }
        item_catalog:
          type: array
          description: >
            ★ v0.15.0 — El catálogo de ítems vendibles (~540), para que el driver
            pueda buscar por código o nombre al registrar un RETORNO DE PRODUCTO
            sin conexión. Un retorno es de facturas anteriores, así que el ítem
            puede NO estar en el camión de hoy.
          items:
            type: object
            properties:
              item_code: { type: string }
              item_name: { type: string }

    DriverStop:
      type: object
      properties:
        stop_number: { type: integer }
        client_code: { type: string }
        client_name: { type: string }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        zip_code: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        orders:
          type: array
          description: >
            ⚠️ ★ v0.45.0 — PUEDE VENIR VACÍA. Una parada de pura recogida no
            tiene pedidos. La app NO puede saltarse una parada por tener esta
            lista vacía ni mostrarla como "sin nada que hacer": es la parada
            donde hay que ir a BUSCAR.
          items: { $ref: '#/components/schemas/DriverOrder' }
        pickups:
          type: array
          items: { $ref: '#/components/schemas/DriverPickup' }
          description: >
            ★ NUEVO en v0.45.0. Lo que hay que RECOGER en esta parada. Vacía
            en la enorme mayoría de las paradas.

            El driver la registra con `POST /dispatch/returns` mandando
            `pickup_for_request_uuid` — cantidades reales y FOTO obligatoria,
            lo mismo que una devolución espontánea. Si no puede,
            `POST /dispatch/pickups/{request_uuid}/not-collected`.

    DriverOrder:
      type: object
      description: Un pedido a entregar, con sus líneas (para marcar ítem por ítem).
      properties:
        order_uuid: { type: string, format: uuid }
        order_number: { type: string }
        total_amount: { type: number, format: double }
        total_units: { type: number, format: double }
        pallet_labels:
          type: array
          items: { type: string }
          description: En qué pallets viene (para que el driver lo ubique en el camión).
        is_incomplete_delivery:
          type: boolean
          description: >
            Si al pedido le faltó producto en el picking. El driver debe saberlo
            ANTES de entregar — así no le sorprende un reclamo del cliente.
        delivery_status:
          allOf:
            - $ref: '#/components/schemas/DeliveryStatus'
          nullable: true
          description: Su estado de entrega, si ya se registró.
        lines:
          type: array
          description: Las líneas del pedido, para confirmar ítem por ítem.
          items:
            type: object
            properties:
              item_code: { type: string }
              item_name: { type: string }
              quantity:
                type: number
                format: double
                description: Cuánto lleva el camión de este ítem para este pedido.
              pallets:
                type: array
                nullable: true
                items: { $ref: '#/components/schemas/PalletPlacement' }
                description: >
                  ★ NUEVO en v0.49.0. En qué pallet está cada parte de este
                  ítem. Viaja en la descarga de la ruta, así que el driver lo
                  tiene sin conexión.

                  Sirve para lo más concreto del trabajo: encontrar la caja
                  sin abrir los cuatro pallets del pedido.

                  ⚠️ NULL y VACÍO no son lo mismo. `null` = el pedido todavía
                  no se repartió. `[]` = se repartió y de este ítem no viajó
                  nada. Una lista vacía NO se muestra como "sin datos".

    RouteSummary:
      type: object
      description: >
        ★ v0.14.0 — El resumen al cerrar la ruta, incluida la lista de
        RETORNADOS (lo que el driver trae de vuelta).
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time }
        total_orders: { type: integer }
        delivered_count: { type: integer }
        partial_count: { type: integer }
        not_delivered_count: { type: integer }
        pending_count:
          type: integer
          description: >
            Pedidos que quedaron sin registrar. NO se les fuerza un estado; el
            admin los cierra desde el Dashboard si hace falta.
        returned_items:
          type: array
          description: >
            ★ RETORNADOS: todo lo que el cliente no recibió y vuelve en el
            camión. Consolidado de todas las paradas.
          items: { $ref: '#/components/schemas/ReturnedItem' }

    ReturnedItem:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        quantity:
          type: number
          format: double
          description: Total de unidades que vuelven.
        reason: { $ref: '#/components/schemas/ItemRejectionReason' }
        order_number: { type: string }
        client_name: { type: string }

    ProductReturnReason:
      type: string
      enum: [DANADO, EXPIRADO, NO_LO_QUIERE]
      description: >
        ★ v0.15.0 — Por qué el cliente devuelve el producto.
        Distinto de ItemRejectionReason (que es para lo que se rechaza al
        RECIBIR la entrega de hoy): esto es mercancía de facturas anteriores.

        ★ v0.33.0 — MAPEO A CreditRequestReason, para precargar una
        solicitud de crédito desde una devolución. NO son la misma
        taxonomía y la correspondencia no es uno a uno:

          DANADO        → DAMAGED          (almacén 07, no vendible)
          EXPIRADO      → DAMAGED          (vencido tampoco es vendible)
          NO_LO_QUIERE  → DOESNT_WANT_IT   ⚠️ CORREGIBLE A MISTAKE

        El último es el que exige criterio humano: si se envió el artículo
        equivocado, el driver lo trae igual y solo puede marcarlo
        NO_LO_QUIERE, porque su taxonomía no tiene MISTAKE. La oficina lo
        corrige al crear la solicitud.

        Y el motivo importa: determina la cuenta contable, el almacén
        destino y si el stock vuelve como vendible o no. Por eso la
        precarga PROPONE y una persona CONFIRMA — nunca se transcribe a
        ciegas.

        SHORT nunca viene de una devolución de ruta: un faltante jamás
        llegó al cliente, así que no hay nada que el driver traiga.

    ProductReturn:
      type: object
      description: >
        ★ v0.15.0 — Un retorno de producto registrado por un driver en ruta.
      properties:
        return_id:
          type: string
          format: uuid
          description: >
            El `return_uuid` que generó la app. Es la identidad del retorno.
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        driver_username: { type: string }
        driver_name: { type: string, nullable: true }
        client_code: { type: string }
        client_name: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductReturnItem' }
        total_units:
          type: number
          format: double
          description: Suma de las cantidades de todos los ítems.
        has_photo:
          type: boolean
          description: >
            Siempre true (la foto es obligatoria), pero se expone para que el
            Dashboard sepa si puede pedirla.
        photo_url:
          type: string
          nullable: true
          description: >
            La ruta para pedir la imagen — GET /admin/returns/{id}/photo.
            La foto NO viaja en este schema.
        note: { type: string, nullable: true }
        client_reference:
          type: string
          nullable: true
          description: Referencia que dio el cliente (factura, remisión). Texto libre.
        occurred_at:
          type: string
          format: date-time
          description: Cuándo ocurrió la visita (hora real, no la de sincronización).
        recorded_at:
          type: string
          format: date-time
          description: Cuándo llegó al servidor.
        credit_request_uuid:
          type: string
          format: uuid
          nullable: true
          description: >
            ★ NUEVO en v0.33.0. La solicitud de crédito que ya se creó a
            partir de esta devolución, si existe. NULL si todavía no se
            procesó.

            Existe para que el Dashboard pueda mostrar cuáles devoluciones
            ya tienen crédito sin recorrer todas las solicitudes buscando.
            Sin esto, crear dos créditos por la misma mercancía devuelta
            sería invisible: cada uno se vería perfectamente válido.
        pickup_for_request_uuid:
          type: string
          format: uuid
          nullable: true
          description: >
            ★ NUEVO en v0.45.0. La solicitud de crédito que MANDÓ a buscar
            esta mercancía: esta devolución es la RECOGIDA de una parada de
            recogida.

            ⚠️ ES EL ENLACE OPUESTO A `credit_request_uuid`, el campo de
            arriba, y confundirlos rompe una garantía:

              · `credit_request_uuid`      — el crédito que NACIÓ de esta
                                             devolución (devolución primero).
              · `pickup_for_request_uuid`  — el crédito que MANDÓ a buscar
                                             esta mercancía (crédito primero).

            Si la recogida escribiera el campo de arriba, "esta devolución ya
            generó un crédito" pasaría a ser falso y se podría crear un
            SEGUNDO crédito desde ella sin que nada lo detecte: dos créditos
            por la misma mercancía, cada uno impecable por separado.

            REGLA PARA EL DASHBOARD: una devolución con este campo NO ofrece
            "crear solicitud de crédito desde esta devolución". El crédito ya
            existe — es el que la mandó a buscar.

    ProductReturnItem:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        quantity: { type: number, format: double }
        reason: { $ref: '#/components/schemas/ProductReturnReason' }

    PaymentType:
      type: string
      enum: [CASH, CHEQUE]
      description: >
        ★ v0.16.0 — Cómo pagó el cliente al DRIVER en ruta.
        CHEQUE exige número de cheque y FOTO; CASH no lleva ninguno de los dos.
        No confundir con AccountPaymentMethod (v0.17.0).

    Payment:
      type: object
      description: >
        ★ v0.16.0 — Un pago recibido en ruta por el DRIVER. Registro
        INMUTABLE: no se edita ni se borra; si hubo error se ANULA dejando el
        rastro. No confundir con AccountPaymentDetail (v0.17.0).
      properties:
        payment_uuid:
          type: string
          format: uuid
          description: El uuid que generó la app. Es la identidad del pago.
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        driver_username: { type: string }
        driver_name: { type: string, nullable: true }
        client_code: { type: string }
        client_name: { type: string }
        amount: { type: number, format: double }
        payment_type: { $ref: '#/components/schemas/PaymentType' }
        check_number:
          type: string
          nullable: true
          description: Solo para CHEQUE.
        has_photo:
          type: boolean
          description: TRUE para CHEQUE (la foto es obligatoria), FALSE para CASH.
        photo_url:
          type: string
          nullable: true
          description: >
            Ruta para pedir la imagen — GET /admin/payments/{uuid}/photo.
            NULL para CASH. La foto NO viaja en este schema.
        note: { type: string, nullable: true }
        occurred_at:
          type: string
          format: date-time
          description: Cuándo se recibió el dinero (hora real de la visita).
        recorded_at:
          type: string
          format: date-time
          description: Cuándo llegó al servidor.
        is_voided:
          type: boolean
          description: >
            ★ Si el pago fue ANULADO. El registro sigue existiendo — el rastro
            importa. Los anulados NO suman a los totales.
        voided_at: { type: string, format: date-time, nullable: true }
        voided_by:
          type: string
          nullable: true
          description: Quién lo anuló.
        void_reason:
          type: string
          nullable: true
          description: >
            Por qué se anuló. Obligatorio al anular — un pago anulado sin
            explicación es una bandera roja que nadie puede resolver después.

    PaymentTotals:
      type: object
      description: Totales de un conjunto de pagos del driver. Los ANULADOS no suman.
      properties:
        cash_total: { type: number, format: double }
        cheque_total: { type: number, format: double }
        grand_total: { type: number, format: double }
        payment_count:
          type: integer
          description: Pagos válidos (sin contar los anulados).
        voided_count: { type: integer }

    DriverPaymentSummary:
      type: object
      description: >
        ★ v0.16.0 — La caja del driver: lo que lleva recogido en su ruta.
      properties:
        truck_id: { type: string, format: uuid }
        truck_name: { type: string, nullable: true }
        totals: { $ref: '#/components/schemas/PaymentTotals' }
        payments:
          type: array
          description: Sus pagos, incluidos los anulados (marcados).
          items: { $ref: '#/components/schemas/Payment' }

    AdminPaymentList:
      type: object
      description: ★ v0.16.0 — Los pagos de ruta que ve el admin, con totales.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals: { $ref: '#/components/schemas/PaymentTotals' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }

    TruckStatus:
      type: string
      enum: [BORRADOR, CONFIRMADO, ASIGNADO, EN_PICKING, EN_REPARTICION, ALISTADO, ASIGNADO_DRIVER, EN_RUTA, RUTA_CERRADA, CANCELADO]
      description: >
        Ciclo de vida del camión.
          BORRADOR    El admin lo está armando (agrega/quita órdenes libremente).
          CONFIRMADO  Listo para picar. Aún modificable. Requiere ruta para asignar.
          ASIGNADO    ★ v0.7.0 — Asignado a un bodeguero. Aún modificable/reasignable.
          EN_PICKING  Recolección en curso (fase 1). SE CONGELA.
          EN_REPARTICION  ★ v0.8.0 — Recolección completa; repartiendo en pallets.
          ALISTADO    Picking terminado (repartición cerrada). Listo para manifiesto.
          ASIGNADO_DRIVER ★ v0.14.0 — Asignado a un driver, aún no salió.
          EN_RUTA         ★ v0.14.0 — El driver inició la ruta; está despachando.
          RUTA_CERRADA    ★ v0.14.0 — El driver terminó la ruta.
          CANCELADO   Deshecho; sus órdenes vuelven a "sin asignar".

    DeliveryTruckName:
      type: object
      description: >
        ★ NUEVO en v0.43.0. Una entrada del catálogo de nombres de reparto.

        NO es un vehículo: es un DESTINO. La lista real incluye ciudades y
        barrios, y también `CLIENTE RETIRA` y `UPS`, que no son camiones en
        absoluto. Si algún día hace falta modelar vehículos —patente,
        capacidad, mantenimiento— eso es otra entidad, no ésta.
      required: [id, name, is_active]
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: El nombre canónico, que es lo que se copia al camión.
        is_active:
          type: boolean
          description: >
            Los inactivos NO se ofrecen al crear un camión y el servidor los
            rechaza, pero SIGUEN VIAJANDO en el listado del catálogo: quien
            lo administra tiene que poder reactivarlos, y para eso tiene que
            verlos. No hay borrado.
        created_at: { type: string, format: date-time }

    TruckSummary:
      type: object
      properties:
        truck_id: { type: string, format: uuid }
        name:
          type: string
          nullable: true
          description: Etiqueta opcional (ej. "Camión 1 - Ruta 11").
        status: { $ref: '#/components/schemas/TruckStatus' }
        created_at: { type: string, format: date-time }
        order_count: { type: integer }
        pickup_count:
          type: integer
          description: >
            ★ NUEVO en v0.45.0. Cuántas recogidas de solicitudes de crédito
            lleva el camión. NO están contadas en `order_count` ni suman a
            `total_amount`: una recogida no es una venta y no tiene monto.
            Tampoco se pica ni se paletiza.
        total_amount:
          type: number
          format: double
          description: >
            Suma de las órdenes del camión. ★ v0.45.0 — las recogidas no
            suman acá.
        shipping_codes:
          type: array
          items: { type: string }
          description: >
            Shipping codes (nombres: BNX3, QNS1...) presentes en el camión.
            Normalmente uno; puede haber varios. NO son rutas comerciales.
            Es el eje logístico.
        has_route:
          type: boolean
          description: >
            ★ v0.6.0 — Si el camión ya tiene su orden de paradas importado
            (de OptimoRoute). Requisito para picar en el Bloque 2.
        sent_to_invoicing:
          type: boolean
          description: >
            ★ NUEVO en v0.34.0. Si este camión ya pasó por
            send-to-invoicing — es decir, si tiene tareas ORDER_INVOICE
            encoladas.

            NO significa que las facturas existan en SAP: significa que se
            pidieron. Una tarea puede estar pendiente o en error. Para el
            estado real de la integración hay que mirar las tareas.

            EXISTE PARA PREVENIR UNA PÉRDIDA: un camión puede despacharse
            sin facturar, y aunque desde v0.34.0 eso ya no es irreversible,
            sigue siendo un error silencioso. Con este campo el Dashboard
            puede advertirlo en el momento en que todavía es gratis
            corregirlo — al asignar el driver, antes de que salga.
        assigned_to:
          type: string
          nullable: true
          description: >
            ★ v0.7.0 — DEPRECADO en v0.10.0 (dos carriles). Se conserva por
            compatibilidad: refleja el bodeguero del carril REGULAR. Para el
            estado real usa `lanes`.
          deprecated: true
        assigned_to_name:
          type: string
          nullable: true
          description: DEPRECADO en v0.10.0. Ver `lanes`.
          deprecated: true
        has_frozen:
          type: boolean
          description: >
            ★ v0.10.0 — Si el camión tiene ítems congelados (ItemCode empieza
            con F). Lo CALCULA el sistema. Determina si se esperan 2 carriles
            (REGULAR + FROZEN) o solo 1 (REGULAR).
        lanes:
          type: array
          description: >
            ★ v0.10.0 — El avance de cada carril. Si has_frozen es false, solo
            trae el carril REGULAR.
          items: { $ref: '#/components/schemas/LaneProgress' }
        driver_username:
          type: string
          nullable: true
          description: >
            ★ v0.14.0 — El driver que tiene este camión. NULL si no se ha
            asignado.
        driver_name:
          type: string
          nullable: true
          description: ★ v0.14.0 — Nombre visible del driver.
        route_started_at:
          type: string
          format: date-time
          nullable: true
          description: ★ v0.14.0 — Cuándo el driver inició la ruta.
        route_finished_at:
          type: string
          format: date-time
          nullable: true
          description: ★ v0.14.0 — Cuándo la cerró.

    TruckDetail:
      allOf:
        - $ref: '#/components/schemas/TruckSummary'
        - type: object
          properties:
            note: { type: string, nullable: true }
            orders:
              type: array
              items: { $ref: '#/components/schemas/OrderSummary' }
              description: Las órdenes montadas en este camión.
            pickups:
              type: array
              items: { $ref: '#/components/schemas/TruckPickup' }
              description: >
                ★ NUEVO en v0.45.0. Las recogidas montadas en este camión.
                Lista vacía cuando no hay ninguna, que es lo normal.

    HoldReason:
      type: string
      enum: [CUPO_EXCEDIDO, MORA, CUPO_Y_MORA]
      description: >
        Por qué se retuvo la orden.
          CUPO_EXCEDIDO  balance + total de la orden > credit_limit
          MORA           tiene facturas vencidas más allá de los días de gracia
          CUPO_Y_MORA    ambas

    PriceSource:
      type: string
      enum: [INVOICED, PRICE_LIST_3, PRICE_LIST_1, PRICE_LIST_2, PLACEHOLDER]
      description: >
        ★ NUEVO en v0.47.0, cadena completa en v0.47.1. De dónde salió el
        `unit_price` de una línea de solicitud de crédito. Se prueban en
        este orden y se usa el primero que resuelva:

          INVOICED      Último precio facturado a ESE cliente para ese ítem.
                        Es un hecho de la relación con ese cliente.
          PRICE_LIST_3  Sin historia de facturación: lista 3 del ítem. Es la
                        sugerencia por defecto — una referencia de catálogo,
                        no la reconstrucción de una venta. No se usa la
                        lista del cliente, para no simular una precisión que
                        no existe.
          PRICE_LIST_1  Sin lista 3. Rescata pocos ítems, pero un precio
          PRICE_LIST_2  real de catálogo siempre es mejor punto de partida
                        que un número inventado.
          PLACEHOLDER   El ítem no tiene NINGÚN precio en SAP. `unit_price`
                        vale **1.00**: un relleno puesto a propósito para
                        que la solicitud pueda crearse igual y decida quien
                        aprueba.

        ⚠️ ★ v0.47.2 — UN PRECIO 0 CUENTA COMO AUSENTE en todos los
        eslabones. En el espejo "sin precio" no es un hueco: es 0, porque
        las listas son decimales no nulos. Cada eslabón se prueba con
        `> 0`; preguntar por null aceptaría el 0 como precio bueno y
        devolvería el bug por la puerta de al lado — la solicitud otra vez
        en cero, ahora con un `price_source` afirmando que se resolvió.

        Un ítem cuya lista 3 vale 0 cae al eslabón siguiente. Un artículo
        vendible con precio cero no es un precio: es un dato que falta.

        ⚠️ PLACEHOLDER NO SE MUESTRA COMO LOS DEMÁS. Un relleno y un precio
        facturado se ven idénticos —un número— y quien aprueba tiene que
        saber cuál está mirando. La pantalla debe marcarlo distinto; no
        alcanza con mostrarlo entre los otros.

        Y no es 0 a propósito: un cero se lee como "no corresponde
        acreditar", que es una frase con sentido, y por eso pasa
        desapercibido. Ése fue el bug que originó todo esto (`cantidad ×
        null` → 0). 1.00 no se lee como nada y obliga a mirar.

    PriceListNumber:
      type: integer
      enum: [1, 2, 3]

    SapStatus:
      type: object
      description: >
        ★ DECLARADO en v0.46.0. El estado del espejo SAP, fuente por fuente.
        Diagnóstico de solo lectura — no dispara ningún refresco.
      properties:
        checked_at:
          type: string
          format: date-time
          description: Cuándo se leyó este estado.
        refresh_interval_minutes:
          type: integer
          description: >
            Cada cuánto corre el refresco automático. Va acá para que
            `is_stale` se pueda interpretar sin conocer la configuración.
        sources:
          type: array
          items: { $ref: '#/components/schemas/SapStatusSource' }

    SapStatusSource:
      type: object
      description: ★ DECLARADO en v0.46.0. Una fuente del espejo SAP.
      properties:
        source_name: { type: string, description: "ej. vw_WMS_Stock" }
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Último INTENTO, haya salido bien o mal. NULL si nunca se intentó
            — que no es lo mismo que "falló".
        last_success_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Último éxito. La distancia entre este campo y `last_attempt_at`
            es el dato que importa: iguales = está al día; muy separados =
            viene fallando hace rato con la última copia buena servida como
            si fuera actual.
        last_attempt_succeeded:
          type: boolean
          description: Si el último intento salió bien.
        last_error:
          type: string
          nullable: true
          description: >
            ⚠️ Texto CRUDO del error de SAP — nombres de objetos, detalles de
            conexión, a veces datos. Por esto el endpoint es solo de ADMIN.
            No mostrarlo fuera de una pantalla de administración ni mandarlo
            a ningún log que salga del servidor.
        row_count:
          type: integer
          nullable: true
          description: >
            Filas que tiene hoy esa fuente en el espejo.

            ★ v0.48.0 — NULLABLE, y null NO es 0: significa que esa fuente
            NUNCA se refrescó. Cero significa que se refrescó y no trajo
            ninguna fila. La diferencia entre esas dos cosas es exactamente
            lo que se va a mirar cuando algo falle.
        is_stale:
          type: boolean
          description: >
            Lleva más de 2× `refresh_interval_minutes` sin un éxito. Viaja
            RESUELTO por el servidor, no como regla a recalcular — mismo
            criterio que `out_of_stock` desde v0.40.0.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [token, role]
      properties:
        token: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        salesperson_code: { type: string, nullable: true }
        display_name: { type: string }

    CatalogItem:
      type: object
      required: [item_code, name, available, price_list_1, price_list_2, price_list_3]
      properties:
        item_code: { type: string }
        name: { type: string }
        category:
          type: string
          nullable: true
          description: >
            ★ v0.48.0 — NULLABLE. Hoy no hay un solo ítem sin categoría, pero
            viene de SAP y puede faltar. Se declara nullable porque el error
            no es simétrico: prever un null que no ocurre no rompe nada;
            no preverlo rompe en producción.
        barcode:
          type: string
          nullable: true
          description: ★ v0.48.0 — NULLABLE. 30% de los ítems no tienen código de barras.
        price_list_1: { type: number, format: double }
        price_list_2: { type: number, format: double }
        price_list_3: { type: number, format: double }
        has_price_1: { type: boolean }
        has_price_2: { type: boolean }
        has_price_3: { type: boolean }
        stock: { type: number, format: double }
        available: { type: number, format: double }
        out_of_stock:
          type: boolean
          description: >
            ★ NUEVO en v0.40.0. `available <= 0` O `stock <= 0`, resuelto por
            el SERVIDOR.

            Viaja resuelto y no como regla a implementar: tres clientes
            calculando la misma condición por separado son tres chances de que
            divergan, y nadie las compara. Mismo criterio que `total_amount`
            desde v0.37.3.

            ⚠️ QUÉ HACE Y QUÉ NO: el cliente no debe ofrecer agregar al
            carrito un ítem con `true`, y debe mostrarlo marcado. Pero el
            servidor NO rechaza un pedido que lo incluya, y es deliberado: la
            app del vendedor trabaja offline sobre el catálogo sincronizado y
            el stock de SAP cambia durante el día. Rechazar al crear daría
            rechazos al vendedor en ruta por ítems que tenía en stock al
            sincronizar, cuando el sistema resuelve el faltante en el
            alistamiento a propósito.
        image_url:
          type: string
          nullable: true
          description: >
            ★ v0.41.0 — CAMBIA cuando cambia la imagen: lleva una versión
            derivada del contenido, para que un cliente que guardó el
            catálogo sin conexión traiga la nueva foto en vez de quedarse con
            la cacheada. Tratala como OPACA.

            `null` mientras el ítem no tenga imagen cargada: el cliente
            muestra su placeholder, que es el estado real del dato y no un
            error.
        visible_in_catalog:
          type: boolean
          description: >
            ★ NUEVO en v0.41.0. Decisión COMERCIAL del WMS, distinta de
            `active`, que es la bandera de SAP y es dato maestro. Un ítem
            puede estar activo en SAP y oculto por decisión, o al revés.

            ⚠️ Un ítem oculto SIGUE VIAJANDO en `GET /sync/catalog`, con este
            campo en `false`. Ese endpoint es un delta con `since`: un ítem
            que simplemente dejara de aparecer no le diría nada al cliente,
            que lo conservaría en su base local para siempre. La ocultación
            tiene que viajar para poder aplicarse.
        active: { type: boolean }

    # ═══════════════ CLIENTE CON CARTERA (★ v0.4.0) ═══════════════
    Client:
      type: object
      required:
        [client_code, name, default_price_list, authorized_price_lists, credit]
      properties:
        client_code: { type: string }
        name: { type: string }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        zipcode: { type: string, nullable: true }
        manager_name:
          type: string
          nullable: true
          description: >
            ★ v0.48.0 — NULLABLE, y la ausencia es la NORMA: 99,5% de los
            clientes no lo tienen.
        shipping_route:
          type: string
          nullable: true
          description: >
            Código de ruta/día de entrega (de OCRD.U_RSAP_ROUTE).

            ★ v0.48.0 — NULLABLE. Null significa que el cliente NO TIENE
            zona asignada — un hueco real de datos maestros, no un dato que
            no se pudo leer. La pantalla debe decirlo con esas palabras, no
            dejar la celda en blanco: una celda vacía se lee como un
            problema de la pantalla.
        default_price_list: { $ref: '#/components/schemas/PriceListNumber' }
        authorized_price_lists:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: '#/components/schemas/PriceListNumber' }
        credit:
          $ref: '#/components/schemas/ClientCredit'
          # ★ v0.4.0 — la app lo usa para ADVERTIR offline.
        open_invoices:
          type: array
          description: >
            ★ v0.17.5. Facturas abiertas del cliente (de vw_CxC), sincronizadas
            offline para que el vendedor pueda proponer proposed_applications
            en POST /account-payments sin conexión. Mismo principio que
            `credit`: dato de la ÚLTIMA sincronización, puede estar
            desactualizado — el aprobador ve el estado fresco en la bandeja
            de aprobación antes de confirmar la imputación real.
          items: { $ref: '#/components/schemas/OpenInvoiceSummary' }

    OpenInvoiceSummary:
      type: object
      required: [invoice_doc_num, amount, invoice_date, due_date]
      properties:
        invoice_doc_num: { type: string, description: "DocNum de la factura (vw_CxC)." }
        amount:
          type: number
          format: double
          description: Saldo abierto de esa factura específica (no el total facturado).
        invoice_date: { type: string, format: date }
        due_date: { type: string, format: date }

    ClientCredit:
      type: object
      required: [balance, credit_limit, credit_available]
      description: >
        Situación de cartera del cliente. La app la usa para ADVERTIR al
        vendedor sin conexión.

        ⚠️ Estos datos son de la ÚLTIMA SINCRONIZACIÓN. Pueden estar
        desactualizados. El middleware re-evalúa con datos frescos al recibir
        la orden. **La app advierte; el middleware decide.**
      properties:
        balance:
          type: number
          format: double
          description: >
            Saldo actual del cliente (de SAP). ES LA CIFRA OFICIAL.
        credit_limit:
          type: number
          format: double
          description: Cupo de crédito.
        credit_available:
          type: number
          format: double
          description: credit_limit − balance. Puede ser NEGATIVO (ya lo excedió).
        overdue_count:
          type: integer
          description: Cuántas facturas tiene vencidas (más allá de la gracia).
        overdue_amount:
          type: number
          format: double
          description: Monto total vencido.
        max_days_overdue:
          type: integer
          description: >
            Días de atraso de la factura MÁS vencida.
            El middleware compara esto contra los días de gracia (5).
        has_overdue:
          type: boolean
          description: >
            Conveniencia: true si max_days_overdue supera los días de gracia.
            Calculado por el middleware (la app NO debe recalcular el umbral).
        grace_days:
          type: integer
          description: >
            Días de gracia vigentes (hoy 5). El middleware los envía para que la
            app pueda explicárselo al vendedor, no para que los recalcule.

    # ═══════════════ ESTADO DE CUENTA (★ v0.4.0) ═══════════════
    ClientStatement:
      type: object
      properties:
        client_code: { type: string }
        client_name: { type: string }
        credit:
          $ref: '#/components/schemas/ClientCredit'
        documents:
          type: array
          items: { $ref: '#/components/schemas/StatementDocument' }
        as_of:
          type: string
          format: date-time
          description: Cuándo se tomó esta foto de la cartera.

    StatementDocument:
      type: object
      properties:
        doc_type:
          type: string
          enum: [INVOICE, CREDIT_NOTE, PAYMENT_ON_ACCOUNT]
        doc_num: { type: string }
        doc_date: { type: string, format: date }
        due_date:
          type: string
          format: date
          nullable: true
          description: NULL para notas de crédito y pagos (no vencen).
        doc_total: { type: number, format: double }
        open_amount:
          type: number
          format: double
          description: >
            POSITIVO para facturas (el cliente debe).
            NEGATIVO para notas de crédito y pagos (restan deuda).
        days_overdue:
          type: integer
          nullable: true
          description: >
            Días de atraso. Negativo = aún no vence. NULL para NC y pagos.
        is_from_sage:
          type: boolean
          description: >
            true si viene de la migración de Sage (dato informativo).
            La deuda cuenta igual, venga de donde venga.
        sage_doc_number:
          type: string
          nullable: true
          description: Número original en Sage, si aplica.

    OrderCreate:
      type: object
      required: [client_uuid, client_code, lines]
      properties:
        client_uuid: { type: string, format: uuid }
        client_code: { type: string }
        salesperson_code:
          type: string
          nullable: true
          description: >
            ★ NUEVO en v0.30.0. A qué vendedor pertenece el pedido.

            Comportamiento CONDICIONAL AL ROL del llamador, mismo patrón que
            POST /account-payments:

            · VENDEDOR y VENDEDOR_INSTITUCIONAL — NO lo envían. Si lo mandan,
              el servidor lo IGNORA y usa el del token. Un vendedor no puede
              atribuir un pedido a otro.

            · ADMIN — OBLIGATORIO. Un ADMIN no tiene salesperson_code propio,
              así que debe elegir explícitamente de qué vendedor es el pedido
              (400 si falta).

              ★ CORREGIDO EN v0.50.0 — SE VALIDA CONTRA EL ESPEJO DE SAP, y
              basta con que el vendedor esté ACTIVO. NO se exige que tenga
              cuenta de login en el WMS.

              Hasta v0.50.0 este texto decía que el código debía corresponder
              a "una cuenta con código de vendedor", y el middleware lo
              implementó tal cual: validaba contra la tabla de login. Con 16
              de los 19 vendedores activos de SAP sin usuario, eso dejaba
              1.800 de 2.638 clientes sin poder recibir un pedido. El
              contrato estaba mal, no el código.

              400 `salesperson_code_not_found` queda SOLO para un código que
              no existe en SAP o está inactivo. Ver la regla global 👤.

            El pedido queda atribuido a este vendedor para todo efecto
            (comisiones, filtros, asignación de clientes). Quién lo creó
            realmente se registra aparte en created_by.
        taken_at:
          type: string
          format: date-time
          nullable: true
          description: >
            ★ v0.48.0 — NULLABLE y NO obligatorio, como siempre lo fue: no
            está en `required`. Es cuándo el vendedor tomó el pedido EN LA
            CALLE, que puede diferir de cuándo llegó al servidor por el
            trabajo sin conexión.
        notes: { type: string, nullable: true }
        invoice_discount_pct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true
          description: >
            ★ NUEVO en v0.37.0. Descuento de DOCUMENTO, sobre el subtotal
            del pedido. Distinto del `line_discount_pct` de cada línea.

            Null o 0 = sin descuento de documento.

            ★ ORDEN DE APLICACIÓN, que decide el total:
              1. cada línea aplica su propio `line_discount_pct`
              2. el subtotal es la suma de esas líneas ya descontadas
              3. `invoice_discount_pct` se aplica sobre ese subtotal
              4. `freight_amount` se SUMA después, sin descontarse

            El flete queda fuera del descuento a propósito: se descuenta
            mercancía, no transporte.

            ★ POR QUÉ PORCENTAJE Y NO MONTO: es lo que SAP almacena a nivel
            de documento. Un cliente puede aceptar un monto en pantalla y
            calcular el porcentaje, pero conviene que muestre el valor
            resultante antes de confirmar — el redondeo puede dar unos
            centavos de diferencia contra el monto pedido, y eso se ve en la
            factura.
        freight_amount:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: >
            ★ NUEVO en v0.37.0. Cargo por flete, en la moneda del pedido.
            Se SUMA al total y no recibe el descuento de documento.

            Null o 0 = sin flete.

            SAP lo maneja como gasto adicional del documento con su propio
            código y cuenta contable. La correspondencia exacta se define
            al implementar el lado del sincronizador; el contrato solo
            transporta el monto.
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderLine' }
          description: >
            ★ v0.37.0 — el MISMO `item_code` PUEDE aparecer en varias
            líneas, y no solo dentro de un bloque de promoción.

            Es lo que permite vender el mismo producto con condiciones
            distintas en un mismo pedido: diez unidades a precio de lista y
            dos con un descuento negociado, cada una en su línea.

            Ya era así de hecho —el bloque de promoción manda condición y
            beneficio del mismo ítem en líneas separadas, y las facturas
            repiten ítems por diseño— pero no estaba dicho para las líneas
            normales.

    OrderLine:
      type: object
      required: [item_code, quantity, unit_price, price_list]
      properties:
        item_code: { type: string }
        quantity: { type: number, format: double, minimum: 0 }
        unit_price:
          type: number
          format: double
          minimum: 0
          description: CERO ES VÁLIDO (muestra / promoción).
        price_list: { $ref: '#/components/schemas/PriceListNumber' }
        line_discount_pct:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
          description: >
            100 ES VÁLIDO (ítem gratis de una promoción).

            ★ v0.29.0 — sin cambio de tipo, nota de negocio nueva. NULL se
            interpreta como 0.00 en el builder del snapshot de order-invoices
            (ya implementado, tarea 19) — el mismo criterio aplica aquí: el
            cliente debe enviar 0.00 explícito cuando no hay descuento, nunca
            omitir el campo ni enviar null.

            Regla de tope por rol (diseño intencional, no un tope pendiente de
            implementar):
            - VENDEDOR (app-sales): en el futuro tendrá un tope máximo
              configurable por ADMIN. Hoy no hay enforcement porque esa config
              de Admin aún no existe.
            - VENDEDOR_INSTITUCIONAL (Dashboard): SIN tope de validación
              server-side, de forma permanente e intencional. Cuando se
              implemente el tope para VENDEDOR, NO debe aplicarse a este rol.
        promotion_group_id:
          type: string
          format: uuid
          nullable: true
          description: >
            ★ v0.28.0, ACLARADO en v0.29.0. Si esta línea pertenece a un
            bloque de promoción, todas las líneas del mismo bloque
            (condición + beneficio) comparten el mismo
            promotion_group_id. Null para líneas normales sin promoción.

            ⚠️ EL VALOR DEBE SER EL promotion_id DE LA PROMOCIÓN — no un
            UUID nuevo generado por el cliente. El tipo es uuid porque
            promotion_id lo es, no porque haya que inventar uno. Un UUID
            generado por el cliente se rechaza con 400
            (code=invalid_promotion): "El promotion_group_id no
            corresponde a ninguna promoción".

            La redacción original de v0.28.0 no lo decía y se prestaba a
            leerlo como un identificador de agrupación arbitrario; esa
            ambigüedad causó una implementación equivocada en un cliente
            (ya corregida) y se aclara acá de forma explícita.

            El servidor rechaza (400, code=invalid_promotion) un pedido
            donde se eliminen solo ALGUNAS líneas de un mismo grupo: el
            bloque es indivisible, se agrega y se elimina completo.
        promotion_role:
          type: string
          enum: [CONDITION, BENEFIT]
          nullable: true
          description: >
            ★ NUEVO en v0.36.0. Qué papel cumple esta línea dentro del
            bloque de promoción.

            **OBLIGATORIO cuando `promotion_group_id` no es null.** Null en
            las líneas normales, y se ignora si viene sin
            `promotion_group_id`.

            ★ POR QUÉ HACÍA FALTA

            El rol existía conceptualmente y NO estaba representado en el
            dato. La validación no tenía con qué distinguir una línea de
            otra, así que agregaba cantidades por `item_code` y comparaba
            ese total contra la condición y contra el beneficio por
            separado.

            Con ítems distintos eso funcionaba POR ACCIDENTE —agrupar por
            ítem los separaba sin proponérselo— y con el mismo ítem se
            colapsaba: una promoción "lleve 10, pague 9" del mismo producto
            mandaba dos líneas (×10 y ×1) y el servidor veía 11, rechazando
            con `invalid_promotion`. Y aunque se arreglara la suma, el
            chequeo de descuento también fallaba: exigía que TODAS las
            líneas de ese ítem tuvieran el descuento del beneficio, y la de
            condición va al 0%.

            Eran dos colisiones, y las dos salían de lo mismo: inferir el
            rol en vez de conocerlo.

            ★ CÓMO SE VALIDA AHORA

            Las líneas `CONDITION` se comparan contra la condición de la
            promoción; las `BENEFIT` contra el beneficio, incluido su
            descuento. **Nunca por agregado de `item_code`.**

            Eso hace posible lo que antes no lo era: que la condición y el
            beneficio sean el mismo producto —la mecánica más común en
            distribución— y también un beneficio con descuento parcial, o
            una condición que ya venga con su propio descuento.

            ★ POR QUÉ EXPLÍCITO Y NO INFERIDO

            Se descartó deducirlo del descuento (se rompe con un beneficio
            parcial) y de la cantidad (indistinguible si condición y
            beneficio piden lo mismo). El cliente YA conoce el rol cuando
            arma el bloque desde el libro de promociones: pedirle que lo
            declare es más barato y más honesto que adivinarlo del otro
            lado.

            Es el mismo criterio que llevó a que el aprobador elija
            `base_line` en vez de deducirla del `item_code`.

    OrderDraftSummary:
      type: object
      description: >
        ★ NUEVO en v0.37.0. Un borrador en la lista, con lo mínimo para
        reconocerlo sin abrirlo.
      properties:
        draft_id: { type: string, format: uuid }
        title:
          type: string
          nullable: true
          description: Etiqueta libre que puso quien lo guardó.
        client_code: { type: string }
        client_name:
          type: string
          nullable: true
          description: >
            Resuelto al leer, no guardado — si el cliente cambió de nombre,
            se ve el actual.
        salesperson_code: { type: string, nullable: true }
        line_count: { type: integer }
        estimated_total:
          type: number
          format: double
          description: >
            Total calculado con lo que el borrador tiene guardado, en el
            mismo orden que define OrderCreate.

            ⚠️ Es ESTIMADO: los precios son los que estaban al guardar. No
            se recalcula contra las listas actuales, y el pedido real puede
            salir por otro monto.
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrderDraftDetail:
      allOf:
        - $ref: '#/components/schemas/OrderDraftSummary'
        - type: object
          properties:
            payload:
              allOf:
                - $ref: '#/components/schemas/OrderCreate'
              description: >
                El pedido guardado, tal cual se enviaría a POST /orders.
                Es lo que el carrito vuelve a cargar al retomarlo.

    OrderAccepted:
      type: object
      properties:
        client_uuid: { type: string, format: uuid }
        order_number: { type: string }
        status:
          $ref: '#/components/schemas/OrderStatus'
          # ★ v0.4.0 — APROBADA o RETENIDA_CARTERA
        hold_reason:
          allOf:
            - $ref: '#/components/schemas/HoldReason'
          nullable: true
          description: >
            ★ Presente solo si status = RETENIDA_CARTERA.
            Explica POR QUÉ, para mostrárselo al vendedor.
        total_amount:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.37.3. El total que calculó el SERVIDOR para este
            pedido, ya con el descuento de documento y el flete aplicados en
            el orden que define OrderCreate.

            La app debe GUARDARLO y MOSTRARLO, no recalcularlo sumando sus
            líneas. Antes de v0.37.3 no viajaba y la app lo reconstruía; eso
            era correcto mientras no existieron el descuento de documento ni
            el flete, y dejó de serlo con v0.37.0.

            Nulable solo por compatibilidad de lectura: un cliente que
            guarde pedidos viejos va a tener filas sin este dato.
        invoice_discount_pct:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.37.3. Descuento de documento aplicado, para que la
            app pueda EXPLICAR la diferencia entre la suma de sus líneas y
            `total_amount`. Null si no hubo.
        freight_amount:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.37.3. Flete cobrado. Misma razón que el anterior.
            Null si no hubo.
        lines_subtotal:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.39.0. Suma de los totales de línea, ANTES del
            descuento de documento y del flete, calculada por el SERVIDOR.

            Viaja para que el cliente no la sume por su cuenta. Sumar
            `line_total` parece inofensivo, pero es aritmética de negocio del
            lado del cliente: el día que el servidor redondee distinto de esa
            suma, la pantalla muestra una resta que no da y parece un error
            del total oficial, que es el número correcto.
        invoice_discount_amount:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.39.0. Cuánto DINERO quitó el descuento de
            documento. Null si no hubo descuento.

            Sin esto el cliente solo podía mostrar el porcentaje pelado, y el
            desglose no cerraba leyendo hacia abajo — había que calcular a
            mano cuánto quitó ese porcentaje. Con este campo el desglose es
            enteramente del servidor y su invariante es verificable por
            cualquiera:

              lines_subtotal − invoice_discount_amount + freight_amount
                = total_amount
        received_at: { type: string, format: date-time }

    # ═══════════════ ESTADO DE LA ORDEN, SYNC-DOWN (★ v0.4.1) ═══════════════
    OrderStatusUpdate:
      type: object
      description: >
        GET /sync/orders. Deliberadamente liviano: solo lo que puede cambiar
        DESPUÉS de que la app ya recibió la orden vía POST /orders -- no repite
        client_name/lines/notes (eso la app ya lo tiene).

        ★ v0.37.3 — `total_amount` SÍ viaja acá, y antes no. El texto viejo
        lo omitía diciendo "eso la app ya lo tiene", y era falso:
        `OrderAccepted` nunca lo devolvió, así que la app nunca lo tuvo.
        Además el total puede cambiar después de creado el pedido, y este es
        el único canal por el que ese cambio llega al vendedor.
      properties:
        client_uuid: { type: string, format: uuid }
        order_number: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        hold_reason:
          allOf:
            - $ref: '#/components/schemas/HoldReason'
          nullable: true
        total_amount:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.37.3. El total vigente del pedido según el
            SERVIDOR, ya con descuento de documento y flete. Si viene, la
            app lo MUESTRA tal cual y no lo recalcula; si viene nulo, cae a
            la suma de sus líneas. Nunca se mezclan las dos fuentes.
        invoice_discount_pct:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.37.3. Para que la app pueda explicar la diferencia
            entre la suma de sus líneas y `total_amount`. Null si no hubo.
        freight_amount:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.37.3. Misma razón que el anterior. Null si no hubo.
        lines_subtotal:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.39.0. Suma de los totales de línea, ANTES del
            descuento de documento y del flete, calculada por el SERVIDOR.

            Viaja para que el cliente no la sume por su cuenta. Sumar
            `line_total` parece inofensivo, pero es aritmética de negocio del
            lado del cliente: el día que el servidor redondee distinto de esa
            suma, la pantalla muestra una resta que no da y parece un error
            del total oficial, que es el número correcto.
        invoice_discount_amount:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.39.0. Cuánto DINERO quitó el descuento de
            documento. Null si no hubo descuento.

            Sin esto el cliente solo podía mostrar el porcentaje pelado, y el
            desglose no cerraba leyendo hacia abajo — había que calcular a
            mano cuánto quitó ese porcentaje. Con este campo el desglose es
            enteramente del servidor y su invariante es verificable por
            cualquiera:

              lines_subtotal − invoice_discount_amount + freight_amount
                = total_amount
        decision_note:
          type: string
          nullable: true
          description: Nota del aprobador, o MOTIVO del rechazo.
        decided_at:
          type: string
          format: date-time
          nullable: true
        received_at: { type: string, format: date-time }
        delivery_status:
          allOf:
            - $ref: '#/components/schemas/DeliveryStatus'
          nullable: true
          description: >
            ★ v0.11.0 — El resultado de la entrega, para que el VENDEDOR sepa
            qué pasó con su pedido. NULL mientras no se haya registrado.
        delivery_reason:
          type: string
          nullable: true
          description: >
            ★ v0.11.0 — Por qué no se entregó (o se entregó parcial), legible
            para el vendedor. Con NO_ENTREGADO trae el motivo del pedido; con
            ENTREGADO_PARCIAL, un resumen de los ítems rechazados.
        delivered_at:
          type: string
          format: date-time
          nullable: true
          description: ★ v0.11.0 — Cuándo se registró la entrega.

    OrderSummary:
      type: object
      properties:
        client_uuid: { type: string, format: uuid }
        order_number: { type: string }
        salesperson_code: { type: string }
        client_code: { type: string }
        client_name: { type: string }
        taken_at:
          type: string
          format: date-time
          nullable: true
          description: >
            ★ v0.48.0 — NULLABLE. Cuándo el vendedor tomó el pedido en la
            calle. Null = no se informó; el cliente puede omitirlo al crear.

            ⚠️ NO SE SUSTITUYE POR `received_at`. Rellenarlo con la hora de
            llegada al servidor convertiría un "no sé" en una afirmación
            falsa sobre la calle. Lo que ordena las grillas es
            `received_at`, que nunca es null.
        received_at: { type: string, format: date-time }
        line_count: { type: integer }
        total_amount:
          type: number
          format: double
          description: >
            ★ v0.37.0 — el total FINAL: líneas con sus descuentos, menos el
            descuento de documento, más el flete. O sea que desde v0.37.0
            NO tiene por qué coincidir con la suma de las líneas.
        invoice_discount_pct:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.37.0. Descuento de documento aplicado. Null si no
            hubo.

            Viaja acá porque sin él un cliente que sume las líneas obtiene
            un número distinto de `total_amount` y no puede explicar la
            diferencia.

            ★ v0.37.3 — este texto decía "lo ven las tres apps iOS" y era
            falso: OrderSummary es superficie de Dashboard y admin. Las
            apps lo reciben por `OrderAccepted` y `OrderStatusUpdate`.
        freight_amount:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.37.0. Flete cobrado. Null si no hubo. Misma razón
            que el anterior.
        lines_subtotal:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.39.0. Suma de los totales de línea, ANTES del
            descuento de documento y del flete, calculada por el SERVIDOR.

            Viaja para que el cliente no la sume por su cuenta. Sumar
            `line_total` parece inofensivo, pero es aritmética de negocio del
            lado del cliente: el día que el servidor redondee distinto de esa
            suma, la pantalla muestra una resta que no da y parece un error
            del total oficial, que es el número correcto.
        invoice_discount_amount:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.39.0. Cuánto DINERO quitó el descuento de
            documento. Null si no hubo descuento.

            Sin esto el cliente solo podía mostrar el porcentaje pelado, y el
            desglose no cerraba leyendo hacia abajo — había que calcular a
            mano cuánto quitó ese porcentaje. Con este campo el desglose es
            enteramente del servidor y su invariante es verificable por
            cualquiera:

              lines_subtotal − invoice_discount_amount + freight_amount
                = total_amount
        exceeds_controlled_sale:
          type: boolean
          description: >
            ★ NUEVO en v0.41.0. Al menos un ítem de este pedido superó el
            tope de venta controlada de su vendedor.

            Se calcula AL CREAR el pedido y se guarda: no se recalcula al
            leer. Si se recalculara, el aviso cambiaría solo con el paso del
            tiempo —al cerrarse otras órdenes— y dejaría de decir qué pasaba
            cuando se tomó este pedido, que es lo único que interesa.

            AVISA, NO BLOQUEA: el pedido entró igual y nadie tiene que
            aprobarlo. Es rastro, no compuerta.

            La grilla solo necesita saber cuáles marcar; el desglose por ítem
            está en `OrderDetail.controlled_sale_warnings`. El reparto es
            deliberado, no un olvido.
        status: { $ref: '#/components/schemas/OrderStatus' }
        hold_reason:
          allOf:
            - $ref: '#/components/schemas/HoldReason'
          nullable: true
        notes: { type: string, nullable: true }
        created_by:
          type: string
          nullable: true
          description: >
            ★ NUEVO en v0.30.0. Usuario que CREÓ el pedido, distinto de
            salesperson_code (a quién pertenece).

            Para un pedido tomado por un VENDEDOR o VENDEDOR_INSTITUCIONAL,
            coincide con su propio usuario. Para uno tomado por un ADMIN
            desde el carrito del Dashboard a nombre de otro vendedor, es el
            ADMIN — mientras salesperson_code apunta al vendedor dueño.

            NULL en pedidos anteriores a v0.30.0 (la columna nace vacía; no
            se puede reconstruir quién los creó).
        decided_by:
          type: string
          nullable: true
          description: Usuario admin que aprobó o rechazó. NULL si aún no hay decisión.
        decided_at:
          type: string
          format: date-time
          nullable: true
          description: Cuándo se tomó la decisión. NULL si aún no hay decisión.
        decision_note:
          type: string
          nullable: true
          description: >
            Nota del aprobador, o MOTIVO del rechazo (obligatorio al rechazar).
            ★ El VENDEDOR lo verá: es lo que le permite explicarle al cliente
            por qué su pedido no procedió.
        shipping_route:
          type: string
          nullable: true
          description: >
            ★ PRECISADO EN v0.42.2 — la ZONA DE VISITA DEL VENDEDOR, heredada
            del cliente (`U_RSAP_ROUTE`). Es para la persona que vende, NO
            para logística: no se usa para armar camiones.

            El nombre legible está en `shipping_route_name`.
        shipping_route_name:
          type: string
          nullable: true
          description: >
            ★ NUEVO en v0.42.2. Nombre de la zona de visita, heredado del
            cliente igual que el código.

            Está acá y no sólo en `AdminClient` porque esta superficie ya
            llevaba `shipping_code_name` para el otro eje: tener el nombre de
            una zona y no de la otra en el mismo objeto es la asimetría que
            este proyecto ya pagó cuatro veces.

            ⚠️ Se resuelve contra el cliente en CADA lectura, a diferencia de
            `shipping_code_name`, que se congela al recibir la orden. Cambiar
            la zona de visita de un cliente cambia lo que muestran sus
            órdenes viejas.
        shipping_code:
          type: integer
          nullable: true
          description: >
            ★ Código LOGÍSTICO de la orden (U_RSAP_SHIPPING_CODE del cliente).
            ES el criterio para agrupar en camiones.
        shipping_code_name:
          type: string
          nullable: true
          description: >
            Nombre legible de la zona de REPARTO (BNX3, BRK1…), congelado al
            recibir la orden.
        truck_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Camión al que está asignada la orden. NULL = sin camión
            ("sin asignar"). El admin la ve marcada para decidir.

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/OrderDetailLine' }
            controlled_sale_warnings:
              type: array
              description: >
                ★ NUEVO en v0.41.0. Un elemento por ítem de venta controlada
                cuyo tope superó el vendedor al tomar este pedido. Vacío si
                no hubo ninguno.

                Es una FOTO del momento de la creación, guardada — no se
                recalcula al leer. Por eso trae los números con los que se
                decidió y no los de hoy.
              items:
                type: object
                properties:
                  item_code: { type: string }
                  item_name: { type: string }
                  limit:
                    type: number
                    format: double
                    description: El tope vigente cuando se tomó el pedido.
                  open_quantity_before:
                    type: number
                    format: double
                    description: >
                      Lo que el vendedor ya tenía en órdenes abiertas de este
                      ítem ANTES de este pedido.
                  quantity_in_order:
                    type: number
                    format: double
                    description: Cuánto agregó este pedido.
                  open_quantity_after:
                    type: number
                    format: double
                    description: >
                      La suma resultante. Es la que superó el tope — se
                      manda ya sumada para que ninguna pantalla vuelva a
                      hacer la cuenta.

    OrderDetailLine:
      type: object
      properties:
        item_code: { type: string }
        item_name: { type: string }
        quantity: { type: number, format: double }
        pallets:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/PalletPlacement' }
          description: >
            ★ NUEVO en v0.49.0. En qué pallet viajó cada parte de este ítem.

            Está acá para que la oficina pueda responder dónde viajó una caja
            cuando el cliente reclama, sin tener que reconstruirlo del
            recuerdo de nadie. El bodeguero ya lo veía mientras repartía; al
            cerrar el carril esa información se perdía.

            ⚠️ NULL y VACÍO no son lo mismo. `null` = el pedido todavía no se
            repartió —lo normal en un pedido recién aprobado—. `[]` = se
            repartió y de este ítem no viajó nada, porque hubo faltante.
        unit_price: { type: number, format: double }
        price_list: { $ref: '#/components/schemas/PriceListNumber' }
        line_discount_pct:
          type: number
          format: double
          nullable: true
          description: >
            ★ v0.48.0 — NULLABLE. Null = no se informó descuento en esa
            línea. Para el cálculo equivale a "sin descuento", pero NO es lo
            mismo que un 0 explícito: uno es silencio y el otro una
            decisión.
        line_total:
          type: number
          format: double
          description: Puede ser 0 (promoción) — es VÁLIDO.

    # ═══════════════ ORDEN RETENIDA CON CONTEXTO (★ v0.4.0) ═══════════════
    HeldOrder:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          description: >
            Orden retenida, ENRIQUECIDA con el contexto de cartera del cliente,
            para que el admin pueda decidir sin salir de la bandeja.
          properties:
            client_credit:
              $ref: '#/components/schemas/ClientCredit'
            credit_after_order:
              type: number
              format: double
              description: >
                credit_available − total_amount.
                Cuánto cupo quedaría si se aprueba. Negativo = lo excede.
            overdue_amount_from_sage:
              type: number
              format: double
              description: >
                Cuánto de la mora viene de la migración de Sage.
                Contexto útil: una deuda de arrastre puede negociarse distinto
                que una mora reciente.

    AdminCatalogItem:
      type: object
      properties:
        item_code: { type: string }
        name: { type: string }
        category: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        price_list_1: { type: number, format: double }
        price_list_2: { type: number, format: double }
        price_list_3: { type: number, format: double }
        has_price_1: { type: boolean }
        has_price_2: { type: boolean }
        has_price_3: { type: boolean }
        no_price_any_list: { type: boolean }
        stock: { type: number, format: double }
        committed:
          type: number
          format: double
          description: >
            ★ DEFINIDO en v0.41.0 (el campo existía sin descripción, y se
            dedujo mal). Unidades de este ítem que ya están vendidas pero que
            SAP todavía cuenta como stock.

            NO lleva la cuenta de lo vendido: TAPA EL RETRASO entre que algo
            se vende y que SAP se entera. `stock` es el número de SAP, y SAP
            no sabe nada de un pedido del WMS hasta que se emite la factura.

            Una línea de pedido cuenta acá mientras su mercancía siga adentro
            del `stock` de SAP y todavía vaya a salir:
              · RECHAZADA no cuenta — no va a salir nunca.
              · FACTURADA deja de contar — el stock de SAP ya bajó, seguir
                restando es contar dos veces la misma unidad.
              · ENTREGADA SIN FACTURAR sigue contando — sin factura el stock
                de SAP no bajó, la ventana sigue abierta.

            No hay condición sobre los estados de entrega: hay que facturar
            antes de asignar el driver, así que cuando la mercancía sale la
            orden ya salió del comprometido.
        available:
          type: number
          format: double
          description: >
            ★ DEFINIDO en v0.41.0. `stock − committed`. Puede ser negativo si
            hay más comprometido que stock, y eso es un dato real, no un
            error.
        out_of_stock:
          type: boolean
          description: >
            ★ NUEVO en v0.40.0. `available <= 0` O `stock <= 0`, resuelto por
            el SERVIDOR.

            Viaja resuelto y no como regla a implementar: tres clientes
            calculando la misma condición por separado son tres chances de que
            divergan, y nadie las compara. Mismo criterio que `total_amount`
            desde v0.37.3.

            ⚠️ QUÉ HACE Y QUÉ NO: el cliente no debe ofrecer agregar al
            carrito un ítem con `true`, y debe mostrarlo marcado. Pero el
            servidor NO rechaza un pedido que lo incluya, y es deliberado: la
            app del vendedor trabaja offline sobre el catálogo sincronizado y
            el stock de SAP cambia durante el día. Rechazar al crear daría
            rechazos al vendedor en ruta por ítems que tenía en stock al
            sincronizar, cuando el sistema resuelve el faltante en el
            alistamiento a propósito.
        visible_in_catalog:
          type: boolean
          description: >
            ★ NUEVO en v0.41.0. Decisión COMERCIAL del WMS, distinta de
            `active`, que es la bandera de SAP y es dato maestro. Un ítem
            puede estar activo en SAP y oculto por decisión, o al revés.

            ⚠️ Un ítem oculto SIGUE VIAJANDO en `GET /sync/catalog`, con este
            campo en `false`. Ese endpoint es un delta con `since`: un ítem
            que simplemente dejara de aparecer no le diría nada al cliente,
            que lo conservaría en su base local para siempre. La ocultación
            tiene que viajar para poder aplicarse.
        controlled_sale:
          type: boolean
          description: >
            ★ NUEVO en v0.41.0. Ítem de venta controlada: hay un tope de
            unidades por vendedor sobre sus órdenes abiertas.
        controlled_sale_limit:
          type: number
          format: double
          nullable: true
          description: >
            ★ NUEVO en v0.41.0. El tope, en UNIDADES, por vendedor, sobre la
            suma de sus órdenes ABIERTAS de este ítem — misma definición de
            "abierta" que `committed`: no RECHAZADA y todavía no facturada.

            No es un cupo por día ni por pedido: es exposición simultánea, y
            se libera solo cuando las órdenes se cierran.

            `null` cuando `controlled_sale` es `false`. AVISA, NO BLOQUEA: el
            pedido que lo excede entra igual y queda marcado.
        image_url:
          type: string
          nullable: true
          description: >
            ★ NUEVO en v0.40.0. La imagen del ítem, la misma que ven las apps
            por `CatalogItem.image_url`.

            ★ v0.41.0 — CAMBIA cuando cambia la imagen: lleva una versión
            derivada del contenido, para que un cliente que la haya cacheado
            traiga la nueva. Tratala como OPACA: no la construyas ni la
            parsees.

            Estaba solo en el schema de las apps, así que la pantalla del
            Dashboard desde donde se van a administrar las imágenes no podía
            ver la que el ítem ya tiene. Cobertura real hoy: cero de 539
            ítems — poblarlo es la segunda mitad de este bloque.
        active: { type: boolean }

    AdminClient:
      type: object
      properties:
        client_code: { type: string }
        name:
          type: string
          nullable: true
          description: >
            ★ v0.49.1 — NULLABLE. Hoy no hay un solo cliente sin nombre en
            2.638, pero la columna lo admite y cero casos no es
            imposibilidad. Ante la duda, nullable (ver v0.48.0).
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        zipcode: { type: string, nullable: true }
        manager_name: { type: string, nullable: true }
        shipping_route:
          type: string
          nullable: true
          description: >
            ★ v0.48.0 — NULLABLE: null = el cliente NO TIENE zona
            asignada. Es un hueco real de datos maestros, no un dato ilegible.

            ★ CORREGIDO EN v0.42.1 — LA ZONA DE VISITA DEL VENDEDOR (de
            `OCRD.U_RSAP_ROUTE`). Es la clasificación COMERCIAL que se les da
            a los vendedores: a qué zona vende y visita cada uno. Catorce
            zonas, identificadas por número.

            Es una zona, igual que `shipping_code` — lo que las separa es
            PARA QUÉ: ésta es para la PERSONA que vende, aquélla para el
            CAMIÓN que entrega. Un cliente puede estar en una zona de reparto
            y ser visitado por un vendedor de otra.

            ⚠️ Rotularla "ruta" a secas la hace leer como recorrido de
            camión. El rótulo tiene que decir de quién es la visita.

            El nombre legible está en `shipping_route_name` desde v0.42.2.

            ⚠️ Viaja como `string` aunque el dato de origen sea entero. Es
            superficie vieja que las tres apps ya consumen; queda así a
            propósito, no por descuido.

            Se resuelve contra el cliente en CADA lectura, a diferencia de
            `shipping_code`, que se congela en la orden al recibirla: cambiar
            la ruta de un cliente cambia lo que muestran sus órdenes viejas.
        shipping_route_name:
          type: string
          nullable: true
          description: >
            ★ NUEVO en v0.42.2. El nombre de la zona de VISITA DEL VENDEDOR
            (Bronx y Manhtt, Queens Retail, Long Island…), de la tabla de
            usuario `@RSAP_ROUTE`.

            `null` cuando el cliente no tiene zona de visita asignada — hay 5
            así sobre 2.638, y siguen en el catálogo a propósito: la vista
            usa `LEFT JOIN` justamente para que no desaparezcan por no tener
            nombre.

            ⚠️ Cuatro de las catorce zonas NO son lugares (Admon, Aliados,
            Sales Manager, Telemarketing), y dos que sí lo parecen están
            partidas por canal y no por geografía (Queens foodservices contra
            Queens Retail). Es clasificación COMERCIAL: no la uses para nada
            que dependa de dónde queda el cliente.
        shipping_code:
          type: integer
          nullable: true
          description: >
            ★ NUEVO en v0.42.0, ★ PRECISADO EN v0.42.1 — ZONA DE REPARTO:
            para el CAMIÓN que entrega. Treinta y seis códigos. La vista ya
            lo exponía y esta superficie no lo recibía.

            Además determina QUÉ DÍAS DE LA SEMANA recibe entregas este
            cliente, que es para lo que existe
            `/admin/shipping-codes/{code}/delivery-days`.

            No confundir con `shipping_route`, que también es una zona pero
            para la VISITA DEL VENDEDOR.

            ★ v0.42.2 — pasa de `string` a `integer`, para coincidir con el
            mismo campo en `OrderSummary`. Estaba con dos tipos según dónde
            se leyera.
        shipping_code_name:
          type: string
          nullable: true
          description: >
            ★ NUEVO en v0.42.0, ★ PRECISADO EN v0.42.1. El nombre de la zona
            de reparto (BNX3, BRK1, QNS2).

            ⚠️ Es el nombre de `shipping_code`, NUNCA de `shipping_route`.
            Los dos son zonas del cliente y ninguna agrupa por lo que agrupa
            la otra: ésta es la del CAMIÓN que entrega, la otra la de la
            VISITA DEL VENDEDOR. Un cliente puede estar en una y ser visitado
            desde la otra.

            El rótulo en pantalla tiene que decir para qué es la zona —
            "zona de reparto"— y nunca "zona" a secas.
        salesperson_code: { type: string }
        salesperson_name:
          type: string
          nullable: true
          description: >
            ★ NUEVO en v0.42.0. El nombre del vendedor asignado, resuelto por
            el servidor desde el espejo de vendedores de SAP — el mismo
            `display_name` que devuelven `/admin/salespersons` y
            `/admin/sap-salespersons`.

            Viaja resuelto para que ningún cliente tenga que cruzar dos
            listas para mostrar un nombre. `null` si el código no
            corresponde a ningún vendedor del espejo, que es un dato en sí
            mismo y no un error de la pantalla.
        default_price_list: { $ref: '#/components/schemas/PriceListNumber' }
        additional_price_list:
          type: integer
          enum: [1, 2, 3]
          nullable: true
        authorized_price_lists:
          type: array
          items: { $ref: '#/components/schemas/PriceListNumber' }
        credit:
          $ref: '#/components/schemas/ClientCredit'
          # ★ v0.4.0 — el admin ve la cartera en la grilla.

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

security:
  - bearerAuth: []