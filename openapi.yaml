        asignárselas a su salesperson_code como a cualquier otro vendedor;
        sin asignación el libro sale vacío y POST /orders rechaza el bloque.

        ★ v0.28.0. Solo devuelve
        las promociones ACTIVE, dentro de su vigencia (valid_from ≤ hoy
        ≤ valid_to), y asignadas al vendedor en cuestión
        (PromotionSalesperson). Un vendedor nunca ve las inactivas, las
        vencidas, ni las de otros vendedores.
      parameters:
        - name: q
          in: query
          description: Búsqueda por título, código de ítem, o nombre de ítem
          schema: { type: string }
        - name: salesperson_code
          in: query
