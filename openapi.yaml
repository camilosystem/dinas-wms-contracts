    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.33.0 — LA DEVOLUCIÓN DE RUTA PRECARGA LA SOLICITUD
    ══════════════════════════════════════════════════════════════════════════

    ★ EL PROBLEMA
      El driver ya captura en ruta todo lo que una solicitud de crédito
      necesita: cliente, ítem, cantidad, motivo y foto. Y después alguien en
      oficina lo vuelve a escribir a mano en la pantalla del Dashboard.

      El mismo dato, dos veces. Y el campo con más riesgo de transcripción
      es el motivo, que determina la cuenta contable, el almacén destino y
      si el stock vuelve como vendible o no. Un DANADO transcrito como
      NO_LO_QUIERE manda mercancía dañada al stock bueno.

    ★ QUÉ CAMBIA
      · `CreditRequestCreate` gana `source_return_id` — la devolución de la
        que nació la solicitud.
      · `ProductReturn` gana `credit_request_uuid` — la solicitud que ya se
        creó desde ella, si existe.

      Las dos mitades del mismo vínculo. Sin ellas, crear dos créditos
      desde la misma devolución sería INVISIBLE: cada uno se vería
      perfectamente válido, y serían dos créditos por la misma mercancía.

    ★ EL MAPEO DE MOTIVOS NO ES UNO A UNO
      Las dos taxonomías no coinciden, y eso es lo que hace que la precarga
      tenga que PROPONER y no transcribir:

        DANADO        → DAMAGED          (almacén 07, no vendible)
        EXPIRADO      → DAMAGED          (vencido tampoco es vendible)
        NO_LO_QUIERE  → DOESNT_WANT_IT   ⚠️ corregible a MISTAKE

      MISTAKE no existe del lado del driver: si se envió el artículo
      equivocado, él lo trae igual y solo puede marcarlo NO_LO_QUIERE. La
      oficina lo corrige.

      SHORT tampoco, y con razón: un faltante nunca llegó al cliente, así
      que no hay nada que el driver traiga. Ese motivo seguirá naciendo en
      el Dashboard o en la app de ventas.

    ★ LO QUE NO HIZO FALTA
      Ningún endpoint nuevo. `GET /admin/returns` ya devuelve todo lo que
      la precarga necesita: client_code, client_name, y los ítems con
      item_code, item_name, quantity y reason.

      `client_reference` (la referencia que dio el cliente: factura,
      remisión) es TEXTO LIBRE — sirve como pista para que la persona
      busque la factura, no como invoice_doc_num.

