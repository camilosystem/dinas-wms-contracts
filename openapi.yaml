openapi: 3.0.3
info:
  title: Dinas WMS — API
  version: 0.51.0
  description: >
    Contrato de la API del middleware Dinas WMS.

    ══════════════════════════════════════════════════════════════════════════
    ⏰ REGLA GLOBAL — TODO EL SISTEMA TRABAJA EN HORA DE NUEVA YORK
    ══════════════════════════════════════════════════════════════════════════

    ★ v0.36.0. Vale para TODA la superficie, no solo para lo que la
    menciona explícitamente.

    Cualquier campo de tipo `date`, cualquier filtro por fecha y cualquier
    noción de "hoy" se resuelven contra el **día calendario de Nueva York**
    (`America/New_York`), NUNCA contra el día UTC.

    Los `date-time` siguen siendo instantes en UTC — eso no cambia. Lo que
    cambia es cómo se deriva un DÍA a partir de un instante, y contra qué
    calendario se compara una fecha.

    ★ POR QUÉ ESTÁ ESCRITO ACÁ Y NO CAMPO POR CAMPO

    Porque el error se repitió en cinco lugares distintos antes de que
    alguien lo tratara como una regla y no como cinco bugs:

      · La vigencia de promociones — se perdían las últimas cuatro horas de
        cada día, justo en la franja de venta en ruta, y el vendedor recibía
        un rechazo sin poder explicarlo.
      · La fecha de factura — SAP rechazaba con -5002 toda facturación
        posterior a las 20:00, porque el día UTC ya era el siguiente y SAP
        compara contra su fecha de sistema.
      · El listado de camiones, las devoluciones, los pagos y el tablero de
        picking — cada uno escondiendo el trabajo del propio día a partir de
        esa misma hora.

    El día UTC empieza a las 20:00 de Nueva York en verano y a las 19:00 en
    invierno. Todo lo que se calcule en UTC deja de coincidir con el
    calendario del negocio durante las últimas horas de cada jornada — que
    son, justamente, cuando la operación está más activa.

    ★ Y VA LA ZONA, NO UN DESFASE

    `America/New_York`, no un número. Nueva York es UTC−4 en verano y UTC−5
    en invierno; un offset fijo se equivoca por una hora medio año.

    ★ ALCANCE

    Aplica al middleware, al Dashboard y a las tres apps. Un cliente que
    calcule "hoy" con el reloj UTC —por ejemplo con `toISOString()`— manda
    el día equivocado durante esa franja y reproduce el problema desde su
    lado, aunque el servidor esté bien.

    ══════════════════════════════════════════════════════════════════════════
    👤 REGLA GLOBAL — UN VENDEDOR NO NECESITA CUENTA PARA SER DUEÑO DE ALGO
    ══════════════════════════════════════════════════════════════════════════

    ★ v0.50.0. Vale para TODA la superficie, no solo para lo que la menciona.

    **Un `salesperson_code` es un hecho de SAP. Una cuenta de login es un
    hecho del WMS.** Son dos cosas distintas y NADA que atribuya un
    documento a un vendedor puede exigir la segunda.

    Un pedido, un pago o una solicitud de crédito pertenecen al vendedor que
    los tomó, tenga o no usuario para entrar al WMS. La cuenta sirve para
    trabajar dentro del sistema; la pertenencia es del negocio y existe
    antes.

    ★ EN CONCRETO
      · Validar que un `salesperson_code` existe se hace contra el ESPEJO DE
        SAP (`SapSalespersons`), y se acepta si está activo.
      · Poblar un selector de "a qué vendedor pertenece esto" se hace con la
        misma fuente.
      · La tabla de cuentas de login solo se consulta para responder quién
        puede ENTRAR al sistema, o para mostrar a quién falta aprovisionar
        (`GET /admin/sap-salespersons`, campo `has_login_account`).

    ★ POR QUÉ ESTÁ ESCRITO ACÁ Y NO EN CADA ENDPOINT
      Porque el error se repitió CINCO veces antes de que alguien lo tratara
      como una regla y no como cinco bugs:

        · v0.21.1 — `GET /admin/salespersons` no mostraba los vendedores
          reales de SAP, solo las cuentas creadas. La pantalla de gestionar
          usuarios no podía decir quién faltaba.
        · v0.29.0 — el mismo endpoint filtraba por `Role=VENDEDOR`, dejando
          fuera al VENDEDOR_INSTITUCIONAL. Role es autorización del WMS; SAP
          no tiene ningún concepto de rol.
        · v0.33.2 — `salesperson_code` en las solicitudes de crédito salía
          del TOKEN de quien cargaba, no del cliente. Producía atribución
          cruzada real.
        · La validación de clientes ya lo había resuelto bien, en otro
          archivo, con el motivo escrito al lado: *"la mayoría de los
          vendedores de SAP nunca tendrá cuenta aquí; rechazar a sus
          clientes por eso era un falso negativo, no una validación"*.
        · v0.50.0 — la creación de pedidos validaba contra la tabla de
          login. **1.800 clientes de 2.638 quedaban bloqueados**: 16 de los
          19 vendedores activos de SAP no tienen usuario, y a sus clientes
          no se les podía cargar un pedido.

      La quinta no fue un descubrimiento nuevo: fue no haber aplicado a dos
      carpetas de distancia lo que el propio código ya había aprendido.

    ★ CÓMO SE VERIFICA QUE NO VUELVA
      Cualquier validación de pertenencia que consulte la tabla de cuentas
      de login está mal por definición, aunque hoy pase los tests: los datos
      de prueba suelen tener cuenta para los tres o cuatro vendedores que se
      usan, y el 84% que no la tiene no aparece en ningún test.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.51.0 — DESARMAR UN PALLET, Y BORRAR UNO CREADO POR ERROR
    ══════════════════════════════════════════════════════════════════════════

    Un bodeguero se equivoca: crea un pallet de más, o arma uno que después
    no le sirve. Hasta acá un pallet se podía crear y no se podía deshacer.

    ★ DOS VERBOS, PORQUE SON DOS ACTOS FÍSICOS DISTINTOS
      · `POST .../pallets/{pallet_id}/clear` — DESARMAR. Baja todo lo que
        tiene y lo devuelve a "sin repartir". El pallet sigue existiendo,
        vacío.
      · `DELETE .../pallets/{pallet_id}` — RETIRAR el pallet. Solo si está
        VACÍO → 409 `pallet_not_empty` si tiene algo.

      Separados a propósito. Borrar un pallet lleno y devolver su contenido
      en el mismo movimiento es una operación que hace dos cosas y muestra
      una: el bodeguero ve desaparecer el pallet y no ve que le volvieron
      diez ítems a la lista de pendientes. Desarmar primero lo obliga a ver
      qué quedó suelto, que es lo que después tiene que volver a ubicar.

      Y es el orden del mundo real: primero se baja la mercancía, después se
      retira el pallet.

    ★ `clear` DEVUELVE LO QUE LIBERÓ
      No un OK a secas: la lista de lo que quedó sin repartir. Sin eso, el
      bodeguero desarma un pallet y tiene que salir a buscar qué se soltó.

    ★ EL NÚMERO DE UN PALLET BORRADO NO SE REUSA
      Si se borra el Regular-2, el próximo pallet regular es el Regular-3.
      El correlativo nunca retrocede.

      Porque la etiqueta es FÍSICA: alguien pudo haberla escrito en el
      plástico o pegado en el pallet antes de que se borrara. Dos pallets
      con el mismo rótulo el mismo día es un error que aparece recién en la
      calle, cuando el driver busca "Queens-Regular-2" y hay dos, o hubo
      dos.

    ⚠️ CANTIDAD 0 NO ES UNA ASIGNACIÓN — Y NO VIAJA
      Al bajar una asignación a cero, el registro interno puede quedar; lo
      que NO puede es salir. `in_pallets`, `Pallet.assignments` y
      `PalletPlacement` NUNCA incluyen entradas con `quantity: 0`.

      Un cero ahí es un fantasma: dice "este ítem está en el pallet A"
      cuando ya no hay nada de ese ítem en A. Lo vería el bodeguero al
      revisar, el driver en su parada, y el manifiesto lo imprimiría —
      "Pallet A: 0 cajas" es una instrucción para ir a buscar algo que no
      está.

      Se resuelve EN EL SERVIDOR y no en cada cliente a propósito: tres
      clientes filtrando la misma condición por separado son tres chances de
      que uno se olvide, y nadie los compara. Mismo criterio que
      `out_of_stock` desde v0.40.0.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.50.0 — LA PERTENENCIA SE VALIDA CONTRA SAP, NO CONTRA EL LOGIN
    ══════════════════════════════════════════════════════════════════════════

    ★ EL DAÑO, MEDIDO
      Crear un pedido desde el Dashboard fallaba con
      `salesperson_code_not_found` para el 68% de la cartera. La causa: la
      validación corría contra la tabla de cuentas de login, y 16 de los 19
      vendedores activos de SAP no tienen usuario del WMS.

        · 19 vendedores activos en SAP — 3 con cuenta de login.
        · 2.638 clientes — 1.800 sin poder recibir un pedido nuevo.

      No era un caso raro: era la mayoría. Y el error decía "no corresponde
      a ninguna cuenta de vendedor", que es cierto y sin embargo manda a
      buscar el problema al lugar equivocado — parece un código mal escrito
      cuando en realidad el código era correcto y la pregunta estaba mal
      hecha.

    ★ QUÉ CAMBIA
      1. `OrderCreate.salesperson_code` se valida contra el ESPEJO DE SAP y
         se acepta si el vendedor está ACTIVO. Ya no se exige cuenta de
         login. 400 `salesperson_code_not_found` queda solo para un código
         que no existe en SAP o está inactivo.

      2. `GET /admin/salespersons` cambia de fuente: devuelve los vendedores
         ACTIVOS del espejo de SAP, no las cuentas de login. Su propósito
         siempre fue poblar selectores de PERTENENCIA —"a qué vendedor
         pertenece este pago", "de qué vendedor es este pedido"— y para eso
         la verdad es SAP. Hoy devolvía 3 de 19.

      3. Se escribe la regla global 👤 arriba de este changelog, porque es
         la quinta vez.

    ★ LOS DOS ENDPOINTS DE VENDEDORES AHORA SE DISTINGUEN POR PROPÓSITO
      Se parecen y no son lo mismo:

        · `GET /admin/salespersons` — a quién puede PERTENECER un documento.
          Vendedores activos de SAP. Es la fuente de todo selector de
          atribución.
        · `GET /admin/sap-salespersons` — a quién FALTA aprovisionar. Los
          mismos, más `is_active` y `has_login_account`. Es la pantalla de
          administración de usuarios.

      Uno responde una pregunta de negocio y el otro una de administración.
      Antes el primero respondía la segunda a medias, y por eso fallaba.

    ⚠️ EL CONTRATO TAMBIÉN ESTABA MAL, NO SOLO EL CÓDIGO
      `OrderCreate.salesperson_code` decía textualmente que el código "debe
      corresponder a una cuenta con código de vendedor" y mandaba a usar
      `GET /admin/salespersons` para el selector. El middleware implementó
      exactamente lo que estaba escrito. La corrección empieza acá.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.49.1 — SE CIERRAN LAS ÚLTIMAS DIVERGENCIAS DE NULABILIDAD
    ══════════════════════════════════════════════════════════════════════════

    Solo TEXTO y nulabilidad. Cierra lo que quedó abierto de v0.48.0 para
    que la guarda que compara los dos documentos pueda arrancar en verde.

    ★ SEIS OCURRENCIAS QUE PASAN A NULLABLE
      · `payment_channel` (tres vistas) — null cuando el método no es
        EFECTIVO ni CHEQUE. Ya lo decía la descripción; ahora lo dice el
        schema.
      · `AdminClient.name` — la columna admite null aunque hoy no haya
        ninguno en 2.638 clientes. Se declara nullable por la regla de
        v0.48.0: cero nulos hoy no es imposibilidad, y equivocarse en este
        sentido no rompe a nadie.
      · `ShippingCodeConfig.name` y el `shipping_code_name` de
        `/admin/trucks/available-orders` — hay 16 clientes cuyo código no
        tiene nombre en la UDT.

    ★ `InvoiceApplication.amount` PASA A NULLABLE, Y ES UNA DECISIÓN, NO UN
      AJUSTE
      Hoy el monto confirmado se resuelve con `?? 0` antes de salir. El 0 no
      miente sobre el efecto —un pago rechazado o pendiente no aplicó nada—
      pero borra una distinción que sí importa al conciliar:

        · `0` — el aprobador MIRÓ esta factura y decidió no aplicarle nada.
        · `null` — todavía no se confirmó. Nadie decidió nada.

      Un cero es una decisión documentada; un null es su ausencia. Colapsar
      las dos hace que una imputación jamás revisada se lea como una
      revisada y descartada, y eso es precisamente lo que alguien intenta
      reconstruir cuando un pago no cuadra.

      Es además el mismo patrón `?? 0` del bug del precio de v0.33.3: una
      ausencia convertida en un número que se lee como una afirmación. Se
      corta acá por la misma razón, aunque hoy no esté causando daño.

      Sigue siendo UN solo schema para propuestas y confirmadas: en las
      propuestas el monto nunca es null, y declarar nullable algo que nunca
      lo es no rompe a nadie.

    ★ LA REGLA PARA LA GUARDA DE NULABILIDAD (capa 5)
      Las dos direcciones NO son simétricas y la guarda no debe tratarlas
      igual:

        · El proceso puede mandar null donde el contrato promete un valor
          → FALLA. Rompe a un cliente con datos reales.
        · El contrato admite null donde el proceso siempre manda un valor
          → SE INFORMA, NO FALLA.

      La segunda es la dirección segura, y v0.48.0 la volvió norma: "ante la
      duda, nullable". Una guarda que falle ahí estaría castigando
      exactamente la elección que el contrato ordena hacer, y empujaría a
      declarar obligatorio para poner el test en verde — que es el error
      caro.

      Se informa igual, porque un campo que nunca es null puede ser señal de
      otra cosa. Pero se lee, no se obedece.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.49.0 — EN QUÉ PALLET QUEDÓ CADA ÍTEM
    ══════════════════════════════════════════════════════════════════════════

    ★ LO QUE YA ERA LEGAL Y NO HACE FALTA CAMBIAR
      Un pedido repartido entre varios pallets ya está permitido desde
      v0.10.0, y partir la cantidad de un mismo ítem entre dos pallets
      también. `assign-to-pallet` recibe `(order_uuid, item_code, pallet_id,
      quantity)` y es idempotente por esa tripleta: el mismo ítem del mismo
      pedido puede estar en dos pallets con cantidades distintas.

      Se dice explícito porque la necesidad —repartir por peso y tamaño, que
      diez cajas pesadas no entran en un solo pallet— podría hacer pensar
      que hay que abrir algo. No hay nada que abrir del lado del servidor.

    ★ LO QUE FALTABA: EL INFORME NO DECÍA QUÉ ÍTEM QUEDÓ EN QUÉ PALLET
      El bodeguero SÍ lo veía —`OrderDistributionProgress.items[].in_pallets`
      lo trae desde v0.10.0— pero esa información moría al cerrar el carril.
      El manifiesto, la app del driver y el detalle del pedido solo tenían
      `pallet_labels`: la lista de pallets del pedido, sin decir qué hay en
      cada uno.

      Con un pedido en un solo pallet eso alcanzaba. Con un pedido repartido
      en cuatro, "está en estos cuatro pallets" no le sirve a nadie: el
      driver los abre todos para encontrar dos cajas, y la oficina no puede
      responder dónde viajó un ítem cuando el cliente reclama.

    ★ QUÉ SE AGREGA — `PalletPlacement`, EL MISMO SCHEMA EN TRES LUGARES
      · Manifiesto — `stops[].orders[].items[]`, con sus pallets.
      · App del driver — `DriverOrder.lines[].pallets`.
      · Detalle del pedido — `OrderDetailLine.pallets`.

      Un solo schema y no tres formas parecidas, por la misma razón de
      siempre: tres definiciones del mismo dato divergen el día que una
      cambia, y nadie las compara.

    ⚠️ NULL Y VACÍO NO SIGNIFICAN LO MISMO
      · `pallets: null` — el pedido TODAVÍA NO SE REPARTIÓ. No hay dato,
        no hay pallets, no hay nada que mostrar.
      · `pallets: []` — se repartió y de este ítem NO viajó nada. Pasa
        cuando hubo faltante y no se recogió ninguna unidad.

      Son dos situaciones distintas para quien lee: una es "esperá", la
      otra es "este ítem no va". Tratar las dos igual es exactamente el
      error que este proyecto ya pagó varias veces con listas vacías.

    ★ `pallet_labels` SE QUEDA
      No se deprecia. Es el resumen que sirve para cargar y descargar el
      camión de un vistazo, y el detalle por ítem no lo reemplaza: son dos
      preguntas distintas —"¿qué pallets bajo en esta parada?" contra
      "¿en cuál está esta caja?"—. Ahora es derivable del detalle, y el
      servidor lo sigue calculando para que nadie tenga que derivarlo.

    ★ LO QUE NO CAMBIA: CONGELADO Y SECO NO SE MEZCLAN
      Un ítem congelado sigue exigiendo pallet FROZEN, y cada bodeguero
      sigue trabajando su carril. La libertad de repartir por peso y tamaño
      existe DENTRO de cada carril. La cadena de frío no es una preferencia
      de organización.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.48.0 — EL CONTRATO ADMITE LOS NULOS QUE YA EXISTEN
    ══════════════════════════════════════════════════════════════════════════

    Ningún endpoint nuevo y ningún campo nuevo: veintitantas propiedades que
    el contrato declaraba obligatorias y que el proceso puede mandar en null.
    Se corrige el contrato, porque en todos estos casos el null es legítimo y
    significa algo.

    ★ DE DÓNDE SALEN
      De medir la nulabilidad entre el OpenAPI servido y este archivo: 103
      ocurrencias sobre 2.959 propiedades en la dirección peligrosa —el
      contrato promete un valor y el proceso puede mandar null—. Un cliente
      que no espera null ahí se rompe con datos reales, no con datos raros.

      ⚠️ Y ESTO EL BARRIDO NO LO VEÍA. Las cuatro capas comparan NOMBRES de
      propiedades: el campo está en los dos documentos y la capa queda
      verde mientras uno dice "siempre viene" y el otro manda null. Es la
      segunda ceguera de la misma familia —la primera fue el 404 de
      `/route`, que era "cuándo se devuelve cada código"—. Verde en el
      barrido sigue sin significar que el contrato describa a la API.

    ★ UN NULL NO ES UN CERO NI UN VACÍO — QUÉ SIGNIFICA CADA UNO
      Se escriben uno por uno porque la diferencia importa:

        · `taken_at` null — no se sabe cuándo se tomó el pedido en la calle.
          NO se rellena con `received_at`: eso inventaría un dato de calle
          que nadie registró. Ningún cálculo ni pantalla debe sustituir uno
          por el otro.
        · `row_count` / `rows_upserted` null — esa fuente NUNCA se refrescó.
          Distinto de 0, que es "se refrescó y no trajo filas". La
          diferencia es justamente lo que se va a mirar cuando algo falle.
        · `shipping_route` null en un cliente — no tiene zona asignada. Es
          un hueco de datos maestros real (cinco clientes hoy) y la pantalla
          debe decirlo, no dejar la celda en blanco.
        · `manager_name` null — 99,5% de los clientes. La ausencia es la
          norma, no la excepción.
        · `line_discount_pct` null — no se informó descuento en esa línea.
          A efectos de cálculo es "sin descuento", pero NO es lo mismo que
          un 0 explícito: uno es silencio y el otro es una decisión.
        · `transfer_bank_account` null — el pago no fue por transferencia.

    ★ POR QUÉ EL CONTRATO Y NO EL CÓDIGO, EN LOS 25 CASOS
      Porque en ninguno el null es un hueco que alguien deba llenar: son
      datos opcionales por naturaleza, o ausencias con significado. La
      medición buscó específicamente la otra cubeta —el dato que debería
      existir siempre y un camino no llena— y no encontró ninguno.

    ★ `taken_at`: LA ASIMETRÍA QUE LO DECIDE
      No está en `required` de `OrderCreate` y nunca lo estuvo, así que un
      cliente puede omitirlo legítimamente. Hacerlo obligatorio ahora
      rompería a cualquiera que hoy lo omite, para ganar un dato que de
      todos modos no se puede reconstruir hacia atrás. Y rellenarlo con
      `received_at` sería peor: convertiría "no sé" en una afirmación falsa
      sobre la calle.

    ★ LA REGLA GENERAL, PARA NO VOLVER A DISCUTIR CASO POR CASO
      Ante la duda de si un campo puede ser null, se declara NULLABLE.

      El error no es simétrico: declarar nullable algo que nunca es null no
      rompe a nadie —el cliente escribe una rama que no se ejecuta—;
      declarar obligatorio algo que puede faltar rompe en producción con un
      dato real. Por eso `category`, que hoy no tiene un solo null en 539
      ítems pero viene de SAP y podría no venir, se declara nullable
      igual.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.47.2 — `price_source` PUEDE SER NULL, Y UN PRECIO 0 ES AUSENCIA
    ══════════════════════════════════════════════════════════════════════════

    Solo TEXTO. Dos cosas que la implementación resolvió bien por criterio
    propio y que el contrato no decía — que es exactamente cuándo hay que
    escribirlas, antes de que el próximo las resuelva distinto.

    ★ 1. `price_source` ES NULLABLE, Y NULL NO ES UN ORIGEN MÁS
      v0.47.1 lo declaró obligatorio. No puede serlo: las solicitudes
      anteriores existen y de la mayoría no se puede afirmar de dónde salió
      su precio.

      El backfill solo afirma lo demostrable — `unit_price > 0` era el
      único camino que resolvía antes, así que esas son INVOICED. Las que
      quedaron en 0 son las víctimas del bug original y **ningún valor del
      enum es cierto para ellas**: no son PLACEHOLDER, que significa
      exactamente 1.00. Inventarles un origen haría pasar por resuelto un
      precio que nunca lo estuvo.

      Entonces NULL significa una sola cosa: *"no se puede afirmar de dónde
      salió"*. Quien aprueba tiene que verlo como lo que es —un dato sin
      procedencia— y no como una categoría más.

      ⚠️ ESTO ES LO QUE EL BARRIDO NO PUEDE VER. Las cuatro capas comparan
      NOMBRES de propiedades: `price_source` está en los dos documentos y
      la capa 4 queda verde igual, con el contrato diciendo "siempre viene"
      y el proceso mandando null. Es la misma ceguera que dejó pasar el 404
      de `/route`, con otra cara.

    ★ 2. UN PRECIO 0 SE TRATA COMO AUSENTE, EN CUALQUIER ESLABÓN
      En el espejo, "sin precio" no es null: es **0**. Las tres listas son
      decimales no nulos, así que un ítem sin precio cargado trae 0, no un
      hueco.

      Cada eslabón de la cadena pregunta `> 0`, no `!= null`. Preguntar por
      null aceptaría el 0 como precio válido y reintroduciría el bug por la
      puerta de al lado: la solicitud volvería a guardarse en cero, ahora
      con un `price_source` que afirma que el precio se resolvió.

      Consecuencia deliberada: un ítem cuya lista 3 vale 0 cae al eslabón
      siguiente, y si ninguno resuelve termina en PLACEHOLDER 1.00. Un
      artículo vendible con precio cero no es un precio, es un dato que
      falta.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.47.1 — SIN PRECIO NO SE RECHAZA: VALE 1.00 Y DECIDE QUIEN APRUEBA
    ══════════════════════════════════════════════════════════════════════════

    Corrige una regla de v0.47.0 que NO llegó a implementarse. Ningún
    cliente depende de ella.

    ★ SE ELIMINA EL 400 `price_unresolved`
      v0.47.0 decía que si no se podía resolver ningún precio y la línea no
      traía `proposed_amount`, la creación se rechazaba. Sale.

      LA REGLA, dicha por quien manda el negocio: *"No tengo problema con
      aquellos ítems que no tienen precio o no se les puede determinar una
      lista de precio: simplemente pongamos como valor $1 y que sea el
      encargado de aprobaciones quien determine el monto final. Si lo
      autoriza por $1, está bien."*

      Es coherente con v0.47.0: quien decide es el aprobador, y el
      servidor no le pone puertas al que pide. Un 400 por un precio que
      falta en SAP frena a la persona equivocada por un problema que no es
      suyo.

    ★ LA CADENA COMPLETA
      `unit_price` se resuelve así, y `price_source` dice cuál se usó:

        1. INVOICED       Último precio facturado a ese cliente.
        2. PRICE_LIST_3   Lista 3 del ítem — la sugerencia por defecto.
        3. PRICE_LIST_1   Lista 1, si no hay 3.
        4. PRICE_LIST_2   Lista 2, si no hay 3 ni 1.
        5. PLACEHOLDER    Ninguna: **1.00**, un número puesto a propósito.

      Los pasos 3 y 4 rescatan pocos ítems —se midieron 4 sobre 539— y aun
      así valen: un precio real de catálogo siempre es mejor punto de
      partida que un número inventado, y cuestan una línea. El 19% de ítems
      sin lista 3 casi todo es "sin ningún precio en SAP", que es otro
      problema y ya tiene su herramienta (`only_without_price` en el
      catálogo de admin).

    ★ POR QUÉ 1.00 Y NO 0
      Porque 0 es el bug que empezó todo. `cantidad × null` → 0 guardaba
      solicitudes en cero que el aprobador podía aprobar sin notar nada:
      un cero se lee como "no corresponde acreditar", que es una frase con
      sentido, y por eso pasa desapercibido.

      1.00 no se lee como nada. Tres cajas por 3.00 es un número que
      obliga a mirar. Y si el aprobador lo aprueba tal cual, es una
      decisión suya y explícita — que es exactamente lo que se pidió.

    ⚠️ POR ESO `price_source` NO ES OPCIONAL DE MOSTRAR
      Un PLACEHOLDER y un precio facturado se ven igual: un número. Quien
      aprueba tiene que ver que ese 1.00 es un relleno y no el precio del
      producto. El Dashboard debe marcarlo distinto — no basta con
      mostrarlo entre los demás.

    ★ `unit_price` YA NO PUEDE SER NULL EN SOLICITUDES NUEVAS
      La cadena siempre termina en un número. Sigue declarado nullable por
      las solicitudes anteriores a esta versión, que pueden tenerlo.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.47.0 — SE ACREDITA LO QUE LA OFICINA DECIDA ACREDITAR
    ══════════════════════════════════════════════════════════════════════════

    ★ SE ELIMINA EL RECHAZO `item_never_invoiced_to_client` (v0.33.3)
      Ya no hay ninguna restricción de ítem ni de factura para crear una
      solicitud de crédito. Cualquier `item_code` del catálogo, con o sin
      `invoice_doc_num`.

      LA REGLA DE NEGOCIO, dicha por quien la manda: *"No debe haber
      restricciones de Item o facturas para las solicitudes de Crédito,
      Siempre habrá una persona que las revisa y las autoriza o las
      rechaza. También es una práctica común hacer créditos a un cliente
      sin necesidad de relacionar la factura: a veces simplemente se le
      autoriza un monto y se le acredita a la cuenta del cliente."*

      v0.33.3 trataba una solicitud como una afirmación contable que había
      que poder respaldar. No lo es: es un PEDIDO, y el respaldo lo pone el
      aprobador cuando decide. Poner la puerta antes del pedido rechaza al
      que pide, no al que decide.

    ★ EL BUG QUE v0.33.3 ARREGLABA SIGUE MUERTO, POR OTRA VÍA
      Aquel rechazo no nació de una política: nació de un bug. Cuando el
      último precio facturado no se podía resolver, `unit_price` quedaba en
      null y el cálculo hacía `cantidad × null` → **0**. La solicitud se
      guardaba con monto 0, el `calculated_amount` lo sumaba en silencio, y
      el aprobador veía un cero aprobable.

      Rechazar la solicitud mataba el bug, pero de la forma más cara: le
      cerraba la puerta al caso legítimo para no tener que resolver el
      cálculo.

      Ahora se resuelve donde estaba el problema. `unit_price` se busca en
      cadena y viaja diciendo DE DÓNDE SALIÓ (`price_source`).

      ⚠️ EL FINAL DE ESA CADENA CAMBIÓ EN v0.47.1, ANTES DE IMPLEMENTARSE.
      Esta versión declaraba un tercer caso `NONE` que rechazaba con 400
      `price_unresolved` cuando no había ningún precio y la línea no traía
      `proposed_amount`. Eso NO rige: hoy la cadena termina en un relleno
      de 1.00 (`PLACEHOLDER`) y la creación nunca falla por falta de
      precio. Ver el changelog de v0.47.1 y el schema `PriceSource`.

      Lo que sí rige y no cambió: un precio que no se pudo resolver NUNCA
      se convierte en `0`. Ésa es la garantía que v0.33.3 quería y la que
      se conserva.

    ★ POR QUÉ LISTA 3 Y NO LA LISTA DEL CLIENTE
      Porque no se está reconstruyendo una venta: se está SUGIRIENDO un
      número para que el aprobador tenga de dónde partir. Cuando la venta
      existió, su precio real ya llega por la vía INVOICED. Cuando no
      existió, no hay venta que reconstruir, y elegir la lista del cliente
      simularía una precisión que no hay.

      Y es una sugerencia en el sentido literal: lo más probable es que
      quien autoriza la BAJE. Por eso viaja con `price_source`, que es lo
      que le dice al aprobador cuánto confiar en el número que está viendo.

    ★ QUÉ SIGNIFICAN LAS LÍNEAS AHORA
      Cambia el peso de `lines`. Ya no son la reconstrucción contable de
      una venta: son sobre todo **la referencia de qué y cuánto hay que
      recoger** —lo que el driver va a buscar cuando la solicitud además es
      una recogida (v0.45.0)— y una propuesta de monto que una persona
      ajusta.

      La modalidad SIN ítems sigue existiendo y sigue siendo legítima: un
      monto acreditado a la cuenta del cliente, sin ítems y sin factura.

    ★ UN COSTO QUE DESAPARECE
      v0.33.3 dejaba escrito su propio precio: una devolución real de un
      ítem sin historia con ese cliente —código cambiado, vendido bajo otro
      código, entregado fuera del flujo normal— quedaba rechazada, y la
      única salida era una solicitud SIN ítems, que genera nota de SERVICIO
      y **no devuelve stock**. La plata se acreditaba y la mercancía que
      volvió físicamente no reingresaba al inventario.

      Con la restricción afuera, esos casos vuelven a poder cargarse CON
      ítems, que es la vía que sí mueve inventario. El costo estaba
      documentado y aceptado; ya no hay que pagarlo.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.46.1 — `sap-status` SIEMPRE FUE SOLO DE ADMIN
    ══════════════════════════════════════════════════════════════════════════

    Solo TEXTO, y corrige un dato FALSO que v0.46.0 publicó.

    v0.46.0 dice que `GET /admin/sap-status` "hasta ahora lo leía cualquier
    usuario autenticado" y que la restricción a ADMIN es un cambio de esta
    versión. Es falso en las dos mitades: el endpoint vive en un controlador
    con `[Authorize(Roles = ADMIN)]` a nivel de clase desde el día que
    nació, y hay un test que lo afirma desde entonces —un token de vendedor
    recibe 403—.

    Lo único que v0.46.0 cambió fue DECLARARLO. La autorización no se tocó
    porque no había nada que tocar.

    ★ POR QUÉ SE CORRIGE EN VEZ DE DEJARLO PASAR
      Un contrato que narra mal la historia de una autorización es peor que
      uno que no la narra. Alguien que lea v0.46.0 dentro de seis meses va a
      concluir que hubo una ventana en la que cualquier usuario autenticado
      leía errores crudos de SAP, y esa ventana no existió. Sobre esa
      conclusión falsa se toman decisiones reales: una auditoría, un
      cambio "de vuelta", una explicación a alguien de afuera.

      Lo que sí sigue siendo cierto y se mantiene escrito: `last_error` es
      texto crudo de SAP y por eso el endpoint es de ADMIN. La razón no
      cambia; lo que cambia es que no es nueva.

    ★ DE DÓNDE SALIÓ EL ERROR
      De un dato mal reportado que yo publiqué sin verificar contra el
      proceso. Es la misma falla que v0.45.3 corrigió en `/route`, y la
      regla que queda es la misma: **lo que el contrato afirma sobre el
      comportamiento del proceso se verifica contra el proceso**, no contra
      lo que alguien recuerda del proceso.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.46.0 — LO QUE ENCONTRÓ EL BARRIDO CONTRA EL PROCESO
    ══════════════════════════════════════════════════════════════════════════

    Nada de esto nace de una necesidad nueva. Son tres divergencias entre lo
    que el contrato dice y lo que el proceso hace, encontradas por el test
    que compara los dos documentos. Se resuelven acá porque el contrato es
    donde se decide de qué lado va la corrección.

    ★ 1. `GET /admin/sap-status` — SE DECLARA, Y PASA A SER SOLO DE ADMIN
      Existía desde el 15 de julio, servido y sin declarar: superficie que
      nadie gobernaba. La regla no admite término medio — si algún cliente
      lo llama, va al contrato; si no lo llama nadie, sale del proceso.

      Se declara porque el dato es el que hace falta cuando algo va mal:
      qué fuente del espejo se refrescó, cuándo tuvo su último éxito, con
      qué error falló, y si lleva demasiado sin actualizarse. Eso hoy sólo
      se puede saber entrando a la base.

      ⚠️ CORREGIDO EN v0.46.1 — lo que sigue era FALSO y se deja tachado a
      propósito, porque el contrato ya se publicó con esto: v0.46.0 decía
      que el endpoint "hasta ahora lo leía cualquier usuario autenticado" y
      que la restricción a ADMIN era un cambio de esta versión. No lo era:
      es solo de ADMIN desde que nació, con test que lo afirma. Lo único
      que v0.46.0 cambió fue declararlo, y NINGUNA app puede haberse roto.

      Lo que sí es cierto: `last_error` es texto de error crudo de SAP
      —nombres de objetos, detalles de conexión, a veces datos— y por eso
      el endpoint es de ADMIN, igual que su hermano
      `POST /admin/sap-refresh/trigger`.

    ★ 2. `not_delivered_orders[].reason` PASA A LLAMARSE `order_reason`
      El contrato decía `reason` y el proceso sirve `order_reason`. Gana el
      proceso, por dos razones que apuntan al mismo lado:

        · `order_reason` es como se llama ese mismo campo en
          `DeliveryRecord` y en `POST /dispatch/orders/{uuid}/deliver`. Un
          motivo a nivel pedido se llama igual en todo el contrato o no se
          entiende en ninguno.
        · Quien lo lea hoy está leyendo `order_reason`, porque es lo que
          llega. Renombrar del otro lado rompería a un cliente que hoy
          funciona, para cumplir una promesa que nunca se cumplió.

      No es una laxitud: es la misma regla de v0.45.3 —cuando el código
      hace lo correcto y el contrato dice otra cosa, se corrige el
      contrato— y no vale como precedente para dejar pasar una divergencia
      donde el código esté mal.

    ★ 3. LO QUE EL BARRIDO ENCONTRÓ Y NO SE ARREGLA ACÁ
      `OrderSummary` declara `decided_at`, `decided_by` y `decision_note`
      —17 operaciones— y el proceso no los sirve. Ahí el contrato tiene
      razón y el que falta es el código: quién aprobó o rechazó un pedido y
      cuándo es dato real, ya guardado, y el Dashboard no lo puede mostrar
      porque nunca llega. Se implementa del lado del middleware; el
      contrato no cambia.

    ★ LO QUE ESTE BLOQUE DEMUESTRA, Y ES LO QUE MÁS IMPORTA
      La capa que compara los NOMBRES DE PROPIEDADES encontró, en su
      primera corrida, que `pickup_count` —declarado en `TruckSummary` y en
      `RouteStop` por v0.45.0— no estaba implementado en ninguno de los
      dos. Cuarta vez de la misma clase: el contrato promete un campo, el
      DTO no lo tiene, y todo compila y todo pasa.

      Las tres anteriores (`sap_reference`, `line_id`, `salesperson_code`)
      se encontraron por casualidad, semanas después. Ésta se encontró
      dentro del mismo bloque que la introdujo.

    ⚠️ Y LO QUE EL BARRIDO NO PUEDE HACER
      Las cuatro capas comparan QUÉ EXISTE, no QUÉ SIGNIFICA. Ninguna
      habría encontrado el 404 de v0.45.3, donde los dos documentos
      declaraban códigos parecidos y diferían en cuándo se devuelve cada
      uno. Verde en el barrido NUNCA significa "el contrato describe lo que
      la API hace".

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.45.3 — EL CONTRATO SE ALINEA AL CÓDIGO EN `/route`
    ══════════════════════════════════════════════════════════════════════════

    Solo TEXTO, y esta vez la corrección va contra el contrato: lo que decía
    era erróneo, y el proceso hacía lo correcto.

    ★ QUÉ DECÍA MAL
      `GET /admin/trucks/{truck_id}/route` declaraba 404 para "el camión no
      existe **o no tiene orden de paradas aún**". El middleware, desde
      antes de este bloque, responde 200 con `has_route: false` y `stops:
      []` cuando el camión existe y no tiene secuencia.

      El código tiene razón y el contrato estaba mal. Un 404 mezcla dos
      situaciones que exigen respuestas distintas de quien llama —"ese
      camión no existe" y "ese camión existe y todavía no tiene ruta"— y
      además hace inútil a `has_route`, que existe justamente para decir la
      segunda. Una respuesta que nunca puede traer `false` en ese campo no
      necesita el campo.

      v0.45.2 empeoró esto: escribió la consecuencia de la invalidación
      DENTRO de la descripción del 404, consagrando un comportamiento que
      nunca existió. La garantía que quería dar sigue en pie —después de
      invalidar, el estado es idéntico a "nunca se importó"— y ahora se
      expresa donde corresponde.

    ★ CÓMO QUEDA
      · 404 — SOLO si el camión no existe.
      · 200 con `has_route: false` y `stops: []` — el camión existe y no
        tiene secuencia, sea porque nunca se importó o porque se invalidó.
        Indistinguible entre esos dos casos, a propósito: la acción es la
        misma.

    ★ CÓMO SE ENCONTRÓ, Y POR QUÉ IMPORTA MÁS QUE EL ERROR
      No se encontró leyendo el código: se encontró CRUZANDO el contrato
      contra el OpenAPI que sirve el proceso, endpoint por endpoint. Es la
      única forma de ver esta clase de divergencia — el código funciona, el
      contrato se lee bien, y la diferencia sólo aparece cuando se los pone
      lado a lado.

      Es la sexta vez en este proyecto que el contrato y la implementación
      difieren sin que nada falle. Todas las anteriores se encontraron por
      casualidad.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.45.2 — INVALIDAR BORRA LAS PARADAS, Y `lines: null`
    ══════════════════════════════════════════════════════════════════════════

    Solo TEXTO. Dos cosas que estaban implícitas y una de ellas ya se había
    implementado bien por criterio propio — que es exactamente cuando hay
    que escribirla, antes de que el próximo la implemente distinto.

    ★ INVALIDAR NO ES APAGAR UN BOOLEANO: LAS PARADAS SE BORRAN
      v0.45.1 dijo que cambiar el conjunto de paradas pone `has_route` en
      `false`. No alcanza.

      `POST /dispatch/returns` y el manifiesto leen las paradas guardadas
      SIN mirar `has_route`. Si las filas quedaran ahí, la secuencia
      invalidada seguiría siendo la verdad justo en los dos lugares donde
      importa: el driver validaría contra un recorrido que ya no describe al
      camión, y el manifiesto imprimiría un orden obsoleto. La invalidación
      sería invisible donde tenía que ser visible.

      Entonces: al invalidar, las paradas se BORRAN. `has_route: false` y
      sin secuencia guardada. Hay que reimportar de OptimoRoute.

    ⚠️ CONSECUENCIA QUE HAY QUE DECIR: `GET /admin/trucks/{truck_id}/route`
      responde 404 después de una invalidación, igual que si nunca se
      hubiera importado. Desde ahí NO se distingue "todavía no se importó"
      de "se invalidó porque cambiaron las paradas".

      No se agrega un campo para distinguirlas porque la acción es la misma
      —importar— y un campo nuevo solo para explicar el pasado invita a que
      alguien decida con él. Lo que sí hay que hacer es AVISAR EN EL
      MOMENTO: la respuesta de montar o desmontar una recogida ya trae
      `has_route: false`, y ese es el único instante en que el admin puede
      entender por qué perdió la secuencia. Si la pantalla no lo dice ahí,
      el admin se entera media hora después, en una pantalla que le dice
      404 sin explicación.

    ★ `lines: null` ES LO MISMO QUE OMITIR `lines`
      El texto decía "si se OMITE, es la modalidad SIN ítems". Un cliente
      que manda `lines: null` explícitamente está diciendo lo mismo y el
      servidor debe tratarlo igual.

      Se escribe porque el Dashboard manda `null` y el contrato decía
      "omite": dos lecturas razonables de la misma frase, y la diferencia
      entre ellas es un 400 que nadie sabría explicar. La modalidad se
      infiere de lo mismo de siempre — `lines` con contenido = CON ítems;
      `lines` ausente o null + `manual_amount` = SIN ítems. Una `lines: []`
      NO es la modalidad sin ítems: es una solicitud con ítems y ninguno,
      y se rechaza con 400.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.45.1 — LO QUE v0.45.0 DIJO DE MÁS SOBRE route-import
    ══════════════════════════════════════════════════════════════════════════

    Solo TEXTO: ningún campo nuevo, ninguna puerta nueva. Pero cambia una
    regla de validación, así que no es cosmético.

    ★ LA FRASE QUE ESTABA DE MÁS
      v0.45.0 dice: «Agrupando por cliente, `route-import` no cambia en
      NADA». Eso es cierto del EMPAREJAMIENTO —sigue siendo un Stop # por
      `client_code`, y ésa es la parte que importaba— y falso del CONJUNTO
      contra el que valida.

      El import rechaza con 400 los `client_code` que "no están en el
      camión", y ese conjunto era "clientes con órdenes". Ahora es
      **clientes con órdenes ∪ clientes con recogidas**.

    ★ POR QUÉ NO ES UN DETALLE
      Sin esa corrección el bloque se cierra sobre sí mismo, y de la peor
      manera: sin ningún error visible en el camino.

        1. `route-export` incluye al cliente de pura recogida — correcto.
        2. Vuelve en el CSV de OptimoRoute con su Stop #.
        3. El import lo rechaza como código extraño → 400.
        4. El admin lo saca del CSV para que el import pase.
        5. La parada nunca se crea. El driver no la ve.
        6. Y si igual va, `POST /dispatch/returns` la rechaza: "no es una
           parada de esta ruta".

      Cada paso individual parece razonable. El resultado es una recogida
      que existe en tres pantallas y en ninguna ruta.

    ★ MONTAR UNA RECOGIDA PUEDE INVALIDAR LA SECUENCIA YA IMPORTADA
      Si la recogida CREA una parada nueva —un cliente que no tenía nada en
      ese camión— y el camión ya tenía su orden de paradas importado, la
      secuencia queda INVALIDADA: `has_route` vuelve a `false` y hay que
      reimportar.

      La alternativa era dejar la parada con `stop_number: null`, y eso es
      exactamente la clase de pérdida silenciosa que este proyecto ya pagó
      varias veces: el manifiesto, la ruta del driver y la pantalla de
      cierre ordenan por `stop_number`, así que una parada sin número no
      aparece en ninguna de las tres. Existe en la base y no existe en la
      calle.

      La otra alternativa —que el servidor la agregue como última parada—
      es peor: inventaría un recorrido que ningún software de mapas
      calculó, con la forma de uno que sí.

      Invalidar es ruidoso a propósito. `assign` exige `has_route`, así que
      el camión no avanza hasta que alguien reimporte. Ese es el punto.

      Si la recogida se suma a una parada que YA existe (el cliente ya
      tenía pedidos), no pasa nada: la parada ya tiene número.

    ★ MISMA REGLA AL DESMONTAR
      Quitar la última recogida de un cliente sin pedidos borra su parada, y
      eso también invalida la secuencia.

      ⚠️ ASIMETRÍA CONOCIDA, NO RESUELTA ACÁ: quitar la última ORDEN de un
      cliente después de importar deja hoy una parada huérfana sin invalidar
      nada. Es anterior a este bloque y menos grave —una parada de más se
      ve; una parada de menos no—, pero es la misma falla. Queda anotada
      como decisión pendiente, no como cosa que no vimos.

    ★ UNA INVARIANTE QUE SE PUEDE VERIFICAR
      En una misma solicitud, `source_return_id` y `pickup.return_id` NUNCA
      pueden tener el mismo valor.

      Son los dos sentidos del vínculo: `source_return_id` es la devolución
      de la que NACIÓ la solicitud; `pickup.return_id` es la devolución que
      la solicitud MANDÓ a buscar. Que coincidan significa que registrar la
      recogida escribió el enlace de nacimiento, y con eso la garantía de
      "un solo crédito por mercancía devuelta" queda inservible sin que
      nada falle.

      Se escribe como igualdad de dos campos del contrato justamente para
      que se pueda comprobar con un test, y no quede como una advertencia
      que hay que recordar.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.45.0 — UNA SOLICITUD DE CRÉDITO PUEDE SER UNA PARADA
    ══════════════════════════════════════════════════════════════════════════

    Hasta acá un camión llevaba UNA sola clase de cosa: pedidos que se
    ENTREGAN. Pero una solicitud de crédito muchas veces significa que hay
    que ir a BUSCAR mercancía donde el cliente, y eso también necesita un
    camión — solo que en la dirección contraria.

    ★ NO TODA SOLICITUD ES UNA RECOGIDA
      Primero alguien la marca como tal. Un crédito por diferencia de
      precio, o un SHORT (mercancía que nunca llegó al cliente), no tiene
      nada que recoger. Por eso la recogida es una MARCA explícita y no algo
      que el sistema deduzca del motivo: los motivos no alcanzan para
      decidirlo y adivinarlo mandaría camiones a buscar aire.

    ★ DOS ACTOS, NO UNO
      1. MARCAR (`POST /admin/credit-requests/{request_uuid}/pickup`), desde
         la misma bandeja de pendientes. Es una decisión sobre la mercancía.
      2. MONTAR en un camión (`POST /admin/trucks/{truck_id}/pickups`). Es
         un acto de logística.

      Están separados porque casi nunca pasan en el mismo momento: la
      solicitud llega hoy y el camión que va a esa zona se arma mañana. Si
      marcar exigiera elegir camión, habría que inventar un camión para
      poder marcar.

    ★ LA VENTANA DE CADA UNO ES DISTINTA — Y ESO ES DELIBERADO
      · MARCAR: solo mientras la solicitud está PENDIENTE_APROBACION.
      · MONTAR: en cualquier momento después de marcada, decidida o no.

      Porque APROBAR Y RECOGER SON VÍAS SEPARADAS. El aprobador decide sin
      esperar a que la mercancía vuelva, y el camión la recoge sin esperar
      la decisión. Ninguna de las dos es requisito de la otra, y el contrato
      no pone ninguna puerta entre ellas.

      Consecuencia que hay que decir en voz alta: una solicitud RECHAZADA
      puede seguir montada en un camión. El sistema NO la desmonta solo.
      Sacarle una parada a un camión que alguien ya armó —o peor, que el
      driver ya descargó— por un cambio de estado en otra pantalla es
      exactamente la clase de cosa que nadie ve hasta que el driver llega y
      no encuentra la parada. Se muestra el estado de la solicitud junto a
      la parada (`TruckPickup.request_status`) y decide una persona.

    ★ UNA PARADA POR CLIENTE — LA RECOGIDA SE SUMA A LA QUE YA HAY
      Si el cliente ya tiene pedidos en ese camión, la recogida NO agrega
      una parada: se suma a la del cliente. El camión pasa UNA vez y hace
      las dos cosas.

      Esto no es una preferencia de presentación: TODO el andamiaje de
      paradas agrupa por `client_code` —`RouteExportStop`, el `Order #` del
      CSV de OptimoRoute, el emparejamiento de `route-import`, `RouteStop`,
      `DriverStop`—. Dos paradas para el mismo cliente le devolverían UN
      solo Stop # a dos filas, y el import ya no sabría a cuál aplicarlo.
      Agrupando por cliente, `route-import` no cambia en NADA.

    ⚠️ UNA PARADA PUEDE NO TENER PEDIDOS
      Un cliente que solo tiene recogida es una parada con `orders: []`.
      Vale para `RouteExportStop` (`order_count: 0`, `subtotal: 0`), para el
      manifiesto, para `DriverStop` y para la pantalla de cierre.

      Quien pinta esas pantallas NO puede tratar "sin pedidos" como "no hay
      nada que hacer acá" ni filtrar la parada por tener la lista vacía. Es
      la parada donde hay que ir a buscar. Se dice explícito porque este
      proyecto ya perdió datos así: una lista vacía que en realidad
      significaba otra cosa.

    ★ LO QUE UNA RECOGIDA NO TOCA
      No se alista, no se pica, no va en un pallet, no tiene monto, no
      entra en `invoice-readiness` ni en `send-to-invoicing`, y no cambia
      `order_count` ni `total_amount` del camión. No hay nada que preparar
      en bodega para ir a buscar mercancía. Los carriles de picking y sus
      contadores la ignoran por completo.

      Y NO VIAJA A SAP. `SapCreditRequestSyncTask` queda exactamente como
      estaba: lo que va a SAP es la nota de crédito cuando se aprueba, y eso
      no cambió. La recogida es un movimiento de camión, no un documento.

    ★ EL CAMIÓN SIGUE NECESITANDO AL MENOS UN PEDIDO PARA CONFIRMARSE
      Un camión de puras recogidas no se puede confirmar (400, igual que
      hoy). No es un olvido: un camión sin nada que picar no puede recorrer
      los estados de picking —EN_PICKING, EN_REPARTICION, ALISTADO— que son
      los que lo llevan hasta el driver. La recogida viaja con el camión que
      ya va a esa zona.

    ★ SE MONTA HASTA QUE EL CAMIÓN SE CONGELA
      Misma ventana que las órdenes: BORRADOR, CONFIRMADO o ASIGNADO; a
      partir de EN_PICKING → 409. Y NO es porque haya algo que picar —no lo
      hay—, sino porque a esa altura la secuencia de paradas ya se importó
      y se cerró. Una parada agregada después no tiene `stop_number`, y una
      parada sin número es una parada que el driver no ve. Si la solicitud
      llega tarde, va en el camión del día siguiente.

    ★ LO QUE REGISTRA EL DRIVER YA EXISTÍA
      Cantidades por ítem y foto obligatoria es EXACTAMENTE
      `POST /dispatch/returns`, que está en pie desde v0.15.0. No se
      duplica: ese endpoint gana `pickup_for_request_uuid` para decir "esta
      devolución ES la recogida de esta solicitud".

      Las cantidades que trae el driver PUEDEN NO COINCIDIR con las que
      pidió el vendedor, y eso no es un error: se pidió crédito por 10 y el
      cliente entregó 7. Lo que la solicitud dice viaja al driver como
      `expected_items` —referencia, no validación—; el servidor NO compara
      ni rechaza por diferencia.

    ⚠️ `pickup_for_request_uuid` NO ES `credit_request_uuid`
      Son enlaces OPUESTOS entre las mismas dos entidades y confundirlos
      rompe una garantía que ya existe:

        · `ProductReturn.credit_request_uuid` (v0.33.0) = la solicitud que
          NACIÓ de esta devolución. Devolución primero, crédito después.
        · `ProductReturn.pickup_for_request_uuid` (v0.45.0) = la solicitud
          que MANDÓ a buscar esta mercancía. Crédito primero, devolución
          después.

      Si la recogida escribiera el campo viejo, "esta devolución ya generó
      un crédito" pasaría a ser falso y se podría crear un SEGUNDO crédito
      desde ella sin que nada lo detecte: dos créditos por la misma
      mercancía, cada uno impecable por separado. Por eso son dos campos.

      Regla para el Dashboard: una devolución con `pickup_for_request_uuid`
      NO ofrece "crear solicitud de crédito desde esta devolución". El
      crédito ya existe — es el que la mandó a buscar.

    ★ "NO SE RECOGIÓ" TIENE QUE PODER DECIRSE
      `POST /dispatch/pickups/{request_uuid}/not-collected`. Sin esto, una
      recogida que el driver nunca pudo hacer y una que nadie miró se ven
      IDÉNTICAS desde la oficina: las dos quedan en EN_CAMION para siempre.
      Un estado que solo avanza cuando todo sale bien no informa nada
      cuando sale mal.

    ★ CREAR SOLICITUDES DE CRÉDITO DESDE EL DASHBOARD — SIN CONTRATO NUEVO
      No hay ningún cambio para esto, y no es un olvido: `POST
      /credit-requests` acepta ADMIN y APROBADOR_CREDITOS desde v0.33.1, y
      desde v0.33.2 el `salesperson_code` se resuelve DESDE EL CLIENTE y no
      desde el token de quien carga — precisamente para que la oficina
      pueda cargarlas sin quedar como dueña de ellas. `created_by` guarda
      quién la cargó. La evidencia se sube por `POST /evidence-photos`, que
      ya es compartido. Es pantalla, no contrato.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.44.0 — EXPORTAR PARADAS ANTES DE ARMAR EL CAMIÓN
    ══════════════════════════════════════════════════════════════════════════

    `POST /admin/route-export` — las mismas paradas que
    `/admin/trucks/{truck_id}/route-export`, pero para un conjunto de órdenes
    SELECCIONADAS que todavía no están en ningún camión.

    ★ PARA QUÉ — Y PARA QUÉ NO
      Sirve para UNA sola cosa: llevar las direcciones a un software de mapas
      externo y **ver distancias** antes de decidir qué órdenes van juntas en
      un camión. Nada más.

      Hoy ese archivo sólo se puede bajar cuando las órdenes ya están
      montadas y el camión confirmado — o sea, después de haber tomado la
      decisión que el archivo ayudaría a tomar.

      ⚠️ NO ES PARA ORDENAR PARADAS. El orden de paradas sigue siendo
      exactamente lo que es hoy: parte de lo que pasa DESPUÉS de montar las
      órdenes en un camión, con `route-export` / `route-import` /
      `/route` del camión, y no cambia en nada. Este endpoint no participa de
      eso, no devuelve secuencia y no recibe ninguna de vuelta.

      Queda dicho así de explícito porque el archivo es idéntico, y un
      archivo idéntico invita a suponer que el proceso también lo es.

    ★ ES EL MISMO ARCHIVO, Y ESO ES DELIBERADO
      Devuelve `RouteExportStop`, el mismo schema, con la misma regla de
      agrupación: UNA PARADA POR CLIENTE, sumando sus pedidos. El Dashboard
      reusa el armador de CSV que ya tiene.

      Podría haberse devuelto el CSV ya armado desde el servidor, o podría
      haberlo armado la pantalla con los datos de la grilla. Las dos opciones
      dejan DOS implementaciones del mismo formato, y el día que una cambie,
      los dos "mismos archivos" dejan de serlo. Una sola regla de agrupación,
      un solo armador.

      Y no lleva orden de paradas porque `RouteExportStop` nunca lo tuvo:
      este archivo es la ENTRADA al software de mapas, y la secuencia vuelve
      por `route-import`.

    ★ POR QUÉ ES POST SI NO ESCRIBE NADA
      Porque la lista de órdenes seleccionadas puede ser larga y en la query
      string de un GET se vuelve frágil. No crea ni modifica nada: es una
      lectura con un cuerpo grande.

    ★ NADA SE DESCARTA EN SILENCIO
      El servidor puede recibir una orden que ya no existe o que alguien
      montó en un camión mientras el admin tenía la pantalla abierta. No se
      omite y ya: se devuelve en `ignored`, con el motivo.

      Sin eso, alguien selecciona 20 órdenes, el archivo sale con 19
      clientes, y el estudio de ruta se hace sobre un cliente menos sin que
      nadie lo note. Una lista más corta de lo pedido no se distingue de una
      lista correcta si nadie dice qué faltó.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.43.1 — EL 409 DICE CUÁL ES EL CAMIÓN QUE YA EXISTE
    ══════════════════════════════════════════════════════════════════════════

    `truck_name_used_today` gana `conflicting_truck_id`, en las dos puertas
    (crear y renombrar).

    ★ POR QUÉ
      Quien recibe ese 409 casi siempre quiere ABRIR el camión que ya existe,
      no crear otro. Sin el id, el cliente tiene que redescubrirlo: pedir
      `GET /admin/trucks?date=…` y matchear por nombre.

      Dos cosas están mal en eso. El servidor YA SABE cuál es —lo encontró
      para poder devolver el 409—, así que hacer que el cliente lo derive de
      nuevo es la misma clase de trabajo duplicado que `total_amount` y
      `lines_subtotal` vinieron a eliminar.

      Y la derivación trae un bug adentro: ese "hoy" tendría que resolverse
      contra el día de Nueva York, y calculado en UTC buscaría en el día
      equivocado entre las 20:00 y la medianoche — o sea que el atajo diría
      "no lo encuentro" justo después de que el servidor afirmó que existe.
      Es la trampa horaria de siempre, esta vez en producción y no en un test.

    ★ Y RESUELVE UN SEGUNDO PROBLEMA DE PASO
      Al renombrar, la unicidad se evalúa contra el día del propio camión, no
      contra hoy. Sin el id, el cliente tendría que saber eso y buscar con
      `created_at` del camión que está editando. Con el id no hay nada que
      razonar: el servidor devuelve el que chocó, sea de hoy o de hace tres
      semanas.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.43.0 — LOS NOMBRES DE CAMIÓN DEJAN DE SER TEXTO LIBRE
    ══════════════════════════════════════════════════════════════════════════

    Hasta acá, armar el camión del día empezaba escribiendo un nombre a mano.
    Ahora se elige de una lista fija que se administra aparte.

    ★ QUÉ SON ESOS NOMBRES, porque el rótulo engaña
      NO son vehículos. La lista real es ALLENTOWN, BRONX, PHILADELPHIA,
      QUEENS… más `CLIENTE RETIRA` y `UPS`, que no son camiones en absoluto.
      Son DESTINOS DE REPARTO. Por eso el catálogo se llama así y no "flota":
      un catálogo de vehículos invita a agregarle patente y capacidad, y esto
      no es eso.

      Tampoco se vincula con `shipping_code` (las 36 zonas de reparto tipo
      BNX3). Son dos granularidades distintas y relacionarlas es una decisión
      aparte que nadie pidió.

    ★ EL CATÁLOGO — `/admin/delivery-truck-names`
      Alta, listado y activar/desactivar. **No hay borrado**: un nombre que
      deja de usarse esta temporada puede volver, y desactivarlo lo saca del
      selector sin perderlo.

      Los inactivos SIGUEN VIAJANDO en el listado, con la bandera en `false`
      — misma razón que `visible_in_catalog` en el catálogo de ítems: quien
      administra la lista tiene que poder volver a activarlos, y para eso
      tiene que verlos.

    ★ DOS REGLAS ESTRICTAS, decididas por Camilo

      1. **El nombre tiene que estar en el catálogo y estar activo.** Un
         nombre fuera de lista se rechaza (400 `unknown_truck_name`). Si hace
         falta uno nuevo, primero se agrega al catálogo — que es el punto de
         tener la lista. Sin esta regla el catálogo sería una sugerencia y el
         texto libre volvería por la puerta de atrás.

      2. **Un nombre, un camión por día** (409 `truck_name_used_today`). Dos
         camiones BRONX el mismo día es siempre un error de carga, y sin la
         regla se arman dos camiones para el mismo destino sin que nadie lo
         note hasta que salen.

    ★ Y LAS DOS REGLAS VALEN TAMBIÉN AL RENOMBRAR
      `PATCH /admin/trucks/{truck_id}` es la otra puerta al mismo campo. Si
      la creación validara y el renombre no, la regla se esquivaría creando
      con un nombre válido y renombrando después — que es exactamente la
      forma del hueco que este contrato ya produjo cuatro veces: cerrar una
      compuerta y dejar la otra abierta.

      ⚠️ Con una precisión que importa: al renombrar, la unicidad se evalúa
      contra **el día del propio camión**, no contra hoy. Renombrar uno de
      hace tres semanas no puede chocar con el BRONX de esta mañana.

    ★ LO QUE NO CAMBIA
      `Truck.name` sigue siendo un string y se COPIA al crear el camión. No
      es una referencia al catálogo: renombrar una entrada del catálogo NO
      renombra los camiones históricos, igual que `shipping_code_name` se
      congela en la orden. Un camión es un documento del día y su etiqueta es
      la que tuvo ese día.

      Y los camiones que ya existen con nombres fuera del catálogo se quedan
      como están. Las reglas aplican a lo que se crea y se renombra de acá en
      adelante, no retroactivamente.

    ★ CARGA INICIAL
      Los 33 nombres se siembran en la migración. Es dato de referencia,
      determinista e idéntico en todos los entornos — no es sembrar datos de
      prueba, que es otra cosa y sigue prohibido.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.42.2 — LA ZONA DE VISITA YA TIENE NOMBRE
    ══════════════════════════════════════════════════════════════════════════

    ★ `shipping_route_name`, EN LAS DOS SUPERFICIES QUE LLEVAN LA ZONA
      El nombre existía en la tabla de usuario `@RSAP_ROUTE` de SAP y ninguna
      vista lo exponía. Ya se agregó a `vw_WMS_Clients` con un `LEFT JOIN`, y
      quedó verificado contra datos reales: 14 zonas con nombre y 5 clientes
      sin zona que siguen en el catálogo con el nombre en `null` — con un
      `INNER` habrían desaparecido sin dejar rastro.

      Va a `AdminClient` **y a `OrderSummary`**. La orden ya llevaba
      `shipping_route` heredado del cliente y ya llevaba `shipping_code_name`
      para el otro eje: dejar el nombre solo en el cliente reproduciría en el
      mismo archivo la asimetría que este cambio viene a cerrar.

    ★ `AdminClient.shipping_code` PASA DE STRING A INTEGER
      El mismo campo estaba declarado `integer` en `OrderSummary` y `string`
      en `AdminClient` — lo introduje así en v0.42.0 y es el mismo error que
      el proyecto acaba de encontrar en dos vistas SQL hermanas que tipan
      `is_canceled` distinto. Un campo con dos tipos según dónde se lea
      obliga a cada cliente a recordar cuál le tocó.

      Se corrige ahora, mientras el campo tiene una semana y dos
      implementaciones, y no dentro de un año.

    ★ DEUDA CONOCIDA QUE NO SE TOCA
      `shipping_route` viaja como `string` en las dos superficies aunque el
      dato de origen sea entero. Es superficie vieja que las tres apps ya
      consumen, así que cambiarla costaría más de lo que arregla. Queda
      dicho para que se lea como decisión y no como descuido.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.42.1 — DOS ZONAS, Y PARA QUÉ ES CADA UNA
    ══════════════════════════════════════════════════════════════════════════

    SOLO TEXTO. Ningún campo nuevo, ninguna forma cambia. Se corrige lo que
    v0.42.0 dijo que significaban `shipping_code` y `shipping_route`, que ya
    había producido una columna mal rotulada en el Dashboard.

    ★ LOS DOS SON ZONAS. LO QUE LOS SEPARA ES PARA QUÉ.

      · `shipping_code` — ZONA DE REPARTO. Para el CAMIÓN que entrega. Y
        además determina QUÉ DÍAS DE LA SEMANA recibe entregas ese cliente,
        que es para lo que existe `/admin/shipping-codes/{code}/delivery-days`.

      · `shipping_route` — ZONA DE VISITA DEL VENDEDOR. Para la PERSONA que
        vende. Es la clasificación comercial que se les da a los vendedores:
        a qué zona vende y visita cada uno. Sus nombres viven en la tabla de
        usuario `@RSAP_ROUTE` de SAP.

    ★ POR QUÉ NO ALCANZA CON DECIR "ZONA" EN NINGUNO DE LOS DOS
      Los dos agrupan clientes geográficamente y ninguno agrupa por lo que el
      otro agrupa. Un cliente puede estar en una zona de reparto y ser
      visitado por un vendedor de otra zona: son dos recorridos distintos con
      dos propósitos distintos.

      Una pantalla que diga sólo "zona" obliga a adivinar cuál, y una que
      diga "ruta" a secas se lee como recorrido de camión cuando es de
      persona. **Cada rótulo tiene que decir PARA QUÉ es**: "zona de reparto"
      y "zona de visita del vendedor", nunca "zona" a secas.

    ★ LO QUE FALTA TODAVÍA
      `shipping_route_name` NO está en esta versión. Los nombres existen en
      `@RSAP_ROUTE`, pero `vw_WMS_Clients` todavía no los expone — hace falta
      un `LEFT JOIN` calcado del que esa misma vista ya hace contra
      `[@RSAP_SHIPPING_CODE]`. Se declara cuando el servidor tenga de dónde
      sacarlo, no antes: un campo que nadie puede llenar es peor que no
      tenerlo, porque los clientes lo dan por disponible.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.42.0 — LA GRILLA DE CLIENTES SE ORDENA Y DICE NOMBRES
    ══════════════════════════════════════════════════════════════════════════

    Sale de uso real del Dashboard, y de una verificación que cambió el pedido
    original.

    ★ 1. ORDENAMIENTO — `sort_by` / `sort_dir`
      Por código, saldo, cupo, disponible y mora. Va al servidor por lo mismo
      que en Órdenes (v0.38.0) y en Catálogo (v0.40.0): la grilla está
      PAGINADA, así que ordenar en el cliente daría "el cliente con menos
      disponible" queriendo decir "de esta página".

      Desempate por `client_code`, que es único. Sin él, ordenar por mora
      —donde la enorme mayoría comparte el valor 0— deja el orden de las filas
      empatadas a criterio del motor, y sobre una lista paginada la misma fila
      puede aparecer en dos páginas o en ninguna.

    ★ 2. `search` GANA EL CÓDIGO POSTAL, Y NADA MÁS
      Se pidió poder buscar por dirección, ciudad y código postal. Al
      verificarlo contra el código resultó que `search` YA matchea código,
      nombre, dirección y ciudad — el único que faltaba era `zipcode`, que
      existe como columna y viaja en la respuesta pero no se buscaba.

      Queda escrito qué campos cubre, que antes no estaba dicho en ningún
      lado y había que ir a leerlo al repositorio.

    ★ 3. EL VENDEDOR POR NOMBRE — `salesperson_name`
      La grilla mostraba `salesperson_code` pelado. El nombre ya existe en el
      espejo de vendedores de SAP —es el mismo `display_name` que devuelven
      `/admin/salespersons` y `/admin/sap-salespersons`— así que se resuelve
      del lado del servidor y ningún cliente tiene que cruzar dos listas.

    ★ 4. LA ZONA DE REPARTO, QUE ES LO QUE SÍ TIENE NOMBRE
      El pedido original era "mostrar la ruta por nombre en vez de por
      código". La verificación dio que ESE NOMBRE NO EXISTE, y el hallazgo
      útil fue otro: son DOS EJES DISTINTOS y el cliente tiene los dos.

        · `shipping_route` — eje COMERCIAL, de `OCRD.U_RSAP_ROUTE`. Catorce
          rutas, números. **No tiene nombre en ninguna parte alcanzable**:
          ninguna de las diez vistas `vw_WMS_` expone una descripción, y no
          hay tabla ni campo de usuario con uno. No es que nadie lo haya
          conectado — no está.
        · `shipping_code` — eje LOGÍSTICO, zonas de reparto. Treinta y seis
          códigos, y **sí tiene nombre** (`shipping_code_name`: QNS1, NJN3,
          BNX3). La vista ya lo expone y la pantalla de clientes no lo
          recibía.

      Entonces `AdminClient` gana `shipping_code` y `shipping_code_name`, que
      son datos que ya existían y no llegaban, y `shipping_route` se queda
      como número — con la razón escrita en el campo, para que nadie vuelva a
      buscar un nombre que no hay.

      ⚠️ `shipping_code_name` es el nombre de `shipping_code`, NUNCA de
      `shipping_route`. Se parecen y no lo son, y confundirlos etiquetaría la
      ruta comercial con la zona de reparto de ese cliente.

    ★ NOTA SOBRE CÓMO VIAJAN, que explica una diferencia real de
      comportamiento: `shipping_route` se resuelve contra el cliente en cada
      lectura, mientras que `shipping_code` y su nombre se CONGELAN en la
      orden al recibirla. Cambiarle la ruta a un cliente cambia lo que
      muestran sus órdenes viejas; cambiarle el código de envío, no.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.41.1 — LO QUE v0.41.0 DIO POR OBVIO
    ══════════════════════════════════════════════════════════════════════════

    Cinco huecos que v0.41.0 dejó, todos encontrados por los agentes al leerla
    antes de construir. Ninguno cambia el diseño: completan lo que estaba
    supuesto y no dicho.

    ★ 1. `GET /catalog-images/{image_id}` — LAS IMÁGENES NECESITAN SU PROPIA
      RUTA DE LECTURA
      v0.41.0 dijo que `image_url` es opaca y no dijo a dónde apunta, dando
      por hecho que serviría el mecanismo de las fotos de evidencia.
      NO SIRVE: `GET /evidence-photos/{id}` está restringido a ADMIN,
      APROBADOR_PAGOS y APROBADOR_CREDITOS, así que un token VENDEDOR recibe
      403 y las apps se quedarían sin poder ver ninguna imagen del catálogo.

      La ruta nueva la puede leer CUALQUIER rol autenticado — las tres apps y
      el Dashboard la necesitan, y una foto de producto no es un dato
      sensible.

    ★ 2. `GET /admin/catalog/{item_code}` — UN ÍTEM SUELTO
      La ficha editable no tenía de dónde leer un ítem: solo existía la
      página. Sin esto, la pantalla queda alimentada por la fila que
      casualmente tenga cargada, y un refresco la deja sin nada. Toda entidad
      editable de esta API tiene su ruta de detalle; esta faltaba.

    ★ 3. TAMAÑO MÁXIMO Y NORMALIZACIÓN DE LA IMAGEN
      v0.41.0 mencionaba un 400 "excede el tamaño máximo" sin decir cuánto.
      Descubrir el límite a fuerza de rechazos, cargando 539 fotos de a una,
      es caro y evitable.

      Máximo de subida: 5 MB de imagen decodificada.

      ★ Y EL SERVIDOR NORMALIZA LO QUE GUARDA, que es lo que faltaba pensar:
      re-codifica a un lado mayor de 1024 px. Sin eso, 539 fotos de cámara a
      3 MB serían más de un giga que CADA app se baja por red móvil para
      llenar su catálogo offline. Lo que se acepta al subir y lo que se sirve
      no tienen por qué ser lo mismo, y acá deliberadamente no lo son.

      La versión de la URL se deriva del contenido YA NORMALIZADO — si
      derivara del original, dos subidas que normalizan al mismo resultado
      producirían URLs distintas para bytes idénticos.

    ★ 4. `DELETE` DE LA IMAGEN DEVUELVE EL ÍTEM, NO 204
      Con 204 sin cuerpo, la pantalla tenía que CONSTRUIR el estado
      resultante (`image_url: null`) en vez de usar el que llegó — el único
      punto de todo el bloque donde el cliente arma estado. Es chico y sería
      correcto, pero es exactamente la excepción que después se generaliza.
      Ahora devuelve 200 con el `AdminCatalogItem`, igual que `PATCH` y `PUT`.

    ★ 5. UN CAMBIO EN UN CAMPO PROPIO DEL WMS TIENE QUE APARECER EN EL DELTA
      v0.41.0 exigió que un ítem oculto siguiera viajando en
      `GET /sync/catalog` con la bandera en `false`. Faltaba la otra mitad:
      ese endpoint entrega solo lo modificado desde `since`, así que si
      cambiar la bandera no marca al ítem como modificado, la ocultación no
      viaja igual — el ítem no se omite, simplemente nunca vuelve a aparecer.

      El resultado es idéntico al que la regla quería evitar, alcanzado por
      otra vía. Queda dicho como garantía y no como mecanismo: cambiar
      `visible_in_catalog`, la imagen, o cualquier campo propio del WMS hace
      que el ítem aparezca en el siguiente delta.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.41.0 — LA FICHA DEL ÍTEM
    ══════════════════════════════════════════════════════════════════════════

    Segunda mitad del bloque de catálogo: el Dashboard pasa a poder EDITAR el
    ítem. Tres capacidades nuevas y una definición que faltaba escribir.

    ★ 1. IMAGEN DEL ÍTEM — subir, reemplazar y borrar
      `PUT` y `DELETE /admin/catalog/{item_code}/image`, y la subida va en
      base64 en el cuerpo, igual que `POST /evidence-photos` desde v0.17.2.
      No se inventa un mecanismo nuevo: los clientes ya saben hacer esto.

      Origen decidido: se cargan UNA POR UNA desde el Dashboard. Las que hay
      hoy están en una carpeta local con nombres que no corresponden al código
      del ítem, así que no hay emparejamiento automático posible y una carga
      masiva sería adivinanza. SAP no las tiene y Attain no se toca.

      ⚠️ `image_url` CAMBIA CUANDO CAMBIA LA IMAGEN. La URL lleva una versión
      derivada del contenido, así que reemplazar la foto de un ítem produce
      una URL distinta. Es lo que hace que las apps —que guardan el catálogo
      sin conexión— muestren la nueva: con una URL estable, un cliente que ya
      cacheó la vieja se quedaría con ella para siempre y nadie entendería por
      qué. Los clientes tratan `image_url` como opaca y no la construyen.

      `only_without_image` en `GET /admin/catalog`, hermano del
      `only_without_price` que ya existía: con 539 ítems y cobertura cero, sin
      una forma de ver qué falta no hay manera de saber por dónde va la carga.

    ★ 2. VISIBILIDAD PROPIA DEL WMS — `visible_in_catalog`
      Distinta de `active`, que es la bandera de SAP y es dato maestro. El WMS
      no escribe maestros de SAP, y pisar ese campo confundiría "inactivo en
      SAP" con "escondido por decisión comercial". Son dos hechos distintos y
      se guardan aparte.

      ⚠️ UN ÍTEM OCULTO NO DESAPARECE DE `GET /sync/catalog`: viaja con
      `visible_in_catalog = false`. Omitirlo parece lo natural y sería un
      error — ese endpoint es un DELTA con `since`, así que un ítem que
      simplemente deja de aparecer no le dice nada al cliente, que lo
      conserva en su base local para siempre. La ocultación tiene que VIAJAR
      para poder aplicarse.

      El Dashboard sigue viendo todos los ítems, ocultos incluidos — si no,
      no habría forma de volver a mostrarlos.

    ★ 3. VENTA CONTROLADA — `controlled_sale` y `controlled_sale_limit`
      Un tope de UNIDADES por vendedor sobre las ÓRDENES ABIERTAS de ese
      ítem. No es un cupo por día ni por pedido: es exposición simultánea, y
      se libera solo cuando las órdenes se cierran, sin que nadie reinicie
      nada.

      ORDEN ABIERTA = la misma definición que `committed` (ver abajo): no
      RECHAZADA y todavía no facturada en SAP.

      ⚠️ AVISA, NO BLOQUEA. El pedido entra igual. Decisión de negocio: el
      control es de seguimiento comercial, no un portón de reparto de stock.
      El servidor calcula el exceso AL CREAR el pedido y lo GUARDA ahí — no se
      recalcula al leer, porque entonces el aviso cambiaría solo con el
      tiempo y no diría nada sobre lo que pasó cuando se tomó el pedido.

      Y el cupo NO VIAJA A LAS APPS. El aviso se ve únicamente en el pedido,
      en el Dashboard, así que no hace falta mandar saldos por ítem controlado
      en cada sincronización de cada dispositivo — que era, por lejos, la
      parte más cara de este bloque.

      Reparto lista/detalle, deliberado: `OrderSummary` lleva un booleano
      —la grilla solo necesita saber cuáles marcar— y `OrderDetail` lleva el
      desglose por ítem. Queda dicho para que no se lea como el hueco de
      "actualicé la lista y no el detalle" que ya se repitió cuatro veces.

    ★ 4. QUÉ ES `committed`, QUE NUNCA ESTUVO ESCRITO
      `committed` y `available` viajaban sin descripción, y cada quien volvía
      a deducir qué contaban. Se dedujo mal: la implementación sumaba TODAS
      las líneas de pedido del ítem sin mirar el estado de la orden, así que
      una orden rechazada restaba disponible para siempre y una ya facturada
      se restaba dos veces —el stock de SAP ya había bajado por la factura y
      la línea seguía contando—. Medido en dev: 10 ítems y 25 unidades
      contadas dos veces, creciendo con cada factura.

      LA DEFINICIÓN, y de ella salen todos los casos:
      **`committed` no lleva la cuenta de lo vendido. Tapa el retraso entre
      que algo se vende y que SAP se entera.**

      `stock` es el número de SAP, y SAP no sabe nada de un pedido del WMS
      hasta que se emite la factura. Entonces una línea cuenta mientras su
      mercancía siga adentro del `stock` de SAP y todavía vaya a salir:

        · RECHAZADA no cuenta — esa mercancía no va a salir nunca.
        · FACTURADA deja de contar — el stock de SAP ya bajó; seguir
          restando es contar dos veces la misma unidad.
        · ENTREGADA SIN FACTURAR SIGUE contando — si no hay factura, el stock
          de SAP no bajó y la ventana sigue abierta. No es una excepción: es
          la regla aplicada.

      No hace falta ninguna condición sobre los estados de entrega, porque
      hay que facturar antes de asignar el driver: cuando la mercancía sale,
      la orden ya está fuera del comprometido.

      Techo conocido y aceptado: una orden que nunca se factura ni se rechaza
      cuenta para siempre. Es residuo operativo, no un caso de diseño.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.40.0 — EL CATÁLOGO SE PUEDE RECORRER
    ══════════════════════════════════════════════════════════════════════════

    Primera mitad del bloque de catálogo. `GET /admin/catalog` gana filtro por
    categoría y ordenamiento, y el ítem gana `out_of_stock`. La ficha editable
    —imágenes, visibilidad propia del WMS, venta controlada— va aparte.

    ★ POR QUÉ EL FILTRO Y EL SORT SON CONTRATO
      Mismo motivo que la grilla de órdenes en v0.38.0: `/admin/catalog` está
      PAGINADO EN EL SERVIDOR. Filtrar u ordenar en el cliente operaría sobre
      la página cargada — "el ítem con menos disponible" sería el menor DE ESA
      PÁGINA. Se ve funcionando y está mal.

      `category` ya viajaba en el ítem, así que el dato no faltaba: faltaba
      poder pedirlo.

    ★ Y LA RESPUESTA TRAE `categories`
      Sin eso el selector de categorías no se puede poblar: derivarlo de la
      página cargada mostraría solo las categorías que casualmente aparecen en
      esas 25 filas. Es la lista COMPLETA y NO cambia con los filtros
      aplicados — si se recortara al filtro activo, elegir una categoría
      dejaría al selector sin las demás y no habría cómo volver.

    ★ `out_of_stock` — LA REGLA LA RESUELVE EL SERVIDOR
      `available <= 0` O `stock <= 0`. Viaja resuelta y no como regla a
      implementar, por lo mismo que `total_amount` en v0.37.3: tres clientes
      calculando la misma condición por separado son tres chances de que
      divergan, y nadie compara.

      ⚠️ QUÉ HACE, Y QUÉ NO: el cliente NO ofrece agregar al carrito un ítem
      con `out_of_stock = true`, y lo muestra marcado. Pero el SERVIDOR NO
      RECHAZA un pedido que lo incluya, y eso es deliberado: la app del
      vendedor trabaja offline sobre el catálogo sincronizado, y el stock de
      SAP cambia durante el día. Rechazar al crear le daría al vendedor en
      ruta rechazos por ítems que tenía en stock al sincronizar — cuando el
      sistema resuelve el faltante en el alistamiento a propósito. La regla
      protege de pedir a ciegas, no castiga al que llegó tarde.

    ★ `image_url` EN `AdminCatalogItem`
      Estaba en `CatalogItem` (lo que ven las apps) y NO en el schema del
      Dashboard, o sea que la pantalla desde donde se van a administrar las
      imágenes no podía ver la que el ítem ya tiene. Cobertura real hoy: cero
      de 539 ítems. Poblarlo es la segunda mitad del bloque.

    ★ DESEMPATE, igual que en v0.38.0
      Todo ordenamiento lleva `item_code` como criterio secundario, que es
      único. Sin él, ordenar por `category` o por `stock` —donde los empates
      son masivos— deja el orden de las filas empatadas a criterio del motor,
      y sobre una lista paginada la misma fila puede aparecer en dos páginas o
      en ninguna.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.39.0 — DATO GUARDADO SIN CAMINO DE LECTURA
    ══════════════════════════════════════════════════════════════════════════

    Dos huecos de la misma forma, encontrados por agentes al cerrar otro
    trabajo. En los dos casos el dato existe, está bien guardado, y no hay
    ninguna ruta que lo devuelva.

    ══ 1. LA SOLICITUD DE CRÉDITO DECIDIDA PIERDE SU EXPEDIENTE ══

    ★ EL HECHO QUE ORDENA TODO
      La bandeja lista ÚNICAMENTE `PENDIENTE_APROBACION`. Una vez decidida,
      la solicitud sale de la bandeja y el detalle queda como el ÚNICO camino
      de lectura.

      Entonces un campo que hoy solo está en la bandeja no es "una pantalla a
      la que le falta un dato": es dato que se vuelve INALCANZABLE PARA
      SIEMPRE en el momento de decidir. Es exactamente el argumento con el
      que nació GetDetailAsync en v0.32.0 para `sap_documents`.

    ★ `CreditRequestDetail` gana cuatro campos que ya existen en la bandeja
      · `evidence_image_url` — la foto que justifica el crédito. Quien
        audite después por qué se acreditaron 175 dólares no tenía de dónde
        sacarla: guardada, sin vía de lectura.
      · `reason` — en la modalidad SIN ítems no hay líneas, así que el motivo
        a nivel solicitud es el único que existe. El detalle de una SIN_ITEMS
        decidida decía cuánto y quién aprobó, pero no POR QUÉ. Y la cuenta
        contable se resuelve DESDE el motivo, así que quien concilia contra
        SAP necesita ver el par.
      · `comments` — el texto libre de quien pidió. Después de decidir se veía
        `decision_note` (lo que dijo el aprobador) y no lo que dijo el
        solicitante: faltaba la mitad del expediente.
      · `received_at` — el detalle traía `decided_at` pero no cuándo se
        reportó. Sin los dos no se puede medir cuánto esperó una solicitud.

    ★ `PendingCreditRequest` gana dos que solo estaban en el detalle
      El aprobador decide DESDE LA BANDEJA, así que un dato que solo aparece
      después no participa de la decisión.
      · `created_by` — desde v0.33.2 una solicitud la puede cargar un ADMIN o
        un APROBADOR_CREDITOS por cuenta del vendedor. La bandeja mostraba a
        quién PERTENECE pero no quién la CARGÓ, y un aprobador aprobando algo
        que él mismo cargó es un dato de control, no un detalle.
      · `source_return_id` — procedencia. Si nació de una devolución de ruta
        viene precargada del registro del driver y su foto; si no, la tipeó
        alguien. Cambia cuánto hay que verificar antes de aprobar.

    ★ LO QUE NO SE AGREGÓ, Y POR QUÉ — para que nadie lo "complete" después
      · `client_statement` sigue SOLO en la bandeja, y es correcto. No está
        guardado: se calcula en vivo contra el saldo actual del cliente.
        Mostrarlo en el detalle de una solicitud vieja pondría el saldo de HOY
        al lado de una decisión de hace un mes, que es peor que no mostrarlo.
        Es lo que el aprobador necesita ANTES de decidir, y ahí está.
      · `manual_amount` sigue solo en la bandeja: en la modalidad SIN ítems
        coincide con `calculated_amount`, que el detalle ya trae. Agregarlo
        sería completitud sin información.
      · `status`, `gl_account_code`, `decided_by`, `decided_at`,
        `decision_note`, `sap_documents` y `sap_credit_note_doc_num` siguen
        solo en el detalle: son posteriores a la decisión y en la bandeja
        serían siempre nulos o constantes.

    ══ 2. EL DESGLOSE DEL TOTAL NO CIERRA SIN QUE EL CLIENTE CALCULE ══

    ★ EL PROBLEMA
      Desde v0.37.0 el pedido trae `invoice_discount_pct`, `freight_amount` y
      `total_amount`. Pero para armar el desglose —subtotal → descuento →
      flete → total— al cliente le faltaban dos números, y los estaba
      calculando: sumaba los `line_total` para el subtotal, y el descuento lo
      mostraba como PORCENTAJE PELADO porque no tenía el importe.

      O sea que la resta no cierra leyendo hacia abajo: hay que sacar a mano
      cuánto quitó ese 10% para que el subtotal explique el total. Y peor, es
      aritmética de negocio del lado del cliente — el día que el servidor
      redondee distinto de la suma de los `line_total`, la pantalla va a
      mostrar una resta que no da y va a parecer un error del total oficial,
      que es el número correcto.

      Es la misma razón por la que v0.37.3 mandó `total_amount` en vez de
      dejar que la app lo reconstruyera: dos aritméticas que deben coincidir y
      que nadie compara terminan divergiendo.

    ★ QUÉ CAMBIA
      `OrderSummary`, `OrderAccepted` y `OrderStatusUpdate` ganan
      `lines_subtotal` e `invoice_discount_amount`. Los tres mismos lugares
      donde ya viajan los montos, para no crear una asimetría nueva.

      Con eso el desglose queda ENTERAMENTE del servidor y se vuelve
      verificable por cualquiera, incluido el chat de auditoría:

        lines_subtotal − invoice_discount_amount + freight_amount = total_amount

      Ningún cliente vuelve a sumar ni a multiplicar nada para mostrarlo.

    ★ LO QUE NO CAMBIA
      El payload del sincronizador NO los recibe. Ya tiene
      `expected_line_total` por línea y `expected_doc_total`, y calcula su
      propio total para contrastarlo contra el DocTotal de SAP — ese contraste
      es su defensa y no debe apoyarse en un número que le manden ya hecho.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.38.0 — ORDENAR Y FILTRAR POR FECHA LA GRILLA DE ÓRDENES
    ══════════════════════════════════════════════════════════════════════════

    Sale de uso real del Dashboard. `GET /admin/orders` gana rango de fechas
    de recepción y ordenamiento explícito.

    ★ POR QUÉ ES CONTRATO Y NO PANTALLA
      La grilla está PAGINADA EN EL SERVIDOR. Ordenar o filtrar por fecha en
      el cliente operaría sobre la página cargada, no sobre el conjunto:
      "la orden más antigua" sería la más antigua DE ESA PÁGINA. Se ve
      funcionando y está mal, que es la peor forma de estar mal.

      Es la misma trampa que ya mordió en el carrito: el aviso de "cliente
      fuera de la cartera del vendedor" comparaba contra la lista cargada, y
      cuando esa lista pasó a ser una página filtrada por la búsqueda, un
      cliente ausente dejó de significar nada.

    ★ RANGO DE FECHAS — `received_from` / `received_to`
      Fechas SIN hora, ambos límites INCLUSIVOS, resueltos contra el día
      calendario de **Nueva York** como manda la regla global del principio
      de este documento. Un cliente que calcule "hoy" con el reloj UTC manda
      el día equivocado durante las últimas horas de cada jornada — que es
      justo cuando la operación está más activa.

    ★ ORDENAMIENTO — `sort_by` / `sort_dir`
      `sort_by`: `received_at` (default) · `order_number` · `status`.
      `sort_dir`: `desc` (default) · `asc`.

      Los defaults reproducen el comportamiento actual, así que un cliente
      que no mande nada ve exactamente lo mismo que hoy.

      `status` NO ordena alfabéticamente: usa el ORDEN DEL CICLO DE VIDA tal
      como está declarado el enum (SINCRONIZADA → RETENIDA_CARTERA →
      APROBADA → RECHAZADA). Alfabéticamente, APROBADA quedaría antes que
      RETENIDA_CARTERA y lo que el admin necesita atender terminaría
      enterrado en el medio. Ordenar por estado sirve para juntar lo que
      espera decisión, no para respetar el diccionario.

    ★ ESTABILIDAD DE LA PAGINACIÓN, que es la parte fácil de olvidar
      Todo ordenamiento lleva un DESEMPATE determinista. Sin él, ordenar por
      un campo con muchos empates —`status` tiene cuatro valores para todas
      las órdenes— deja el orden de las filas empatadas a criterio del motor,
      y entre dos consultas la misma orden puede aparecer en la página 1 y en
      la 2, o en ninguna. El desempate es `received_at` descendente y después
      `order_number`, que es único.

    ★ LO QUE NO SE EXTENDIÓ, a propósito
      `GET /my-orders` NO recibe estos parámetros. No es un olvido: nadie los
      pidió ahí y esa pantalla sigue siendo usable sin ellos. Queda dicho
      para que no se lea como el hueco de "actualicé la lista y no el
      detalle" que ya se repitió cuatro veces. Si se piden, se agregan igual.

    ★ Y LOS FILTROS DE LA PANTALLA DE BORRADORES NO ESTÁN ACÁ
      Buscar un borrador por nombre o por fecha de creación NO necesita
      contrato: `GET /order-drafts` no está paginado y `OrderDraftSummary` ya
      trae `title` y `created_at`. Filtrar en el cliente es correcto ahí
      porque la lista llega entera — exactamente lo contrario de la grilla de
      órdenes. Techo conocido: si algún día esa lista crece y se pagina,
      esos filtros tienen que mudarse al servidor el mismo día.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.37.3 — LOS MONTOS LLEGAN A LA APP DEL VENDEDOR DE VERDAD
    ══════════════════════════════════════════════════════════════════════════

    v0.37.0 puso `invoice_discount_pct` y `freight_amount` en `OrderSummary`
    y escribió que "lo ven las tres apps iOS, no solo el Dashboard".

    ERA FALSO, y lo detectó el agente del Mac verificando qué endpoints
    consume cada app en vez de aceptar la afirmación.

    ★ POR QUÉ NO LLEGABAN
      `OrderSummary` lo devuelven `/my-orders`, `/admin/orders` y
      `/admin/trucks/available-orders` — superficie de Dashboard y de admin.
      La app de vendedores consume exactamente dos endpoints de pedidos:
      `POST /orders`, que responde `OrderAccepted`, y `GET /sync/orders`,
      que responde `OrderStatusUpdate`. Ninguno de los dos traía los montos.

      O sea que el campo se agregó al lugar donde el consumidor declarado
      nunca lo iba a ver. Es el ítem (a) de la checklist —quién PRODUCE y
      quién CONSUME— fallando en su forma más pura: los dos lados existían,
      pero no eran los dos lados del mismo camino.

    ★ Y EL SUPUESTO DE OrderStatusUpdate TAMBIÉN ERA FALSO
      Su descripción justificaba omitir `total_amount` con "eso la app ya lo
      tiene". No lo tenía: `OrderAccepted` nunca lo devolvió, así que la app
      jamás lo recibió. Venía calculándolo por su cuenta sumando líneas —
      correcto mientras no existieron el descuento de documento ni el flete,
      y equivocado desde v0.37.0.

    ★ QUÉ CAMBIA
      `OrderAccepted` y `OrderStatusUpdate` ganan `total_amount`,
      `invoice_discount_pct` y `freight_amount`, los tres nulables.

      En `OrderAccepted` para que la app capture el total AUTORITATIVO en el
      momento de crear, en vez de reconstruirlo: dos aritméticas que deben
      coincidir y nadie compara terminan divergiendo.

      En `OrderStatusUpdate` porque es el ÚNICO canal por el que un cambio
      posterior llega al vendedor. Hoy los montos se fijan al crear, pero ya
      está decidido el bloque donde un humano ajusta el pedido antes de
      facturarlo —reduciendo cantidades o quitando líneas— y ahí el total
      cambia después de que la app lo recibió. Sin este campo, el vendedor
      seguiría viendo el viejo.

    ★ REGLA PARA EL CLIENTE
      Si `total_amount` viene, se MUESTRA — no se recalcula ni se "corrige"
      localmente. Si viene nulo (pedidos anteriores a esta versión, o un
      carrito que el servidor todavía no tarifó), se cae a la suma de las
      líneas. Nunca se mezclan las dos fuentes en la misma pantalla.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.37.2 — EL client_uuid DE UN BORRADOR LO EMITE EL SERVIDOR
    ══════════════════════════════════════════════════════════════════════════

    Corrige un consejo de v0.37.0 que ningún cliente podía cumplir y que,
    además, protegía del escenario equivocado. Decía: "conviene generarlo
    recién al convertir: si el mismo borrador se convierte dos veces, un
    uuid repetido lo haría idempotente".

    ★ POR QUÉ NO SE PODÍA CUMPLIR
      `POST /order-drafts/{draft_id}/convert` no recibe body. El cliente no
      tiene por dónde mandar un uuid nuevo al convertir.

    ★ Y POR QUÉ ESE ESCENARIO NO EXISTÍA
      Un mismo borrador no se puede convertir dos veces: convertir borra el
      borrador en la misma operación, así que la segunda llamada da 404.

    ★ EL RIESGO REAL, QUE SÍ EXISTE
      DOS BORRADORES DISTINTOS con el mismo `client_uuid`. Pasa solo: el
      carrito genera el uuid UNA VEZ por carrito y lo reusa al reintentar
      —a propósito, para que la idempotencia de POST /orders funcione—, así
      que guardar dos veces el mismo carrito deja dos borradores con el
      mismo uuid. Convertir el primero crea el pedido; convertir el segundo
      devuelve EL PRIMERO por idempotencia, borra el borrador, y nadie se
      entera de que el segundo pedido nunca existió.

      La misma forma tiene una secuencia más corta y más probable: guardar
      el carrito como borrador, enviarlo igual por el camino normal, y
      convertir el borrador más tarde.

    ★ QUÉ CAMBIA
      Al convertir, el SERVIDOR emite un `client_uuid` nuevo e IGNORA el
      guardado. La garantía deja de depender de que cada cliente se acuerde
      —hay tres apps y un Dashboard— y el borrador deja de arrastrar una
      llave de idempotencia emitida en otro momento.

      La idempotencia de la conversión no se pierde: la sostiene la
      existencia del borrador, que se borra en la misma transacción. Un
      reintento después de convertir da 404, nunca un pedido duplicado.

      Los clientes pueden seguir regenerando el uuid en cada guardado —es
      sano y mantiene el payload honesto— pero ya no es lo que sostiene la
      garantía.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.37.1 — EL PAYLOAD DEL SINCRONIZADOR DEJA DE AGRUPAR POR ÍTEM
    ══════════════════════════════════════════════════════════════════════════

    Corrige un hueco de v0.37.0 en su propio terreno. Esa versión declaró
    que el mismo ítem puede ir en varias líneas (★ 4), pero dejó
    `SapOrderInvoiceSyncTask.lines` agrupando por `item_code` —
    literalmente "SUM(PalletAssignment.Quantity) para este
    OrderUuid+ItemCode — NO OrderLine.Quantity".

    O sea que el contrato bendecía dos líneas del mismo producto con
    condiciones distintas y, al facturar, las fusionaba en una sola, con el
    precio y el descuento de UNA de las dos.

    ★ QUÉ ROMPE EN LA PRÁCTICA

      Una promoción "lleve 10, pague 9" del mismo ítem manda dos líneas
      —condición ×10 al 0% y beneficio ×1 al 100%—. Agrupadas, la factura
      sale 11 × precio de lista: la unidad gratis se cobra. Y el caso que
      v0.37.0 habilita a propósito —diez a precio de lista y dos con
      descuento negociado— saldría las doce al precio de una sola de las
      dos líneas.

      `expected_doc_total` se calculaba sobre esas mismas líneas ya
      fusionadas, así que la reconciliación no detectaba la divergencia:
      la horneaba. SAP y la orden coincidían en el número equivocado.

    ★ QUÉ CAMBIA

      `lines` pasa a llevar UNA ENTRADA POR LÍNEA DEL PEDIDO, no por ítem.
      `item_code` PUEDE REPETIRSE entre entradas, y el sincronizador no
      debe agrupar por ese campo en ningún punto del camino.

      Es el mismo principio que ya rige en las solicitudes de crédito desde
      v0.31.0: una línea se identifica por su id, nunca por `item_code`,
      justamente porque puede repetirse.

      El orden del array es el orden de las líneas del pedido, y el índice
      de cada entrada es el `BaseLineNumber` de la línea de la factura y de
      sus asignaciones de bin.

    ★ REPARTO DE LA CANTIDAD ENTRE LÍNEAS DEL MISMO ÍTEM

      `PalletAssignment` es por (orden, ítem): el reparto físico no sabe a
      qué línea comercial pertenece cada unidad. La regla —decisión de
      negocio, no del código— es POR ORDEN DE LÍNEA: se llena cada línea
      hasta su cantidad pedida antes de pasar a la siguiente.

      Sin faltante es exacto y no decide nada. Con faltante el recorte cae
      en las últimas líneas, que en una promoción significa perder primero
      la unidad gratis — correcto, porque sin la compra que la condiciona
      no corresponde el beneficio.

      Eso exige que el orden de las líneas sea un dato PERSISTIDO y no el
      que devuelva la consulta: quedarse con "la primera" de un agrupamiento
      sin orden explícito puede tomar cualquiera de las dos, y cuál gane
      cambia lo que se le cobra al cliente.

    ★ LO QUE NO CAMBIA

      `approximate` sigue significando lo mismo: certeza sobre el BIN de
      origen, no sobre la línea. Un ítem que salió de un solo bin sigue en
      `approximate=false` aunque su cantidad se reparta entre dos líneas —
      el bin sigue siendo un hecho directo.

      Una línea en faltante total sigue sin aparecer en el array. Por eso el
      índice es el número de línea de la FACTURA, no el del pedido.

      Ningún otro schema cambia. `OrderCreate`, `OrderSummary` y los
      endpoints de borrador quedan exactamente como en v0.37.0: esto toca
      solo el payload que consume el sincronizador.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.37.0 — BORRADORES, DESCUENTO DE DOCUMENTO Y FLETE
    ══════════════════════════════════════════════════════════════════════════

    Sale de reuniones con usuarios. El carrito del Dashboard tiene menos
    restricciones que la app de vendedores a propósito, y le faltaban tres
    cosas que la operación real necesita.

    ★ 1. BORRADORES DE PEDIDO — entidad y endpoints propios
      Guardar el carrito para retomarlo: una cotización sin confirmar, o no
      perder lo armado al cambiar de cliente.

      Es una ENTIDAD APARTE y no un `Order.Status` nuevo, y la razón importa:
      un pedido que existe consume cupo, aparece en la grilla y se puede
      montar en un camión. Un borrador no hace nada de eso. Si fuera un
      estado, cada consulta tendría que acordarse de excluirlo — y el día
      que alguien se olvidara, una cotización aparecería en el tablero de
      picking.

      El borrador guarda el PAYLOAD de creación tal cual, y convertirlo es
      reenviarlo por el camino normal. Una sola validación, ningún borrador
      imposible de convertir.

      No se valida al guardar, sí al convertir. Consecuencia a mostrar bien
      en pantalla: un borrador guardado hoy puede fallar mañana porque la
      promoción venció o el cliente entró en mora.

      Convertir crea el pedido y borra el borrador en UNA operación: en dos
      llamadas, un fallo entre medio dejaría el pedido creado y el borrador
      vivo, y alguien lo convertiría de nuevo.

    ★ 2. DESCUENTO DE DOCUMENTO — `invoice_discount_pct`
      Sobre el subtotal, distinto del descuento por línea.

      Va en PORCENTAJE porque es lo que SAP almacena a nivel de documento.
      Un cliente puede aceptar un monto y calcular el porcentaje, pero debe
      mostrar el valor resultante antes de confirmar: el redondeo puede dar
      centavos de diferencia, y eso se ve en la factura.

    ★ 3. FLETE — `freight_amount`
      Se SUMA al total y NO recibe el descuento de documento. Se descuenta
      mercancía, no transporte.

    ★ ORDEN DE APLICACIÓN, que define el total
      líneas con su descuento → subtotal → descuento de documento sobre ese
      subtotal → flete sumado sin descontar.

    ★ 4. EL MISMO ÍTEM PUEDE IR EN VARIAS LÍNEAS, y ahora está dicho
      Permite vender el mismo producto con condiciones distintas en un
      pedido: diez a precio de lista y dos con descuento negociado.

      Ya era así de hecho —el bloque de promoción manda condición y
      beneficio del mismo ítem en líneas separadas, y las facturas repiten
      ítems por diseño— pero no estaba escrito para las líneas normales.

    ★ LOS DOS CAMPOS VIAJAN EN TRES LUGARES, no en uno
      OrderCreate, OrderSummary y el payload del sincronizador.

      Si faltaran en OrderSummary, el Dashboard mostraría un total que no
      cuadra con la suma de las líneas y nadie podría explicar la
      diferencia. (★ CORREGIDO EN v0.37.3: este párrafo decía "las tres
      apps iOS", y era falso — las apps no consumen OrderSummary. Los
      montos les llegan por OrderAccepted y OrderStatusUpdate desde
      v0.37.3.) Si faltaran en el payload del sincronizador, la factura
      saldría a SAP sin el descuento ni el flete: la orden diría un total y
      SAP otro.

      Y `expected_doc_total` deja de ser la simple suma de las líneas —
      ahora incluye las dos cosas, porque es contra lo que el sincronizador
      compara el DocTotal que devuelve SAP.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.36.0 — EL ROL DE CADA LÍNEA EN UN BLOQUE DE PROMOCIÓN
    ══════════════════════════════════════════════════════════════════════════

    ★ OrderLine gana `promotion_role` (CONDITION | BENEFIT)
      Obligatorio cuando la línea lleva `promotion_group_id`.

      El rol existía conceptualmente y no estaba en el dato, así que la
      validación agregaba cantidades por `item_code` y comparaba ese total
      contra la condición y contra el beneficio por separado. Con ítems
      distintos funcionaba POR ACCIDENTE; con el mismo ítem se colapsaba.

      Una promoción "lleve 10, pague 9" del mismo producto mandaba dos
      líneas (×10 y ×1) y el servidor veía 11. Y aunque se arreglara la
      suma, el chequeo de descuento fallaba igual: exigía que TODAS las
      líneas de ese ítem tuvieran el descuento del beneficio, y la de
      condición va al 0%. Dos colisiones, las dos por inferir el rol en vez
      de conocerlo.

      Ahora las líneas CONDITION se validan contra la condición y las
      BENEFIT contra el beneficio, nunca por agregado de ítem. Eso habilita
      lo que antes era imposible: condición y beneficio del mismo producto
      —la mecánica más común en distribución—, beneficios con descuento
      parcial, y condiciones que ya traigan su propio descuento.

      Se descartó inferirlo del descuento (se rompe con un beneficio
      parcial) y de la cantidad (indistinguible si condición y beneficio
      piden lo mismo). El cliente ya conoce el rol cuando arma el bloque
      desde el libro: declararlo es más barato que adivinarlo del otro lado.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.35.0 — CAMIONES: LO QUE FALTABA PARA OPERARLOS
    ══════════════════════════════════════════════════════════════════════════

    Tres huecos que se fueron acumulando, todos alrededor de los camiones.

    ★ 1. GET /admin/trucks/pending-invoicing — NUEVO
      La pantalla de Facturación pendiente componía su pregunta desde el
      cliente (estado + fecha) y eso la dejaba ciega dos veces: por la
      fecha, que tiene default "hoy" en UTC y escondía los camiones de días
      anteriores; y por el estado, que es lo grave — pedía solo ALISTADO,
      así que un camión despachado sin facturar NUNCA aparecía, y ese es
      justamente el caso que v0.34.0 abrió para poder resolver. El arreglo
      existía en el backend y era inalcanzable desde la interfaz.

      Ahora el servidor responde la pregunta del negocio: picking completo
      y sin enviar a facturación. Sin fecha.

    ★ 2. PATCH /admin/trucks/{truck_id} — NUEVO
      No había ninguna forma de corregir el nombre de un camión. Un error
      de tipeo quedaba a la vista en la grilla para siempre, y la única
      salida era editar la base a mano — que es exactamente lo que hubo que
      hacer con un camión llamado "Camlo-Queens".

    ★ 3. El `name` al crear un camión pasa a ser OBLIGATORIO
      Era opcional y el servidor asignaba un código automático, lo que llenó
      la base de camiones "Sin nombre". Junto con el PATCH, cierra el mismo
      problema por sus dos puntas: que se ponga un nombre, y que se pueda
      arreglar si sale mal.

    ★ 4. `invoice_date` se calcula en hora de NUEVA YORK, no en UTC
      Viaja a SAP como DocDate, y SAP rechaza con -5002 cualquier fecha
      posterior a su fecha de sistema. Como el día UTC empieza a las 20:00
      de Nueva York, calcularlo en UTC hacía que TODA facturación nocturna
      mandara el día siguiente y fuera rechazada.

      Medido: dos tareas en ERROR con 3 intentos, enviadas de noche, contra
      siete facturas de una corrida matutina que pasaron limpio.

      Es el quinto lugar donde "hoy" se calculaba en UTC, y el más caro: los
      otros cuatro esconden filas en pantallas, este rompe la facturación
      todas las noches.

      La regla vale para toda fecha que termine en un documento de SAP.

    ★ NOTA DE VERSIONADO
      El archivo publicado bajo el tag v0.34.2 declaraba `version: 0.34.1`
      por dentro. El contenido era el correcto —el sha coincide— pero el
      campo quedó desactualizado. Corregido acá.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.34.1 — COMPLETA v0.34.0, QUE NO PODÍA FUNCIONAR
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ FALTABA
      v0.34.0 amplió `send-to-invoicing` a cuatro estados para que un
      camión despachado se pudiera facturar. Pero hay TRES compuertas que
      exigían ALISTADO, no una — y solo se amplió esa.

      `send-to-invoicing` exige un chequeo de disponibilidad LIMPIO y de
      menos de 5 minutos, y `invoice-readiness` es el ÚNICO lugar que
      escribe esos campos. Como seguía rechazando a los camiones
      despachados, ninguno podía obtener un chequeo fresco — y el rechazo
      llegaba igual, con `no_readiness_check` o `stale_readiness_check` en
      lugar de `not_alistado`.

      El callejón sin salida no se había cerrado: se había mudado de
      compuerta.

      Y la tercera, `reduce-allocation`, es la única vía para resolver una
      discrepancia. Un camión despachado puede tenerlas —si otra factura
      consumió el stock mientras estaba en la calle— y sin esto quedaría
      en `discrepancies_found` para siempre.

    ★ Y UN SEGUNDO ARREGLO: LA VIGENCIA DE PROMOCIONES SE EVALÚA EN
      HORA DE NUEVA YORK
      Se comparaba contra el día UTC, y eso recortaba las últimas CUATRO
      HORAS de vigencia todos los días — justo en la franja de venta en
      ruta. El vendedor recibía `invalid_promotion` sin forma de entender
      por qué.

      No cambia ninguna forma de dato: `valid_from`/`valid_to` siguen
      siendo fechas sin hora. Lo que cambia es contra qué día se comparan.
      Sin migración.

      Los tres lugares que evalúan vigencia cambian JUNTOS — el libro del
      vendedor, la aceptación del pedido y la activación por el analista.
      Arreglar uno solo los volvería inconsistentes entre sí, que es peor
      que el bug actual.

    ★ QUÉ CAMBIA
      `invoice-readiness` y `reduce-allocation` aceptan los mismos cuatro
      estados que `send-to-invoicing`: ALISTADO, ASIGNADO_DRIVER, EN_RUTA
      y RUTA_CERRADA. Con el mismo código de rechazo,
      `picking_not_complete`, para los anteriores.

      El argumento es el mismo que el de v0.34.0, aplicado hasta el final:
      si la condición real es que el picking esté completo, eso vale igual
      para el chequeo y para la corrección que para el envío. El chequeo es
      una lectura que compara demanda contra stock; nada en él depende de
      que el camión no haya salido.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.34.0 — UN CAMIÓN DESPACHADO YA SE PUEDE FACTURAR
    ══════════════════════════════════════════════════════════════════════════

    ★ LA TRAMPA QUE SE CIERRA
      `send-to-invoicing` exigía ALISTADO. Pero asignar un driver saca al
      camión de ese estado, y cuando el driver ARRANCA LA RUTA pasa a
      EN_RUTA, donde `unassign-driver` lo rechaza.

      Resultado: un camión que salía a repartir sin haberse facturado NO SE
      PODÍA FACTURAR NUNCA. Mercancía entregada, sin factura, y sin
      camino de vuelta. Nada avisaba en ningún momento.

      Se descubrió persiguiendo otra cosa — un camión que "no aparecía" en
      la pantalla de facturación resultó haberse pasado de largo, no
      quedado corto.

    ★ POR QUÉ EL ESTADO ERA LA CONDICIÓN EQUIVOCADA
      La condición real nunca fue "estar en ALISTADO" sino que el PICKING
      ESTÉ COMPLETO. Las cantidades alistadas no cambian porque el camión
      salga a la calle, así que la factura sale igual de correcta.

      Ahora se acepta ALISTADO, ASIGNADO_DRIVER, EN_RUTA y RUTA_CERRADA.
      Los estados anteriores siguen rechazados —ahí las cantidades todavía
      se mueven— con el código `picking_not_complete`, que reemplaza al
      viejo `not_alistado`.

    ★ Y UN AVISO, PORQUE ARREGLARLO NO ES LO MISMO QUE EVITARLO
      `TruckSummary` gana `sent_to_invoicing`: si el camión ya pasó por
      send-to-invoicing.

      Despachar sin facturar deja de ser irreversible, pero sigue siendo un
      error silencioso. Con este campo el Dashboard puede advertirlo al
      asignar el driver — el último momento en que corregirlo es gratis.

      Es información, no bloqueo. Puede haber razones legítimas para
      despachar antes de facturar, y el sistema no debería decidir eso por
      la operación.

