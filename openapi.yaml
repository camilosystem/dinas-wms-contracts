    CAMBIOS EN v0.32.2 — ADMIN TAMBIÉN PUEDE RECHAZAR CRÉDITOS
    ══════════════════════════════════════════════════════════════════════════

      `POST /admin/credit-requests/{uuid}/reject` pasa a aceptar ADMIN,
      alineándose con `approve` y `retry`, que ya lo tenían.

      La asimetría estaba al revés desde el riesgo: un ADMIN podía APROBAR
      —que crea notas de crédito reales en SAP y mueve inventario— pero no
      RECHAZAR, que no tiene ningún efecto externo.

      Lo notó el agente de middleware al implementar v0.32.1: revisó el
      contrato, vio que reject no incluía ADMIN, y NO lo "arregló por
      simetría" — lo dejó como estaba y lo fijó en test, con el argumento
      correcto de que ampliar quién puede rechazar es una decisión de
      negocio y no una consecuencia de haber tocado approve.

      NOTA sobre las bandejas de Pagos: `account-payments` approve y reject
      siguen SIN ADMIN, los dos. Cada bandeja queda coherente consigo misma
      —créditos con ADMIN en ambas acciones, pagos en ninguna— pero
      distintas entre sí. Está sin revisar si eso es deliberado.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.32.1 — LO QUE SALIÓ DEL SEGUNDO RECHAZO DE SAP
    ══════════════════════════════════════════════════════════════════════════

    ★ 1. NO SE LIGA A UNA FACTURA PAGADA
      SAP rechazó la nota de ítems con -5002: "One of the base documents
      has already been closed".

      La factura estaba en `bost_Close` por estar saldada
      (`PaidToDate == DocTotal`), aunque sus LÍNEAS seguían en `bost_Open`
      con la cantidad pendiente intacta. SAP mira la cabecera.

      Otra corrección de un supuesto propio: se había decidido aceptar
      facturas cerradas razonando que "estar saldada no impide devolver
      mercancía". Es CIERTO para una nota independiente —la DocNum 561 lo
      prueba, es contra esa misma factura cerrada— y FALSO para una ligada.

      REGLA: factura abierta → se liga. Factura pagada → nota independiente
      con `ItemCode`, precio y almacén explícitos, y el `invoice_doc_num`
      registrado en `Comments`. Automático, sin frenar.

      POR QUÉ automático: las devoluciones de cartera vieja son justamente
      las que llegan DESPUÉS del pago. Trabar cada crédito sobre factura
      saldada bloquearía el caso más común.

    ★ 2. POST /admin/credit-requests/{uuid}/retry — NUEVO
      El modelo de dos documentos contempla que uno falle y el otro quede
      hecho. Pero no había forma de reintentar el que falló desde el
      Dashboard: reaprobar da 409, y `/admin/sap-sync/*` es la superficie
      del sincronizador.

      El aprobador podía VER que un documento quedó en error y no tenía cómo
      hacer nada. Esto cierra esa mitad.

    ★ 3. ADMIN puede aprobar créditos — y la implementación no lo cumplía
      El contrato decía "REQUIERE APROBADOR_CREDITOS o ADMIN" desde v0.17.0,
      y el middleware rechazaba a ADMIN con 403.

      Se detectó midiendo la matriz de roles: el 409 con el rol correcto
      sobre la misma solicitud probó que el 403 era de ROL, no de estado.

      El efecto: el Dashboard deja entrar a ADMIN a la bandeja, así que
      podía cargar montos, elegir líneas, apretar Aprobar — y recibir un 403
      con cuerpo vacío. Es un bug de implementación, no un cambio de diseño.

    ★ NOTA SOBRE LOS BORRADORES DE SAP
      Van dos veces que un borrador acepta algo que el documento asentado
      rechaza. Queda acotado qué prueban y qué no:

        SÍ validan  — forma del payload y nombres de campo, resolución de
                      DocEntry, existencia del base_line, aritmética de
                      montos y totales.
        NO validan  — tipo de cuenta contable, estado del documento base.

      Siguen valiendo la pena: atrapan errores de estructura barato. Pero el
      veredicto real llega en el POST.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.32.0 — LO QUE SALIÓ DE LA PRIMERA NOTA REAL
    ══════════════════════════════════════════════════════════════════════════

    Siete cambios, todos surgidos de construir e integrar el bloque de
    notas de crédito contra SAP real. Se acumularon a propósito para
    publicarlos en una sola ronda.

    ★ 1. DAMAGED pasa de la cuenta 6020 a la 4700
      La 6020 (Damaged Merchandise) es de tipo `at_Other`, y SAP EXIGE una
      cuenta de tipo INGRESO en las líneas de una nota de ítems. Rechazó el
      documento con -5002.

      Un BORRADOR sí aceptaba 6020, porque no corre la validación de
      determinación de cuentas. De ahí salió un falso positivo en el
      descubrimiento: se dio por verificado algo que solo era cierto para
      borradores.

      LECCIÓN, que vale más que el cambio: para cualquier cosa que toque
      cuentas contables, un borrador NO es evidencia suficiente. Sigue
      sirviendo para forma del payload, vínculos, precios y cantidades.

      Contabilidad creó la 4700 (Returns Damaged) para esto: `at_Revenues`,
      activa, nivel 3 bajo Net Sales, sin cuentas hijas. Conserva la
      separación contable Y deja que el stock vuelva al almacén 07.

    ★ 2. `SapCreditNoteLine` gana `reason`, SOLO para verificar
      La regla "un documento SERVICE solo lleva líneas SHORT" no era
      verificable desde el sincronizador: cuando le llega la tarea el split
      ya está hecho. Y el error habría sido CONSISTENTE — una línea DAMAGED
      mal ubicada vendría con 4200 y sin almacén, indistinguible de un
      SHORT legítimo.

      El sincronizador NO deriva cuenta ni almacén de este campo. Solo
      comprueba coherencia y se niega a postear si no cuadra.

    ★ 3. `base_line` deja de exigirse en líneas SHORT
      Esas van a un documento de servicio, que no se puede ligar a una
      factura. Se le estaba pidiendo al aprobador una decisión que después
      se descartaba.

    ★ 4. Queda definido el payload de la modalidad SIN_ITEMS
      Nota de servicio con una sola línea, contra `gl_account_code`, con el
      `manual_amount` en `UnitPrice` y cantidad 1 — porque en servicio la
      cantidad no multiplica. Descripción: nombre del cliente + motivo.

    ★ 5. `sap_reference` viaja en el DTO de la tarea del sincronizador
      El campo existía y no se devolvía. Sin él, quien escribe reporta un
      número y no puede comprobar que aterrizó.

    ★ 6. `error_detail` ya no se limpia al reintentar
      Persiste como el error del último intento fallido. Antes, una tarea
      reintentada quedaba con `attempts: 1` y ningún rastro del porqué.

    ★ 7. GET /admin/credit-requests/{request_uuid} — NUEVO
      `CreditRequestDetail` solo se devolvía como respuesta de approve,
      reject o cancel. Una vez decidida, la solicitud salía de la bandeja y
      no había forma de volver a leerla — quedando inalcanzable
      `sap_documents`, que es justamente lo que cambia DESPUÉS de aprobar.

      Es el hueco de `line_id` de v0.31.0 en su otra mitad: entonces
      faltaba leer antes de decidir, ahora faltaba leer después. Se
      descartó este endpoint en v0.31.2 con un argumento que valía solo
      para el estado pendiente.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.31.2 — line_id OBTENIBLE ANTES DE APROBAR
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ CORRIGE
      v0.31.0 hizo `line_allocations` obligatorio para aprobar una solicitud
      con ítems, y cada entrada exige `line_id`. Pero ninguna ruta exponía
      ese `line_id` ANTES de la decisión:

        · La bandeja (GET /admin/credit-requests/pending) devolvía
          PendingCreditRequest, cuyas `lines` eran CreditRequestLine — la
          propuesta cruda del vendedor, sin identificador.
        · CreditRequestDetail, el único schema con `line_id`, aparecía como
          respuesta SOLO de approve, reject y cancel.
        · No existe GET /admin/credit-requests/{request_uuid}.

      O sea: para aprobar hacía falta un dato que solo llegaba como
      resultado de aprobar. La funcionalidad principal del bloque era
      inconstruible.

      Detectado por el agente del Dashboard, que buscó `line_id` en todo el
      archivo antes de afirmarlo y se negó a resolverlo por su cuenta. Usar
      el índice del array habría sido plausible y silenciosamente
      equivocado: acreditar contra la línea de factura de otro ítem es
      exactamente el daño que la validación de cantidad busca evitar.

    ★ QUÉ CAMBIA
      `PendingCreditRequest.lines` pasa de CreditRequestLine a
      CreditRequestDetailLine. La bandeja ahora trae `line_id`,
      `unit_price` y `proposed_amount` — todo lo que el aprobador necesita
      para decidir, sin una segunda llamada.

    ★ POR QUÉ ASÍ Y NO DE OTRA FORMA
      La alternativa era agregar `line_id` a CreditRequestLine. Se descartó:
      ese schema es lo que la app de vendedores ENVÍA al crear una
      solicitud, y llevarlo ahí sugeriría que el vendedor asigna el
      identificador, cuando lo asigna el servidor al guardar.

      La otra alternativa era un GET /admin/credit-requests/{uuid} nuevo.
      Encaja con el modelo "la bandeja lista, el detalle se abre", pero
      agrega superficie y un viaje extra para un dato que la bandeja ya
      podía traer. Si más adelante hace falta refrescar una solicitud
      suelta, se agrega entonces.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.31.1 — COMPLETA EL PAYLOAD QUE ESCRIBE EN SAP
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ CORRIGE
      v0.31.0 definió el lado de LECTURA del modelo de dos documentos
      (CreditRequestSapDocument, expuesto en CreditRequestDetail) pero dejó
      SapCreditRequestSyncTask exactamente como estaba en v0.18.0 — y eso es
      lo que el sincronizador consume para ESCRIBIR en SAP.

      Con ese payload el sincronizador no podía saber cuál de las dos tareas
      era cuál (comparten document_uuid y todo lo demás), cuánto acreditar
      (llegaba proposed_amount, la propuesta del vendedor, no
      approved_amount), contra qué línea ligar (base_line no viajaba, y es
      la razón de ser del endpoint nuevo), ni qué cuenta y almacén usar (la
      tabla de mapeo vivía solo en la prosa del changelog).

      Detectado por el agente de middleware antes de escribir una línea de
      código, contando ocurrencias de cada campo en todo el archivo en vez
      de leer por encima. Su criterio fue el correcto: emitir campos que el
      contrato no declara, en la interfaz entre dos programas, es
      exactamente lo que el repo de un solo escritor viene a evitar.

    ★ QUÉ AGREGA
      · SapCreditRequestSyncTask gana `doc_kind` (ITEMS | SERVICE) — sin él
        las dos tareas de una misma solicitud son indistinguibles.
      · `lines` pasa de CreditRequestLine (la propuesta del vendedor) a
        SapCreditNoteLine (la decisión resuelta).
      · SapCreditNoteLine — schema nuevo: item_code, quantity,
        approved_amount, account_code, warehouse_code, base_line.

    ★ QUIÉN RESUELVE QUÉ
      El MIDDLEWARE resuelve cuenta y almacén por motivo, y se los entrega
      resueltos al sincronizador. Encaja con lo que ya existe:
      CreditReasonGLAccount ya resolvía el G/L por motivo para SIN_ITEMS, y
      el contrato ya exponía gl_account_code.

      El sincronizador no consulta tablas de motivos ni deduce nada: si un
      campo no está en el payload, no debe inventarlo. Es capa de
      traducción, no de reglas de negocio.

      gl_account_code de cabecera queda en NULL para CON_ITEMS, porque desde
      v0.31.0 la cuenta puede DIFERIR ENTRE LÍNEAS de una misma nota —
      DAMAGED usa 6020 mientras el resto usa 4200. Por eso va por línea.
      (⚠️ La cuenta de DAMAGED cambió a 4700 en v0.32.0 — SAP rechaza la
      6020 en líneas de ítems. El resto del párrafo sigue vigente.)

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.31.0 — NOTAS DE CRÉDITO REALES EN SAP
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ CAMBIA
      Aprobar una solicitud de crédito deja de llamar a un stub que simulaba
      éxito con un doc_num falso. Ahora crea notas de crédito reales en SAP.

      Y la aprobación pasa a ser una decisión con contenido: el aprobador
      ajusta montos y elige contra qué línea de la factura va cada crédito.

    ★ EL MAPEO DE MOTIVOS (verificado contra SAP, no supuesto)

      Motivo          Documento  Cuenta  Almacén  Stock
      DOESNT_WANT_IT  Ítems      4200    01       vuelve vendible
      MISTAKE         Ítems      4200    01       vuelve vendible
      DAMAGED         Ítems      6020    07       vuelve, NO vendible
                                  ↑ ⚠️ OBSOLETO: cambió a 4700 en v0.32.0.
                                    SAP rechaza la 6020 en líneas de ítems
                                    porque no es cuenta de tipo ingreso.
      SHORT           Servicio   4200    —        no vuelve nada

      DAMAGED cambia deliberadamente la práctica del negocio: hoy se
      registra como nota de SERVICIO sin ítem ni almacén, con el código del
      artículo escrito a mano en la descripción, y el producto DESAPARECE
      del inventario de SAP. Pasa a ser nota de ÍTEMS con el stock devuelto
      al almacén 07 (DAMAGE) — queda registrado dónde está, sin ensuciar el
      stock vendible.

      El almacén 07 no tiene ubicaciones activadas, así que esas líneas no
      llevan asignaciones de bin. El caso resulta ser el más simple de los
      cuatro en payload.

    ★ UNA SOLICITUD PUEDE PRODUCIR DOS DOCUMENTOS
      Un documento de SAP es de ítems O de servicio, nunca mixto. Una
      solicitud que mezcle líneas SHORT con líneas de otros motivos genera
      DOS notas de crédito. Es raro —casi siempre viene un solo tipo de
      motivo— pero el caso existe.

      Si uno tiene éxito y el otro falla, EL QUE PASÓ QUEDA HECHO. No se
      revierte. La solicitud muestra cuál falta y solo se reintenta el que
      falló. Ver `CreditRequestSapDocument`.

    ★ POR QUÉ EL APROBADOR ELIGE LA LÍNEA DE LA FACTURA
      La nota se liga a la factura POR LÍNEA (BaseLine), no de cabecera. Y
      no se puede deducir por `item_code`: el mismo ítem aparece repetido
      con frecuencia, porque el esquema de promociones escribe los ítems
      descontados en línea aparte para que el cliente vea los descuentos.
      Cualquier heurística fallaría de forma rutinaria, no ocasional.

      Por eso el aprobador ve las líneas reales
      (GET /admin/invoices/{invoice_doc_num}/lines) y elige SIEMPRE, incluso
      cuando no hay ambigüedad.

    ★ SAP NO VALIDA EL EXCESO — el cliente debe hacerlo
      Se verificó contra Service Layer: SAP acepta acreditar 10 unidades
      contra una línea facturada por 1, sin error ni advertencia. Un crédito
      de diez veces el valor vendido entra sin chistar.

      El Dashboard valida que lo acreditado no exceda la línea elegida. Esa
      protección tiene que estar donde el aprobador está mirando las líneas
      —no después, cuando el documento ya falló, y menos aún nunca.

    ★ RESUMEN DE CAMBIOS DE SUPERFICIE
      · GET /admin/invoices/{invoice_doc_num}/lines — NUEVO
      · POST /admin/credit-requests/{uuid}/approve — gana `line_allocations`
      · CreditRequestLine gana `proposed_amount` (opcional, compatible)
      · CreditRequestDetail gana `lines`, `sap_documents`, `invoice_doc_num`
      · `sap_credit_note_doc_num` queda OBSOLETO (no alcanza con dos docs)
      · Schemas nuevos: InvoiceLine, CreditRequestDetailLine,
        CreditRequestSapDocument

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.30.1 — CORRIGE UN HUECO DE v0.30.0
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ CORRIGE
      v0.30.0 abrió GET /promotions a ADMIN con su query param
      salesperson_code, pero NO hizo lo mismo con
      GET /promotions/{promotion_id}. El detalle quedó exactamente como en
      v0.29.0.

      El efecto no era cosmético: la lista solo devuelve PromotionSummary,
      sin condition_items ni benefit_items. Sin el detalle no se puede
      armar el bloque de promoción, así que un ADMIN veía los títulos del
      libro, hacía clic, y no podía agregar nada. El libro de promociones
      quedaba inusable para él.

      Detectado por el agente del Dashboard verificando contra el
      middleware real, no leyendo el contrato:

        GET /promotions?salesperson_code=18        → 200
        GET /promotions/{id}                       → 403
        GET /promotions/{id}?salesperson_code=18   → 403

      Ahora el detalle acepta ADMIN y el mismo query param, con la misma
      regla: obligatorio para ADMIN, ignorado para los demás.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.30.0 — ADMIN PUEDE USAR EL CARRITO DEL DASHBOARD
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Un ADMIN puede ahora tomar pedidos desde el carrito del Dashboard, a
      nombre de un vendedor.

      El problema de fondo que esto resuelve: todo el carrito está anclado
      al salesperson_code del token, y un ADMIN no tiene uno. Un pedido sin
      vendedor dueño no existe como concepto — de él dependen las
      comisiones, los filtros de SAP y la asignación de clientes.

      La solución reusa el patrón que ya usa POST /account-payments: el
      ADMIN elige explícitamente de qué vendedor es el pedido.

      · OrderCreate gana `salesperson_code` — OBLIGATORIO para ADMIN,
        IGNORADO y sobrescrito desde el token para VENDEDOR y
        VENDEDOR_INSTITUCIONAL. Un vendedor no puede atribuir un pedido a
        otro, ni aunque mande el campo.

      · OrderSummary gana `created_by` — quién CREÓ el pedido, distinto de
        salesperson_code (a quién PERTENECE). Deja rastro de que un ADMIN
        lo tomó a nombre de otro. NULL en pedidos anteriores a v0.30.0: la
        columna nace vacía y no se puede reconstruir hacia atrás.

      · POST /orders, GET /sync/catalog, GET /sync/clients y GET
        /promotions autorizan también a ADMIN.

      · GET /sync/clients y GET /promotions ganan el query param
        `salesperson_code`, válido SOLO para ADMIN — los vendedores lo
        mandan y se ignora, mismo criterio que ya usa GET /my-orders.
        GET /sync/catalog no lo necesita: no filtra por vendedor.

    ★ QUÉ NO CAMBIA
      GET /my-orders sigue siendo exclusivo de VENDEDOR_INSTITUCIONAL. Un
      ADMIN ve las órdenes por GET /admin/orders, que ya filtra por
      salesperson_code — no hacía falta abrirle una segunda vía.

      El pipeline es el mismo para los tres roles: mismo Order.Status, sin
      concepto de canal, sin tratamiento distinto según quién lo creó. La
      única diferencia observable en el dato es `created_by`.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.29.0 — ROL VENDEDOR_INSTITUCIONAL
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      NUEVO ROL: VENDEDOR_INSTITUCIONAL — distinto de VENDEDOR y de
      ANALISTA_COMERCIAL. Opera desde el Dashboard (no la app iOS), tiene
      salesperson_code propio (mismo esquema que VENDEDOR), y puede tomar
      pedidos (POST /orders, mismo pipeline que la app de vendedores, sin
      campo de canal).

      PROVISIONING: POST /admin/salespersons/provision gana un campo
      OPCIONAL `role` (VENDEDOR | VENDEDOR_INSTITUCIONAL, default
      VENDEDOR). Omitirlo es compatibilidad total con los clientes
      existentes del endpoint. BODEGUERO/DRIVER siguen provisionándose
      por POST /admin/staff/provision (v0.24.0); ADMIN/APROBADOR_PAGOS/
      APROBADOR_CREDITOS/ANALISTA_COMERCIAL no se provisionan por
      ninguna de las dos vías.

      El 409 salesperson_already_provisioned aplica sin importar el rol
      solicitado: un salesperson_code admite UNA SOLA cuenta de login.
      GET /admin/sap-salespersons.has_login_account sigue siendo un
      booleano simple, no distingue por rol.

      DESCUENTO POR LÍNEA: sin cambio de tipo — nota de negocio nueva en
      OrderLine.line_discount_pct sobre el tope por rol.

    ★ QUÉ CORRIGE
      Role es el rol de LOGIN del WMS, no un atributo del vendedor en SAP
      (el espejo SapSalespersons solo trae salesperson_code, name,
      is_active — SAP no tiene ningún concepto de rol). Dos consultas lo
      trataban como si fuera un dato de SAP y respondían "¿es un vendedor
      real?" mirando Role == VENDEDOR:

      - GET /admin/salespersons — ahora lista toda cuenta CON
        salesperson_code, sin mirar rol.
      - La validación de client_code de POST /account-payments y
        POST /credit-requests — ahora exige que el salesperson_code del
        cliente mapee a una cuenta conocida, sin mirar su rol.

      Para VENDEDOR el resultado no cambia. La corrección es de criterio:
      ampliarlo a una lista de dos roles habría vuelto a romperse con el
      siguiente rol que lleve código.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.28.0 — MÓDULO DE PROMOCIONES
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Módulo completo de promociones — desde la gestión por el analista
      hasta el libro del vendedor y la integración al carrito de venta.

      NUEVO ROL: ANALISTA_COMERCIAL — puede crear/editar/activar/desactivar
      promociones. No tiene acceso a logística, aprobaciones, ni cartera.

      GESTIÓN (ANALISTA_COMERCIAL o ADMIN):
      - GET  /admin/promotions
      - POST /admin/promotions (empieza INACTIVE)
      - GET  /admin/promotions/{id}
      - PUT  /admin/promotions/{id} (solo si está INACTIVE)
      - POST /admin/promotions/{id}/activate
      - POST /admin/promotions/{id}/deactivate

      LIBRO DEL VENDEDOR (VENDEDOR o ANALISTA_COMERCIAL):
      - GET /promotions — solo las ACTIVE, vigentes (valid_from ≤ hoy ≤
        valid_to), y asignadas al vendedor autenticado.
        Búsqueda ?q= por título, código de ítem, o nombre de ítem.
      - GET /promotions/{id} — 403 si no está asignada al vendedor.

      CARRITO:
      - OrderLine gana promotion_group_id (nullable UUID) — todas las
        líneas del mismo bloque de promoción (condición + beneficio)
        comparten el mismo valor. Ese valor ES el promotion_id de la
        promoción, NO un UUID nuevo generado por el cliente (ver la
        descripción del campo en OrderLine — corregido en v0.29.0, el
        texto original de v0.28.0 era ambiguo). El servidor valida que
        el bloque sea completo y rechaza (400) pedidos donde se
        eliminen solo ALGUNAS líneas de un mismo grupo (el bloque es
        indivisible — se agrega y se elimina en conjunto).

      TIPOS DE PROMOCIÓN:
      - FREE_ITEMS: los ítems de beneficio tienen discount_pct=100.
      - DISCOUNTED_ITEMS: cada ítem de beneficio tiene su propio
        discount_pct definido por el analista.

      ⚠️ ZONA HORARIA DE LA VIGENCIA (★ v0.34.1). `valid_from` y
      `valid_to` son fechas SIN HORA, y se evalúan contra el día
      calendario de **Nueva York** (`America/New_York`), no contra el día
      UTC.

      Antes se comparaban contra el día UTC, y eso recortaba las últimas
      cuatro horas de vigencia TODOS LOS DÍAS: una promoción con
      `valid_to = 2026-08-09` dejaba de valer a las 20:00 hora de Nueva
      York, porque ahí ya eran las 00:00 UTC del 10. Justo en la franja de
      venta en ruta, y el vendedor recibía un 400 `invalid_promotion` sin
      forma de entender por qué.

      Con la zona explícita, `valid_to` significa lo que el negocio
      entiende al escribir una fecha: hasta el final de ESE día en Nueva
      York.

      Los tres lugares que evalúan vigencia —el libro del vendedor, la
      aceptación del pedido, y la activación por el analista— usan el
      mismo cálculo y DEBEN cambiar juntos. Si solo cambiara el libro, el
      vendedor vería la promoción a las 21:00 y el pedido se le
      rechazaría igual: hoy son consistentes en el error, y arreglar uno
      solo los volvería inconsistentes, que es peor.

      Y va la ZONA, no un desfase fijo: Nueva York es UTC−4 en verano y
      UTC−5 en invierno, así que un número se equivoca por una hora medio
      año.

      VIGENCIA: toda promoción tiene valid_from/valid_to (fechas de inicio
      y fin). Se activa/desactiva manualmente — un analista no puede
      activar una promoción con valid_to ya vencida.

      RESTRICCIÓN POR VENDEDOR: cada promoción lleva una lista de
      salesperson_codes autorizados — un vendedor solo ve las que le
      fueron asignadas explícitamente.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.27.0 — CONTROL MANUAL DE RECONCILIACIÓN ANTES DE FACTURAR
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Reemplaza el disparo automático de ORDER_INVOICE en ALISTADO
      (v0.22.0) por un flujo manual con chequeo de stock previo:

      - GET /admin/trucks/{truck_id}/invoice-readiness — compara demanda
        agregada del camión (todas las órdenes) contra stock real
        (vw_WMS_Stock, almacén 01). Persiste checked_at/is_clean en el
        camión — es la base de lo que exige el envío.
      - POST /admin/trucks/{truck_id}/orders/{order_uuid}/items/{item_code}/reduce-allocation
        — reducción DIRIGIDA (solo esa orden+ítem, nada más del camión),
        reason OBLIGATORIO para auditoría.
      - POST /admin/trucks/{truck_id}/send-to-invoicing — reemplaza el
        disparo automático. EXIGE invoice-readiness limpio y de los
        últimos 5 minutos (409 si no). Aquí, no en ALISTADO, se calcula
        y persiste bin_allocations.

      El disparo automático original (RefreshAggregateStatusAsync,
      commit c3921d7) debe ELIMINARSE — un camión en ALISTADO ya no
      encola nada por sí solo.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.26.0 — ASIGNACIÓN DE BIN POR LÍNEA (ORDER_INVOICE)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      La primera factura real fue rechazada por SAP (400, code -10:
      "Fully allocate item X to bin locations") — el almacén 01 exige
      DocumentLinesBinAllocations cuando un ítem tiene más de un bin
      (AutoAllocOnIssue=whsBinSingleChoiceOnly). Investigación confirmó que
      el Wave Picking recoge por CAMIÓN, no por orden — a nivel de línea
      individual no existe (ni puede existir) el dato de qué bin específico
      recibió cada cliente, solo a nivel de camión agregado.

      bin_allocations (por línea): cómo repartir la cantidad entre los bins
      reales. Un solo bin → hecho directo, approximate=false. Más de un
      bin → repartido determinísticamente (fill-first) entre las órdenes
      que comparten ese ítem+camión, approximate=true — exacto en el
      agregado del camión, aproximado por línea individual (no hay otra
      opción físicamente posible dado cómo funciona el Wave Picking).

      Calculado y PERSISTIDO una sola vez al encolar la tarea (misma
      transacción atómica que crea todas las tareas del camión — el
      conjunto de órdenes ya está congelado desde antes de ALISTADO, así
      que no hay órdenes tardías ni condición de carrera entre tareas).
      GET /pending nunca recalcula, solo lee lo guardado.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.25.0 — TOTALES ESPERADOS EN EL SNAPSHOT DE ORDER_INVOICE
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Vacío encontrado al leer la primera tarea real de ORDER_INVOICE en la
      cola: el snapshot no traía ningún total (ni por línea, ni por
      documento). Sin eso, el sincronizador no tiene contra qué comparar el
      DocTotal real que devuelva SAP tras crear la factura — la salvaguarda
      contra divergencias de redondeo (SAP calcula LineTotal con el precio
      con descuento SIN redondear antes de multiplicar, verificado con
      datos reales) se quedaba sin contraparte.

      - expected_line_total (por línea): quantity × unit_price ×
        (1 - discount_pct/100), calculado con la misma fórmula exacta que
        usa SAP — no redondear antes de multiplicar.
      - expected_doc_total (a nivel de order_invoice): suma de todos los
        expected_line_total.

      El sincronizador compara esto contra lo que SAP devuelva de verdad;
      si no coincide, lo reporta como advertencia, nunca lo fuerza a cuadrar
      ni lo trata como error bloqueante.

      Nota de corrección (no es cambio de contrato, es aclaración): el
      campo "invoice_uuid" mencionado en descripciones anteriores nunca
      existió — el snapshot solo tiene order_uuid (= document_uuid de la
      tarea). Usar order_uuid= como prefijo en Comments, no invoice_uuid=.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.24.0 — CREAR CUENTAS DE BODEGUERO/DRIVER DESDE CERO
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Vacío encontrado en medio de una prueba real (llevar un pedido por
      todo el ciclo de picking para Órdenes de Venta → Facturas): un
      ambiente recién migrado/limpio (droplet o cualquier middleware
      nuevo) solo tiene el admin del bootstrap — no hay bodegueros ni
      drivers para asignar/completar un picking.

      A diferencia de /admin/salespersons/provision (que ACTIVA una
      cuenta para alguien que ya existe como SlpCode real en SAP),
      BODEGUERO y DRIVER no son un concepto de SAP — son personal interno
      del WMS, sin ningún espejo contra el cual validar.

      - GET /admin/staff — lista el personal ya creado (Role IN
        (BODEGUERO, DRIVER)), directo de la tabla de login, sin espejo.
      - POST /admin/staff/provision — crea una cuenta desde cero
        (username, password, display_name, role ∈ {BODEGUERO, DRIVER}).
        Sin salesperson_code, sin vínculo a SAP (Code queda null).

      Vive en la MISMA pantalla "Gestionar Usuarios" del Dashboard, como
      sección aparte de la de vendedores — decisión explícita de Camilo
      de no crear una pantalla nueva para esto.

    ══════════════════════════════════════════════════════════════════════════
    CAMBIOS EN v0.23.0 — REFRESCO DEL ESPEJO A DEMANDA (alcance mínimo)
    ══════════════════════════════════════════════════════════════════════════

    ★ QUÉ AGREGA
      Parte del diseño de "Órdenes de Venta → Facturas": antes de mandar a
      facturar, el jefe de bodega necesita un chequeo de stock real contra
      SAP (vw_WMS_Stock), y el espejo local hoy solo se refresca cada 15
      min (SapRefreshBackgroundService, dentro del propio middleware — NO
      es el sincronizador dinas-wms-sap-sync, son dos mecanismos
      completamente separados y en direcciones opuestas: este refresco
      lee de SAP hacia el WMS; el sincronizador escribe del WMS hacia SAP).

      POST /admin/sap-refresh/trigger — REQUIERE ADMIN. Llama directamente
      al mismo SapMirrorRefreshService que ya usa el timer, sin lógica
      nueva. Si ya hay un refresco en curso, espera ese y devuelve su
