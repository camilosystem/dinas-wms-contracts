            ★ NUEVO en v0.30.1. SOLO para ADMIN, y OBLIGATORIO para él
            (400 si lo omite): no tiene salesperson_code propio contra el
            cual comprobar la asignación.

            Los demás roles NO lo envían: si lo mandan se IGNORA y se usa
            el del token. Mismo criterio que GET /promotions y
